name: Temporary Chapter 241 ship
on:
  push:
    branches:
      - manuscript/ch241-scraper
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply chapter and state updates
        run: python scripts/.tmp_ch241_apply.py
      - name: Remove temporary shipping files
        run: rm scripts/.tmp_ch241_apply.py .github/workflows/.tmp_ch241.yml
      - name: Verify diff hygiene
        run: |
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only 9fb049bec6cdabbf67c113523b5aae7425d4cdb0 | sort | tr '\n' ' ')" = "state/MANUSCRIPT_CHAPTER_INDEX.md state/MANUSCRIPT_STATE.md state/MANUSCRIPT_WORKFLOW.md state/OPEN_THREADS.md state/PROJECT_STATE.md state/manuscript/Peg_Leg_Greg_Running_Manuscript.md "
      - name: Commit shipped chapter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ship Chapter 241: THE SCRAPER"
          git push origin HEAD:manuscript/ch241-scraper
