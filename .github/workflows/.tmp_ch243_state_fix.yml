name: Temporary Chapter 243 rebased state fix
on:
  push:
    branches:
      - manuscript/ch243-statefix-rebased
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix stale next-edge line
        run: python scripts/.tmp_ch243_state_fix.py
      - name: Remove temporary files
        run: rm scripts/.tmp_ch243_state_fix.py .github/workflows/.tmp_ch243_state_fix.yml
      - name: Verify staged diff hygiene
        run: |
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only e7ca3631b3a9e69a658ba959030d131dfe21b968 | sort | tr '\n' ' ')" = "state/OPEN_THREADS.md "
      - name: Commit state fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Chapter 243 next-edge state"
          git push origin HEAD:manuscript/ch243-statefix-rebased
