name: Extract 3L Dragon Fancy chunks

on:
  push:
    branches:
      - 3l/dragon-fancy-chunks
    paths:
      - 'scripts/extract_3l_dragon_chunks.py'
      - '3l/performance/record-001.performance.md'
      - '.github/workflows/3l-dragon-fancy-chunks.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Dragon-only chunks
        run: python scripts/extract_3l_dragon_chunks.py
      - name: Commit chunks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3l/audio/dragon-chunks/record-001
          git diff --cached --quiet && exit 0
          git commit -m "audio: extract Record 001 Dragon chunks"
          git push origin HEAD:${GITHUB_REF_NAME}
