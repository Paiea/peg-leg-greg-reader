name: 3L full audio URL spike

on:
  push:
    branches:
      - 3l/record-001-clean-speaker-v2
    paths:
      - '.github/workflows/3l-full-audio-url-spike.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect full AI voice response
        run: |
          set -euo pipefail
          mkdir -p /tmp/3l-audio
          curl -L --fail --retry 3 -D /tmp/3l-audio/headers.txt \
            'https://www.aidocmaker.com/g0/audio?name=d1227e2cc2fc4b0eb83612cda153bd8a' \
            -o /tmp/3l-audio/response.bin
          file /tmp/3l-audio/response.bin
          wc -c /tmp/3l-audio/response.bin
          echo '--- candidate URLs ---'
          strings /tmp/3l-audio/response.bin | grep -Eo 'https://[^"'"'"' <]+' | grep -E 'mp3|audio|storage' | head -30 || true
          echo '--- first text ---'
          strings /tmp/3l-audio/response.bin | head -40 || true
      - uses: actions/upload-artifact@v4
        with:
          name: 3l-full-audio-url-spike
          path: /tmp/3l-audio/
