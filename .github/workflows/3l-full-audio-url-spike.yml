name: 3L full audio URL spike

on:
  push:
    branches:
      - 3l/record-001-clean-speaker-v2
    paths:
      - '.github/workflows/3l-full-audio-url-spike.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download full AI voice file
        run: |
          set -euo pipefail
          mkdir -p /tmp/3l-audio
          curl -L --fail --retry 3 \
            'https://www.aidocmaker.com/g0/audio?name=d1227e2cc2fc4b0eb83612cda153bd8a' \
            -o /tmp/3l-audio/test.mp3
          file /tmp/3l-audio/test.mp3
          wc -c /tmp/3l-audio/test.mp3
          head -c 64 /tmp/3l-audio/test.mp3 | xxd
      - uses: actions/upload-artifact@v4
        with:
          name: 3l-full-audio-url-spike
          path: /tmp/3l-audio/test.mp3
