name: 3L Parallel Audio Work Order Tests

on:
  push:
    branches:
      - 3l/dialogue-territory-rebuild-002-010
    paths:
      - tests/test_3l_parallel_audio_work_order.py
      - scripts/build_3l_parallel_audio_work_order.py
      - .github/workflows/3l-parallel-audio-work-order-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout focused files
        uses: actions/checkout@v4
        with:
          ref: 3l/dialogue-territory-rebuild-002-010
          sparse-checkout: |
            tests/test_3l_parallel_audio_work_order.py
            scripts/build_3l_parallel_audio_work_order.py
          sparse-checkout-cone-mode: false
      - name: Run five-worker work-order tests
        run: python -m unittest tests/test_3l_parallel_audio_work_order.py -v
