name: Extract 3L Record 001 Dragon chunks

on:
  push:
    branches:
      - 3l/record-001-fancy-dragon-full-scene
    paths:
      - 'scripts/extract_3l_dragon_chunks.py'
      - '3l/performance/record-001.performance.md'
      - '.github/workflows/3l-record-001-dragon-chunks.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Dragon-only chunks
        run: python scripts/extract_3l_dragon_chunks.py
      - name: Commit chunk texts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3l/audio/dragon-chunks/record-001
          git diff --cached --quiet && exit 0
          git commit -m "audio: extract Record 001 Dragon-only chunks"
          git push origin HEAD:${GITHUB_REF_NAME}
