name: Assemble 3L Record 001 Fancy Dragon takes

on:
  push:
    branches:
      - 3l/record-001-fancy-dragon-full-scene
    paths:
      - '.github/workflows/3l-record-001-fancy-dragon-takes.yml'
      - '3l/audio/record-001-fancy-takes.json'
      - 'scripts/build_3l_fancy_take_candidate.py'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -filters 2>/dev/null | grep rubberband

      - name: Validate speaker-map authority
        run: |
          python -m unittest tests.test_3l_two_voice_candidate
          python -m py_compile scripts/build_3l_fancy_take_candidate.py
          python - <<'PY'
          import json
          deep=json.load(open('3l/audio/record-001-two-voice-map.json'))
          fancy=json.load(open('3l/audio/record-001-fancy-takes.json'))
          needed={str(t['order']) for t in deep['takes'] if any(s['role']=='dragon' for s in t['mapped_spans'])}
          supplied=set(fancy['takes'])
          assert supplied == needed, (sorted(needed), sorted(supplied))
          assert len(supplied) == 28
          print('Fancy take coverage:', len(supplied))
          PY

      - name: Download Fancy take captures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fancy-takes
          python - <<'PY' > /tmp/fancy-urls.tsv
          import json
          m=json.load(open('3l/audio/record-001-fancy-takes.json'))
          for order, url in sorted(m['takes'].items(), key=lambda item:int(item[0])):
              print(f'{int(order):02d}\t{url}')
          PY
          while IFS=$'\t' read -r order url; do
            echo "Fancy take $order"
            curl -fL --retry 3 --retry-delay 2 -o "/tmp/fancy-takes/${order}.mp3" "$url"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "/tmp/fancy-takes/${order}.mp3"
          done < /tmp/fancy-urls.tsv

      - name: Assemble candidate
        run: |
          PYTHONPATH=. python scripts/build_3l_fancy_take_candidate.py --fancy-dir /tmp/fancy-takes

      - name: Verify candidate
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -v error -i 3l/assets/audio/record-001-fancy-dragon-minus3_25.mp3 -f null -
          python - <<'PY'
          import json
          r=json.load(open('3l/audio/verification/record-001-fancy-dragon-minus3_25.json'))
          assert r['fancy_take_count'] == 28
          assert r['dragon_span_count'] == 112
          assert r['dragon_pitch_semitones'] == -3.25
          assert r['dragon_tempo'] == 1.0
          assert r['dragon_formant'] == 'preserved'
          assert r['greg_or_narrator_voice_replacement_count'] == 0
          assert r['take_role_patterns_verified'] is True
          print(json.dumps({k:r[k] for k in ('candidate_duration_seconds','candidate_byte_size','candidate_sha256')}, indent=2))
          PY
          git diff --check

      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3l/assets/audio/record-001-fancy-dragon-minus3_25.mp3 3l/audio/verification/record-001-fancy-dragon-minus3_25.json
          git commit -m "audio: render Record 001 Fancy Dragon full scene" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Upload listening artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3l-record-001-fancy-dragon-minus3_25
          path: 3l/assets/audio/record-001-fancy-dragon-minus3_25.mp3