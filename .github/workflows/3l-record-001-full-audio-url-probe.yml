name: 3L Record 001 full audio URL probe

on:
  push:
    branches: [3l/record-001-rewrite-audio]
    paths:
      - '.github/workflows/3l-record-001-full-audio-url-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List audio page scripts and inspect page-specific bundle
        run: |
          set -euo pipefail
          base='https://www.aidocmaker.com'
          curl -L --fail --max-time 10 "$base/g0/audio?name=6f0f049b390b474a92c5caa2cf588cfc" -o /tmp/page.html
          grep -Eo '<script[^>]+src="[^"]+\.js[^"]*"' /tmp/page.html \
            | sed -E 's/.*src="([^"]+)".*/\1/' \
            | sort -u | tee /tmp/scripts.txt
          echo '--- likely page scripts ---'
          grep -Ei '(audio|appCode|pages)' /tmp/scripts.txt || true
          while IFS= read -r src; do
            if echo "$src" | grep -Eqi '(audio|appCode|pages)'; then
              case "$src" in http*) u="$src" ;; *) u="$base$src" ;; esac
              echo "--- $u ---"
              curl -L --fail --silent --max-time 10 "$u" \
                | grep -Eo '.{0,240}(audio\?name|storage\.googleapis|preview_url|audioUrl|audio_url|download.{0,60}audio|/api/.{0,160}audio|name.{0,80}fetch).{0,500}' \
                | head -120 || true
            fi
          done < /tmp/scripts.txt
