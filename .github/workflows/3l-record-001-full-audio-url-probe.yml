name: 3L Record 001 full audio URL probe

on:
  push:
    branches: [3l/record-001-rewrite-audio]
    paths:
      - '.github/workflows/3l-record-001-full-audio-url-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Render generated audio page in Chrome
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "chrome=$chrome"
          url='https://www.aidocmaker.com/g0/audio?name=8715afbfdd81403aa72071a4d3440931'
          "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "$url" > /tmp/rendered.html 2>/tmp/chrome.log || true
          echo '--- audio/media URLs in rendered DOM ---'
          grep -Eo 'https:[^"<> ]+(storage\.googleapis\.com|\.mp3|\.wav|\.m4a)[^"<> ]*' /tmp/rendered.html | sort -u | head -100 || true
          echo '--- audioUrl context ---'
          grep -Eoi '.{0,300}(audioUrl|audio_url|storage\.googleapis|\.mp3).{0,600}' /tmp/rendered.html | head -80 || true
          echo '--- visible text markers ---'
          grep -Eoi '.{0,120}(No\. And before you repeat|download|generating|voiceover).{0,220}' /tmp/rendered.html | head -40 || true
          echo '--- chrome stderr tail ---'
          tail -40 /tmp/chrome.log || true
