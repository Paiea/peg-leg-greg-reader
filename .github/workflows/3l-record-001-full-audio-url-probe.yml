name: 3L Record 001 full audio URL probe

on:
  push:
    branches: [3l/record-001-rewrite-audio]
    paths:
      - '.github/workflows/3l-record-001-full-audio-url-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect full voiceover page
        run: |
          set -euo pipefail
          url='https://www.aidocmaker.com/g0/audio?name=6f0f049b390b474a92c5caa2cf588cfc'
          curl -L --fail --retry 2 "$url" -o /tmp/page.html
          echo '--- direct media-looking URLs ---'
          grep -Eo 'https:[^"<> ]+\.(mp3|wav|m4a|ogg)(\?[^"<> ]*)?' /tmp/page.html | head -50 || true
          echo '--- storage/google/audio contexts ---'
          grep -Eoi '.{0,160}(storage\.googleapis\.com|preview_url|audio_url|\.mp3|audio).{0,240}' /tmp/page.html | head -80 || true
          echo '--- next data hints ---'
          grep -Eoi '.{0,120}(__NEXT_DATA__|self\.__next_f|context_id|6f0f049b390b474a92c5caa2cf588cfc).{0,300}' /tmp/page.html | head -80 || true
          test -s /tmp/page.html
