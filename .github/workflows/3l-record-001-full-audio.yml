name: 3L Record 001 full audio capture

on:
  push:
    branches:
      - 3l/record-001-production
    paths:
      - '3l/audio/record-001/full-voice-capture.json'
      - '.github/workflows/3l-record-001-full-audio.yml'
  pull_request:
    paths:
      - '3l/audio/record-001/full-voice-capture.json'
      - '.github/workflows/3l-record-001-full-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download full provider render
        shell: bash
        run: |
          set -euo pipefail
          url=$(python - <<'PY'
          import json
          print(json.load(open('3l/audio/record-001/full-voice-capture.json'))['audio_url'])
          PY
          )
          mkdir -p 3l/audio/assets 3l/audio/record-001/verification
          curl -fL --retry 4 --retry-delay 2 -D /tmp/headers.txt -o /tmp/record-001-provider "$url"
          echo '=== response headers ==='
          cat /tmp/headers.txt
          echo '=== downloaded file ==='
          file /tmp/record-001-provider
          ls -lh /tmp/record-001-provider
          ffprobe -v error -show_entries format=format_name,duration,size -of json /tmp/record-001-provider | tee 3l/audio/record-001/verification/provider-ffprobe.json
          cp /tmp/record-001-provider 3l/audio/assets/record-001-greg-test.mp3

      - name: Add settling tail and verify
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -i 3l/audio/assets/record-001-greg-test.mp3 -af 'apad=pad_dur=2' -vn -c:a libmp3lame -b:a 192k /tmp/record-001-final.mp3
          mv /tmp/record-001-final.mp3 3l/audio/assets/record-001-greg-test.mp3
          ffprobe -v error -show_entries format=format_name,duration,size -of json 3l/audio/assets/record-001-greg-test.mp3 | tee 3l/audio/record-001/verification/final-ffprobe.json

      - name: Commit captured test render
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3l/audio/assets/record-001-greg-test.mp3 3l/audio/record-001/verification
          git commit -m 'audio: capture 3L Record 001 Greg test render' || exit 0
          git pull --rebase origin "$GITHUB_HEAD_REF"
          git push origin HEAD:"$GITHUB_HEAD_REF"
