name: 3L Record 001 voice source check

on:
  push:
    branches:
      - 3l/record-001-production
    paths:
      - '3l/audio/record-001/full-voice-capture.json'
      - '.github/workflows/3l-record-001-full-audio.yml'
  pull_request:
    paths:
      - '3l/audio/record-001/full-voice-capture.json'
      - '.github/workflows/3l-record-001-full-audio.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Verify published preview and full-player source
        shell: bash
        run: |
          set -euo pipefail
          readarray -t urls < <(python - <<'PY'
          import json
          data=json.load(open('3l/audio/record-001/full-voice-capture.json'))
          print(data['preview_url'])
          print(data['audio_url'])
          PY
          )
          preview_url="${urls[0]}"
          full_page_url="${urls[1]}"

          curl -fL --retry 4 --retry-delay 2 -D /tmp/preview-headers.txt -o /tmp/preview.mp3 "$preview_url"
          grep -Eqi 'content-type: audio/(mpeg|mp3)' /tmp/preview-headers.txt
          test "$(wc -c < /tmp/preview.mp3)" -gt 1000
          file /tmp/preview.mp3 | grep -Eqi 'audio|MPEG'

          curl -fL --retry 4 --retry-delay 2 -D /tmp/full-headers.txt -o /tmp/full-player.html "$full_page_url"
          grep -qi 'content-type: text/html' /tmp/full-headers.txt
          grep -q 'd53f086b9a64427ba8aa22ca77580def' /tmp/full-player.html

          echo 'Record 001 preview MP3 and full provider player are reachable.'
