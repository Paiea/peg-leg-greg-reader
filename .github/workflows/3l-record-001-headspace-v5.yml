name: 3L Record 001 headspace v5

on:
  workflow_dispatch:
  push:
    branches: [3l/record-001-rewrite-audio]
    paths:
      - '3l/audio/experiments/record-001-headspace-v5-captures.json'
      - '.github/workflows/3l-record-001-headspace-v5.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3l/record-001-rewrite-audio
          fetch-depth: 0

      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Resolve and verify full provider takes
        run: |
          python - <<'PY'
          import concurrent.futures
          import hashlib
          import html
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          import time
          import urllib.request

          manifest_path = pathlib.Path('3l/audio/experiments/record-001-headspace-v5-captures.json')
          manifest = json.loads(manifest_path.read_text())
          raw = pathlib.Path('/tmp/3l-v5/raw')
          raw.mkdir(parents=True, exist_ok=True)
          chrome = shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          if not chrome:
              raise SystemExit('No Chrome/Chromium found on runner')

          def ffprobe(path):
              p = subprocess.run([
                  'ffprobe','-v','error','-show_entries','format=duration,size',
                  '-of','json',str(path)
              ], check=True, capture_output=True, text=True)
              info = json.loads(p.stdout)['format']
              return float(info['duration']), int(info['size'])

          def resolve(block):
              bid = block['id']
              cid = block['context_id']
              page = f'https://www.aidocmaker.com/g0/audio?name={cid}'
              dst = raw / f'{bid}.mp3'
              last = ''
              for attempt in range(18):
                  p = subprocess.run([
                      chrome, '--headless', '--no-sandbox', '--disable-gpu',
                      '--virtual-time-budget=9000', '--dump-dom', page
                  ], capture_output=True, text=True, timeout=45)
                  dom = p.stdout
                  matches = re.findall(r'<audio[^>]+src="([^"]+)"', dom, flags=re.I)
                  urls = [html.unescape(x) for x in matches if 'adm--audio-files--lt--private' in html.unescape(x)]
                  if urls:
                      url = urls[0]
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=90) as r, open(dst, 'wb') as f:
                          shutil.copyfileobj(r, f)
                      duration, size = ffprobe(dst)
                      subprocess.run(['ffmpeg','-v','error','-i',str(dst),'-f','null','-'], check=True)
                      if duration <= 0 or size <= 0:
                          raise RuntimeError(f'{bid}: invalid media duration={duration} size={size}')
                      return {
                          'id': bid,
                          'voice': block['voice'],
                          'context_id': cid,
                          'duration': duration,
                          'size': size,
                          'sha256': hashlib.sha256(dst.read_bytes()).hexdigest(),
                          'provider_bucket': 'full_private'
                      }
                  last = (p.stderr or '')[-1200:]
                  time.sleep(8)
              raise RuntimeError(f'{bid}: full audio never became available. chrome={last}')

          results = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              futures = {ex.submit(resolve, b): b['id'] for b in manifest['blocks']}
              for fut in concurrent.futures.as_completed(futures):
                  bid = futures[fut]
                  item = fut.result()
                  results[bid] = item
                  print(f"resolved {bid}: {item['voice']} {item['duration']:.3f}s {item['size']} bytes")

          if len(results) != len(manifest['blocks']):
              raise SystemExit(f"resolved {len(results)} of {len(manifest['blocks'])}")
          pathlib.Path('/tmp/3l-v5/resolved.json').write_text(json.dumps(results, indent=2, sort_keys=True))
          PY

      - name: Assemble speaker-pure chapter
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          manifest = json.loads(pathlib.Path('3l/audio/experiments/record-001-headspace-v5-captures.json').read_text())
          resolved = json.loads(pathlib.Path('/tmp/3l-v5/resolved.json').read_text())
          raw = pathlib.Path('/tmp/3l-v5/raw')
          norm = pathlib.Path('/tmp/3l-v5/norm')
          sil = pathlib.Path('/tmp/3l-v5/silence')
          norm.mkdir(parents=True, exist_ok=True)
          sil.mkdir(parents=True, exist_ok=True)

          def run(*args):
              subprocess.run(list(args), check=True)

          for block in manifest['blocks']:
              bid = block['id']
              run('ffmpeg','-y','-v','error','-i',str(raw/f'{bid}.mp3'),
                  '-ar','44100','-ac','2','-c:a','pcm_s16le',str(norm/f'{bid}.wav'))

          pauses = sorted({int(b['pause_after_ms']) for b in manifest['blocks']} | {int(manifest['final_tail_ms'])})
          for ms in pauses:
              seconds = ms / 1000.0
              run('ffmpeg','-y','-v','error','-f','lavfi','-i','anullsrc=r=44100:cl=stereo',
                  '-t',f'{seconds:.3f}','-c:a','pcm_s16le',str(sil/f'{ms}.wav'))

          concat = pathlib.Path('/tmp/3l-v5/concat.txt')
          lines = []
          for block in manifest['blocks']:
              bid = block['id']
              lines.append(f"file '{(norm/f'{bid}.wav').resolve()}'")
              lines.append(f"file '{(sil/f\"{int(block['pause_after_ms'])}.wav\").resolve()}'")
          lines.append(f"file '{(sil/f\"{int(manifest['final_tail_ms'])}.wav\").resolve()}'")
          concat.write_text('\n'.join(lines) + '\n')

          out_dir = pathlib.Path('3l/assets/audio')
          out_dir.mkdir(parents=True, exist_ok=True)
          out = out_dir / 'record-001-headspace-v5.mp3'
          run('ffmpeg','-y','-v','error','-f','concat','-safe','0','-i',str(concat),
              '-ar','44100','-ac','2','-c:a','libmp3lame','-b:a','160k',str(out))
          run('ffmpeg','-v','error','-i',str(out),'-f','null','-')

          probe = subprocess.run([
              'ffprobe','-v','error','-show_entries','format=duration,size','-of','json',str(out)
          ], check=True, capture_output=True, text=True)
          fmt = json.loads(probe.stdout)['format']
          source = pathlib.Path(manifest['source_path'])
          voice_counts = {}
          for b in manifest['blocks']:
              voice_counts[b['voice']] = voice_counts.get(b['voice'],0) + 1
          receipt = {
              'record': manifest['record'],
              'title': manifest['title'],
              'source_path': manifest['source_path'],
              'source_commit': manifest['source_commit'],
              'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'manifest_sha256': hashlib.sha256(pathlib.Path('3l/audio/experiments/record-001-headspace-v5-captures.json').read_bytes()).hexdigest(),
              'output_path': str(out),
              'duration_seconds': float(fmt['duration']),
              'size_bytes': int(fmt['size']),
              'sha256': hashlib.sha256(out.read_bytes()).hexdigest(),
              'blocks': len(manifest['blocks']),
              'voice_counts': voice_counts,
              'greg_voice': manifest['greg_voice'],
              'dragon_voice': manifest['dragon_voice'],
              'dragon_dsp': manifest['dragon_dsp'],
              'final_tail_ms': manifest['final_tail_ms'],
              'full_provider_assets_verified': True,
              'resolved_blocks': [resolved[b['id']] for b in manifest['blocks']]
          }
          receipt_path = pathlib.Path('3l/audio/experiments/record-001-headspace-v5-receipt.json')
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps({k:receipt[k] for k in ['duration_seconds','size_bytes','sha256','blocks','voice_counts']}, indent=2))
          PY

      - name: Upload listening artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3l-record-001-headspace-v5
          path: |
            3l/assets/audio/record-001-headspace-v5.mp3
            3l/audio/experiments/record-001-headspace-v5-receipt.json
          if-no-files-found: error

      - name: Commit experimental audio and receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 3l/assets/audio/record-001-headspace-v5.mp3 3l/audio/experiments/record-001-headspace-v5-receipt.json
          if git diff --cached --quiet; then
            echo 'No audio changes to commit.'
          else
            git commit -m '3L audio: assemble Record 001 headspace v5'
            git push origin HEAD:3l/record-001-rewrite-audio
          fi
