name: Build 3L Record 001 two-voice candidate

on:
  push:
    branches:
      - 3l/record-001-two-voice-candidate
    paths:
      - '.github/workflows/3l-record-001-two-voice-candidate.yml'
      - '3l/performance/record-001.performance.md'
      - 'scripts/build_3l_two_voice_candidate.py'
      - 'tests/test_3l_two_voice_candidate.py'

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify mapping code before assembly
        run: python -m unittest tests.test_3l_two_voice_candidate

      - name: Build reuse-first candidate
        run: python scripts/build_3l_two_voice_candidate.py

      - name: Verify A/B site and audio decode
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_3l_site tests.test_3l_two_voice_candidate
          ffmpeg -v error -i 3l/assets/audio/record-001-two-voice-candidate.mp3 -f null -
          git diff --check

      - name: Commit verified candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            3l/assets/audio/record-001-two-voice-candidate.mp3 \
            3l/audio/record-001-two-voice-map.json \
            3l/audio/verification/record-001-two-voice-candidate.json
          git commit -m "audio: render verified Record 001 A/B candidate"
          git push origin HEAD:${GITHUB_REF_NAME}
