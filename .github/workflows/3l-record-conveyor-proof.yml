name: 3L Record Conveyor Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '3l/audio/conveyor/record-002-proof.json'

permissions:
  contents: write

jobs:
  build-record-002:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure ffmpeg tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Materialize fresh Record 002 captures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          record = '002'
          plan_path = Path(f'3l/audio/record-{record}-short-dual-plan.json')
          receipt_path = Path(f'3l/audio/verification/record-{record}-short-captures.json')
          proof_path = Path(f'3l/audio/conveyor/record-{record}-proof.json')

          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          proof = json.loads(proof_path.read_text(encoding='utf-8'))

          if proof.get('record') != record or receipt.get('record') != record or plan.get('record') != record:
              raise SystemExit('record mismatch')

          chunks = {int(chunk['index']): chunk for chunk in plan['chunks']}
          expected = {(idx, str(voice)) for idx, chunk in chunks.items() for voice in chunk['required_voices']}
          existing = {(int(item['chunk']), str(item['voice'])): item for item in receipt.get('captures', [])}
          missing_before = expected - set(existing)
          fresh = proof.get('captures', [])
          fresh_keys = {(int(item['chunk']), str(item['voice'])) for item in fresh}

          if fresh_keys != missing_before:
              raise SystemExit(f'proof captures must exactly fill current missing set; missing={sorted(missing_before)} fresh={sorted(fresh_keys)}')

          with tempfile.TemporaryDirectory(prefix='record-002-conveyor-') as temp_name:
              temp = Path(temp_name)
              for item in fresh:
                  chunk_no = int(item['chunk'])
                  voice = str(item['voice'])
                  chunk = chunks[chunk_no]
                  if voice not in chunk['required_voices']:
                      raise SystemExit(f'chunk {chunk_no}: unexpected voice {voice}')
                  if item.get('transcript') != chunk['transcript']:
                      raise SystemExit(f'chunk {chunk_no} {voice}: transcript drift')
                  url = str(item['preview_url'])
                  target = temp / f'chunk-{chunk_no:03d}-{voice}.mp3'
                  subprocess.run(['curl', '-L', '--fail', '--retry', '3', '--retry-delay', '1', '-o', str(target), url], check=True)
                  subprocess.run(['ffmpeg', '-v', 'error', '-i', str(target), '-f', 'null', '-'], check=True)
                  duration = float(subprocess.check_output([
                      'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                      '-of', 'default=nw=1:nk=1', str(target)
                  ], text=True).strip())
                  digest = hashlib.sha256(target.read_bytes()).hexdigest()
                  existing[(chunk_no, voice)] = {
                      'chunk': chunk_no,
                      'voice': voice,
                      'context_id': item['context_id'],
                      'preview_url': url,
                      'audio_url': item.get('audio_url'),
                      'duration_seconds': round(duration, 6),
                      'byte_size': target.stat().st_size,
                      'sha256': digest,
                      'status': 'verified',
                      'manifest': str(proof_path),
                  }

          keys = set(existing)
          missing_after = expected - keys
          extra = keys - expected
          if missing_after or extra:
              raise SystemExit(f'capture coverage mismatch after fill; missing={sorted(missing_after)} extra={sorted(extra)}')

          receipt['capture_manifests'] = list(dict.fromkeys([*receipt.get('capture_manifests', []), str(proof_path)]))
          receipt['captures'] = [existing[key] for key in sorted(existing)]
          receipt['verified_capture_count'] = len(existing)
          receipt['planned_capture_count'] = len(expected)
          receipt['complete'] = True
          receipt['missing'] = []
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(f'record {record}: source coverage {len(existing)}/{len(expected)} complete')
          PY

      - name: Assemble and verify Record 002
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_3l_short_dual_audio.py 002
          ffmpeg -v error -i 3l/assets/audio/record-002.mp3 -f null -
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 3l/assets/audio/record-002.mp3

      - name: Publish Record 002 into reader
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_3l_record_pages.py
          grep -q 'record-002.mp3' 3l/records/002.html
          grep -q 'record-002.mp3' 3l/audio/index.html

      - name: Commit verified Record 002
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3l/audio/verification/record-002-short-captures.json
          git add 3l/audio/verification/record-002-short-dual-audio.json
          git add 3l/assets/audio/record-002.mp3
          git add 3l/audio/index.html 3l/records
          git diff --cached --quiet && exit 0
          git commit -m "audio: publish Record 002 via conveyor proof"
          git push origin HEAD:main
