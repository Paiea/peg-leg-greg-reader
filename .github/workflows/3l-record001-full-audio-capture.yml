name: 3L Record 001 short-take assembly

on:
  push:
    branches:
      - 3l/record-001-publish
    paths:
      - '3l/audio/record-001-short-takes.json'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install ffmpeg tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Bring locked Record 001 canon into publish branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 3l/record-001-production
          mkdir -p 3l/manuscript
          git show origin/3l/record-001-production:3l/manuscript/record-001.md > 3l/manuscript/record-001.md

      - name: Validate capture map against locked canon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          d=json.loads(Path('3l/audio/record-001-short-takes.json').read_text())
          assert d['record']==1
          assert d['title']=='THE PETITIONER'
          assert d['voice']=='deep'
          assert d['status']=='capture_ready'
          assert d['take_count']==len(d['takes'])==36
          assert [t['order'] for t in d['takes']]==list(range(1,37))
          assert all(t.get('context_id') for t in d['takes'])
          assert all(t['preview_url'].startswith('https://storage.googleapis.com/') for t in d['takes'])

          source=Path('3l/manuscript/record-001.md').read_text()
          body=source.split('## THE PETITIONER',1)[1].strip()
          assert '—' not in source, 'em dash found in canon prose'

          paragraphs=[p.strip() for p in re.split(r'\n\s*\n', body) if p.strip()]
          units=[]
          for para in paragraphs:
              if len(para) <= 500:
                  units.append(para)
                  continue
              parts=re.split(r'(?<=[.!?])\s+', para)
              cur=''
              for part in parts:
                  candidate=(cur+' '+part).strip()
                  if cur and len(candidate)>500:
                      units.append(cur)
                      cur=part
                  else:
                      cur=candidate
              if cur:
                  units.append(cur)
          chunks=[]
          cur=''
          for unit in units:
              candidate=(cur+'\n\n'+unit).strip() if cur else unit
              if cur and len(candidate)>500:
                  chunks.append(cur)
                  cur=unit
              else:
                  cur=candidate
          if cur:
              chunks.append(cur)

          assert len(chunks)==36, len(chunks)
          assert max(map(len,chunks)) <= 500
          for take, chunk in zip(d['takes'], chunks):
              take['source_transcript']=chunk
              take['transcript']=chunk
              take['preview_transcript']=chunk

          expected=re.sub(r'\s+',' ',body).strip()
          actual=re.sub(r'\s+',' ',' '.join(chunks)).strip()
          assert actual==expected, 'short takes do not exactly cover Record 001 prose'
          Path('3l/audio/record-001-short-takes.json').write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          print('validated', len(chunks), 'takes and exact prose coverage')
          PY

      - name: Download and ffprobe every take
        shell: bash
        run: |
          set -euo pipefail
          out='3l/assets/audio/record-001-chunks'
          rm -rf "$out"
          mkdir -p "$out" 3l/assets/audio 3l/audio/verification
          python3 - <<'PY' > /tmp/urls.tsv
          import json
          d=json.load(open('3l/audio/record-001-short-takes.json'))
          for t in d['takes']:
              print(f"{t['order']:02d}\t{t['preview_url']}")
          PY
          while IFS=$'\t' read -r n url; do
            f="$out/$n.mp3"
            curl -fL --retry 4 --retry-all-errors --retry-delay 2 "$url" -o "$f"
            test "$(stat -c%s "$f")" -gt 1000
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 "$f" >/dev/null
          done < /tmp/urls.tsv
          test "$(find "$out" -maxdepth 1 -name '*.mp3' | wc -l)" -eq 36

      - name: Stitch, add settling tail, hash, and verify
        shell: bash
        run: |
          set -euo pipefail
          out='3l/assets/audio/record-001-chunks'
          final='3l/assets/audio/record-001.mp3'
          : > /tmp/concat.txt
          for f in "$out"/*.mp3; do printf "file '%s'\n" "$GITHUB_WORKSPACE/$f" >> /tmp/concat.txt; done
          ffmpeg -y -v error -f concat -safe 0 -i /tmp/concat.txt -c:a libmp3lame -q:a 2 /tmp/assembled.mp3
          ffmpeg -y -v error -i /tmp/assembled.mp3 -af apad=pad_dur=2 -c:a libmp3lame -q:a 2 "$final"
          test "$(stat -c%s "$final")" -gt 100000
          ffprobe -v error "$final"

          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          d=json.loads(Path('3l/audio/record-001-short-takes.json').read_text())
          component=0.0
          for t in d['takes']:
              f=Path(f"3l/assets/audio/record-001-chunks/{t['order']:02d}.mp3")
              duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(f)], text=True).strip())
              component += duration
              t['duration_seconds']=round(duration,3)
              t['byte_size']=f.stat().st_size
              t['audio_sha256']=hashlib.sha256(f.read_bytes()).hexdigest()
          final=Path('3l/assets/audio/record-001.mp3')
          fd=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(final)], text=True).strip())
          d['status']='durable_takes_verified_and_assembled'
          d['component_duration_seconds']=round(component,3)
          d['final_asset']=str(final)
          d['final_duration_seconds']=round(fd,3)
          d['final_byte_size']=final.stat().st_size
          d['final_audio_sha256']=hashlib.sha256(final.read_bytes()).hexdigest()
          d['settling_tail_seconds']=2.0
          Path('3l/audio/record-001-short-takes.json').write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          report={
              'record':1,
              'title':'THE PETITIONER',
              'voice':'deep',
              'capture_mode':'preview-safe-short-takes-single-voice-prototype',
              'take_count':d['take_count'],
              'duration_seconds':d['final_duration_seconds'],
              'byte_size':d['final_byte_size'],
              'sha256':d['final_audio_sha256'],
              'settling_tail_seconds':2.0,
              'status':'verified_unlistened'
          }
          Path('3l/audio/verification/record-001.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
          sha256sum "$out"/*.mp3 "$final" > "$out/SHA256SUMS"

      - name: Commit verified Record 001 audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 3l/manuscript/record-001.md \
                  3l/audio/record-001-short-takes.json \
                  3l/audio/verification/record-001.json \
                  3l/assets/audio/record-001.mp3 \
                  3l/assets/audio/record-001-chunks
          git commit -m 'audio: assemble 3L Record 001 prototype'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
