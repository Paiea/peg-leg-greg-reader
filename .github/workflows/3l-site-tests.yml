name: 3L Site Tests

on:
  push:
    branches:
      - 3l/marketed-r2-flow
    paths:
      - '3l/**'
      - 'r2/index.html'
      - 'tests/test_3l_site.py'
      - '.github/workflows/3l-site-tests.yml'
  pull_request:
    paths:
      - '3l/**'
      - 'r2/index.html'
      - 'tests/test_3l_site.py'
      - '.github/workflows/3l-site-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            3l
            tests
            r2/index.html
          sparse-checkout-cone-mode: false
      - name: Run 3L static site tests
        run: python -m unittest tests.test_3l_site
