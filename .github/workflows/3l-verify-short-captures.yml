name: Verify 3L short capture sources

on:
  push:
    branches:
      - 3l/records-002-010-write2
    paths:
      - '.github/workflows/3l-verify-short-captures.yml'
      - '3l/audio/record-002-short-captures*.json'
      - '3l/audio/record-003-short-captures*.json'
      - '3l/audio/record-002-short-dual-plan.json'
      - '3l/audio/record-003-short-dual-plan.json'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            3l/audio
      - name: Ensure ffmpeg tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -1
      - name: Download and verify capture MP3s
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          temp = root / '.tmp-3l-short-captures'
          temp.mkdir(exist_ok=True)
          verification_dir = root / '3l/audio/verification'
          verification_dir.mkdir(parents=True, exist_ok=True)

          for record in ('002', '003'):
              capture_paths = sorted((root / '3l/audio').glob(f'record-{record}-short-captures*.json'))
              capture_paths = [p for p in capture_paths if p.parent.name != 'verification']
              plan_path = root / f'3l/audio/record-{record}-short-dual-plan.json'
              if not capture_paths:
                  print(record, 'no capture manifests yet; skipping')
                  continue

              plan = json.loads(plan_path.read_text(encoding='utf-8'))
              chunks = {int(chunk['index']): chunk for chunk in plan['chunks']}
              seen = set()
              verified = []
              authority = None
              plan_ref = None

              for capture_path in capture_paths:
                  manifest = json.loads(capture_path.read_text(encoding='utf-8'))
                  if manifest.get('record') != record:
                      raise ValueError(f'{capture_path}: record mismatch')
                  if authority is None:
                      authority = manifest['authority']
                      plan_ref = manifest['plan']
                  elif manifest['authority'] != authority or manifest['plan'] != plan_ref:
                      raise ValueError(f'{capture_path}: authority or plan mismatch')

                  for item in manifest['captures']:
                      chunk_index = int(item['chunk'])
                      voice = item['voice']
                      key = (chunk_index, voice)
                      if key in seen:
                          raise ValueError(f'{record}: duplicate capture {key} in {capture_path}')
                      seen.add(key)

                      chunk = chunks.get(chunk_index)
                      if not chunk:
                          raise ValueError(f'{record}: unknown chunk {chunk_index}')
                      if voice not in chunk['required_voices']:
                          raise ValueError(f'{record}: voice {voice} not required for chunk {chunk_index}')
                      if item['transcript'] != chunk['transcript']:
                          raise ValueError(f'{record}: transcript mismatch for chunk {chunk_index} {voice}')
                      if item.get('status') != 'ready':
                          raise ValueError(f'{record}: capture not ready for chunk {chunk_index} {voice}')

                      out = temp / f'record-{record}-chunk-{chunk_index:03d}-{voice}.mp3'
                      subprocess.run([
                          'curl', '-L', '--fail', '--retry', '3', '--retry-delay', '1',
                          '-o', str(out), item['preview_url']
                      ], check=True)
                      subprocess.run(['ffmpeg', '-v', 'error', '-i', str(out), '-f', 'null', '-'], check=True)
                      duration = float(subprocess.check_output([
                          'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                          '-of', 'default=nw=1:nk=1', str(out)
                      ], text=True).strip())
                      if duration <= 0.5:
                          raise ValueError(f'{record}: suspicious duration {duration} for chunk {chunk_index} {voice}')
                      data = out.read_bytes()
                      verified.append({
                          'chunk': chunk_index,
                          'voice': voice,
                          'context_id': item['context_id'],
                          'preview_url': item['preview_url'],
                          'duration_seconds': round(duration, 6),
                          'byte_size': len(data),
                          'sha256': hashlib.sha256(data).hexdigest(),
                          'status': 'verified',
                          'manifest': str(capture_path),
                      })

              expected = {
                  (int(chunk['index']), voice)
                  for chunk in plan['chunks']
                  for voice in chunk['required_voices']
              }
              missing = sorted(expected - seen)
              verified.sort(key=lambda item: (item['chunk'], item['voice']))
              receipt = {
                  'record': record,
                  'authority': authority,
                  'plan': plan_ref,
                  'capture_manifests': [str(p) for p in capture_paths],
                  'verified_capture_count': len(verified),
                  'planned_capture_count': len(expected),
                  'complete': not missing,
                  'missing': [{'chunk': chunk, 'voice': voice} for chunk, voice in missing],
                  'captures': verified,
              }
              receipt_path = verification_dir / f'record-{record}-short-captures.json'
              receipt_path.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              print(record, f"verified={len(verified)}/{len(expected)} complete={not missing} manifests={len(capture_paths)}")
          PY
      - name: Commit verification receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3l/audio/verification/record-002-short-captures.json 2>/dev/null || true
          git add 3l/audio/verification/record-003-short-captures.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "audio: verify 3L short capture sources"
          git push origin HEAD:${GITHUB_REF_NAME}
