name: One-shot append Chapter 232
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/append-ch232-once.yml
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified chapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          manuscript = Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md')
          payload = Path('state/manuscript/.ch232_append.tmp')
          text = manuscript.read_text()
          chapter = payload.read_text()
          assert '# CHAPTER 231' in text and '## THE MAGISTRATE' in text, 'Chapter 231 authority missing'
          assert '# CHAPTER 232' not in text, 'Chapter 232 already exists; refusing competing append'
          assert chapter.count('# CHAPTER 232') == 1 and chapter.count('## THE MATCHER') == 1, 'Chapter 232 title/header mismatch'
          assert chapter.count('—') == 0, 'em dash in Chapter 232'
          words = len(re.findall(r"\b[\w’'-]+\b", chapter))
          assert 2500 <= words <= 4000, words
          manuscript.write_text(text.rstrip() + '\n\n------------------------------------------------------------------------\n\n' + chapter.lstrip())
          print('chapter_words', words)
          print('em_dashes', chapter.count('—'))
          PY
      - name: Remove one-shot files
        run: rm state/manuscript/.ch232_append.tmp .github/workflows/append-ch232-once.yml
      - name: Verify, commit, rebase, and push
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md').read_text()
          assert text.count('# CHAPTER 232') == 1
          tail = '# CHAPTER 232' + text.split('# CHAPTER 232', 1)[1]
          assert '## THE MATCHER' in tail
          assert tail.count('—') == 0
          words = len(re.findall(r"\b[\w’'-]+\b", tail))
          assert 2500 <= words <= 4000, words
          print('verified_words', words)
          print('verified_em_dashes', tail.count('—'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/manuscript/Peg_Leg_Greg_Running_Manuscript.md state/manuscript/.ch232_append.tmp .github/workflows/append-ch232-once.yml
          git diff --cached --check
          git commit -m "Append Chapter 232: THE MATCHER"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
