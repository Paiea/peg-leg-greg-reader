name: Apply strict dialogue ownership 031-040

on:
  push:
    branches:
      - integration/aggressive-dialogue-031-040-final
    paths:
      - '.github/workflows/apply-dialogue-ownership-031-040.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact visible-text ownership repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import re

          repairs = {
              31: [
                  ('I held up my LIMITED CASTING tag. The clerk said, “Functional enough.”',
                   ['I held up my LIMITED CASTING tag.', 'The clerk said, “Functional enough.”']),
                  ('She looked at Hessa. Hessa looked at me. The woman said, “Why would I do a wall?” There it was.',
                   ['She looked at Hessa.', 'Hessa looked at me.', 'The woman said, “Why would I do a wall?”', 'There it was.']),
                  ('Hessa said, “Yes.” Traitor. The woman smiled.',
                   ['Hessa said, “Yes.”', 'Traitor.', 'The woman smiled.']),
                  ('I read it twice. Alden was somewhere getting his sword repaired and finding Berren. Antonius had work waiting without urgency. Hessa had told me not to experiment. Darrowmere samples had reached Edrin. And the South Canal sacks, which had nearly gotten people killed before any monsters existed, were finally open. There. The world had chosen. I folded the note. The clerk said, “Going?”',
                   ['I read it twice. Alden was somewhere getting his sword repaired and finding Berren. Antonius had work waiting without urgency. Hessa had told me not to experiment. Darrowmere samples had reached Edrin. And the South Canal sacks, which had nearly gotten people killed before any monsters existed, were finally open. There. The world had chosen. I folded the note.', 'The clerk said, “Going?”']),
              ],
              32: [
                  ('I asked, “Where did the sacks come from?” Nobody answered. Not because nobody knew. I looked at Nella.',
                   ['I asked, “Where did the sacks come from?”', 'Nobody answered. Not because nobody knew. I looked at Nella.']),
                  ('The constable straightened. Verran said, “Nella.” She ignored him.',
                   ['The constable straightened.', 'Verran said, “Nella.”', 'She ignored him.']),
                  ('Verran said, “Private.” The constable said, “Not anymore.” Verran’s jaw moved. Nella said, “Storage credit.”',
                   ['Verran said, “Private.”', 'The constable said, “Not anymore.”', 'Verran’s jaw moved.', 'Nella said, “Storage credit.”']),
                  ('He looked at the constable. The constable said, “You can answer or not. It will be in the statement either way.” Verran laughed once without humor.',
                   ['He looked at the constable.', 'The constable said, “You can answer or not. It will be in the statement either way.”', 'Verran laughed once without humor.']),
              ],
              34: [
                  ('I nearly asked why she had loosened the first bolt after tightening it. Did not. She was working. Arlo said, “Greg.”',
                   ['I nearly asked why she had loosened the first bolt after tightening it. Did not. She was working.', 'Arlo said, “Greg.”']),
              ],
              35: [
                  ('I stopped. Jorren grinned. The woman said, “Everybody owes Vale.”',
                   ['I stopped.', 'Jorren grinned.', 'The woman said, “Everybody owes Vale.”']),
                  ('Jorren said that immediately. The man said, “One copper.”',
                   ['Jorren said that immediately.', 'The man said, “One copper.”']),
                  ('She left. The Five Roads man disappeared. Mara brought Jorren water without being asked. He looked offended. She said, “You work tomorrow.” He drank it. Again. Existing life. Jorren had routines here. People knew his schedule. People knew which chair Nessa claimed. Mara knew when to stop pouring him beer. I had entered it. Not created it.',
                   ['She left. The Five Roads man disappeared.', 'Mara brought Jorren water without being asked.', 'He looked offended.', 'She said, “You work tomorrow.”', 'He drank it.', 'Again. Existing life. Jorren had routines here. People knew his schedule. People knew which chair Nessa claimed. Mara knew when to stop pouring him beer. I had entered it. Not created it.']),
                  ('Reasonable. A male voice from an upstairs window shouted, “Jorren, you owe me four copper.” I looked at him. He looked at the window.',
                   ['Reasonable.', 'A male voice from an upstairs window shouted, “Jorren, you owe me four copper.”', 'I looked at him.', 'He looked at the window.']),
              ],
              36: [
                  ('Berren said, “I am sitting.” He was standing. She pointed at the bench. He sat. I liked her immediately. Not because she controlled him. Because she did not seem interested in whether she controlled him. She had bread to cut. Alden said, “This is Nara.”',
                   ['Berren said, “I am sitting.” He was standing.', 'She pointed at the bench.', 'He sat.', 'I liked her immediately. Not because she controlled him. Because she did not seem interested in whether she controlled him. She had bread to cut.', 'Alden said, “This is Nara.”']),
                  ('Alden said, “Day after.” I wanted tomorrow. My body wanted tomorrow. My mind had already started building rounds. Bad sign.',
                   ['Alden said, “Day after.”', 'I wanted tomorrow. My body wanted tomorrow. My mind had already started building rounds. Bad sign.']),
              ],
              37: [
                  ('The clerk said, “Initial.” I initialed beside the false signature. Now it was my mistake. Better. We left through the west gate just after noon with a mill worker named Ossin and a handcart full of rope, two shovels, a pry bar, three hooked poles, and enough bread to make the contract’s meal clause technically true.',
                   ['The clerk said, “Initial.”', 'I initialed beside the false signature. Now it was my mistake. Better. We left through the west gate just after noon with a mill worker named Ossin and a handcart full of rope, two shovels, a pry bar, three hooked poles, and enough bread to make the contract’s meal clause technically true.']),
                  ('He held his hands about two feet apart. Berren looked disappointed. I liked him less for three seconds. The woman said, “You kill anything that comes out. Mostly you pull rubbish.”',
                   ['He held his hands about two feet apart.', 'Berren looked disappointed.', 'I liked him less for three seconds.', 'The woman said, “You kill anything that comes out. Mostly you pull rubbish.”']),
              ],
              38: [
                  ('Hessa said, “Again.” He breathed. Focused. A faint warmth appeared against my face. Not visible. Barely there. The boy smiled. Then lost it.',
                   ['Hessa said, “Again.”', 'He breathed. Focused. A faint warmth appeared against my face. Not visible. Barely there. The boy smiled. Then lost it.']),
                  ('I did. No questions. That felt strange enough that I noticed. Downstairs I helped Jalen move two crates because',
                   ['I did. No questions. That felt strange enough that I noticed. Downstairs I helped Jalen move two crates because he asked. Not Antonius work. No pay. One crate was heavy. My hands objected. I adjusted grip. Used forearms. Bad. Still got it moved.']),
                  ('he asked. Not Antonius work. No pay. One crate was heavy. My hands objected. I adjusted grip. Used forearms. Bad. Still got it moved. Jalen said, “You’re the bean man.”',
                   ['Jalen said, “You’re the bean man.”']),
              ],
              39: [
                  ('Alden claimed a narrow strip near the rear wall. Not claimed. Asked. A Guild attendant looked at our weapons, looked at Berren’s foot, and said, “Light.” Alden said, “Light.” Berren said nothing. Good. We used blunted practice swords. My repaired real sword stayed belted at the wall. That mattered more than expected. The practice blade felt wrong. Weight close. Balance not. Grip thicker.',
                   ['Alden claimed a narrow strip near the rear wall. Not claimed. Asked.', 'A Guild attendant looked at our weapons, looked at Berren’s foot, and said, “Light.”', 'Alden said, “Light.”', 'Berren said nothing.', 'Good. We used blunted practice swords. My repaired real sword stayed belted at the wall. That mattered more than expected. The practice blade felt wrong. Weight close. Balance not. Grip thicker.']),
                  ('Berren said, “Greg.” Good. Third. Alden changed rhythm. Slow first. Then fast. I recognized it. He had learned that from someone else.',
                   ['Berren said, “Greg.”', 'Good. Third.', 'Alden changed rhythm. Slow first. Then fast.', 'I recognized it. He had learned that from someone else.']),
              ],
          }

          p_re = re.compile(r'<p\b[^>]*>(.*?)</p>', re.I | re.S)
          tag_re = re.compile(r'<[^>]+>')

          def norm(s: str) -> str:
              return re.sub(r'\s+', ' ', html.unescape(s).replace('\xa0', ' ')).strip()

          def flat_prose(text: str) -> str:
              article = text.split('<article class="prose">', 1)[1].split('</article>', 1)[0]
              return norm(tag_re.sub(' ', article))

          changed = []
          for chapter, items in repairs.items():
              path = Path('chapters') / f'{chapter:03d}.html'
              text = path.read_text(encoding='utf-8')
              original_flat = flat_prose(text)
              for old_visible, new_paras in items:
                  matches = []
                  for m in p_re.finditer(text):
                      inner = m.group(1)
                      if norm(tag_re.sub('', inner)) == norm(old_visible):
                          matches.append((m, inner))
                  if len(matches) != 1:
                      raise SystemExit(f'{path}: expected one visible-text match, got {len(matches)}: {old_visible[:100]}')
                  m, inner = matches[0]
                  if tag_re.search(inner):
                      raise SystemExit(f'{path}: targeted paragraph unexpectedly contains inline markup: {old_visible[:100]}')
                  replacement = ''.join(f'<p>{part}</p>' for part in new_paras)
                  text = text[:m.start()] + replacement + text[m.end():]
              if flat_prose(text) != original_flat:
                  raise SystemExit(f'{path}: ownership repair changed normalized prose text')
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))
          print('repaired:', ', '.join(changed))
          PY
      - name: Strict ownership checker must clear
        run: python scripts/dialogue_ownership_check.py --range 31-40 --strict
      - name: Verify Chapter 31 semantic name reveal remains correct
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('chapters/031.html').read_text(encoding='utf-8')
          marker = '“What’s your name?”'
          before, after = text.split(marker, 1)
          assert 'Rinna said' not in before
          assert '<p>The woman said, </p>' not in text
          assert 'stone block Ressa had used' not in text
          assert 'stone block Rinna had used' in after
          print('Chapter 31 semantic reveal passed')
          PY
      - name: Verify rewrite is idempotent after human repairs
        run: |
          mkdir -p /tmp/dialogue-after-human
          cp chapters/{031..040}.html /tmp/dialogue-after-human/
          for pass in 1 2 3 4; do
            python scripts/apply_dialogue_ownership_rewrite.py --start 31 --end 40
          done
          python - <<'PY'
          from pathlib import Path
          for n in range(31, 41):
              name = f'{n:03d}.html'
              before = Path('/tmp/dialogue-after-human', name).read_text(encoding='utf-8')
              after = Path('chapters', name).read_text(encoding='utf-8')
              if before != after:
                  raise SystemExit(f'ownership rewrite still changes {name}')
          print('ownership rewrite idempotent after human repairs')
          PY
      - name: Full repository validation
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check
          python scripts/verify_reader_frontier.py
      - name: Validate changed prose surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for n in range(31, 41):
              p = Path('chapters') / f'{n:03d}.html'
              text = p.read_text(encoding='utf-8')
              article = text.split('<article class="prose">', 1)[1].split('</article>', 1)[0]
              if '<p></p>' in article:
                  raise SystemExit(f'empty paragraph: {p}')
              prose = re.sub(r'<[^>]+>', '', article)
              if '—' in prose:
                  raise SystemExit(f'em dash in prose: {p}')
          print('prose validation passed')
          PY
      - name: Commit validated human ownership repairs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters/031.html chapters/032.html chapters/034.html chapters/035.html chapters/036.html chapters/037.html chapters/038.html chapters/039.html
          if git diff --cached --quiet; then
            echo 'No manuscript ownership repairs to commit.'
            exit 0
          fi
          git commit -m "Resolve strict dialogue ownership through chapter 40"
          git push origin HEAD:integration/aggressive-dialogue-031-040-final
