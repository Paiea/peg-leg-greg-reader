name: Assemble Greg Again Chapter 10 audio

on:
  push:
    branches:
      - audio/greg-again-ch10-returner
    paths:
      - .github/workflows/assemble-greg-again-ch10-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch10-returner
      - name: Install ffmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Assemble Chapter 10
        shell: bash
        run: |
          set -euo pipefail
          dir='greg-again/audio/assets/chunks/010'
          out='greg-again/audio/assets/chapter-010.mp3'
          files=(01 02 03 04 05 06 07 08 09 10 11 12)

          if [ "${#files[@]}" -ne 12 ]; then
            echo 'Expected exactly 12 Chapter 10 takes.'
            exit 1
          fi

          : > /tmp/ch10-concat.txt
          for label in "${files[@]}"; do
            file="$dir/$label.mp3"
            test -s "$file" || { echo "Missing or empty $file"; exit 1; }
            size=$(stat -c%s "$file")
            if [ "$size" -lt 10000 ]; then
              echo "Suspiciously small take $file: $size bytes"
              exit 1
            fi
            printf "file '%s/%s.mp3'\n" "$GITHUB_WORKSPACE/$dir" "$label" >> /tmp/ch10-concat.txt
          done

          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i /tmp/ch10-concat.txt -c copy "$out"

          size=$(stat -c%s "$out")
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out")
          echo "CHAPTER_010_BYTES=$size"
          echo "CHAPTER_010_DURATION=$duration"

          python - "$size" "$duration" <<'PY'
          import sys
          size = int(sys.argv[1])
          duration = float(sys.argv[2])
          if size < 5_000_000:
              raise SystemExit(f'assembled MP3 too small: {size}')
          if not 600 <= duration <= 1200:
              raise SystemExit(f'assembled duration suspicious: {duration}')
          print(f'Chapter 10 assembly verified: {duration:.3f}s, {size} bytes')
          PY

          file "$out"
      - name: Commit assembled Chapter 10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chapter-010.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'audio: assemble Greg Again Chapter 10'
            git push origin HEAD:audio/greg-again-ch10-returner
          fi
