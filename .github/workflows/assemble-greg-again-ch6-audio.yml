name: Assemble Greg Again Chapter 6 audio

on:
  push:
    branches:
      - audio/greg-again-ch6-first-customer
    paths:
      - .github/workflows/assemble-greg-again-ch6-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch6-first-customer
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify and assemble Chapter 6
        shell: bash
        run: |
          set -euo pipefail
          dir='greg-again/audio/assets/chunks/006'
          out='greg-again/audio/assets/chapter-006.mp3'
          : > /tmp/ch6-concat.txt
          for n in $(seq -w 1 13); do
            f="$dir/$n.mp3"
            test -s "$f"
            bytes=$(stat -c%s "$f")
            if [ "$bytes" -lt 10000 ]; then
              echo "Chunk $n is suspiciously small: $bytes"
              exit 1
            fi
            printf "file '%s/%s'\n" "$PWD" "$f" >> /tmp/ch6-concat.txt
            dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f")
            echo "CHUNK $n duration=$dur bytes=$bytes"
          done
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i /tmp/ch6-concat.txt -c copy "$out"
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out")
          bytes=$(stat -c%s "$out")
          echo "CHAPTER6 duration=$duration bytes=$bytes"
          python - "$duration" "$bytes" <<'PY'
          import sys
          duration = float(sys.argv[1])
          size = int(sys.argv[2])
          assert 300 < duration < 1800, duration
          assert size > 1_000_000, size
          PY
      - name: Commit assembled Chapter 6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chapter-006.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'chore: assemble Greg Again Chapter 6 audio'
            git push origin HEAD:audio/greg-again-ch6-first-customer
          fi
