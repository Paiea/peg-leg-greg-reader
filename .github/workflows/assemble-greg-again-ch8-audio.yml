name: Assemble Greg Again Chapter 8 audio

on:
  push:
    branches:
      - audio/greg-again-ch8-evidence-before-certainty
    paths:
      - .github/workflows/assemble-greg-again-ch8-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch8-evidence-before-certainty
      - name: Install ffmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Assemble Chapter 8
        shell: bash
        run: |
          set -euo pipefail
          dir='greg-again/audio/assets/chunks/008'
          out='greg-again/audio/assets/chapter-008.mp3'
          files=(01 02 03 04 05 06 07 08 09 10 11 12 13 14)

          if [ "${#files[@]}" -ne 14 ]; then
            echo 'Expected exactly 14 Chapter 8 takes.'
            exit 1
          fi

          : > /tmp/ch8-concat.txt
          for label in "${files[@]}"; do
            file="$dir/$label.mp3"
            test -s "$file" || { echo "Missing or empty $file"; exit 1; }
            size=$(stat -c%s "$file")
            if [ "$size" -lt 10000 ]; then
              echo "Suspiciously small take $file: $size bytes"
              exit 1
            fi
            printf "file '%s/%s.mp3'\n" "$GITHUB_WORKSPACE/$dir" "$label" >> /tmp/ch8-concat.txt
          done

          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i /tmp/ch8-concat.txt -c copy "$out"

          size=$(stat -c%s "$out")
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out")
          echo "CHAPTER_008_BYTES=$size"
          echo "CHAPTER_008_DURATION=$duration"

          python - "$size" "$duration" <<'PY'
          import sys
          size = int(sys.argv[1])
          duration = float(sys.argv[2])
          if size < 5_000_000:
              raise SystemExit(f'assembled MP3 too small: {size}')
          if not 600 <= duration <= 1200:
              raise SystemExit(f'assembled duration suspicious: {duration}')
          print(f'Chapter 8 assembly verified: {duration:.3f}s, {size} bytes')
          PY

          file "$out"
      - name: Commit assembled Chapter 8
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chapter-008.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'audio: assemble Greg Again Chapter 8'
            git push origin HEAD:audio/greg-again-ch8-evidence-before-certainty
          fi
