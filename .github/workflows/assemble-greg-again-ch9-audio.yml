name: Assemble Greg Again Chapter 9 audio

on:
  push:
    branches:
      - audio/greg-again-ch9-backstop
    paths:
      - .github/workflows/assemble-greg-again-ch9-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch9-backstop
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Assemble Chapter 9
        shell: bash
        run: |
          set -euo pipefail
          dir='greg-again/audio/assets/chunks/009'
          out='greg-again/audio/assets/chapter-009.mp3'
          files=(01 02a 02b 03 04 05 06a 06b 07 08 09 10)
          test "${#files[@]}" -eq 12
          : > /tmp/ch9-concat.txt
          for label in "${files[@]}"; do
            file="$dir/$label.mp3"
            test -s "$file" || { echo "Missing $file"; exit 1; }
            size=$(stat -c%s "$file")
            test "$size" -gt 10000 || { echo "Suspiciously small $file"; exit 1; }
            printf "file '%s/%s.mp3'\n" "$GITHUB_WORKSPACE/$dir" "$label" >> /tmp/ch9-concat.txt
          done
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i /tmp/ch9-concat.txt -c copy "$out"
          size=$(stat -c%s "$out")
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out")
          echo "CHAPTER_009_BYTES=$size"
          echo "CHAPTER_009_DURATION=$duration"
          python - "$size" "$duration" <<'PY'
          import sys
          size=int(sys.argv[1]); duration=float(sys.argv[2])
          if size < 5_000_000: raise SystemExit(f'assembled MP3 too small: {size}')
          if not 600 <= duration <= 1200: raise SystemExit(f'assembled duration suspicious: {duration}')
          print(f'Chapter 9 assembly verified: {duration:.3f}s, {size} bytes')
          PY
          file "$out"
      - name: Commit assembled Chapter 9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chapter-009.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'audio: assemble Greg Again Chapter 9'
            git push origin HEAD:audio/greg-again-ch9-backstop
          fi