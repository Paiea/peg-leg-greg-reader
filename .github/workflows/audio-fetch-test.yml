          14:['44a89af1-fc4a-4e51-a40d-c36b2a58b54d','cc1965c7-3e63-403f-9600-f51efe53c7db','8271d22c-8b0a-4b08-bd6d-65120d416125','a9f87643-7366-4c3a-b5cd-189d72cabada','4190e324-d490-49b3-88c0-54f7996981c0','cff1f29b-f736-4c14-b3aa-a7369832411a','d6b634e6-5ab5-4794-ab1c-d66481304a63','78088ec9-2176-4ac4-9e82-30a55243dc9e','4dfee40d-fc6f-4fda-a4fd-b4fb009b3f22','5b48a2a9-62a7-414e-97f3-9c44decf51ae','96a627e4-5491-45d6-a26a-044b057deab4','bee1f2cb-3d6c-4b1e-ad0e-4c5937d7b85e','b5593634-b30b-4b3b-aa8c-533c034e7784','445ab43e-ff17-464c-8248-06e39b2bd0b0','a3c3dc04-10c2-45c7-a145-f6758fc3e769','ab260a10-799d-4d25-a180-97394914472b','cd3ff553-d449-4475-b06a-cebfc3c3325b','d4089607-fb67-4659-9018-5fd3371d7d4f','5130ae24-1bda-4fe7-9ed7-5ccfe40b8885','3a23715f-0ff6-4d12-b521-1eaf4b910beb','be5a672b-f1c5-4ac6-a5a5-90de05ad2a01','179179e8-8678-4324-8730-daffcc5f2143','b3f935c1-6797-4051-9f5e-6e316a3f7a0a','4893cbb9-7cfd-4354-bb42-117681e9d5be','f8fce2fb-80a4-45be-8158-d4fe993f6bb4','5f916a24-1dc0-4cb1-bfb8-7e4d985cfe81','866c5134-25e1-498f-be80-cbabe96a4913','249cd639-96e5-4bbe-9a0d-a4d8494bd683','5235bd61-506e-44c3-aef4-7234df0ed7a1']}
          expected={12:'a6c8a7aecadd56e6cf4a8d27a0b528a68ac039a12d5551bdb03cd404f9c81aab',13:'8fc5583cf87616a72027b5605559d2406bdf94d9e65ead217fce7fe501ab2654',14:'70024079506ccb1e6534b5d6eef8e04eddc2d6bb58d88b1e81e417eeade2271a'}
          root=pathlib.Path('greg-again/audio/assets')
          for ch,uids in ids.items():
              d=root/'chunks'/f'{ch:03d}'; d.mkdir(parents=True,exist_ok=True)
              for old in d.glob('*.mp3'): old.unlink()
              for n,uid in enumerate(uids,1):
                  p=d/f'{n:02d}.mp3'
                  subprocess.run(['curl','--fail','--location','--retry','3',base+uid+'.mp3','-o',str(p)],check=True)
                  if p.stat().st_size<10_000: raise SystemExit(f'ch{ch} take {n} too small')
                  subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(p)],check=True,stdout=subprocess.DEVNULL)
              concat=pathlib.Path(f'/tmp/ch{ch}.txt')
              concat.write_text('\n'.join(f"file '{p.resolve()}'" for p in sorted(d.glob('*.mp3')))+'\n')
              final=root/f'chapter-{ch:03d}.mp3'
              subprocess.run(['ffmpeg','-v','error','-f','concat','-safe','0','-i',str(concat),'-c','copy','-y',str(final)],check=True)
              digest=hashlib.sha256(final.read_bytes()).hexdigest()
              if digest!=expected[ch]: raise SystemExit(f'ch{ch} hash mismatch {digest}')
              dur=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(final)],text=True).strip()
              print(ch,dur,digest)
          PY
      - name: Commit verified binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Paiea
          git config user.email paiea.tv@gmail.com
          git add greg-again/audio/assets/chapter-012.mp3 greg-again/audio/assets/chapter-013.mp3 greg-again/audio/assets/chapter-014.mp3 greg-again/audio/assets/chunks/012 greg-again/audio/assets/chunks/013 greg-again/audio/assets/chunks/014
          git commit -m 'Publish verified Greg Again audio binaries for Chapters 12-14'
          git push origin HEAD:audio/greg-again-batch-012-014
