name: Greg Again Audio Fetch Test

on:
  push:
    branches:
      - audio/greg-again-batch-012-014
    paths:
      - .github/workflows/audio-fetch-test.yml

jobs:
  inspect-provider-page:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch provider landing page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.aidocmaker.com/g0/audio?name=98aef78da55b4520a8acf2c5636c7d56' \
            -o out/provider.html
          test -s out/provider.html
          file out/provider.html
          echo '--- media-like references ---'
          grep -Eo 'https?://[^"'"'"'<> ]+|src=["'"'"'][^"'"'"']+|href=["'"'"'][^"'"'"']+' out/provider.html | grep -Ei 'audio|mp3|wav|m4a|media|storage|download|blob|g0' | head -100 || true
          echo '--- audio tokens ---'
          grep -Eio '.{0,120}(audio|mp3|wav|m4a|download|storage|blob).{0,220}' out/provider.html | head -100 || true
      - uses: actions/upload-artifact@v4
        with:
          name: ga012-provider-page
          path: out/provider.html
          if-no-files-found: error
