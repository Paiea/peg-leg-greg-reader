name: Greg Again Audio Fetch Test

on:
  push:
    branches:
      - audio/greg-again-batch-012-014
    paths:
      - .github/workflows/audio-fetch-test.yml

jobs:
  fetch-preview-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public preview MP3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          url='https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/c3a7eb16-58f2-4ba9-97b2-9b1a60bf5e5e.mp3'
          curl --fail --location "$url" -o out/handoff-test.mp3
          test -s out/handoff-test.mp3
          file out/handoff-test.mp3
          python - <<'PY'
          from pathlib import Path
          p=Path('out/handoff-test.mp3')
          b=p.read_bytes()
          print('bytes',len(b),'prefix',b[:16].hex())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ga-audio-preview-bridge-test
          path: out/handoff-test.mp3
          if-no-files-found: error
