name: Greg Again Audio Fetch Test

on:
  push:
    branches:
      - audio/greg-again-batch-012-014
    paths:
      - .github/workflows/audio-fetch-test.yml

jobs:
  inspect-provider-client:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch landing page and client chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/chunks
          PAGE='https://www.aidocmaker.com/g0/audio?name=98aef78da55b4520a8acf2c5636c7d56'
          curl --fail --location "$PAGE" -o out/provider.html
          python - <<'PY' > out/script-paths.txt
          import re
          s=open('out/provider.html',encoding='utf-8').read()
          for p in re.findall(r'<script[^>]+src="([^"]+)"', s):
              print(p)
          PY
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            f="out/chunks/$(basename "${p%%\?*}")"
            curl --fail --location "https://www.aidocmaker.com$p" -o "$f"
          done < out/script-paths.txt
          python - <<'PY'
          from pathlib import Path
          found=[]
          for p in Path('out/chunks').glob('*.js'):
              s=p.read_text(errors='ignore')
              import re
              for m in re.finditer(r'(?i).{0,300}(useDocmakerFile|documentDetails|callModalApi|fetch_doc|fetch.*file|get.*document|context_type).{0,500}',s):
                  found.append(f'FILE {p.name}\n{m.group(0)}\n')
                  if len(found)>=200: break
              if len(found)>=200: break
          print('\n'.join(found))
          Path('out/matches.txt').write_text('\n'.join(found))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ga012-provider-client-full
          path: out
          if-no-files-found: error
