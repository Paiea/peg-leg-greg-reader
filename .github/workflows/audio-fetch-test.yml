name: Greg Again Audio Fetch Test

on:
  push:
    branches:
      - audio/greg-again-batch-012-014
    paths:
      - .github/workflows/audio-fetch-test.yml

jobs:
  fetch-document-record:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Chapter 12 take 01 document record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          endpoint='https://level2labs-prod--adm-agent-helper-user-fetch-document.modal.run'
          curl --silent --show-error --location \
            -X POST "$endpoint" \
            -H 'Content-Type: application/json' \
            --data '{"context_id":"98aef78da55b4520a8acf2c5636c7d56","context_type":"audio","refresh":true}' \
            -D out/headers.txt \
            -o out/document.json
          echo '--- status/body ---'
          cat out/headers.txt
          python -m json.tool out/document.json || cat out/document.json
      - uses: actions/upload-artifact@v4
        with:
          name: ga012-take01-document-record
          path: out
          if-no-files-found: error
