name: Greg Again Audio Batch Finalizer

on:
  push:
    branches:
      - audio/greg-again-batch-012-014
    paths:
      - .github/workflows/audio-publish-test.yml

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-batch-012-014
          fetch-depth: 0
      - name: Reconcile current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Paiea
          git config user.email paiea.tv@gmail.com
          git fetch origin main
          git merge --no-edit origin/main
      - name: Restore locked transcript artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/takes
          gh api /repos/Paiea/peg-leg-greg-reader/actions/artifacts/10089624291/zip > /tmp/takes.zip
          unzip -q /tmp/takes.zip -d /tmp/takes
      - name: Build durable production records and catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          preview = {
            12: ['d50e3b2c-c57a-47ca-9f05-3fac5d7eab8f','6cdeafbc-3a9b-48bb-a42a-737ef7f16da6','8e34e0fd-7f35-4443-b87d-c5766073c3aa','a675d4f8-93fa-4ec0-8e1d-e904a6c28218','ae2299ae-9b3f-4a20-99bf-ac05139bfd56','ff3f247b-6269-403a-90ff-1b36a03101d2','a2a9596c-f0e4-4be4-89a3-8a36f2d6cc03','008ccd17-55e4-439b-ac1b-ed79876243c4','740fa0b3-50e5-4301-836c-5145e7756cf8','3b7c8f22-a911-43ac-83f1-f6520735fc6c','181b3243-4b56-48e0-b1ca-f9e858c15e0c','21aa29c7-c3b1-45b9-9468-d8dfb6a1d455','f3a88ed0-ddf7-4e81-a847-bb53d95a222b','8830e5e1-de6e-450e-844e-55169835574c','c7823b4d-7383-4d45-bb7d-f13acf396bb3','a63ea85c-8985-4610-ab2a-0b12749fb8a3','61e4d1d5-439d-4840-aa0c-02aaa5418845','7926bfaa-d5e1-499c-9222-20e0a4be0073','1a445551-7576-4985-879e-7d0ff12eb801','baa15cf5-8de0-4ab1-9b3b-a722f7a7bf85','f85240b5-73fa-4f18-ba29-7d1b12b03717','8fa26048-609b-4737-9a89-dd0434f42551','7c1c38a1-ec5b-4e2e-a546-f3100e348991','550b668e-195b-4b2a-8330-119e93b904b1','8f06175c-0072-4d00-b9d7-16cf3b28cab9'],
            13: ['987b64bb-45e9-4555-9841-d881e1709b28','7e436744-8a34-4a67-b1df-dcee0565a8bc','c0be655b-3200-4ac0-9e69-53bfbdd3eaea','6e4b65e0-25ec-4a19-9bba-53232f76b088','43cbb451-8109-4884-ae4a-655a32dd2737','ceaeef6a-ddef-4000-af3c-7a197bdae869','d3aa8130-b279-42eb-bc92-868571736e98','0630d609-8702-4058-8cc1-f6520735fc6c','e8bae97e-08eb-49ac-96be-abdbb3a11636','b44b1964-6bdc-487f-b6f3-e206535642e4','a17e9c1b-c4ec-4f17-81a6-63b4d15725c4','715c806a-45cc-4ba4-b385-b31e593be06b','f460f596-7639-4fab-b79c-6bea7a9f912a','eb5f0c11-95bd-4694-a813-7b492beb25c5','f5e3a99f-ae5f-4bf6-9ed8-35813611a2ea','90e7e177-7025-4818-a358-28b076637df2','3232fee8-a4fd-4fbe-92ce-40591fe429ba','f61ca67b-1345-4412-b6bb-0963d2bc8b78','0267a708-6bd2-49fa-ae63-1f3664382d1d','adc1491d-183e-4270-afc4-430417b7ee46','c6c2ada3-3f09-4312-8e7f-8209cbeb44d8','01b879e0-8eae-40f6-a0e6-24d624b20a45','2ab4d7cd-24ac-4934-8760-524c60265c76','76c11fd4-54f2-4a42-9b8f-d27b57eca50e','1d4978a7-55b0-4bfa-bffc-cd543ea1d81d','bd031491-0f9d-423d-9fef-c408d15b433d','35a8af48-b263-4d26-af01-a2eebdb2e4ef','7bfaf092-2501-480f-bb1c-e44e32b3fa50'],
            14: ['44a89af1-fc4a-4e51-a40d-c36b2a58b54d','cc1965c7-3e63-403f-9600-f51efe53c7db','8271d22c-8b0a-4b08-bd6d-65120d416125','a9f87643-7366-4c3a-b5cd-189d72cabada','4190e324-d490-49b3-88c0-54f7996981c0','cff1f29b-f736-4c14-b3aa-a7369832411a','d6b634e6-5ab5-4794-ab1c-d66481304a63','78088ec9-2176-4ac4-9e82-30a55243dc9e','4dfee40d-fc6f-4fda-a4fd-b4fb009b3f22','5b48a2a9-62a7-414e-97f3-9c44decf51ae','96a627e4-5491-45d6-a26a-044b057deab4','bee1f2cb-3d6c-4b1e-ad0e-4c5937d7b85e','b5593634-b30b-4b3b-aa8c-533c034e7784','445ab43e-ff17-464c-8248-06e39b2bd0b0','a3c3dc04-10c2-45c7-a145-f6758fc3e769','ab260a10-799d-4d25-a180-97394914472b','cd3ff553-d449-4475-b06a-cebfc3c3325b','d4089607-fb67-4659-9018-5fd3371d7d4f','5130ae24-1bda-4fe7-9ed7-5ccfe40b8885','3a23715f-0ff6-4d12-b521-1eaf4b910beb','be5a672b-f1c5-4ac6-a5a5-90de05ad2a01','179179e8-8678-4324-8730-daffcc5f2143','b3f935c1-6797-4051-9f5e-6e316a3f7a0a','4893cbb9-7cfd-4354-bb42-117681e9d5be','f8fce2fb-80a4-45be-8158-d4fe993f6bb4','5f916a24-1dc0-4cb1-bfb8-7e4d985cfe81','866c5134-25e1-498f-be80-cbabe96a4913','249cd639-96e5-4bbe-9a0d-a4d8494bd683','5235bd61-506e-44c3-aef4-7234df0ed7a1'],
          }
          cfg = {
            12: dict(title='The Stranger', scene='Mara', guard='MEMORY ABSENCE MUST STAY ABSENCE.', blob='706f38e3bea403709a231779bfa7db426c57aec3', count=25, duration=606.504, asset_sha='33c5581590e27f673e5b51a4b6d5413d587317105ea9daef3aea483876545087', note="Chapter 12 preserves memory absence as absence. Twenty-five preview-safe deep-voice takes keep Mara's knowledge of young Greg distinct from Greg's missing recent memory while preserving the ordinary losses that history did not record."),
            13: dict(title='The Fighter', scene='The Good Sword', guard='A BETTER TOOL DOES NOT REPLACE JUDGMENT.', blob='3ecba1f063e00271f48800b67c544ed58410b5a3', count=28, duration=653.952, asset_sha='8fc5583cf87616a72027b5605559d2406bdf94d9e65ead217fce7fe501ab2654', note="Chapter 13 keeps the better sword useful without letting the tool replace judgment. Twenty-eight preview-safe takes preserve Edda's tactical ownership, terrain causality, and Greg's distinction between equipment improvement and decision quality."),
            14: dict(title='The Helper', scene='The Back Room', guard='ORDINARY SPACE CARRIES HISTORY.', blob='e2c1ccb2f7433445fea4a2bd01d9711d1511df06', count=29, duration=678.096, asset_sha='70024079506ccb1e6534b5d6eef8e04eddc2d6bb58d88b1e81e417eeade2271a', note="Chapter 14 lets ordinary space carry history. Twenty-nine preview-safe takes preserve the back room, Mara's packing, remembered bodily habits, and Greg choosing a bounded human deadline over easy pay."),
          }
          audio = Path('greg-again/audio')
          (audio / 'takes').mkdir(parents=True, exist_ok=True)
          (audio / 'scripts').mkdir(parents=True, exist_ok=True)

          for ch in (12, 13, 14):
              c = cfg[ch]
              source_takes = json.loads(Path(f'/tmp/takes/ch{ch:03d}-takes.json').read_text(encoding='utf-8'))
              if len(source_takes) != c['count'] or len(preview[ch]) != c['count']:
                  raise SystemExit(f'chapter {ch} take-count mismatch')
              spoken = '\n\n'.join(item['transcript'] for item in source_takes)
              rows = []
              pos = 0
              for item, uuid in zip(source_takes, preview[ch]):
                  text = item['transcript']
                  start, end = pos, pos + len(text)
                  if spoken[start:end] != text:
                      raise SystemExit(f'chapter {ch} take {item["take"]} offset mismatch')
                  rows.append({
                      'take': item['take'],
                      'source_char_start': start,
                      'source_char_end': end,
                      'chars': len(text),
                      'transcript_sha256': hashlib.sha256(text.encode()).hexdigest(),
                      'start_anchor': text[:48],
                      'end_anchor': text[-48:],
                      'provider_artifact': f'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/{uuid}.mp3',
                      'durable_audio': f'../assets/chunks/{ch:03d}/{item["take"]:02d}.mp3',
                      'status': 'verified',
                  })
                  pos = end + 2
              take_map = {
                  'chapter': ch,
                  'chapter_id': f'ga-{ch:03d}',
                  'source': f'r2/assets/written/ch{ch:03d}.md',
                  'source_blob': c['blob'],
                  'source_projection': 'chapter body after markdown separator, trimmed; paragraph gaps normalized to exactly two newlines',
                  'spoken_text_sha256': hashlib.sha256(spoken.encode()).hexdigest(),
                  'voice': 'deep',
                  'audio_finish': 'processing-space',
                  'take_count': c['count'],
                  'takes': rows,
              }
              if ch == 12:
                  take_map['historical_provider_work'] = {
                      'context_id': '98aef78da55b4520a8acf2c5636c7d56',
                      'provider_page': 'https://www.aidocmaker.com/g0/audio?name=98aef78da55b4520a8acf2c5636c7d56',
                      'note': 'Original long Take 01 raw bytes were account-gated; provider identity preserved. Only inaccessible spoken material was re-rendered through the preview bridge.',
                  }
              (audio / 'takes' / f'{ch:03d}.json').write_text(json.dumps(take_map, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

              historical = ''
              if ch == 12:
                  historical = '''\n## Preserved historical provider work\n\nThe original long Chapter 12 Take 01 remains preserved as production evidence:\n\n- provider job: `98aef78da55b4520a8acf2c5636c7d56`\n- provider page: `https://www.aidocmaker.com/g0/audio?name=98aef78da55b4520a8acf2c5636c7d56`\n\nThat artifact is account-gated in this harness. Its raw bytes were not recoverable, so only that inaccessible spoken material was re-rendered through the verified preview bridge. The original provider identity is retained rather than silently discarded.\n'''
              script = f'''# Greg, Again - Chapter {ch:02d} Audio Finish\n\nR2 title: **{c['title']}**\nWritten scene: **{c['scene']}**\nSource authority: `r2/assets/written/ch{ch:03d}.md`\nSource blob: `{c['blob']}`\nVoice: `deep`\nLens: **SHARED GREG SURFACE**\nAudio finish: **PROCESSING SPACE**\nProduction takes: **{c['count']}**\nFinal duration: **{c['duration']:.3f} seconds**\nPublished asset SHA-256: `{c['asset_sha']}`\n\n## Production contract\n\n> **DO NOT OPTIMIZE AWAY PROCESSING TIME.**\n> **SMOOTHNESS IS NOT AUTOMATICALLY CLARITY.**\n> **{c['guard']}**\n\nThe complete spoken surface is the authoritative written chapter body in source order. Preview-safe take boundaries are production seams only. They do not authorize lexical rewrite, omission, added story fact, or reassignment of another character's knowledge or action to Greg.\n\n## Durable take map\n\nSee `../takes/{ch:03d}.json`. Every listed take includes exact source boundaries, transcript hash, provider artifact URL, durable MP3 path, and verified status. The final listener-facing chapter is `../assets/chapter-{ch:03d}.mp3`.\n\n## Binary handoff\n\nThis batch uses the verified AI Voice Generator preview bridge: each provider-safe take submits the same complete text as `transcript` and `preview_transcript`, returns a direct public MP3 artifact, is captured durably under `assets/chunks/{ch:03d}/`, and is assembled in numeric order.\n''' + historical
              script_name = {12:'012-the-stranger.md', 13:'013-the-good-sword.md', 14:'014-the-back-room.md'}[ch]
              (audio / 'scripts' / script_name).write_text(script, encoding='utf-8')

          manifest_path = audio / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['chapters'] = [item for item in manifest['chapters'] if item.get('number') not in (12,13,14)]
          for ch in (12,13,14):
              c = cfg[ch]
              manifest['chapters'].append({
                  'chapter_id': f'ga-{ch:03d}', 'number': ch, 'title': c['title'], 'status': 'experimental',
                  'lens': 'shared-greg-surface', 'audio_finish': 'processing-space', 'take_count': c['count'],
                  'duration_seconds': c['duration'], 'audio_src': f'assets/chapter-{ch:03d}.mp3', 'note': c['note'],
              })
          manifest['chapters'].sort(key=lambda item: item['number'])
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for ch in (12,13,14):
              path = Path(f'r2/data/chapters/ch{ch:03d}.json')
              meta = json.loads(path.read_text(encoding='utf-8'))
              if meta['title'] != cfg[ch]['title']:
                  raise SystemExit(f'chapter {ch} title moved under us: {meta["title"]}')
              meta['audio'] = {'status':'published','path':f'../greg-again/audio/assets/chapter-{ch:03d}.mp3'}
              path.write_text(json.dumps(meta, ensure_ascii=False, separators=(',',':')) + '\n', encoding='utf-8')

          test = '''import json\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nAUDIO = ROOT / "greg-again" / "audio"\nR2 = ROOT / "r2"\n\nclass GregAgainBatch012014Test(unittest.TestCase):\n    def test_batch_012_014_is_durably_published(self):\n        manifest = json.loads((AUDIO / "manifest.json").read_text(encoding="utf-8"))\n        by_id = {item["chapter_id"]: item for item in manifest["chapters"]}\n        expected = {12:("The Stranger",25,606.504),13:("The Fighter",28,653.952),14:("The Helper",29,678.096)}\n        for chapter, (title, take_count, duration) in expected.items():\n            entry = by_id[f"ga-{chapter:03d}"]\n            self.assertEqual(title, entry["title"])\n            self.assertEqual("shared-greg-surface", entry["lens"])\n            self.assertEqual("processing-space", entry["audio_finish"])\n            self.assertEqual(take_count, entry["take_count"])\n            self.assertEqual(duration, entry["duration_seconds"])\n            final = AUDIO / entry["audio_src"]\n            self.assertTrue(final.exists())\n            self.assertGreater(final.stat().st_size, 1_000_000)\n            take_map = json.loads((AUDIO / "takes" / f"{chapter:03d}.json").read_text(encoding="utf-8"))\n            self.assertEqual(take_count, take_map["take_count"])\n            self.assertEqual(take_count, len(take_map["takes"]))\n            for take in take_map["takes"]:\n                self.assertEqual("verified", take["status"])\n                self.assertTrue(take["provider_artifact"].endswith(".mp3"))\n                durable = (AUDIO / "takes" / take["durable_audio"]).resolve()\n                self.assertTrue(durable.exists())\n                self.assertGreater(durable.stat().st_size, 10_000)\n            meta = json.loads((R2 / "data/chapters" / f"ch{chapter:03d}.json").read_text(encoding="utf-8"))\n            self.assertEqual("published", meta["audio"]["status"])\n            self.assertEqual(f"../greg-again/audio/assets/chapter-{chapter:03d}.mp3", meta["audio"]["path"])\n\n    def test_audio_finish_guardrails_are_durable(self):\n        cases={"012-the-stranger.md":"MEMORY ABSENCE MUST STAY ABSENCE","013-the-good-sword.md":"A BETTER TOOL DOES NOT REPLACE JUDGMENT","014-the-back-room.md":"ORDINARY SPACE CARRIES HISTORY"}\n        for filename, guardrail in cases.items():\n            script=(AUDIO / "scripts" / filename).read_text(encoding="utf-8")\n            self.assertIn("DO NOT OPTIMIZE AWAY PROCESSING TIME", script)\n            self.assertIn("SMOOTHNESS IS NOT AUTOMATICALLY CLARITY", script)\n            self.assertIn(guardrail, script)\n\n    def test_chapter_12_preserves_original_provider_identity(self):\n        take_map=json.loads((AUDIO / "takes/012.json").read_text(encoding="utf-8"))\n        self.assertEqual("98aef78da55b4520a8acf2c5636c7d56", take_map["historical_provider_work"]["context_id"])\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          Path('tests/test_greg_again_audio_batch_012_014.py').write_text(test, encoding='utf-8')
          PY
      - name: Remove temporary bridge workflows
        shell: bash
        run: |
          rm -f .github/workflows/audio-fetch-test.yml .github/workflows/audio-publish-test.yml
      - name: Verify publication before push
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_greg_again_audio*.py'
          python -m unittest discover -s tests -p 'test_r2_site.py'
          python -m json.tool greg-again/audio/manifest.json >/dev/null
          python -m json.tool greg-again/audio/takes/012.json >/dev/null
          python -m json.tool greg-again/audio/takes/013.json >/dev/null
          python -m json.tool greg-again/audio/takes/014.json >/dev/null
      - name: Commit final batch publication metadata
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'Publish Greg Again audio Chapters 12-14'
          git push origin HEAD:audio/greg-again-batch-012-014
