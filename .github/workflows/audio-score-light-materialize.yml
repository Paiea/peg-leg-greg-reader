name: Materialize Audio Score Light Baselines

on:
  push:
    branches:
      - audio-score-light-001-030
    paths:
      - scripts/materialize_audio_score_light.py
      - scripts/audio_score_light_validate.py
      - r2/AUDIO_SCORE_LIGHT.md
      - .github/workflows/audio-score-light-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio-score-light-001-030
          fetch-depth: 0
      - name: Materialize exact-prose Light baselines
        run: python scripts/materialize_audio_score_light.py --start 1 --end 30
      - name: Validate all Light baselines
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq -w 1 30); do
            python scripts/audio_score_light_validate.py "$n"
          done
      - name: Commit generated baselines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add r2/assets/audio-score-light
          if git diff --cached --quiet; then
            echo "No baseline changes"
            exit 0
          fi
          git commit -m "Materialize Audio Score Light baselines 1-30"
          git push origin HEAD:audio-score-light-001-030
