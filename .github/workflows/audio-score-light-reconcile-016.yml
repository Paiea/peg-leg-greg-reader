name: Reconcile existing Audio Score Light Chapter 016

on:
  push:
    branches:
      - 'audio/light-greg-again-ch016-auto'
    paths:
      - '.github/workflows/audio-score-light-reconcile-016.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconcile newest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit -X theirs origin/main

      - name: Reconcile Chapter 016 manifests from verified assembly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          chapter='016'
          p=Path(f'greg-again/audio/light/takes/{chapter}/short-takes.json')
          d=json.loads(p.read_text())
          assert d['chapter']==16
          assert d['chapter_id']=='ga-016'
          assert d['generation']=='light'
          assert d['status']=='durable_takes_verified_and_assembled'
          assert d['voice']=='deep'
          assert d['take_count']==26
          assert d['final_asset']=='greg-again/audio/assets/light/chapter-016.mp3'
          assert d['final_audio_sha256']=='c3d9530c29165e1a5dffc0d9efc71b2b36be93b928e4d3cea45ab3910240a904'
          assert d['final_duration_seconds']==675.72

          lp=Path('greg-again/audio/light/manifest.json')
          light=json.loads(lp.read_text())
          entry={
              'chapter_id': d['chapter_id'],
              'number': d['chapter'],
              'title': d['title'],
              'status': 'verified_unlistened',
              'source': d['source'],
              'source_blob_sha': d['source_blob_sha'],
              'voice': 'deep',
              'take_count': d['take_count'],
              'capture_mode': 'preview-safe-short-takes',
              'duration_seconds': d['final_duration_seconds'],
              'audio_src': 'assets/light/chapter-016.mp3',
              'verification': 'greg-again/audio/light/verification/016/'
          }
          chapters=light.setdefault('chapters',[])
          chapters[:]=[c for c in chapters if c.get('chapter_id')!='ga-016' and c.get('number')!=16]
          chapters.append(entry)
          chapters.sort(key=lambda c:c.get('number',10**9))
          lp.write_text(json.dumps(light,indent=2)+'\n')

          pp=Path('greg-again/audio/manifest.json')
          pub=json.loads(pp.read_text())
          matches=[c for c in pub.get('chapters',[]) if c.get('chapter_id')=='ga-016' or c.get('number')==16]
          if len(matches)!=1:
              raise SystemExit(f'expected one public Chapter 16 entry, found {len(matches)}')
          c=matches[0]
          c['audio_src']='assets/light/chapter-016.mp3'
          c['take_count']=26
          c['duration_seconds']=675.72
          c['audio_finish']='audio-score-light'
          c['note']=('Audio Score Light Chapter 16 assembled from 26 preview-safe deep-voice takes. '
                     'The Light source preserves the written prose with only sparse speech-generation intervention; '
                     'durable previews, exact source order, playability, assembly, and settling tail were mechanically verified.')
          pp.write_text(json.dumps(pub,indent=2)+'\n')
          PY
          python -m json.tool greg-again/audio/light/manifest.json >/dev/null
          python -m json.tool greg-again/audio/manifest.json >/dev/null

      - name: Commit reconciled branch
        shell: bash
        run: |
          set -euo pipefail
          git add greg-again/audio/light/manifest.json greg-again/audio/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Reconcile Audio Score Light Chapter 016 manifests'
          fi
          git push origin HEAD:${{ github.ref_name }}
