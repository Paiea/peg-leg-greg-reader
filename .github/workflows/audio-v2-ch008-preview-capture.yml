name: Audio v2 Chapter 008 preview capture

on:
  push:
    branches:
      - audio/v2-greg-again-ch008-auto
    paths:
      - greg-again/audio/v2/takes/008/preview-capture.json

permissions:
  contents: write

jobs:
  capture-assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download and verify preview chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/v2/takes/008/captured
          python - <<'PY'
          import json, pathlib, subprocess
          p = pathlib.Path('greg-again/audio/v2/takes/008/preview-capture.json')
          data = json.loads(p.read_text())
          chunks = data['chunks']
          assert len(chunks) == 20, f'expected 20 chunks, got {len(chunks)}'
          outdir = pathlib.Path('greg-again/audio/v2/takes/008/captured')
          rows=[]
          for item in chunks:
              n = int(item['chunk'])
              url = item['preview_url']
              out = outdir / f'chunk-{n:02d}.mp3'
              subprocess.run(['curl','-fL','--retry','4','--retry-delay','2','-o',str(out),url], check=True)
              cp = subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(out)], check=True, capture_output=True, text=True)
              dur = float(cp.stdout.strip())
              if dur <= 0:
                  raise SystemExit(f'chunk {n:02d} invalid duration {dur}')
              rows.append({'chunk':n,'file':str(out),'duration_seconds':dur,'preview_url':url})
          pathlib.Path('greg-again/audio/v2/verification/008').mkdir(parents=True, exist_ok=True)
          pathlib.Path('greg-again/audio/v2/verification/008/chunks.json').write_text(json.dumps(rows, indent=2) + '\n')
          PY

      - name: Assemble chapter and add settling tail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/assets/v2
          : > /tmp/ch008-concat.txt
          for f in greg-again/audio/v2/takes/008/captured/chunk-*.mp3; do
            printf "file '%s'\n" "$PWD/$f" >> /tmp/ch008-concat.txt
          done
          ffmpeg -y -f concat -safe 0 -i /tmp/ch008-concat.txt -vn -c:a libmp3lame -b:a 192k /tmp/chapter-008-stitched.mp3
          ffmpeg -y -i /tmp/chapter-008-stitched.mp3 -af "apad=pad_dur=2" -vn -c:a libmp3lame -b:a 192k greg-again/audio/assets/v2/chapter-008.mp3
          ffprobe -v error -show_entries format=duration -of json greg-again/audio/assets/v2/chapter-008.mp3 > greg-again/audio/v2/verification/008/final-ffprobe.json

      - name: Record assembly verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          chunks = json.loads(pathlib.Path('greg-again/audio/v2/verification/008/chunks.json').read_text())
          final = json.loads(pathlib.Path('greg-again/audio/v2/verification/008/final-ffprobe.json').read_text())
          duration = float(final['format']['duration'])
          report = {
              'chapter': 8,
              'source': 'r2/assets/audio-score/ch008.md',
              'source_blob_sha': '70fb72370291aa2a47b76d383cae9434254305e8',
              'voice': 'deep',
              'chunk_count': len(chunks),
              'all_chunks_ffprobe_valid': all(float(c['duration_seconds']) > 0 for c in chunks),
              'final_asset': 'greg-again/audio/assets/v2/chapter-008.mp3',
              'final_duration_seconds': duration,
              'settling_tail_seconds_target': 2.0,
              'assembly_order': [c['chunk'] for c in chunks],
              'status': 'assembled_unlistened'
          }
          pathlib.Path('greg-again/audio/v2/verification/008/assembly.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

      - name: Commit durable audio artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greg-again/audio/assets/v2/chapter-008.mp3 greg-again/audio/v2/takes/008/captured greg-again/audio/v2/verification/008
          git commit -m "Capture and assemble Audio Score v2 Chapter 008" || exit 0
          git push
