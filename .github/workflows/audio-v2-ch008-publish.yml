name: Publish Audio v2 Chapter 008

on:
  push:
    branches:
      - audio/v2-greg-again-ch008-auto
    paths:
      - greg-again/audio/v2/production/008/PUBLISH_REQUEST.json

permissions:
  contents: write

jobs:
  verify-reconcile-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch newest Audio Score authority
        run: git fetch origin audio-score/chapters-001-010

      - name: Verify exact source coverage and durable assembly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess

          score_path = pathlib.Path('r2/assets/audio-score/ch008.md')
          capture_path = pathlib.Path('greg-again/audio/v2/takes/008/preview-capture.json')
          assembly_path = pathlib.Path('greg-again/audio/v2/verification/008/assembly.json')
          asset_path = pathlib.Path('greg-again/audio/assets/v2/chapter-008.mp3')

          text = score_path.read_text()
          marker = '\n---\n\n'
          if marker not in text:
              raise SystemExit('Audio Score body marker missing')
          body = text.split(marker, 1)[1].strip('\n')
          paras = body.split('\n\n')

          chunks, current, current_len = [], [], 0
          for para in paras:
              add_len = len(para) + (2 if current else 0)
              if current and current_len + add_len > 480:
                  chunks.append('\n\n'.join(current))
                  current, current_len = [para], len(para)
              else:
                  current.append(para)
                  current_len += add_len
          if current:
              chunks.append('\n\n'.join(current))

          if '\n\n'.join(chunks) != body:
              raise SystemExit('Chunk coverage does not reconstruct Audio Score body exactly')

          capture = json.loads(capture_path.read_text())
          if len(chunks) != 20 or capture.get('chunk_count') != 20 or len(capture.get('chunks', [])) != 20:
              raise SystemExit('Expected exactly 20 captured chunks')

          urls = []
          aliases = []
          for i, (source_chunk, item) in enumerate(zip(chunks, capture['chunks']), 1):
              if item['chunk'] != i:
                  raise SystemExit(f'Chunk order mismatch at {i}')
              provider = source_chunk.replace('Mana', 'Ma-na').replace('mana', 'ma-na')
              if len(provider) > 500:
                  raise SystemExit(f'Chunk {i:02d} exceeds preview-safe limit: {len(provider)}')
              if item['char_count'] != len(provider):
                  raise SystemExit(f'Chunk {i:02d} char count mismatch')
              url = item.get('preview_url', '')
              if not url.startswith('https://storage.googleapis.com/'):
                  raise SystemExit(f'Chunk {i:02d} lacks durable Google Storage preview URL')
              urls.append(url)
              if provider != source_chunk:
                  aliases.append(i)

          if len(set(urls)) != 20:
              raise SystemExit('Preview URLs are not unique')
          if aliases != [10, 17]:
              raise SystemExit(f'Unexpected pronunciation alias chunks: {aliases}')

          assembly = json.loads(assembly_path.read_text())
          if not assembly.get('all_chunks_ffprobe_valid'):
              raise SystemExit('Chunk ffprobe verification not green')
          if assembly.get('assembly_order') != list(range(1,21)):
              raise SystemExit('Assembly order is not 01-20')
          if float(assembly.get('settling_tail_seconds_target', 0)) != 2.0:
              raise SystemExit('Settling tail target mismatch')
          if not asset_path.exists() or asset_path.stat().st_size <= 0:
              raise SystemExit('Final v2 asset missing')

          report = {
              'chapter': 8,
              'source': 'r2/assets/audio-score/ch008.md',
              'source_blob_sha': '70fb72370291aa2a47b76d383cae9434254305e8',
              'chunk_count': 20,
              'source_body_reconstructed_exactly_once': True,
              'all_provider_chunks_preview_safe': True,
              'all_preview_urls_google_storage': True,
              'unique_preview_urls': True,
              'provider_alias_chunks': [10,17],
              'provider_aliases': ['Mana -> Ma-na', 'mana -> ma-na'],
              'all_chunks_ffprobe_valid': True,
              'assembly_order_verified': True,
              'final_asset_exists': True,
              'final_duration_seconds': float(assembly['final_duration_seconds']),
              'settling_tail_seconds_target': 2.0,
              'human_listen_back_performed': False,
              'subjective_audio_quality_claimed': False,
              'status': 'objectively_verified_unlistened'
          }
          out = pathlib.Path('greg-again/audio/v2/verification/008/source-publication-verification.json')
          out.write_text(json.dumps(report, indent=2) + '\n')
          PY

      - name: Reconcile newest manifests and route Chapter 008 to v2
        shell: bash
        run: |
          set -euo pipefail
          git show origin/audio-score/chapters-001-010:greg-again/audio/v2/manifest.json > /tmp/v2-manifest.json
          git show origin/audio-score/chapters-001-010:greg-again/audio/manifest.json > /tmp/public-manifest.json
          python - <<'PY'
          import json, pathlib

          v2_path = pathlib.Path('/tmp/v2-manifest.json')
          public_path = pathlib.Path('/tmp/public-manifest.json')
          v2 = json.loads(v2_path.read_text())
          public = json.loads(public_path.read_text())

          entry = {
              'chapter_id': 'ga-008',
              'number': 8,
              'title': 'Road Work',
              'status': 'verified',
              'source': 'r2/assets/audio-score/ch008.md',
              'source_blob_sha': '70fb72370291aa2a47b76d383cae9434254305e8',
              'voice': 'deep',
              'capture_factory': 'preview-safe-identical-transcript',
              'take_count': 20,
              'duration_seconds': 535.8,
              'audio_src': 'assets/v2/chapter-008.mp3',
              'listener_qa': 'not_performed',
              'verification': 'greg-again/audio/v2/verification/008/'
          }
          chapters = [c for c in v2.get('chapters', []) if c.get('number') != 8]
          chapters.append(entry)
          chapters.sort(key=lambda c: c.get('number', 0))
          v2['chapters'] = chapters

          found = False
          for chapter in public.get('chapters', []):
              if chapter.get('chapter_id') == 'ga-008' or chapter.get('number') == 8:
                  found = True
                  chapter['take_count'] = 20
                  chapter['duration_seconds'] = 535.8
                  chapter['audio_src'] = 'assets/v2/chapter-008.mp3'
                  chapter['note'] = ('Audio Score v2 Chapter 8: twenty preview-safe deep-voice chunks captured from '
                                     'the Audio Score, objectively verified for exact ordered source coverage, durable '
                                     'Google Storage artifact capture, ffprobe playability, ordered assembly, and a '
                                     'two-second settling tail. Subjective human listen-back remains separate QA.')
                  break
          if not found:
              raise SystemExit('Stable public Chapter 008 entry missing')

          pathlib.Path('greg-again/audio/v2/manifest.json').write_text(json.dumps(v2, indent=2) + '\n')
          pathlib.Path('greg-again/audio/manifest.json').write_text(json.dumps(public, indent=2) + '\n')
          PY

      - name: Record publication state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          assembly = json.loads(pathlib.Path('greg-again/audio/v2/verification/008/assembly.json').read_text())
          status = '''# Audio Score v2 — Chapter 008 Production Status

Chapter: 008 — Road Work
Claim branch: `audio/v2-greg-again-ch008-auto`
Source: `r2/assets/audio-score/ch008.md`
Audio Score blob SHA: `70fb72370291aa2a47b76d383cae9434254305e8`
Voice: `deep`

## Current state

- 20 preview-safe chunks captured with identical `transcript` + `preview_transcript`
- all 20 returned durable Google Storage preview MP3 URLs
- all 20 downloaded and passed `ffprobe`
- exact Audio Score body reconstructs from the 20 source chunks once and in order
- provider-facing pronunciation aliases only on chunks 10 and 17 (`mana` -> `ma-na`)
- final listener-facing asset exists at `greg-again/audio/assets/v2/chapter-008.mp3`
- final duration: 535.8 seconds
- approximately 2 seconds of settling tail appended at assembly
- v2 manifest reconciled from newest Audio Score authority
- public manifest Chapter 008 switched to `assets/v2/chapter-008.mp3`

## QA boundary

Objective artifact/source/assembly verification is complete. No claim is made that a human subjective listen-back occurred in this worker. Future listener feedback should repair only the smallest failed chunk/seam if needed.

## Reusable production lesson

For this provider/tool surface, the durable short-take capture factory is: Audio Score -> natural preview-safe chunks (about 500 chars max) -> `deep` -> identical `transcript` and `preview_transcript` -> capture returned Google Storage `preview_url` -> Actions download/ffprobe -> ffmpeg stitch -> settling tail -> verify -> publish.
'''
          pathlib.Path('greg-again/audio/v2/production/008/STATUS.md').write_text(status)
          PY

      - name: Commit reconciled publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greg-again/audio/v2/manifest.json greg-again/audio/manifest.json greg-again/audio/v2/verification/008/source-publication-verification.json greg-again/audio/v2/production/008/STATUS.md
          git commit -m "Publish Audio Score v2 Chapter 008" || exit 0
          git push
