name: Update audio routing contract for v2 migration

on:
  push:
    branches:
      - audio/v2-greg-again-ch008-integrate
    paths:
      - greg-again/audio/v2/production/008/ROUTING_CONTRACT_FIX_REQUEST.json

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make stable identity contract v2-aware
        run: python greg-again/audio/v2/production/008/patch_v2_routing_test.py
