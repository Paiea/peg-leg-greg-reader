name: Probe Book 1 DOCX
on:
  push:
    branches:
      - reader/validate-general-polish-ch001-005-r2
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/general-polish-ch001-005-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - name: Remove repeated full-manuscript paragraph scans
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/promote_book1_polish.py')
          s=p.read_text(encoding='utf-8')
          old='''def _chapter_bodies(doc: Document) -> dict[int, list[str]]:\n    headings = _heading_map(doc)\n    ordered = sorted(headings.items(), key=lambda item: item[1])\n    bodies: dict[int, list[str]] = {}\n    for pos, (chapter, start) in enumerate(ordered):\n        end = ordered[pos + 1][1] if pos + 1 < len(ordered) else len(doc.paragraphs)\n        bodies[chapter] = [p.text for p in doc.paragraphs[start + 1 : end]]\n    return bodies\n'''
          new='''def _chapter_bodies(doc: Document) -> dict[int, list[str]]:\n    headings = _heading_map(doc)\n    ordered = sorted(headings.items(), key=lambda item: item[1])\n    paragraphs = doc.paragraphs\n    bodies: dict[int, list[str]] = {}\n    for pos, (chapter, start) in enumerate(ordered):\n        end = ordered[pos + 1][1] if pos + 1 < len(ordered) else len(paragraphs)\n        bodies[chapter] = [p.text for p in paragraphs[start + 1 : end]]\n    return bodies\n'''
          assert s.count(old) == 1
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Test optimized promotion tool
        run: python -m unittest tests.test_promote_book1_polish -v
      - name: Commit optimization
        run: |
          test "$(git diff --name-only)" = "scripts/promote_book1_polish.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/promote_book1_polish.py
          git commit -m 'Speed up Book 1 source verification'
          git push
