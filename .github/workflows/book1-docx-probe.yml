name: Promote Book 1 Chapters 1-5
on:
  push:
    branches:
      - reader/validate-general-polish-ch001-005-r2
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/general-polish-ch001-005-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - name: Test source promotion
        run: python -m unittest tests.test_promote_book1_polish -v
      - name: Promote Chapters 1-5 into canonical Book 1
        run: python scripts/promote_book1_polish.py 1-5
      - name: Verify bounded canonical change
        run: |
          test "$(git diff --name-only)" = "state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map.docx"
          git diff --check
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit canonical source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map.docx
          git commit -m 'Promote Book 1 polish Chapters 1-5'
          git push
