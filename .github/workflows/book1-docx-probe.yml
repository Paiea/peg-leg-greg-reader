name: Test Book 1 Idempotence Regression
on:
  push:
    branches:
      - reader/validate-general-polish-ch001-005-r2
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/general-polish-ch001-005-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - run: python -m unittest tests.test_promote_book1_polish.PromoteBook1PolishTests.test_already_synchronized_chapter_does_not_touch_docx -v
