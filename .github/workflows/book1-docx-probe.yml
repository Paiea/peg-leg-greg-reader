name: Probe Book 1 DOCX
on:
  push:
    branches:
      - reader/validate-general-polish-ch001-005-r2
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/general-polish-ch001-005-20260831
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - name: Run Book 1 promotion tests
        run: python -m unittest tests.test_promote_book1_polish -v
      # TDD green run after implementation.
