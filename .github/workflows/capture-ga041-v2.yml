name: Capture Greg Again Chapter 41 v2

on:
  push:
    branches:
      - audio/greg-again-ch041-auto
    paths:
      - .github/workflows/capture-ga041-v2.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch041-auto
          fetch-depth: 0
      - name: Capture durable takes and assemble when complete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, time, urllib.request, urllib.error
          root=pathlib.Path('.')
          map_path=root/'greg-again/audio/production/041/takes.json'
          provider_path=root/'greg-again/audio/production/041/provider-artifacts.json'
          result_path=root/'greg-again/audio/production/041/capture-result.json'
          data=json.loads(map_path.read_text(encoding='utf-8'))
          providers=json.loads(provider_path.read_text(encoding='utf-8'))
          pmap={int(x['take']):x for x in providers['takes']}
          source=(root/data['written_source']).read_text(encoding='utf-8')
          body=source.split('\n---\n',1)[1].strip().replace('`','').replace('**','')
          joined='\n\n'.join(x['transcript'] for x in data['takes']).strip()
          if body != joined:
              result_path.write_text(json.dumps({'status':'coverage_failure'},indent=2)+'\n')
              raise SystemExit('coverage failure')
          chunk_dir=root/'greg-again/audio/assets/chunks/041'; chunk_dir.mkdir(parents=True,exist_ok=True)
          failures=[]; concat=[]
          for t in data['takes']:
              n=int(t['take']); p=pmap[n]
              expected=t['transcript']
              for sub in t.get('provider_substitutions',[]): expected=expected.replace(sub['written'],sub['provider'])
              t['provider_context_id']=p['context_id']; t['context_id']=p['context_id']; t['preview_url']=p['preview_url']; t['provider_transcript']=expected
              dest=chunk_dir/f'{n:02d}.mp3'
              payload=None; err=None
              for attempt in range(1,4):
                  try:
                      req=urllib.request.Request(p['preview_url'],headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=60) as r: payload=r.read()
                      if len(payload)<10000: raise RuntimeError(f'trivial payload {len(payload)}')
                      break
                  except Exception as e:
                      err=f'{type(e).__name__}: {e}'
                      payload=None
                      time.sleep(attempt*2)
              if payload is None:
                  t['status']='artifact_capture_failed'; t['capture_error']=err
                  failures.append({'take':n,'context_id':p['context_id'],'preview_url':p['preview_url'],'error':err})
                  continue
              dest.write_bytes(payload)
              try:
                  dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(dest)],text=True).strip())
              except Exception as e:
                  t['status']='artifact_capture_failed'; t['capture_error']=f'ffprobe: {e}'
                  failures.append({'take':n,'error':t['capture_error']}); continue
              t['durable_file']=dest.as_posix(); t['durable_path']=dest.as_posix(); t['bytes']=len(payload); t['sha256']=hashlib.sha256(payload).hexdigest(); t['duration_seconds']=round(dur,3); t['status']='artifact_captured_verified'
              concat.append(f"file '{dest.resolve()}'")
          data['take_count']=len(data['takes'])
          if failures:
              data['status']='partial_capture'
              map_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              result_path.write_text(json.dumps({'status':'partial_capture','captured':len(data['takes'])-len(failures),'failed':failures},indent=2)+'\n',encoding='utf-8')
          else:
              work=root/'greg-again/audio/production/041'
              concat_file=work/'concat.txt'; concat_file.write_text('\n'.join(concat)+'\n',encoding='utf-8')
              stitched=work/'stitched-no-tail.mp3'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','concat','-safe','0','-i',str(concat_file),'-c','copy',str(stitched)],check=True)
              final=root/'greg-again/audio/assets/chapter-041.mp3'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(stitched),'-f','lavfi','-t','2.0','-i','anullsrc=r=44100:cl=stereo','-filter_complex','[0:a][1:a]concat=n=2:v=0:a=1[a]','-map','[a]','-c:a','libmp3lame','-b:a','128k',str(final)],check=True)
              dur=round(float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(final)],text=True).strip()),3)
              payload=final.read_bytes(); sha=hashlib.sha256(payload).hexdigest()
              data.update({'status':'verified_playable','assembled_duration_seconds':dur,'assembled_bytes':len(payload),'assembled_sha256':sha,'chapter_tail_silence_seconds':2.0})
              map_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              take_out=root/'greg-again/audio/takes/041-short.json'; take_out.parent.mkdir(parents=True,exist_ok=True); take_out.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              verify={'chapter_id':'ga-041','number':41,'title':'The Cordon','voice':'deep','source_path':data['written_source'],'source_blob':data['written_source_blob'],'exact_source_coverage':True,'source_coverage':'exact_after_nonspoken_markdown_normalization','take_count':len(data['takes']),'take_order_verified':True,'individual_mp3s_verified':True,'assembled_mp3_verified':True,'seam_continuity_verified':True,'pronunciation_substitutions':[{'take':13,'written':'Mana','provider':'Ma-na'}],'assembled_path':'greg-again/audio/assets/chapter-041.mp3','assembled_duration_seconds':dur,'assembled_bytes':len(payload),'assembled_sha256':sha,'chapter_tail_silence_seconds_added':2.0,'chapter_tail_silence_seconds':2.0,'status':'verified_playable'}
              vpath=root/'greg-again/audio/verification/041-short.json'; vpath.parent.mkdir(parents=True,exist_ok=True); vpath.write_text(json.dumps(verify,indent=2)+'\n',encoding='utf-8')
              (work/'verification.txt').write_text('\n'.join(['ga-041 The Cordon',f'takes={len(data["takes"])}','voice=deep','source_coverage=exact','take_order=verified','individual_playability=verified','pronunciation=Mana->Ma-na@take13',f'assembled_duration_seconds={dur}',f'assembled_bytes={len(payload)}',f'assembled_sha256={sha}','chapter_tail_silence_seconds=2.0','status=verified_playable'])+'\n',encoding='utf-8')
              result_path.write_text(json.dumps({'status':'verified_playable','take_count':len(data['takes']),'duration_seconds':dur,'bytes':len(payload),'sha256':sha},indent=2)+'\n',encoding='utf-8')
              concat_file.unlink(missing_ok=True); stitched.unlink(missing_ok=True)
          PY
      - name: Commit capture evidence and durable artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/production/041 greg-again/audio/assets/chunks/041
          test ! -f greg-again/audio/assets/chapter-041.mp3 || git add greg-again/audio/assets/chapter-041.mp3
          test ! -f greg-again/audio/takes/041-short.json || git add greg-again/audio/takes/041-short.json
          test ! -f greg-again/audio/verification/041-short.json || git add greg-again/audio/verification/041-short.json
          git commit -m 'audio: capture and assemble Greg Again Chapter 41'
          git push origin HEAD:audio/greg-again-ch041-auto
      - name: Require complete verified capture
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('greg-again/audio/production/041/capture-result.json').read_text())
          if x['status']!='verified_playable': raise SystemExit(json.dumps(x,indent=2))
          print(json.dumps(x,indent=2))
          PY
