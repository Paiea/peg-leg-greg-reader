name: Capture Greg Again full audio

on:
  push:
    branches:
      - fix/greg-again-audio-playback
    paths:
      - .github/workflows/capture-greg-again-audio.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/greg-again-audio-playback
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Probe a clearly sub-two-minute segment
        shell: bash
        run: |
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const id = '2057bf13b3a74dc2802765c7cad5251a';
          const out = '/tmp/segment.mp3';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          let saved = false;
          const pending = [];

          page.on('response', response => {
            pending.push((async () => {
              try {
                const url = response.url();
                const ct = (await response.headerValue('content-type')) || '';
                if (ct.startsWith('audio/') || /\.mp3(?:$|\?)/i.test(url) || /audio-playback/i.test(url)) {
                  const body = await response.body();
                  console.log('AUDIO_CANDIDATE', ct, body.length, url);
                  if (!saved && body.length > 10000) {
                    fs.writeFileSync(out, body);
                    saved = true;
                  }
                }
              } catch (e) { console.log('CAPTURE_ERROR', String(e)); }
            })());
          });

          for (let attempt = 1; attempt <= 5 && !saved; attempt++) {
            await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(5000);
            const text = await page.locator('body').innerText().catch(() => '');
            console.log('BODY', attempt, text.slice(0, 2400));
            const sources = await page.locator('audio').evaluateAll(nodes => nodes.map(n => n.currentSrc || n.src).filter(Boolean)).catch(() => []);
            console.log('AUDIO_SOURCES', JSON.stringify(sources));
            for (const src of sources) {
              const r = await page.request.get(src).catch(() => null);
              if (r && r.ok()) {
                const body = await r.body();
                if (body.length > 10000) {
                  fs.writeFileSync(out, body);
                  saved = true;
                  break;
                }
              }
            }
            if (!saved) await page.waitForTimeout(5000);
          }
          await Promise.allSettled(pending);
          await browser.close();
          if (!saved || !fs.existsSync(out)) throw new Error('sub-two-minute segment did not surface playable media');
          console.log('CAPTURED_BYTES', fs.statSync(out).size);
          JS
          node capture.mjs
          file /tmp/segment.mp3
