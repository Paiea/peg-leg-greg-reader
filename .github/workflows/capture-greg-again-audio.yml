name: Capture Greg Again audio chunks

on:
  push:
    branches:
      - fix/greg-again-audio-playback
    paths:
      - .github/workflows/capture-greg-again-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-chunks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/greg-again-audio-playback
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Capture remaining generated chunks
        shell: bash
        run: |
          mkdir -p greg-again/audio/assets/chunks
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const jobs = [
            ['06', 'e3490a2ccd22454c80e1a0ecf3305584'],
            ['07', 'b3da7a867c4c4f18b1eda85ee085cd16'],
            ['08', 'b7eb984e88d54555a3834e65815e0d0c'],
            ['09', 'ef31a04a142b453ab00d4d21c8f25c32'],
            ['10', '37e4c53e5eb64083bb7eea884dfa1ba5'],
            ['11', '314fa08cf7ff45e5a87c5f08948ff1d9']
          ];

          const browser = await chromium.launch({ headless: true });
          const failures = [];

          async function capture(label, id) {
            const out = `greg-again/audio/assets/chunks/${label}.mp3`;
            if (fs.existsSync(out) && fs.statSync(out).size > 10000) return;
            const page = await browser.newPage();
            try {
              for (let attempt = 1; attempt <= 8; attempt++) {
                await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(5000);
                const text = await page.locator('body').innerText().catch(() => '');
                console.log('SEGMENT', label, 'ATTEMPT', attempt, text.slice(0, 900).replaceAll('\n', ' | '));
                if (/longer than 2 minutes requires a paid plan/i.test(text)) throw new Error('two-minute gate');
                if (/File Not Found/i.test(text)) throw new Error('file not found');
                const sources = await page.locator('audio').evaluateAll(nodes => nodes.map(n => n.currentSrc || n.src).filter(Boolean)).catch(() => []);
                for (const src of sources) {
                  const response = await page.request.get(src).catch(() => null);
                  if (!response || !response.ok()) continue;
                  const body = await response.body();
                  if (body.length > 10000) {
                    fs.writeFileSync(out, body);
                    console.log('CAPTURED', label, body.length);
                    return;
                  }
                }
                await page.waitForTimeout(4000);
              }
              throw new Error('no playable media surfaced');
            } finally {
              await page.close();
            }
          }

          for (const [label, id] of jobs) {
            try { await capture(label, id); }
            catch (e) { failures.push(`${label}: ${e.message}`); console.log('FAILED', label, e.message); }
          }
          await browser.close();
          fs.writeFileSync('/tmp/capture-failures.txt', failures.join('\n'));
          console.log('FAILURES', failures);
          JS
          node capture.mjs
          ls -lh greg-again/audio/assets/chunks || true
      - name: Commit every successful chunk
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chunks
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist captured Greg Again audio chunks'
            git push origin HEAD:fix/greg-again-audio-playback
          fi
      - name: Report missing chunks
        shell: bash
        run: |
          if [ -s /tmp/capture-failures.txt ]; then
            cat /tmp/capture-failures.txt
            exit 1
          fi
