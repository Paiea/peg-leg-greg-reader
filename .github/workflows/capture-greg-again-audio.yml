name: Capture Greg Again full audio

on:
  push:
    branches:
      - fix/greg-again-audio-playback
    paths:
      - .github/workflows/capture-greg-again-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-and-assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/greg-again-audio-playback
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Capture generated segments
        shell: bash
        run: |
          mkdir -p /tmp/greg-audio
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const ids = [
            '577d31b09af34af791f8351d3f0b3f43',
            '6428215337f74075ab59f5a2c5e962e8',
            'd219f2dfc78844ea8662805ebff01f5f',
            '6662527fd0094ebeb3b265468f23db66',
            '2057bf13b3a74dc2802765c7cad5251a',
            'e3490a2ccd22454c80e1a0ecf3305584',
            'b3da7a867c4c4f18b1eda85ee085cd16',
            'b7eb984e88d54555a3834e65815e0d0c',
            'ef31a04a142b453ab00d4d21c8f25c32',
            '37e4c53e5eb64083bb7eea884dfa1ba5',
            '314fa08cf7ff45e5a87c5f08948ff1d9'
          ];

          const browser = await chromium.launch({ headless: true });

          async function captureSegment(id, index) {
            const label = String(index + 1).padStart(2, '0');
            const out = `/tmp/greg-audio/${label}.mp3`;
            const page = await browser.newPage();
            for (let attempt = 1; attempt <= 8; attempt++) {
              await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(5000);
              const text = await page.locator('body').innerText().catch(() => '');
              console.log('SEGMENT', label, 'ATTEMPT', attempt, text.slice(0, 1200).replaceAll('\n', ' | '));
              if (/longer than 2 minutes requires a paid plan/i.test(text)) {
                await page.close();
                throw new Error(`segment ${label} crossed the two-minute gate`);
              }
              if (/File Not Found/i.test(text)) {
                await page.close();
                throw new Error(`segment ${label} generation disappeared before capture`);
              }
              const sources = await page.locator('audio').evaluateAll(nodes => nodes.map(n => n.currentSrc || n.src).filter(Boolean)).catch(() => []);
              for (const src of sources) {
                console.log('SOURCE', label, src);
                const response = await page.request.get(src).catch(() => null);
                if (!response || !response.ok()) continue;
                const body = await response.body();
                if (body.length > 10000) {
                  fs.writeFileSync(out, body);
                  console.log('CAPTURED', label, body.length);
                  await page.close();
                  return;
                }
              }
              await page.waitForTimeout(4000);
            }
            await page.close();
            throw new Error(`segment ${label} did not surface playable media`);
          }

          for (let i = 0; i < ids.length; i++) {
            await captureSegment(ids[i], i);
          }
          await browser.close();
          JS
          node capture.mjs
          ls -lh /tmp/greg-audio
      - name: Assemble one chapter MP3
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p greg-again/audio/assets
          : > /tmp/concat.txt
          for f in /tmp/greg-audio/*.mp3; do
            printf "file '%s'\n" "$f" >> /tmp/concat.txt
          done
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i /tmp/concat.txt -c:a libmp3lame -q:a 2 greg-again/audio/assets/chapter-001.mp3
          file greg-again/audio/assets/chapter-001.mp3
          du -h greg-again/audio/assets/chapter-001.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 greg-again/audio/assets/chapter-001.mp3
      - name: Commit self-hosted chapter audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chapter-001.mp3
          git diff --cached --quiet && exit 0
          git commit -m 'fix: self-host full Greg Again Chapter 1 audio'
          git push origin HEAD:fix/greg-again-audio-playback
