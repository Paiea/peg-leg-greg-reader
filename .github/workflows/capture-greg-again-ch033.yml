name: Capture Greg Again Chapter 33

on:
  push:
    branches:
      - audio/greg-again-ch033-auto
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch033-auto
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Capture provider previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/production/033/takes
          python3 - <<'PY'
          import json, subprocess, pathlib
          p = pathlib.Path('greg-again/audio/production/033/provider-results.json')
          data = json.loads(p.read_text())
          for item in data['takes']:
              n = item['take']
              url = item['preview_url']
              out = pathlib.Path(f'greg-again/audio/production/033/takes/take-{n:02d}.mp3')
              subprocess.run(['curl','-L','--fail','--retry','4','--retry-delay','2','-o',str(out),url], check=True)
              subprocess.run(['ffprobe','-v','error','-show_entries','format=duration,size','-of','default=nw=1',str(out)], check=True)
          PY

      - name: Assemble and verify chapter
        shell: bash
        run: |
          set -euo pipefail
          cd greg-again/audio/production/033/takes
          : > concat.txt
          for f in take-*.mp3; do printf "file '%s'\n" "$f" >> concat.txt; done
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy ../chapter-033-raw.mp3
          cd ../../../../..
          mkdir -p greg-again/audio/assets
          ffmpeg -y -i greg-again/audio/production/033/chapter-033-raw.mp3 -af "apad=pad_dur=2" -c:a libmp3lame -b:a 128k greg-again/audio/assets/chapter-033.mp3
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 greg-again/audio/assets/chapter-033.mp3)
          size=$(stat -c%s greg-again/audio/assets/chapter-033.mp3)
          sha=$(sha256sum greg-again/audio/assets/chapter-033.mp3 | awk '{print $1}')
          cat > greg-again/audio/production/033/VERIFY.md <<EOF
          # Chapter 33 audio verification

          - take_count: 24
          - duration_seconds: ${duration}
          - size_bytes: ${size}
          - sha256: ${sha}
          - voice: deep
          - source_blob: 6a838d18f9adc895cefe2c523f24cee19e82525f
          - ordered provider artifacts: captured and ffprobe-readable
          - final chapter: ffprobe-readable with approximately 2 second assembly tail
          EOF
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 greg-again/audio/assets/chapter-033.mp3

      - name: Commit durable audio artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add greg-again/audio/production/033/takes/*.mp3 greg-again/audio/production/033/chapter-033-raw.mp3 greg-again/audio/production/033/VERIFY.md greg-again/audio/assets/chapter-033.mp3
          git commit -m "Capture and assemble Chapter 33 audio"
          git push origin HEAD:audio/greg-again-ch033-auto
