name: Capture Greg Again Chapter 10

on:
  push:
    branches:
      - audio/greg-again-ch10-returner
    paths:
      - .github/workflows/capture-greg-again-ch10.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch10-returner
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Capture Chapter 10 takes
        shell: bash
        run: |
          mkdir -p greg-again/audio/assets/chunks/010
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const jobs = [
            ['01', 'e95dc587ae584d42879e3a60fc61787f'],
            ['02', '2faae5fbef53491ca04a27363c176781'],
            ['03', 'e1c1af8a6a244b52a1b251bf471c8636'],
            ['04', '5b56d8e7bb0440b293a35e9db6f81477'],
            ['05', '3be62df29f054af6880a22c1aae7e5ed'],
            ['06', '12cf935c3eee464188b4344c04fee201'],
            ['07', '4faf6e8d85fd46d98054b20e527b2611'],
            ['08', '7599d14874664ea7b30850c6d59374b2'],
            ['09', '5dc9af4ebb6f48a496a9039b6c61ff93'],
            ['10', 'a8445f6a7c6748b2bbb522eb195a8297'],
            ['11', '1bba43599d13474f9be7376da1b6365e'],
            ['12', 'df2aefb1cd594970869b682c96aa55c2']
          ];

          const browser = await chromium.launch({ headless: true });
          const failures = [];

          async function capture(label, id) {
            const out = `greg-again/audio/assets/chunks/010/${label}.mp3`;
            if (fs.existsSync(out) && fs.statSync(out).size > 10000) return;
            const page = await browser.newPage();
            try {
              for (let attempt = 1; attempt <= 12; attempt++) {
                await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(5000);
                const text = await page.locator('body').innerText().catch(() => '');
                console.log('SEGMENT', label, 'ATTEMPT', attempt, text.slice(0, 700).replaceAll('\n', ' | '));
                if (/longer than 2 minutes requires a paid plan/i.test(text)) throw new Error('two-minute gate');
                if (/File Not Found/i.test(text)) throw new Error('file not found');
                const sources = await page.locator('audio').evaluateAll(nodes => nodes.map(n => n.currentSrc || n.src).filter(Boolean)).catch(() => []);
                for (const src of sources) {
                  const response = await page.request.get(src).catch(() => null);
                  if (!response || !response.ok()) continue;
                  const body = await response.body();
                  if (body.length > 10000) {
                    fs.writeFileSync(out, body);
                    console.log('CAPTURED', label, body.length);
                    return;
                  }
                }
                await page.waitForTimeout(4000);
              }
              throw new Error('no playable media surfaced');
            } finally {
              await page.close();
            }
          }

          for (const [label, id] of jobs) {
            try { await capture(label, id); }
            catch (error) {
              failures.push(`${label}: ${error.message}`);
              console.log('FAILED', label, error.message);
            }
          }
          await browser.close();
          fs.writeFileSync('/tmp/capture-failures.txt', failures.join('\n'));
          JS
          node capture.mjs
          ls -lh greg-again/audio/assets/chunks/010/*.mp3 || true
      - name: Commit every successful chunk
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git stash push --include-untracked --message chapter-10-takes
          git pull --rebase origin audio/greg-again-ch10-returner
          git stash pop
          git add greg-again/audio/assets/chunks/010
          if ! git diff --cached --quiet; then
            git commit -m 'audio: persist Greg Again Chapter 10 takes'
            git push origin HEAD:audio/greg-again-ch10-returner
          fi
      - name: Report missing chunks
        shell: bash
        run: |
          if [ -s /tmp/capture-failures.txt ]; then
            cat /tmp/capture-failures.txt
            exit 1
          fi
          test "$(find greg-again/audio/assets/chunks/010 -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 12
      - name: Assemble Chapter 10
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/ch10-concat.txt
          for i in $(seq 1 12); do
            f=$(printf 'greg-again/audio/assets/chunks/010/%02d.mp3' "$i")
            printf "file '%s'\n" "$GITHUB_WORKSPACE/$f" >> /tmp/ch10-concat.txt
          done
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i /tmp/ch10-concat.txt -c copy greg-again/audio/assets/chapter-010.mp3
          test "$(stat -c%s greg-again/audio/assets/chapter-010.mp3)" -gt 1000000
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 greg-again/audio/assets/chapter-010.mp3
      - name: Commit assembled Chapter 10
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git stash push --include-untracked --message chapter-10-final
          git pull --rebase origin audio/greg-again-ch10-returner
          git stash pop
          git add greg-again/audio/assets/chapter-010.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'audio: assemble Greg Again Chapter 10'
            git push origin HEAD:audio/greg-again-ch10-returner
          fi
