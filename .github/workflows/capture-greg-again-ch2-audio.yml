name: Capture Greg Again Chapter 2 audio

on:
  push:
    branches:
      - audio/greg-again-ch2
    paths:
      - .github/workflows/capture-greg-again-ch2-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Capture Chapter 2 generated chunks
        shell: bash
        run: |
          mkdir -p greg-again/audio/assets/chunks/002
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const jobs = [
            ['01', '1f3ca242fe3c492cb26275b4d4c1bf65'],
            ['02', 'f8fc9580c81c426993698892c7b2ae9f'],
            ['03', '30058875db044faf914b098788e756a7'],
            ['04', 'd1e12a3b2c9a43e29850091d4e22195d'],
            ['05', 'ef1b82acc7ba4c9cb9529658c61097ab'],
            ['06', '6a628aae26004ddea71872c9c416091a'],
            ['07', '8a2582291c514ca080602265057d64f2'],
            ['08', '82d0b33982e24b118fe2748029d3928f'],
            ['09', 'fe13dd7c69254e5a8603a27ad8e5ea9b'],
            ['10', 'ca9f7e7dd11042209bef8906f2af0e06'],
            ['11', '342b84c37ead4d17a1b250d22a16d60d'],
            ['12', '0adb112729784e8f973151a9f66bd063']
          ];

          const browser = await chromium.launch({ headless: true });
          const failures = [];

          async function capture(label, id) {
            const out = `greg-again/audio/assets/chunks/002/${label}.mp3`;
            if (fs.existsSync(out) && fs.statSync(out).size > 10000) return;
            const page = await browser.newPage();
            try {
              for (let attempt = 1; attempt <= 10; attempt++) {
                await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(5000);
                const text = await page.locator('body').innerText().catch(() => '');
                console.log('SEGMENT', label, 'ATTEMPT', attempt, text.slice(0, 700).replaceAll('\n', ' | '));
                if (/longer than 2 minutes requires a paid plan/i.test(text)) throw new Error('two-minute gate');
                if (/File Not Found/i.test(text)) throw new Error('file not found');
                const sources = await page.locator('audio').evaluateAll(nodes => nodes.map(n => n.currentSrc || n.src).filter(Boolean)).catch(() => []);
                for (const src of sources) {
                  const response = await page.request.get(src).catch(() => null);
                  if (!response || !response.ok()) continue;
                  const body = await response.body();
                  if (body.length > 10000) {
                    fs.writeFileSync(out, body);
                    console.log('CAPTURED', label, body.length);
                    return;
                  }
                }
                await page.waitForTimeout(4000);
              }
              throw new Error('no playable media surfaced');
            } finally {
              await page.close();
            }
          }

          for (const [label, id] of jobs) {
            try { await capture(label, id); }
            catch (error) {
              failures.push(`${label}: ${error.message}`);
              console.log('FAILED', label, error.message);
            }
          }
          await browser.close();
          fs.writeFileSync('/tmp/capture-failures.txt', failures.join('\n'));
          JS
          node capture.mjs
          ls -lh greg-again/audio/assets/chunks/002 || true
      - name: Commit every successful chunk
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chunks/002
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist Greg Again Chapter 2 audio chunks'
            git push origin HEAD:audio/greg-again-ch2
          fi
      - name: Report missing chunks
        shell: bash
        run: |
          if [ -s /tmp/capture-failures.txt ]; then
            cat /tmp/capture-failures.txt
            exit 1
          fi
