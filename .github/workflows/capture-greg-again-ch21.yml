name: Capture Greg Again Chapter 21

on:
  push:
    branches:
      - audio/greg-again-batch-021-021
    paths:
      - .github/workflows/capture-greg-again-ch21.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-batch-021-021
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Preserve successful takes and open slots 06-07
        shell: bash
        run: |
          set -euo pipefail
          d=greg-again/audio/assets/chunks/021
          if [ ! -f "$d/13.mp3" ]; then
            for pair in '12 13' '11 12' '10 11' '09 10' '08 09' '07 08'; do
              set -- $pair
              test -f "$d/$1.mp3"
              mv "$d/$1.mp3" "$d/$2.mp3"
            done
          fi
      - name: Install browser and audio harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Capture replacement takes 06-07
        shell: bash
        run: |
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const jobs=[['06','6c114e2d4bf64e7083f1fbf75d6ee97b'],['07','192da976671d40ed8cf7c1ffda62ceed']];
          const browser=await chromium.launch({headless:true});
          for(const [label,id] of jobs){
            const out=`greg-again/audio/assets/chunks/021/${label}.mp3`;
            if(fs.existsSync(out)&&fs.statSync(out).size>10000)continue;
            const page=await browser.newPage();
            let ok=false;
            for(let attempt=1;attempt<=12;attempt++){
              await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(5000);
              const text=await page.locator('body').innerText().catch(()=> '');
              console.log('SEGMENT',label,'ATTEMPT',attempt,text.slice(0,700).replaceAll('\n',' | '));
              if(/longer than 2 minutes requires a paid plan/i.test(text))throw new Error(`${label}: two-minute gate`);
              const sources=await page.locator('audio').evaluateAll(nodes=>nodes.map(n=>n.currentSrc||n.src).filter(Boolean)).catch(()=>[]);
              for(const src of sources){
                const response=await page.request.get(src).catch(()=>null);
                if(!response||!response.ok())continue;
                const body=await response.body();
                if(body.length>10000){fs.writeFileSync(out,body);console.log('CAPTURED',label,body.length);ok=true;break;}
              }
              if(ok)break;
              await page.waitForTimeout(4000);
            }
            await page.close();
            if(!ok)throw new Error(`${label}: no playable media surfaced`);
          }
          await browser.close();
          JS
          node capture.mjs
      - name: Verify and assemble Chapter 21
        shell: bash
        run: |
          set -euo pipefail
          d=greg-again/audio/assets/chunks/021
          test "$(find "$d" -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 13
          : > /tmp/ch21-concat.txt
          for i in $(seq 1 13); do
            f=$(printf "$d/%02d.mp3" "$i")
            test "$(stat -c%s "$f")" -gt 10000
            ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$f"
            printf "file '%s'\n" "$GITHUB_WORKSPACE/$f" >> /tmp/ch21-concat.txt
          done
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i /tmp/ch21-concat.txt -c copy greg-again/audio/assets/chapter-021.mp3
          test "$(stat -c%s greg-again/audio/assets/chapter-021.mp3)" -gt 1000000
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 greg-again/audio/assets/chapter-021.mp3
      - name: Commit repaired durable audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git stash push --include-untracked --message chapter-21-repair
          git pull --rebase origin audio/greg-again-batch-021-021
          git stash pop
          git add greg-again/audio/assets/chunks/021 greg-again/audio/assets/chapter-021.mp3
          git commit -m 'audio: capture and assemble Greg Again Chapter 21'
          git push origin HEAD:audio/greg-again-batch-021-021
