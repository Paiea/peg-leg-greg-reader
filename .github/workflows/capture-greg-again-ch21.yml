name: Capture Greg Again Chapter 21

on:
  push:
    branches:
      - audio/greg-again-batch-021-021
    paths:
      - .github/workflows/capture-greg-again-ch21.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-batch-021-021
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser and audio harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Capture Chapter 21 takes
        shell: bash
        run: |
          mkdir -p greg-again/audio/assets/chunks/021
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const jobs = [
            ['01','55cef046cffd4eda9c01c38a17e67f4c'],
            ['02','557f9def1b3f4a6e91cfae644b34aa64'],
            ['03','4ab4fedb84654124a4fa75aa1c966a3f'],
            ['04','f08786e0c94e49398b1ff787266f5787'],
            ['05','de26b61e281f4eb3b497751c92824deb'],
            ['06','9fd5e7e9efd347eb9b1594fc9ad7ba9d'],
            ['07','38cfeabde8a34561aaa864a497c14400'],
            ['08','86187a93bd2a4decb0888d86dcf18d7e'],
            ['09','9f02c16e3a9840ad813c1bffa467b6be'],
            ['10','03f047be8d6e4865b39e3743d0027f2a'],
            ['11','1b616beb9c8042c5bd7a102bcb31e1a3'],
            ['12','a21d629c0c3643d9913969ee2fe80e20']
          ];
          const browser = await chromium.launch({headless:true});
          const failures=[];
          async function capture(label,id){
            const out=`greg-again/audio/assets/chunks/021/${label}.mp3`;
            if(fs.existsSync(out)&&fs.statSync(out).size>10000)return;
            const page=await browser.newPage();
            try{
              for(let attempt=1;attempt<=12;attempt++){
                await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForTimeout(5000);
                const text=await page.locator('body').innerText().catch(()=> '');
                console.log('SEGMENT',label,'ATTEMPT',attempt,text.slice(0,700).replaceAll('\n',' | '));
                if(/longer than 2 minutes requires a paid plan/i.test(text))throw new Error('two-minute gate');
                if(/File Not Found/i.test(text))throw new Error('file not found');
                const sources=await page.locator('audio').evaluateAll(nodes=>nodes.map(n=>n.currentSrc||n.src).filter(Boolean)).catch(()=>[]);
                for(const src of sources){
                  const response=await page.request.get(src).catch(()=>null);
                  if(!response||!response.ok())continue;
                  const body=await response.body();
                  if(body.length>10000){fs.writeFileSync(out,body);console.log('CAPTURED',label,body.length);return;}
                }
                await page.waitForTimeout(4000);
              }
              throw new Error('no playable media surfaced');
            }finally{await page.close();}
          }
          for(const [label,id] of jobs){try{await capture(label,id);}catch(error){failures.push(`${label}: ${error.message}`);console.log('FAILED',label,error.message);}}
          await browser.close();
          fs.writeFileSync('/tmp/capture-failures.txt',failures.join('\n'));
          JS
          node capture.mjs
      - name: Commit every successful chunk
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git stash push --include-untracked --message chapter-21-takes
          git pull --rebase origin audio/greg-again-batch-021-021
          git stash pop
          git add greg-again/audio/assets/chunks/021
          if ! git diff --cached --quiet; then
            git commit -m 'audio: persist Greg Again Chapter 21 takes'
            git push origin HEAD:audio/greg-again-batch-021-021
          fi
      - name: Verify and assemble Chapter 21
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/capture-failures.txt ]; then cat /tmp/capture-failures.txt; exit 1; fi
          test "$(find greg-again/audio/assets/chunks/021 -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 12
          : > /tmp/ch21-concat.txt
          for i in $(seq 1 12); do
            f=$(printf 'greg-again/audio/assets/chunks/021/%02d.mp3' "$i")
            test "$(stat -c%s "$f")" -gt 10000
            ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$f"
            printf "file '%s'\n" "$GITHUB_WORKSPACE/$f" >> /tmp/ch21-concat.txt
          done
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i /tmp/ch21-concat.txt -c copy greg-again/audio/assets/chapter-021.mp3
          test "$(stat -c%s greg-again/audio/assets/chapter-021.mp3)" -gt 1000000
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 greg-again/audio/assets/chapter-021.mp3
      - name: Commit assembled Chapter 21
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git stash push --include-untracked --message chapter-21-final
          git pull --rebase origin audio/greg-again-batch-021-021
          git stash pop
          git add greg-again/audio/assets/chapter-021.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'audio: assemble Greg Again Chapter 21'
            git push origin HEAD:audio/greg-again-batch-021-021
          fi
