name: Capture Greg Again Chapter 4 audio

on:
  push:
    branches:
      - audio/greg-again-ch4-shared-surface
    paths:
      - .github/workflows/capture-greg-again-ch4-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch4-shared-surface
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Capture Chapter 4 generated chunks
        shell: bash
        run: |
          mkdir -p greg-again/audio/assets/chunks/004
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const jobs = [
            ['01', 'bc80ef4754fd4cb5b3c4d2b279715e29'],
            ['02', '1e2721a8312346fea6a6d6691929d0b8'],
            ['03', 'b05a031d21c8423eb05648884686ee4a'],
            ['04', '3a79857d6ed04aa1a4ff4a8d5b20af79'],
            ['05', 'e31d5f2185324a0a8012e9d4b999e7f4'],
            ['06', '07f53fea70314ed58b4db113d6a4bfac'],
            ['07', '003a3eeabcf64be2ae625a5e2996b33f'],
            ['08', '0c17f7a82a0a4887a6dfa19074220750'],
            ['09', '1caab145ce53415d8aab6d66795b7133'],
            ['10', 'c783a5262d9940c78459b6f1a310ae9d'],
            ['11', '1d77049562d44682bdfcb08fac2304a5'],
            ['12', '378ddf87222a4c81a9f3b0518119693e']
          ];

          const browser = await chromium.launch({ headless: true });
          const failures = [];

          async function capture(label, id) {
            const out = `greg-again/audio/assets/chunks/004/${label}.mp3`;
            if (fs.existsSync(out) && fs.statSync(out).size > 10000) return;
            const page = await browser.newPage();
            try {
              for (let attempt = 1; attempt <= 10; attempt++) {
                await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(5000);
                const text = await page.locator('body').innerText().catch(() => '');
                console.log('SEGMENT', label, 'ATTEMPT', attempt, text.slice(0, 700).replaceAll('\n', ' | '));
                if (/longer than 2 minutes requires a paid plan/i.test(text)) throw new Error('two-minute gate');
                if (/File Not Found/i.test(text)) throw new Error('file not found');
                const sources = await page.locator('audio').evaluateAll(nodes => nodes.map(n => n.currentSrc || n.src).filter(Boolean)).catch(() => []);
                for (const src of sources) {
                  const response = await page.request.get(src).catch(() => null);
                  if (!response || !response.ok()) continue;
                  const body = await response.body();
                  if (body.length > 10000) {
                    fs.writeFileSync(out, body);
                    console.log('CAPTURED', label, body.length);
                    return;
                  }
                }
                await page.waitForTimeout(4000);
              }
              throw new Error('no playable media surfaced');
            } finally {
              await page.close();
            }
          }

          for (const [label, id] of jobs) {
            try { await capture(label, id); }
            catch (error) {
              failures.push(`${label}: ${error.message}`);
              console.log('FAILED', label, error.message);
            }
          }
          await browser.close();
          fs.writeFileSync('/tmp/capture-failures.txt', failures.join('\n'));
          JS
          node capture.mjs
          ls -lh greg-again/audio/assets/chunks/004 || true
      - name: Commit every successful chunk
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chunks/004
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist Greg Again Chapter 4 audio chunks'
            git push origin HEAD:audio/greg-again-ch4-shared-surface
          fi
      - name: Report missing chunks
        shell: bash
        run: |
          if [ -s /tmp/capture-failures.txt ]; then
            cat /tmp/capture-failures.txt
            exit 1
          fi
