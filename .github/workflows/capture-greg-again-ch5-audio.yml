name: Capture Greg Again Chapter 5 audio

on:
  push:
    branches:
      - audio/greg-again-ch5-processing-space
    paths:
      - .github/workflows/capture-greg-again-ch5-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch5-processing-space
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Capture Chapter 5 generated chunks
        shell: bash
        run: |
          mkdir -p greg-again/audio/assets/chunks/005
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const jobs = [
            ['01', '9dd751783a3a4054ad103f6e0da9bdb1'],
            ['02', '9659c14391a940c9b11b26262682dea6'],
            ['03', 'e46acec6cfda4e218d0fe9bbf1caff95'],
            ['04', '543009caec01490b9433cc90549570c0'],
            ['05', 'e4ef7c2b078349c6a682f0d5818e1dc8'],
            ['06', '662d120019da4327af46bb3b5c9fcf13'],
            ['07', '37c22164e5b2490a9d11cd8bafcd55a9'],
            ['08', '3472f0484fae4120978922431f6379d0'],
            ['09', 'e660c7dc2b764a9793fd0f2f321a1691'],
            ['10', '95b9e79df7214d4eab80e42584367924'],
            ['11', '7235d0d7fbc045fabe5a02c7fd0850e9'],
            ['12', '1e641a44c7e24d258f05e4a410cd888d'],
            ['13', '7eb503f825774b9a8d4107ded41230d7'],
            ['14', 'e506431d93214e91a01699f72d1165de']
          ];

          const browser = await chromium.launch({ headless: true });
          const failures = [];

          async function capture(label, id) {
            const out = `greg-again/audio/assets/chunks/005/${label}.mp3`;
            if (fs.existsSync(out) && fs.statSync(out).size > 10000) return;
            const page = await browser.newPage();
            try {
              for (let attempt = 1; attempt <= 10; attempt++) {
                await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(5000);
                const text = await page.locator('body').innerText().catch(() => '');
                console.log('SEGMENT', label, 'ATTEMPT', attempt, text.slice(0, 700).replaceAll('\n', ' | '));
                if (/longer than 2 minutes requires a paid plan/i.test(text)) throw new Error('two-minute gate');
                if (/File Not Found/i.test(text)) throw new Error('file not found');
                const sources = await page.locator('audio').evaluateAll(nodes => nodes.map(n => n.currentSrc || n.src).filter(Boolean)).catch(() => []);
                for (const src of sources) {
                  const response = await page.request.get(src).catch(() => null);
                  if (!response || !response.ok()) continue;
                  const body = await response.body();
                  if (body.length > 10000) {
                    fs.writeFileSync(out, body);
                    console.log('CAPTURED', label, body.length);
                    return;
                  }
                }
                await page.waitForTimeout(4000);
              }
              throw new Error('no playable media surfaced');
            } finally {
              await page.close();
            }
          }

          for (const [label, id] of jobs) {
            try { await capture(label, id); }
            catch (error) {
              failures.push(`${label}: ${error.message}`);
              console.log('FAILED', label, error.message);
            }
          }
          await browser.close();
          fs.writeFileSync('/tmp/capture-failures.txt', failures.join('\n'));
          JS
          node capture.mjs
          ls -lh greg-again/audio/assets/chunks/005 || true
      - name: Commit every successful chunk
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chunks/005
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist Greg Again Chapter 5 audio chunks'
            git push origin HEAD:audio/greg-again-ch5-processing-space
          fi
      - name: Report missing chunks
        shell: bash
        run: |
          if [ -s /tmp/capture-failures.txt ]; then
            cat /tmp/capture-failures.txt
            exit 1
          fi
