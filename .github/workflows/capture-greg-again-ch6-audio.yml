name: Capture Greg Again Chapter 6 audio

on:
  push:
    branches:
      - audio/greg-again-ch6-first-customer
    paths:
      - .github/workflows/capture-greg-again-ch6-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch6-first-customer
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Capture Chapter 6 generated chunks
        shell: bash
        run: |
          mkdir -p greg-again/audio/assets/chunks/006
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const jobs = [
            ['01', '3be0bc3589fe4bc6b3d9dc0ba317fdfb'],
            ['02', '1786b81104a5453dbdc8facee9710d72'],
            ['03', '57855fc62ecd4e5ab82a363c83e3ffce'],
            ['04', '03f466604353489096946d3433060daa'],
            ['05', '67e9b4a0632847b59f3e51b67930efed'],
            ['06', 'a2ca1da102e4437d86f8de4a615ba764'],
            ['07', '4ca6b6eb6b55477dac51cd686792d23c'],
            ['08', '1e81dd8237a64393977663e948e06e3c'],
            ['09', 'beb2fbd476414279a0f921f36a666b89'],
            ['10', '72d14e532d384913a8a6c83a87551c12'],
            ['11', '0d0780ef68124d9b8a17862e08a22d8d'],
            ['12', '5fc86af68c3c4cac8ce03fe17d657bd4'],
            ['13', '2ffb7a3332094990853407cac2eaf361']
          ];

          const browser = await chromium.launch({ headless: true });
          const failures = [];

          async function capture(label, id) {
            const out = `greg-again/audio/assets/chunks/006/${label}.mp3`;
            if (fs.existsSync(out) && fs.statSync(out).size > 10000) return;
            const page = await browser.newPage();
            try {
              for (let attempt = 1; attempt <= 10; attempt++) {
                await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(5000);
                const text = await page.locator('body').innerText().catch(() => '');
                console.log('SEGMENT', label, 'ATTEMPT', attempt, text.slice(0, 700).replaceAll('\n', ' | '));
                if (/longer than 2 minutes requires a paid plan/i.test(text)) throw new Error('two-minute gate');
                if (/File Not Found/i.test(text)) throw new Error('file not found');
                const sources = await page.locator('audio').evaluateAll(nodes => nodes.map(n => n.currentSrc || n.src).filter(Boolean)).catch(() => []);
                for (const src of sources) {
                  const response = await page.request.get(src).catch(() => null);
                  if (!response || !response.ok()) continue;
                  const body = await response.body();
                  if (body.length > 10000) {
                    fs.writeFileSync(out, body);
                    console.log('CAPTURED', label, body.length);
                    return;
                  }
                }
                await page.waitForTimeout(4000);
              }
              throw new Error('no playable media surfaced');
            } finally {
              await page.close();
            }
          }

          for (const [label, id] of jobs) {
            try { await capture(label, id); }
            catch (error) {
              failures.push(`${label}: ${error.message}`);
              console.log('FAILED', label, error.message);
            }
          }
          await browser.close();
          fs.writeFileSync('/tmp/capture-failures.txt', failures.join('\n'));
          JS
          node capture.mjs
          ls -lh greg-again/audio/assets/chunks/006 || true
      - name: Commit every successful chunk
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chunks/006
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist Greg Again Chapter 6 audio chunks'
            git push origin HEAD:audio/greg-again-ch6-first-customer
          fi
      - name: Report missing chunks
        shell: bash
        run: |
          if [ -s /tmp/capture-failures.txt ]; then
            cat /tmp/capture-failures.txt
            exit 1
          fi
