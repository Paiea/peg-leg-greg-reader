name: Capture Greg Again Chapter 7 audio

on:
  push:
    branches:
      - audio/greg-again-ch7-extra-guard
    paths:
      - .github/workflows/capture-greg-again-ch7-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch7-extra-guard
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Capture Chapter 7 generated chunks
        shell: bash
        run: |
          mkdir -p greg-again/audio/assets/chunks/007
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const jobs = [
            ['01', 'd0518eb20003406b9b55380fa5aff0aa'],
            ['02', '162c98df005e46d3927d597d993d5153'],
            ['03', '95bd942836d2477695ca94872b15836d'],
            ['04', 'fef3c1fb785f4909ae11569b56d5426a'],
            ['05', '756aa56f10404c7ba98eb9d759707dab'],
            ['06', '5a94dfddbc0b4cdd9712931494297013'],
            ['07', '0903f166f6644491b7f9be02792824ea'],
            ['08', 'b8cfcc2f286441bcb6933c53374815e8'],
            ['09', '9455436c5e5c4268a536a1c083f2fc00'],
            ['10', '9ba36a62214d4ea88ede7d919e78a631'],
            ['11', '32b2595022914c7eaaceb9c3c7db12fb'],
            ['12', 'fba7459263584eb48f03a2faab3f1682'],
            ['13', '7279c5dea13e4cdf910d3dca24d02b1f']
          ];

          const browser = await chromium.launch({ headless: true });
          const failures = [];

          async function capture(label, id) {
            const out = `greg-again/audio/assets/chunks/007/${label}.mp3`;
            if (fs.existsSync(out) && fs.statSync(out).size > 10000) return;
            const page = await browser.newPage();
            try {
              for (let attempt = 1; attempt <= 10; attempt++) {
                await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(5000);
                const text = await page.locator('body').innerText().catch(() => '');
                console.log('SEGMENT', label, 'ATTEMPT', attempt, text.slice(0, 700).replaceAll('\n', ' | '));
                if (/longer than 2 minutes requires a paid plan/i.test(text)) throw new Error('two-minute gate');
                if (/File Not Found/i.test(text)) throw new Error('file not found');
                const sources = await page.locator('audio').evaluateAll(nodes => nodes.map(n => n.currentSrc || n.src).filter(Boolean)).catch(() => []);
                for (const src of sources) {
                  const response = await page.request.get(src).catch(() => null);
                  if (!response || !response.ok()) continue;
                  const body = await response.body();
                  if (body.length > 10000) {
                    fs.writeFileSync(out, body);
                    console.log('CAPTURED', label, body.length);
                    return;
                  }
                }
                await page.waitForTimeout(4000);
              }
              throw new Error('no playable media surfaced');
            } finally {
              await page.close();
            }
          }

          for (const [label, id] of jobs) {
            try { await capture(label, id); }
            catch (error) {
              failures.push(`${label}: ${error.message}`);
              console.log('FAILED', label, error.message);
            }
          }
          await browser.close();
          fs.writeFileSync('/tmp/capture-failures.txt', failures.join('\n'));
          JS
          node capture.mjs
          ls -lh greg-again/audio/assets/chunks/007 || true
      - name: Commit every successful chunk
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chunks/007
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist Greg Again Chapter 7 audio chunks'
            git push origin HEAD:audio/greg-again-ch7-extra-guard
          fi
      - name: Report missing chunks
        shell: bash
        run: |
          if [ -s /tmp/capture-failures.txt ]; then
            cat /tmp/capture-failures.txt
            exit 1
          fi
