name: Capture Greg Again Chapter 9 audio

on:
  push:
    branches:
      - audio/greg-again-ch9-backstop
    paths:
      - .github/workflows/capture-greg-again-ch9-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch9-backstop
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Capture Chapter 9 generated chunks
        shell: bash
        run: |
          mkdir -p greg-again/audio/assets/chunks/009
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const jobs = [
            ['01','21667d8a92c64adda3e4544d716c29b1'],
            ['02','8a264f62ae334d638ed9056f2acc9a52'],
            ['03','c1adde48589845aebbf7a3114e7c0612'],
            ['04','373b5154bd8943d992e89926d93d7a89'],
            ['05','c5f8502774024cd0b9720db5087a0c01'],
            ['06','de539688ff394df497bbf3d119f5c8d8'],
            ['07','b412a1f6165c428bb08178a9ee833150'],
            ['08','618018912f694b99a8431b00495e2ee4'],
            ['09','c76fa3dbe2e74f05988224f976f395fc'],
            ['10','4520501211da4bb9b56016cdeec1c76c']
          ];
          const browser = await chromium.launch({headless:true});
          const failures=[];
          async function capture(label,id){
            const out=`greg-again/audio/assets/chunks/009/${label}.mp3`;
            if(fs.existsSync(out)&&fs.statSync(out).size>10000)return;
            const page=await browser.newPage();
            try{
              for(let attempt=1;attempt<=12;attempt++){
                await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForTimeout(5000);
                const text=await page.locator('body').innerText().catch(()=> '');
                if(/longer than 2 minutes requires a paid plan/i.test(text)) throw new Error('two-minute gate');
                if(/File Not Found/i.test(text)) throw new Error('file not found');
                const sources=await page.locator('audio').evaluateAll(nodes=>nodes.map(n=>n.currentSrc||n.src).filter(Boolean)).catch(()=>[]);
                for(const src of sources){
                  const response=await page.request.get(src).catch(()=>null);
                  if(!response||!response.ok()) continue;
                  const body=await response.body();
                  if(body.length>10000){fs.writeFileSync(out,body);console.log('CAPTURED',label,body.length);return;}
                }
                await page.waitForTimeout(4000);
              }
              throw new Error('no playable media surfaced');
            }finally{await page.close();}
          }
          for(const [label,id] of jobs){try{await capture(label,id);}catch(error){failures.push(`${label}: ${error.message}`);}}
          await browser.close();
          fs.writeFileSync('/tmp/capture-failures.txt',failures.join('\n'));
          JS
          node capture.mjs
          ls -lh greg-again/audio/assets/chunks/009 || true
      - name: Commit every successful chunk
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chunks/009
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist Greg Again Chapter 9 audio chunks'
            git push origin HEAD:audio/greg-again-ch9-backstop
          fi
      - name: Report missing chunks
        run: |
          if [ -s /tmp/capture-failures.txt ]; then cat /tmp/capture-failures.txt; exit 1; fi