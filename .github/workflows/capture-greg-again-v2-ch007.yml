name: Capture Greg Again Audio Score v2 Chapter 007

on:
  push:
    branches:
      - audio/v2-greg-again-ch007-auto
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/v2-greg-again-ch007-auto
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Recover queued provider takes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/v2/takes/007/audio greg-again/audio/v2/verification/007 /tmp/ga007

          cat > /tmp/ga007/takes.tsv <<'EOF'
          01	c2daa4c06e954a488453b64da3c388c7
          02	27074993609b4c9ba37c12d289cf3d13
          03	a647e8c87fd64fde814e3f33a6d91f2c
          04	2a13b0a5ffd7471881b4fd5bab3e081f
          05	9eea180273404102b438f2e9bfa9e6dc
          06	03f60559dfd74f7b8def603c8dfb727c
          07	299a67c8d2914e9bad497b32ee021c6b
          08	ab7fe440d8854ed98e7957f0309f162c
          09	6fe02527adcc4cabae6ffe770da109fd
          10	33d5a19232394af9b7612fbf936de38d
          EOF

          recover_take() {
            local take="$1" id="$2"
            local provider="https://www.aidocmaker.com/g0/audio?name=${id}"
            local page="/tmp/ga007/take-${take}.page"
            local tmp="/tmp/ga007/take-${take}.tmp.mp3"
            local out="greg-again/audio/v2/takes/007/audio/take-${take}.mp3"

            for attempt in $(seq 1 30); do
              rm -f "$page" "$tmp"
              echo "take ${take}: recovery attempt ${attempt}"
              if ! curl -L --fail -sS --connect-timeout 20 --max-time 120 "$provider" -o "$page"; then
                sleep 20
                continue
              fi

              if ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$page" >/dev/null 2>&1; then
                mv "$page" "$out"
                echo "take ${take}: provider endpoint returned audio directly"
                return 0
              fi

              direct="$(python3 - "$page" <<'PY'
          import html, re, sys
          text = open(sys.argv[1], 'r', encoding='utf-8', errors='ignore').read()
          text = html.unescape(text).replace('\\u002F','/').replace('\\/','/')
          patterns = [
              r'https://storage\.googleapis\.com/[^"\'<>\\ ]+?\.mp3(?:\?[^"\'<>\\ ]*)?',
              r'https://[^"\'<>\\ ]+?mcp-preview/[^"\'<>\\ ]+?\.mp3(?:\?[^"\'<>\\ ]*)?',
              r'https://[^"\'<>\\ ]+?\.mp3(?:\?[^"\'<>\\ ]*)?'
          ]
          for pat in patterns:
              m = re.search(pat, text)
              if m:
                  print(m.group(0))
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
              )" || true

              if [ -n "${direct:-}" ]; then
                echo "take ${take}: unwrapped direct MP3"
                if curl -L --fail -sS --retry 3 --connect-timeout 20 --max-time 180 "$direct" -o "$tmp" \
                  && test "$(stat -c%s "$tmp")" -gt 10000 \
                  && ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$tmp" >/dev/null; then
                  mv "$tmp" "$out"
                  return 0
                fi
              fi

              echo "take ${take}: not ready yet"
              grep -Eio '.{0,100}(storage\.googleapis\.com|mcp-preview|\.mp3|audioUrl|audio_url|downloadUrl|playback|queued|processing).{0,160}' "$page" | head -30 || true
              sleep 20
            done

            echo "take ${take}: failed to recover after polling" >&2
            return 1
          }

          while IFS=$'\t' read -r take id; do
            recover_take "$take" "$id"
          done < /tmp/ga007/takes.tsv

          for f in greg-again/audio/v2/takes/007/audio/take-*.mp3; do
            ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$f"
          done

      - name: Assemble Chapter 007
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/assets/v2 greg-again/audio/v2/verification/007
          cd greg-again/audio/v2/takes/007/audio
          : > concat.txt
          for n in $(seq -w 1 10); do printf "file 'take-%s.mp3'\n" "$n" >> concat.txt; done
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy /tmp/chapter-007-raw.mp3
          cd ../../../../../..
          ffmpeg -y -i /tmp/chapter-007-raw.mp3 -af "apad=pad_dur=2" -c:a libmp3lame -b:a 128k greg-again/audio/assets/v2/chapter-007.mp3

          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 greg-again/audio/assets/v2/chapter-007.mp3)
          size=$(stat -c%s greg-again/audio/assets/v2/chapter-007.mp3)
          sha=$(sha256sum greg-again/audio/assets/v2/chapter-007.mp3 | awk '{print $1}')
          cat > greg-again/audio/v2/verification/007/VERIFY.md <<EOF
          # Audio Score v2 Chapter 007 verification

          - chapter: 007
          - title: The Extra Guard
          - take_count: 10
          - voice: deep
          - audio_score_source: r2/assets/audio-score/ch007.md
          - audio_score_blob: d179b9621a0903c286171b707264b6256600b99f
          - duration_seconds: ${duration}
          - size_bytes: ${size}
          - sha256: ${sha}
          - ordered provider artifacts: recovered and ffprobe-readable
          - assembly: takes 01 through 10 in locked order
          - listener tail: approximately 2 seconds added at assembly
          - provider pronunciation substitution: take 07 used Ma-na for written Mana
          EOF
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 greg-again/audio/assets/v2/chapter-007.mp3

      - name: Commit recovered and assembled audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add greg-again/audio/v2/takes/007/audio/*.mp3 greg-again/audio/v2/verification/007/VERIFY.md greg-again/audio/assets/v2/chapter-007.mp3
          git commit -m "audio: recover and assemble Audio Score v2 Chapter 007"
          git push origin HEAD:audio/v2-greg-again-ch007-auto
