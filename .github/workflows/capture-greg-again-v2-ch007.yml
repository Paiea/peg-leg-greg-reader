name: Publish Greg Again Audio Score v2 Chapter 007

on:
  push:
    branches:
      - audio/v2-greg-again-ch007-auto

concurrency:
  group: audio-v2-greg-again-ch007-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/v2-greg-again-ch007-auto
          fetch-depth: 0

      - name: Reconcile v2 and public manifests
        shell: bash
        run: |
          set -euo pipefail
          test -s greg-again/audio/assets/v2/chapter-007.mp3
          python3 - <<'PY'
          import json
          from pathlib import Path

          v2_path = Path('greg-again/audio/v2/manifest.json')
          v2 = json.loads(v2_path.read_text())
          entry = {
              'chapter_id': 'ga-007',
              'number': 7,
              'title': 'The Extra Guard',
              'status': 'verified',
              'source': 'r2/assets/audio-score/ch007.md',
              'source_blob': 'd179b9621a0903c286171b707264b6256600b99f',
              'voice': 'deep',
              'take_count': 31,
              'duration_seconds': 623.448,
              'audio_src': 'assets/v2/chapter-007.mp3',
              'sha256': 'de12bffa3ed699816837db6b9e41abaad514368ca94e57ecb2fa16f578f8af8f'
          }
          chapters = [c for c in v2.get('chapters', []) if c.get('number') != 7 and c.get('chapter_id') != 'ga-007']
          chapters.append(entry)
          chapters.sort(key=lambda c: c.get('number', 10**9))
          v2['chapters'] = chapters
          v2_path.write_text(json.dumps(v2, indent=2) + '\n')

          public_path = Path('greg-again/audio/manifest.json')
          public = json.loads(public_path.read_text())
          matches = [c for c in public['chapters'] if c.get('number') == 7 or c.get('chapter_id') == 'ga-007']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one public Chapter 007 entry, found {len(matches)}')
          c = matches[0]
          c['take_count'] = 31
          c['duration_seconds'] = 623.448
          c['audio_src'] = 'assets/v2/chapter-007.mp3'
          c['note'] = 'Audio Score v2 Chapter 7 uses thirty-one preview-safe deep-voice takes captured from direct provider preview artifacts, stitched in deterministic order, and finished with the established settling tail.'
          public_path.write_text(json.dumps(public, indent=2) + '\n')
          PY

      - name: Verify publication route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          v2 = json.loads(Path('greg-again/audio/v2/manifest.json').read_text())
          public = json.loads(Path('greg-again/audio/manifest.json').read_text())
          v2c = next(c for c in v2['chapters'] if c.get('number') == 7)
          pub = next(c for c in public['chapters'] if c.get('number') == 7)
          assert v2c['status'] == 'verified'
          assert v2c['take_count'] == 31
          assert v2c['duration_seconds'] == 623.448
          assert pub['take_count'] == 31
          assert pub['duration_seconds'] == 623.448
          assert pub['audio_src'] == 'assets/v2/chapter-007.mp3'
          assert Path('greg-again/audio/assets/v2/chapter-007.mp3').is_file()
          assert Path('greg-again/audio/assets/chapter-007.mp3').is_file()
          print('Chapter 007 v2 route verified; legacy v1 asset preserved')
          PY

      - name: Commit publication authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add greg-again/audio/v2/manifest.json greg-again/audio/manifest.json
          git commit -m "audio: publish Audio Score v2 Chapter 007"
          git push origin HEAD:audio/v2-greg-again-ch007-auto
