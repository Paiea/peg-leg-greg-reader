name: Chapter 4 pronunciation repair diagnostic

on:
  push:
    branches:
      - audio/greg-again-ch004-pronunciation-repair
    paths:
      - .github/workflows/ch004-pronunciation-repair.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi

      - name: Validate micro replacement clip
        shell: bash
        env:
          MICRO_URL: https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/957ae6cc-7de2-43cc-b110-8f293e6d454e.mp3
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch004-repair
          curl --fail --location --retry 4 --retry-delay 2 "$MICRO_URL" -o /tmp/ch004-repair/micro.mp3
          file /tmp/ch004-repair/micro.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/ch004-repair/micro.mp3 | tee /tmp/ch004-repair/micro-duration.txt
          python - <<'PY'
          from pathlib import Path
          d = float(Path('/tmp/ch004-repair/micro-duration.txt').read_text().strip())
          if not 3.0 < d < 30.0:
              raise SystemExit(f'Unexpected micro clip duration: {d}')
          print(f'MICRO_DURATION={d:.3f}')
          PY

      - name: Map silence seams around listener timestamp
        shell: bash
        run: |
          set -euo pipefail
          src="greg-again/audio/assets/chunks/004/01.mp3"
          test -s "$src"
          printf 'ORIGINAL_TAKE01_DURATION='
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$src"
          ffmpeg -hide_banner -loglevel info -i "$src" -af silencedetect=noise=-42dB:d=0.12 -f null - 2> /tmp/ch004-repair/silence.log || true
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/ch004-repair/silence.log').read_text(errors='replace')
          starts = []
          ends = []
          for line in text.splitlines():
              m = re.search(r'silence_start: ([0-9.]+)', line)
              if m:
                  starts.append(float(m.group(1)))
              m = re.search(r'silence_end: ([0-9.]+)', line)
              if m:
                  ends.append(float(m.group(1)))
          events = sorted([('start', x) for x in starts] + [('end', x) for x in ends], key=lambda x: x[1])
          print('SILENCE_EVENTS_25_TO_60')
          for kind, t in events:
              if 25 <= t <= 60:
                  print(f'{kind:5s} {t:8.3f}')
          print('ALL_SILENCE_EVENT_COUNT', len(events))
          PY

      - name: Inspect provider landing page safely
        shell: bash
        env:
          TAKE_PAGE_URL: https://www.aidocmaker.com/g0/audio?name=1aa6c6df8ed346f19849ead71b02acfe
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 "$TAKE_PAGE_URL" -o /tmp/ch004-repair/provider.html
          python - <<'PY'
          import html, re
          from pathlib import Path
          from urllib.parse import urlsplit
          text = Path('/tmp/ch004-repair/provider.html').read_text(errors='replace')
          decoded = html.unescape(text).replace('\\/', '/')
          print('PROVIDER_HTML_BYTES', len(text.encode()))
          for needle in ['.mp3', 'storage.googleapis.com', 'audioUrl', 'audio_url', 'download', '1aa6c6df8ed346f19849ead71b02acfe']:
              print('MARKER', needle, decoded.count(needle))
          urls = re.findall(r'https?://[^"\'<>\\s]+', decoded)
          seen = set()
          print('AUDIOISH_URL_SHAPES')
          for u in urls:
              if u in seen:
                  continue
              seen.add(u)
              low = u.lower()
              if any(k in low for k in ['mp3', 'audio', 'storage.googleapis', 'download']):
                  p = urlsplit(u)
                  print(p.netloc + p.path)
          PY
