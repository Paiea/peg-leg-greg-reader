name: Diagnose Chapter 5 Vale pronunciation seam
on:
  push:
    branches: [audio/greg-again-mana-pronunciation-repair]
    paths: [.github/workflows/ch005-vale-diagnostic.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-mana-pronunciation-repair
      - shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; fi
          mkdir -p /tmp/ch005-vale
          curl --fail --location --retry 4 --retry-delay 2 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/aca37006-6b77-444e-8a30-8ef3e3124f52.mp3' -o /tmp/ch005-vale/micro.mp3
          python - <<'PY'
          import json,subprocess,re
          from pathlib import Path
          root=Path('greg-again/audio/assets/chunks/005')
          def dur(p):
              return float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(p)],text=True).strip())
          takes=[root/f'{i:02d}.mp3' for i in range(1,15)]
          missing=[str(p) for p in takes if not p.exists()]
          if missing: raise SystemExit(f'missing Chapter 5 chunks: {missing}')
          ds=[dur(p) for p in takes]
          target_chapter=8*60+8
          prior=sum(ds[:6])
          local=target_chapter-prior
          if not (0 < local < ds[6]):
              raise SystemExit(f'listener timestamp does not land in take07: prior={prior:.3f} local={local:.3f} d7={ds[6]:.3f}')
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','info','-i',str(takes[6]),'-af','silencedetect=noise=-42dB:d=0.12','-f','null','-'],stderr=open('/tmp/ch005-vale/silence.log','w'),check=False)
          text=Path('/tmp/ch005-vale/silence.log').read_text(errors='replace')
          events=[]
          for line in text.splitlines():
              m=re.search(r'silence_start: ([0-9.]+)',line)
              if m: events.append(('start',float(m.group(1))))
              m=re.search(r'silence_end: ([0-9.]+)',line)
              if m: events.append(('end',float(m.group(1))))
          events.sort(key=lambda x:x[1])
          ints=[]; cur=None
          for kind,t in events:
              if kind=='start': cur=t
              elif cur is not None: ints.append((cur,t)); cur=None
          substantial=[x for x in ints if x[1]-x[0]>=0.25]
          before=[x for x in substantial if x[1] < local]
          after=[x for x in substantial if x[0] > local]
          if not before or not after: raise SystemExit('could not bracket listener timestamp with silences')
          left=max(before,key=lambda x:x[1]); right=min(after,key=lambda x:x[0])
          out={
            'chapter':5,'take':7,'listener_timestamp_seconds':target_chapter,
            'prior_take_duration_seconds':round(prior,3),'take_local_target_seconds':round(local,3),
            'take07_duration_seconds':round(ds[6],3),'left_silence':[round(left[0],3),round(left[1],3)],
            'right_silence':[round(right[0],3),round(right[1],3)],
            'candidate_splice':[round(sum(left)/2,3),round(sum(right)/2,3)],
            'written_sentence':'Vale expected money tomorrow.',
            'provider_sentence':'Vayle expected money tomorrow.',
            'provider_context_id':'557cba04f37e43c3b72ffd1fd58a1d95',
            'provider_preview_url':'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/aca37006-6b77-444e-8a30-8ef3e3124f52.mp3',
            'policy':'confirmed bad occurrence only; do not mass-repair other historical Vale readings'
          }
          p=Path('greg-again/audio/production/005/2026-09-08-vale-pronunciation-diagnostic.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          rm .github/workflows/ch005-vale-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/production/005/2026-09-08-vale-pronunciation-diagnostic.json .github/workflows/ch005-vale-diagnostic.yml
          git commit -m 'audio: diagnose Chapter 5 Vale pronunciation seam'
          git push origin HEAD:audio/greg-again-mana-pronunciation-repair
