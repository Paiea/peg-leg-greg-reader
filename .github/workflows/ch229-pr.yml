name: Temporary Chapter 229 PR runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'manuscript/ch229-road-one'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manuscript/ch229-road-one
          fetch-depth: 0
      - name: Apply Chapter 229
        run: python .ch229_apply.py
      - name: Verify and push branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Append Chapter 229: THE ROAD ONE"
          git push origin HEAD:manuscript/ch229-road-one
