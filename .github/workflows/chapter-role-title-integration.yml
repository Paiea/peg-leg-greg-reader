name: Integrate chapter role titles

on:
  push:
    branches:
      - editor/chapter-title-role-integration
    paths:
      - 'scripts/apply_chapter_role_titles.py'
      - 'tests/test_chapter_role_title_integration.py'
      - '.github/workflows/chapter-role-title-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chapter-role-title-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DOCX dependency
        run: pip install python-docx
      - name: Test title integration tool
        run: python -m unittest tests.test_chapter_role_title_integration -v
      - name: Fetch approved audit authority
        run: git fetch origin editor/chapter-title-role-audit-batch-001:refs/remotes/origin/editor/chapter-title-role-audit-batch-001
      - name: Inspect canonical DOCX title layout
        run: |
          python - <<'PY'
          from docx import Document
          for path, needles in [
              ('state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map.docx', ['CHAPTER FIFTY-ONE', 'THE SIGNAL', 'CHAPTER SIXTY-SIX', 'THE ABSENT']),
              ('state/manuscript/Peg_Leg_Greg_Book2_Manuscript_Ch83-137.docx', ['CHAPTER ONE HUNDRED TWO', 'THE PIVOT', 'CHAPTER ONE HUNDRED TWENTY-SIX', 'THE OLD ROAD']),
          ]:
              print('DOCX', path)
              doc = Document(path)
              hits = set()
              for i, p in enumerate(doc.paragraphs):
                  upper = p.text.upper()
                  if any(n in upper for n in needles):
                      for j in range(max(0, i-2), min(len(doc.paragraphs), i+4)):
                          hits.add(j)
              for j in sorted(hits):
                  p = doc.paragraphs[j]
                  print(j, repr(p.style.name), repr(p.text))
          PY
      - name: Apply approved role titles
        run: PYTHONPATH=. python scripts/apply_chapter_role_titles.py --apply
      - name: Bring approved audit ledger into integration branch
        run: git checkout origin/editor/chapter-title-role-audit-batch-001 -- state/CHAPTER_TITLE_ROLE_AUDIT.md state/chapter-title-role-audit
      - name: Regenerate reader derivatives
        run: |
          python scripts/generate_light.py 156-219
          python scripts/generate_illustrated.py current
          python scripts/generate_light.py current
          python scripts/update_reader_navigation.py index.html
          python scripts/update_home_contents.py
      - name: Refresh NotebookLM sources
        run: python scripts/build_notebooklm_export.py
      - name: Verify approved role titles
        run: |
          PYTHONPATH=. python scripts/apply_chapter_role_titles.py --verify
          grep -qi '<h1>THE WARRIOR</h1>' chapters/005.html
          grep -qi '<h1>THE STAGEHAND</h1>' chapters/177.html
          grep -qi '<h1>THE MAGISTRATE</h1>' chapters/231.html
          grep -qi '<h1>THE SURVEYOR</h1>' chapters/331.html
          grep -qi '<h1>THE INVESTOR</h1>' chapters/446.html
          grep -qi 'The Surveyor' scripts/reader_sections.py
          git diff --check
      - name: Test reader tooling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit title integration
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/manuscript state/MANUSCRIPT_CHAPTER_INDEX.md state/CHAPTER_TITLE_ROLE_AUDIT.md state/chapter-title-role-audit chapters light index.html light.html latest.html exports/notebooklm
          git commit -m 'Normalize chapter titles to Greg roles'
          git push origin HEAD:editor/chapter-title-role-integration
