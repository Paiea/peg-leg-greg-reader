name: One-shot check Chapter 232 authority
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-ch232-authority-once.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce duplicate authority failure
        run: python state/.test_ch232_authority.py
