name: Diagnose dialogue ownership 031-040

on:
  push:
    branches:
      - integration/aggressive-dialogue-031-040-final
    paths:
      - '.github/workflows/diagnose-dialogue-031-040.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Chapter 38 ownership seam
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import re
          text = Path('chapters/038.html').read_text(encoding='utf-8')
          article = text.split('<article class="prose">', 1)[1].split('</article>', 1)[0]
          p_re = re.compile(r'<p\b[^>]*>(.*?)</p>', re.I | re.S)
          tag_re = re.compile(r'<[^>]+>')
          paragraphs = [html.unescape(tag_re.sub('', m.group(1))).replace('\xa0', ' ').strip() for m in p_re.finditer(article)]
          paragraphs = [p for p in paragraphs if p]
          for index in range(150, 156):
              print(f'=== CHAPTER 38 PARAGRAPH {index} ===')
              print(paragraphs[index - 1])
              print('=== END ===')
          PY
