name: Publish dialogue attribution pass

# Integration v5: publish the accepted incremental dialogue/attribution range
# through Chapter 99 while preserving the Book I / Book II source boundary.
on:
  pull_request:
    paths:
      - 'scripts/apply_dialogue_attribution_patches.py'
      - 'scripts/run_dialogue_live_integration.py'
      - 'scripts/dialogue_live_entrypoint.py'
      - 'state/editorial/dialogue-live-overrides.json'
      - 'tests/test_dialogue_publish_boundary.py'
      - '.github/workflows/dialogue-attribution-live.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/apply_dialogue_attribution_patches.py'
      - 'scripts/run_dialogue_live_integration.py'
      - 'scripts/dialogue_live_entrypoint.py'
      - 'state/editorial/dialogue-live-overrides.json'
      - 'tests/test_dialogue_publish_boundary.py'
      - '.github/workflows/dialogue-attribution-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-dialogue-through-99:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch durable editorial patch authority
        run: git fetch origin editor/voice-compression-pass:refs/remotes/origin/editor/voice-compression-pass
      - name: Install manuscript source-sync dependency
        run: pip install python-docx
      - name: Apply approved Chapter 81-99 reader changes
        run: python scripts/dialogue_live_entrypoint.py --patch-ref origin/editor/voice-compression-pass --min-chapter 81 --max-chapter 99 --canonicalize-from 81
      - name: Promote Book I reader prose through Chapter 82
        run: python scripts/promote_book1_polish.py '81-82'
      - name: Promote Book II reader prose through Chapter 99
        run: python scripts/promote_book1_polish.py '83-99' --docx state/manuscript/Peg_Leg_Greg_Book2_Manuscript_Ch83-137.docx
      - name: Validate integration boundary
        run: |
          python -m unittest discover -s tests -v
          git diff --check
          bad="$(git diff --name-only | grep -Ev '^(chapters/[0-9]{3}\.html|state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map\.docx|state/manuscript/Peg_Leg_Greg_Book2_Manuscript_Ch83-137\.docx)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected files changed:"
            echo "$bad"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          for n in range(81, 100):
              text = Path(f'chapters/{n:03d}.html').read_text(encoding='utf-8')
              m = re.search(r'<article\s+class="prose"[^>]*>(.*?)</article>', text, re.S | re.I)
              if not m:
                  raise SystemExit(f'missing prose article in chapter {n}')
              if '—' in re.sub(r'<[^>]+>', '', m.group(1)):
                  raise SystemExit(f'em dash in chapter {n} prose')
          print('Dialogue integration validation passed for Chapters 81-99')
          PY
      - name: Commit published reader and canonical sources
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- chapters state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map.docx state/manuscript/Peg_Leg_Greg_Book2_Manuscript_Ch83-137.docx; then
            echo 'Dialogue attribution reader prose already published through Chapter 99.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chapters state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map.docx state/manuscript/Peg_Leg_Greg_Book2_Manuscript_Ch83-137.docx
          git commit -m 'editorial: publish dialogue attribution pass through chapter 99'
          git push
