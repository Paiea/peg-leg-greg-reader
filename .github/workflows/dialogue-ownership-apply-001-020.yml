name: Apply dialogue ownership 001-020

on:
  push:
    branches:
      - editor/voice-compression-pass
    paths:
      - .github/workflows/dialogue-ownership-apply-001-020.yml
      - scripts/apply_dialogue_ownership_semantic.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/voice-compression-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression examples
        run: python scripts/apply_dialogue_ownership_semantic.py --self-test
      - name: Snapshot original chapters
        run: |
          mkdir -p /tmp/dialogue-before
          cp chapters/{001..020}.html /tmp/dialogue-before/
      - name: Apply semantic ownership boundaries
        run: python scripts/apply_dialogue_ownership_semantic.py --start 1 --end 20
      - name: Verify prose preservation and HTML structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def article(text):
              return text.split('<article class="prose">',1)[1].split('</article>',1)[0]
          def without_paragraph_boundaries(text):
              return re.sub(r'</?p>', '', article(text))

          stale_old = ('"What?" Antonius asked.</p><p>"Nothing," I said.</p><p>"You keep looking at me," Antonius said.'</n                       ')</n
          for n in range(1, 21):
              name = f'{n:03d}.html'
              before = Path('/tmp/dialogue-before', name).read_text(encoding='utf-8')
              after = Path('chapters', name).read_text(encoding='utf-8')
              assert '<article class="prose">' in after and '</article>' in after, name
              assert '<p></p>' not in after, f'empty paragraph: {name}'
              b = without_paragraph_boundaries(before)
              a = without_paragraph_boundaries(after)
              if n == 3:
                  b = b.replace('"What?" Antonius asked."Nothing," I said."You keep looking at me," Antonius said."I have a memorable-face problem," I said."Your face?" Antonius asked."Other people\'s." Antonius held out his hand."You\'ve been staring at my hands for five minutes," Arlo said.',
                                '"What?" Arlo asked."Nothing," I said."You keep looking at me," Arlo said."I have a memorable-face problem," I said."Your face?" Arlo asked."Other people\'s."Arlo held out his hand."You\'ve been staring at my hands for five minutes," Arlo said.')
              assert a == b, f'prose text changed beyond approved attribution repair: {name}'
          print('verified prose preservation for chapters 001-020')
          PY
      - name: Refresh semantic review manifests
        run: |
          python scripts/dialogue_ownership_candidates.py
          python scripts/dialogue_ownership_semantic.py
      - name: Commit reader-visible ownership cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chapters/{001..020}.html state/editorial/dialogue-ownership/CANDIDATES_001_020.md state/editorial/dialogue-ownership/HIGH_CONFIDENCE_001_020.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Apply semantic dialogue ownership cleanup through chapter 20'
          git push
