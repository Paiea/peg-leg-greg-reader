name: Dialogue ownership candidates

on:
  push:
    branches:
      - editor/voice-compression-pass
    paths:
      - scripts/dialogue_ownership_candidates.py
      - scripts/dialogue_ownership_semantic.py
      - .github/workflows/dialogue-ownership-candidates.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/voice-compression-pass
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate review surfaces
        run: |
          python scripts/dialogue_ownership_candidates.py
          python scripts/dialogue_ownership_semantic.py
      - name: Commit candidate reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/editorial/dialogue-ownership/CANDIDATES_001_020.md state/editorial/dialogue-ownership/HIGH_CONFIDENCE_001_020.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate semantic dialogue ownership review surfaces'
          git push
