name: Dialogue ownership audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/voice-compression-pass
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Candidate audit only
        run: |
          echo 'Dialogue ownership is semantic. This workflow does not mutate prose.'
          echo 'Use the script/reporting surface only to surface candidates for manual ownership review.'
