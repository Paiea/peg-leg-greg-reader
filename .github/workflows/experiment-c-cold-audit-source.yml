name: Experiment C cold audit source
on:
  push:
    branches: [experiment/r2-temporal-c-hybrid]
    paths: ['.github/workflows/experiment-c-cold-audit-source.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: experiment/r2-temporal-c-hybrid
      - name: Assemble accepted 87-138 cold-read source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          mkdir -p r2/experiments/temporal-writing/c-hybrid/rehearsals
          out=r2/experiments/temporal-writing/c-hybrid/rehearsals/cold-source-087-138.md
          : > "$out"
          for n in $(seq 87 138); do
            printf '\n<!-- ACCEPTED CHAPTER %03d -->\n\n' "$n" >> "$out"
            git show "origin/main:r2/assets/written/ch$(printf '%03d' "$n").md" >> "$out"
            printf '\n' >> "$out"
          done
          git config user.name experiment-c-auditor
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/experiment-c-cold-audit-source.yml
          git add "$out"
          git commit -m 'Experiment C: assemble cold audit source 87-138'
          git push origin HEAD:experiment/r2-temporal-c-hybrid