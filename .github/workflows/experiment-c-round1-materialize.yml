name: Experiment C Round 01 materialize

on:
  push:
    branches:
      - experiment/r2-temporal-c-hybrid
    paths:
      - .github/workflows/experiment-c-round1-materialize.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: experiment/r2-temporal-c-hybrid
      - name: Extract reconciled 87-112
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin experiment/r2-temporal-c-hybrid-a:refs/remotes/origin/experiment/r2-temporal-c-hybrid-a
          git fetch origin experiment/r2-temporal-c-hybrid-b:refs/remotes/origin/experiment/r2-temporal-c-hybrid-b
          python - <<'PY'
          import re, subprocess
          from pathlib import Path

          out = Path('r2/experiments/temporal-writing/c-hybrid/reconciled')
          out.mkdir(parents=True, exist_ok=True)

          def get(ref, path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True)

          def chapters(text):
              matches = list(re.finditer(r'(?m)^# Chapter (\d+): .+$', text))
              result = {}
              for i, m in enumerate(matches):
                  start = m.start()
                  end = matches[i+1].start() if i+1 < len(matches) else len(text)
                  result[int(m.group(1))] = text[start:end].rstrip() + '\n'
              return result

          a = chapters(get('origin/experiment/r2-temporal-c-hybrid-a','r2/experiments/temporal-writing/c-hybrid/a/first-pass.md'))
          b = chapters(get('origin/experiment/r2-temporal-c-hybrid-b','r2/experiments/temporal-writing/c-hybrid/b/first-pass.md'))

          for n in range(87,101):
              text = a[n]
              if n == 89:
                  text = text.replace('Not pending dramatic revelation.\n\n', '')
              (out / f'ch{n:03d}.md').write_text(text, encoding='utf-8')

          for n in range(101,113):
              text = b[n]
              if n == 105:
                  text = text.replace('Infrastructure progress did not require narrative closure.\n', 'The survey had ended. The road had not.\n')
              (out / f'ch{n:03d}.md').write_text(text, encoding='utf-8')
          PY

          git config user.name "experiment-c-materializer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/experiment-c-round1-materialize.yml
          git add r2/experiments/temporal-writing/c-hybrid/reconciled
          git commit -m "Experiment C: materialize Round 01 Chapters 87-112"
          git push origin HEAD:experiment/r2-temporal-c-hybrid
