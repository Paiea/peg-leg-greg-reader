name: Experiment C Round 03 materialize

on:
  push:
    branches:
      - experiment/r2-temporal-c-hybrid
    paths:
      - .github/workflows/experiment-c-round3-materialize.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract reconciled 139-164
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin experiment/r2-temporal-c-hybrid-r3-a experiment/r2-temporal-c-hybrid-r3-b
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          def show(ref, path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True)

          def chapters(text):
              pat = re.compile(r'(?ms)^# Chapter (\d+): ([^\n]+)\n\n(.*?)(?=\n---\n|\Z)')
              out = {}
              for m in pat.finditer(text):
                  n = int(m.group(1))
                  out[n] = f'# Chapter {n}: {m.group(2)}\n\n{m.group(3).strip()}\n'
              return out

          a = chapters(show('origin/experiment/r2-temporal-c-hybrid-r3-a', 'r2/experiments/temporal-writing/c-hybrid/round-03/a/first-pass.md'))
          b = chapters(show('origin/experiment/r2-temporal-c-hybrid-r3-b', 'r2/experiments/temporal-writing/c-hybrid/round-03/b/first-pass.md'))

          selected = {}
          for n in range(139, 153): selected[n] = a[n]
          for n in range(153, 161): selected[n] = b[n]
          for n in range(162, 165): selected[n] = b[n]

          selected[161] = '''# Chapter 161: The Road Offer

Jorren's readiness note became money before it became rank.

The north-west road office offered him eight weeks as a seasonal field coordinator.

Not Guild Silver.

Not a substitute for Silver authority where a Guild contract required it.

City work.

Road crews.

Daily tasking, material counts, culvert sequencing, and the privilege of being blamed when three carts arrived before the gravel did.

"Pay?" I asked.

He told me.

Better than ordinary Bronze road work.

"They can do that?"

"Apparently they just did."

The offer letter was very specific about what he could sign and what still needed a city engineer or Guild Silver.

Somebody had learned from lawyers.

Jorren tapped the folded Silver application still living in his field book.

"If I take this, does it help later?"

"Probably."

"Useful certainty."

"You asked the man whose first Silver closeout has a crate dispute attached."

"Fair."

He took the road job.

The application stayed unsigned.

Three days later he left Carrow with a city tool wagon, two road laborers, and a clerk who had already corrected his spelling twice.

Before climbing aboard he pointed at my cord.

"Try not to become important."

"You first."

The clerk shouted that they were late.

Jorren climbed onto the wagon and became somebody else's scheduling problem...
'''

          outdir = Path('r2/experiments/temporal-writing/c-hybrid/round-03/reconciled')
          outdir.mkdir(parents=True, exist_ok=True)
          for n in range(139, 165):
              (outdir / f'ch{n:03d}.md').write_text(selected[n], encoding='utf-8')

          # Verify exact contiguous range and no experiment prelude leaks.
          files = sorted(outdir.glob('ch*.md'))
          nums = [int(p.stem[2:]) for p in files]
          assert nums == list(range(139,165)), nums
          for p in files:
              t = p.read_text(encoding='utf-8')
              assert t.startswith(f'# Chapter {int(p.stem[2:])}: ')
              assert 'Status: **EXPERIMENTAL' not in t
          print('Round 03 reconciled chapters 139-164: OK')
          PY
          git config user.name "experiment-c-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add r2/experiments/temporal-writing/c-hybrid/round-03/reconciled
          git rm .github/workflows/experiment-c-round3-materialize.yml
          git commit -m "Materialize Experiment C Round 03 Chapters 139-164"
          git push origin HEAD:experiment/r2-temporal-c-hybrid
