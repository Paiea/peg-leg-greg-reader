name: Experiment C Round 03 materialize

on:
  push:
    branches:
      - experiment/r2-temporal-c-hybrid
    paths:
      - .github/workflows/experiment-c-round3-materialize.yml
      - r2/experiments/temporal-writing/c-hybrid/tools/round3_materialize.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch hard windows
        run: git fetch origin experiment/r2-temporal-c-hybrid-r3-a experiment/r2-temporal-c-hybrid-r3-b
      - name: Extract reconciled 139-164
        run: python r2/experiments/temporal-writing/c-hybrid/tools/round3_materialize.py
      - name: Commit reconciled run
        run: |
          git config user.name "experiment-c-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add r2/experiments/temporal-writing/c-hybrid/round-03/reconciled
          git rm .github/workflows/experiment-c-round3-materialize.yml
          git rm r2/experiments/temporal-writing/c-hybrid/tools/round3_materialize.py
          git commit -m "Materialize Experiment C Round 03 Chapters 139-164"
          git push origin HEAD:experiment/r2-temporal-c-hybrid
