name: Experiment C Round 04 materialize

on:
  push:
    branches:
      - experiment/r2-temporal-c-hybrid

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch hard windows
        run: git fetch origin experiment/r2-temporal-c-hybrid-r4-a experiment/r2-temporal-c-hybrid-r4-b
      - name: Materialize reconciled run
        run: python r2/experiments/temporal-writing/c-hybrid/round-04/materialize.py
      - name: Commit reconciled run
        run: |
          git config user.name "experiment-c-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add r2/experiments/temporal-writing/c-hybrid/round-04/reconciled
          git rm .github/workflows/experiment-c-round4-materialize.yml
          git rm r2/experiments/temporal-writing/c-hybrid/round-04/materialize.py
          git commit -m "Materialize Experiment C Round 04 Chapters 165-190"
          git push origin HEAD:experiment/r2-temporal-c-hybrid
