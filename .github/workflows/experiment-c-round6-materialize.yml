name: Experiment C Round 06 materialize

on:
  push:
    branches:
      - experiment/r2-temporal-c-hybrid
    paths:
      - .github/workflows/experiment-c-round6-materialize.yml
      - .github/scripts/experiment_c_round6_materialize.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch hard windows
        run: git fetch origin experiment/r2-temporal-c-hybrid-r6-a experiment/r2-temporal-c-hybrid-r6-b
      - name: Materialize reconciled run
        run: python .github/scripts/experiment_c_round6_materialize.py
      - name: Commit reconciled run
        run: |
          git config user.name "experiment-c-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add r2/experiments/temporal-writing/c-hybrid/round-06/reconciled
          git rm .github/workflows/experiment-c-round6-materialize.yml
          git rm .github/scripts/experiment_c_round6_materialize.py
          git commit -m "Materialize Experiment C Round 06 Chapters 206-226"
          git push origin HEAD:experiment/r2-temporal-c-hybrid
