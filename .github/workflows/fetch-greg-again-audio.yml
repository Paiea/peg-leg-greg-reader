name: Fetch Greg Again audio asset

on:
  push:
    branches:
      - fix/greg-again-audio-playback
    paths:
      - .github/workflows/fetch-greg-again-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/greg-again-audio-playback
      - name: Resolve generated full chapter media
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p greg-again/audio/assets
          PAGE='https://www.aidocmaker.com/g0/audio?name=ef4bd152f363417387db64ed87c15305'
          curl --fail --location --show-error "$PAGE" --output /tmp/page.html
          python - <<'PY'
          from pathlib import Path
          import html, re, subprocess
          page = html.unescape(Path('/tmp/page.html').read_text(errors='replace'))
          needles = ['ef4bd152f363417387db64ed87c15305', 'storage.googleapis.com', '.mp3', 'audio_url', 'audioUrl', 'downloadUrl']
          for needle in needles:
              print('\nNEEDLE', needle)
              pos = page.find(needle)
              print('POSITION', pos)
              if pos >= 0:
                  print(page[max(0,pos-600):pos+1800])
          urls = []
          for m in re.finditer(r'https?://[^"\'<>\\ ]+', page):
              u = m.group(0).replace('\\u0026','&').replace('\\/','/')
              if any(x in u.lower() for x in ['mp3','audio','storage.googleapis.com','googleusercontent']):
                  urls.append(u)
          print('\nCANDIDATE_URLS')
          for u in dict.fromkeys(urls):
              print(u)
          # If the page exposes a direct mp3/storage URL, download the first plausible one.
          direct = next((u for u in dict.fromkeys(urls) if '.mp3' in u.lower() or 'storage.googleapis.com' in u.lower()), None)
          if not direct:
              raise SystemExit(3)
          subprocess.run(['curl','--fail','--location','--show-error',direct,'--output','/tmp/chapter-001.mp3'], check=True)
          head = Path('/tmp/chapter-001.mp3').read_bytes()[:16]
          print('MEDIA_HEAD', repr(head))
          target = Path('greg-again/audio/assets/chapter-001.mp3')
          target.write_bytes(Path('/tmp/chapter-001.mp3').read_bytes())
          print('AUDIO_OK', target, target.stat().st_size)
          PY
      - name: Commit audio asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chapter-001.mp3
          git diff --cached --quiet && exit 0
          git commit -m 'fix: host full Greg Again Chapter 1 audio'
          git push origin HEAD:fix/greg-again-audio-playback
