name: One-shot clean Chapter 232 state
on:
  push:
    paths:
      - '.github/workflows/fix-ch232-state-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale Chapter 232 trailhead residue
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('state/MANUSCRIPT_STATE.md')
          t=p.read_text()
          stale='Primary recommendation: **LET THE FULL CH231 THEATRE / PERFORMANCE DAY BREATHE. MOVE ONLY THE ENGINE THAT HAS REAL DAILY PRESSURE.**'
          assert stale in t
          a=t.index(stale)
          b=t.index('## Chat / handoff behavior',a)
          t=t[:a]+t[b:]
          assert stale not in t
          assert t.count('## Immediate next edge — Chapter 233') == 1
          assert 'Current story endpoint: Chapter 232 — **THE COUNTERSIGN**.' in t
          p.write_text(t)
          PY
          rm -f .github/workflows/fix-ch232-state-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Remove stale Chapter 232 trailhead residue'
          git pull --rebase origin main
          git push origin HEAD:main
