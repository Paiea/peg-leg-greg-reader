name: Fix Chapter 245 Wrong Office

on:
  push:
    branches:
      - manuscript/ch245-name-taker-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify wording fix
        run: python .github/scripts/fix_ch245_wrong_office.py

      - name: Remove temporary machinery
        run: |
          rm .github/scripts/fix_ch245_wrong_office.py
          rm .github/workflows/fix-ch245-wrong-office.yml

      - name: Verify net diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/fix_ch245_wrong_office.py \
            .github/workflows/fix-ch245-wrong-office.yml \
            state/manuscript/Peg_Leg_Greg_Running_Manuscript.md | sort)"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish Chapter 245 wording"
          actual_net="$(git diff --name-only d845fe44ba1cd89d00e8e4f7548662d09187b6a0..HEAD | sort)"
          test "$actual_net" = "state/manuscript/Peg_Leg_Greg_Running_Manuscript.md"
          echo VERIFIED_NET_DIFF_PATHS=1
          git push origin HEAD:manuscript/ch245-name-taker-fix
