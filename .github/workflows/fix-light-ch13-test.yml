name: Fix Light Chapter 13 test frontier
on:
  push:
    branches:
      - audio/light-greg-again-ch013-auto
    paths:
      - .github/workflows/fix-light-ch13-test.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/light-greg-again-ch013-auto
      - name: Align tests with Light Chapter 13 publication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_greg_again_audio_catalog.py')
          s = p.read_text()
          s = s.replace('audio_score_light_numbers = set(range(1, 13))', 'audio_score_light_numbers = set(range(1, 14))')
          s = s.replace('for number in range(1, 13):\n            self.assertEqual("audio-score-light", by_id[f"ga-{number:03d}"]["audio_finish"])', 'for number in range(1, 14):\n            self.assertEqual("audio-score-light", by_id[f"ga-{number:03d}"]["audio_finish"])')
          s = s.replace('for number in range(1, 13):\n            chapter_id = f"ga-{number:03d}"\n            expected_src = f"assets/light/chapter-{number:03d}.mp3"', 'for number in range(1, 14):\n            chapter_id = f"ga-{number:03d}"\n            expected_src = f"assets/light/chapter-{number:03d}.mp3"')
          s = s.replace('self.assertEqual("processing-space", by_id["ga-013"]["audio_finish"])\n        self.assertEqual(13, by_id["ga-013"]["take_count"])\n        self.assertEqual(621.456, by_id["ga-013"]["duration_seconds"])\n        self.assertEqual("assets/chapter-013.mp3", by_id["ga-013"]["audio_src"])\n        audio = AUDIO_ROOT / "assets" / "chapter-013.mp3"\n        self.assertTrue(audio.exists())\n        self.assertGreater(audio.stat().st_size, 9_000_000)', 'self.assertEqual("audio-score-light", by_id["ga-013"]["audio_finish"])\n        self.assertEqual(25, by_id["ga-013"]["take_count"])\n        self.assertEqual(656.184, by_id["ga-013"]["duration_seconds"])\n        self.assertEqual("assets/light/chapter-013.mp3", by_id["ga-013"]["audio_src"])\n        audio = AUDIO_ROOT / "assets" / "light" / "chapter-013.mp3"\n        self.assertTrue(audio.exists())\n        self.assertGreater(audio.stat().st_size, 1_000_000)\n        legacy_audio = AUDIO_ROOT / "assets" / "chapter-013.mp3"\n        self.assertTrue(legacy_audio.exists())\n        self.assertGreater(legacy_audio.stat().st_size, 9_000_000)')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_greg_again_audio_catalog.py
          git commit -m 'Align Chapter 013 tests with Audio Score Light' || exit 0
          git push origin HEAD:audio/light-greg-again-ch013-auto
