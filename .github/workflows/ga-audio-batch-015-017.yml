name: Greg Again Audio Batch 015-017

on:
  push:
    branches:
      - audio/greg-again-batch-015-017
    paths:
      - .github/workflows/ga-audio-batch-015-017.yml

permissions:
  contents: read

jobs:
  inspect-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace provider audio resolver
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.aidocmaker.com'
          curl -fsSL "$base/g0/audio?name=a9b6ca920b60470db8a87f206533cee3" -o /tmp/player.html
          python - <<'PY' > /tmp/scripts.txt
          import re
          s=open('/tmp/player.html',encoding='utf-8',errors='replace').read()
          for src in re.findall(r'<script[^>]+src="([^"]+)"', s):
              print(src)
          PY
          : > /tmp/alljs
          while read -r src; do
            case "$src" in
              http*) url="$src" ;;
              *) url="$base$src" ;;
            esac
            curl -fsSL "$url" >> /tmp/alljs || true
            printf '\n' >> /tmp/alljs
          done < /tmp/scripts.txt
          python - <<'PY'
          import re
          s=open('/tmp/alljs',encoding='utf-8',errors='replace').read()
          print('js-bytes',len(s))
          pats=[r'.{0,180}mcp-preview.{0,240}',r'.{0,180}g0/audio.{0,240}',r'.{0,180}audio-playback.{0,240}',r'.{0,180}(?:status|poll|context_id|contextId).{0,240}']
          seen=set()
          for pat in pats:
              for m in re.finditer(pat,s,re.I|re.S):
                  x=' '.join(m.group(0).split())
                  if x not in seen:
                      seen.add(x); print(x[:1000])
          PY
