name: Greg Again Audio Batch 015-017

on:
  push:
    branches:
      - audio/greg-again-batch-015-017
    paths:
      - .github/workflows/ga-audio-batch-015-017.yml

permissions:
  contents: read

jobs:
  inspect-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect provider player markup
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://www.aidocmaker.com/g0/audio?name=a9b6ca920b60470db8a87f206533cee3' -o /tmp/player.html
          python - <<'PY'
          import re
          s=open('/tmp/player.html',encoding='utf-8',errors='replace').read()
          print('bytes', len(s))
          for m in sorted(set(re.findall(r'https?://[^"\'<> ]+', s))):
              if any(k in m.lower() for k in ('audio','mp3','wav','download','storage','blob')):
                  print(m[:1000])
          print('--- relevant markup ---')
          for line in s.splitlines():
              if any(k in line.lower() for k in ('audio','mp3','wav','download','source src')):
                  print(line[:2000])
          PY
