name: Greg Again Audio Batch 015-017

on:
  push:
    branches:
      - audio/greg-again-batch-015-017
    paths:
      - .github/workflows/ga-audio-batch-015-017.yml

permissions:
  contents: read

jobs:
  inspect-player:
    runs-on: ubuntu-latest
    steps:
      - name: Extract provider request wrapper
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.aidocmaker.com'
          curl -fsSL "$base/g0/audio?name=a9b6ca920b60470db8a87f206533cee3" -o /tmp/player.html
          python - <<'PY' > /tmp/scripts.txt
          import re
          s=open('/tmp/player.html',encoding='utf-8',errors='replace').read()
          for src in re.findall(r'<script[^>]+src="([^"]+)"', s): print(src)
          PY
          : > /tmp/alljs
          while read -r src; do
            case "$src" in http*) url="$src" ;; *) url="$base$src" ;; esac
            curl -fsSL "$url" >> /tmp/alljs || true
            printf '\n' >> /tmp/alljs
          done < /tmp/scripts.txt
          python - <<'PY'
          s=open('/tmp/alljs',encoding='utf-8',errors='replace').read()
          needles=['63273,e=>','user_fetch_document','adm-agent-helper','modal-api','modalApi','modal.com']
          for needle in needles:
              print('\n===== '+needle+' =====')
              pos=0; count=0
              while True:
                  pos=s.find(needle,pos)
                  if pos<0 or count>=8: break
                  print(s[max(0,pos-2500):pos+7000])
                  pos += len(needle); count += 1
          PY
