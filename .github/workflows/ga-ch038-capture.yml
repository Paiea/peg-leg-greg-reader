name: Capture Greg Again Chapter 38

on:
  push:
    branches:
      - audio/greg-again-ch038-auto

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch038-auto
          fetch-depth: 0

      - name: Install audio tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Capture provider previews, verify, and assemble
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess

          urls = [
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/89eeee95-897b-401c-a208-73aaecbfbad9.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/9369c142-a315-4ac9-809c-c2fd7fb32e87.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/cf9c6b94-ec87-4aeb-b345-4d96b473b744.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/0a617b12-f62e-4db1-a7e1-9e0fa7e486a6.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/e42cd838-1750-4911-95aa-f4a3a9309d1f.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/fb8fd834-164a-4835-9511-bef5dabdfda8.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/67f0c642-9353-4e11-8f2a-9ab63d06a351.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/743540f9-75d8-4c09-913c-3e7fb18d3c0a.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/4956f92e-46d6-4945-af40-2d5edba25605.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/24d6a17a-9601-463a-9d96-378f6c2a6c05.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/1488005c-a339-49e1-bed9-0ae23e483f5f.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/3888cc7e-e1fc-454f-abe6-c41fcc1beae5.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/70a58530-c145-46a0-b5b2-29a7d9d67d1a.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/915b2d3f-f8b2-4010-b27d-7eda78a176d1.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/26a49d4c-980d-49c2-bcc7-5632e983629e.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/cdf17444-5416-4afa-929e-bfa132f1f0d3.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/d9706d29-9254-453e-98a6-c0d5bb8823ee.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/5fd731b5-3608-4b9f-a9a2-8158d74dd39b.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b062281d-be46-4d1b-a12c-e88c97a4c839.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/77c6243b-d00e-4ba1-be8a-30d2c76ec297.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/a5fbad7f-af0a-4d3a-a8a7-11b4bd09e71b.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/d4d79221-9060-4a21-b358-4466890fd07a.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/73fd35b0-de1e-4951-bea2-0ed7c952d87c.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/25e71bd4-58bb-4362-9dd2-8193e14d8886.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/56abd1ac-b279-4a0d-8c04-8e3945f21ef7.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/e7a94d15-80ab-4d93-b8a1-0a2561568c30.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/a9a19c0a-100e-4269-8c9e-1d6f2d005195.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/996491f1-6fb6-4add-9e03-2be213201dfd.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/7402eec8-c4ad-4c3d-96b9-359d8ed18655.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b98fdb0c-5314-450c-afe5-0f6933df450f.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/02ec95e9-0829-48bb-a75c-c0356cb6b4f8.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/0a429e6c-a050-4bc9-bb81-59249d477e81.mp3",
            "https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/1c810088-ee25-4157-b9be-7f1260d0b582.mp3"
          ]
          contexts = [
            "dc0985a0ab0048ec92614a08e27b9932",
            "edbe503d01da4bb3a4c50a420807038a",
            "dd3b5e0b3ab9413c8f215d4bb74f2a32",
            "a5b8cbff26af4a74aa5fcdb1acf2bd5c",
            "5c9c7b4bb1004c918e5d778b00a8da61",
            "6c1640d933064e25ba75af702f6e3ff1",
            "3d4183015ffa42ebb51cebfa589fe317",
            "3a3b018481244d9fbcbfe8a4c1d7f313",
            "6b024134b4ef443f881675136ac1691f",
            "b7382787098f4b0da4de9dc2cbf9b35a",
            "c27e4d88e5d94787b9e97f910328e79e",
            "6a8bceb88d734eca9232664528ae7403",
            "1d16c1a38b404eb582db69bcc5a378f3",
            "c21d05e06b1c4cb693e5df35856de105",
            "1fab11d41f5044048f274020be9e9881",
            "3baf5e436712498ca90eb448b453afa0",
            "96f8828652684212958e5e487dceab2a",
            "c82c35d6958048179ec12f51a936223d",
            "ea7f1082146d43f68edc377c076f1dfc",
            "9d71db412e284861a0a481855d813d0e",
            "8f56aee6affb4348b7a35e55a96a9f6a",
            "4e1689639643459793783888ceb8b507",
            "31576a22ea7443d9abc6fa7b2123f4a2",
            "3470a7cd1ebd43939b784a25d955e6bd",
            "b85c73f769c143ccaf912f32424e2d00",
            "20f57f069ec64c0599585c6691d2cf4f",
            "c0a87c3bc9e74f0f8ca26b36e8844dae",
            "a6155e3a095d4a2f897e62821368484d",
            "d8b9e15d146a4ef5844c5bd1c969f992",
            "efb5996e5b0345da8b5cd9aa7362f5eb",
            "69e26cb02f7b4392a9a5fae1beef8a28",
            "9609bb60ea1040aaadb463ecdc18ca8d",
            "b386608be0d148e5bc74c8a2778fd573"
          ]
          assert len(urls) == len(contexts) == 33

          root = pathlib.Path.cwd()
          chunks_dir = root / "greg-again/audio/assets/chunks/038"
          chunks_dir.mkdir(parents=True, exist_ok=True)
          prod = root / "greg-again/audio/production/038"
          takes_path = prod / "takes.json"
          take_map = json.loads(takes_path.read_text())
          assert len(take_map["takes"]) == 33

          def run(*args):
              return subprocess.run(args, check=True, text=True, capture_output=True).stdout.strip()

          for idx, (url, context_id) in enumerate(zip(urls, contexts), start=1):
              out = chunks_dir / f"{idx:02d}.mp3"
              subprocess.run(["curl", "-fL", "--retry", "3", "--retry-delay", "2", url, "-o", str(out)], check=True)
              duration = float(run("ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=nw=1:nk=1", str(out)))
              if duration <= 0:
                  raise SystemExit(f"take {idx} has invalid duration")
              data = out.read_bytes()
              item = take_map["takes"][idx - 1]
              item.update({
                  "context_id": context_id,
                  "preview_url": url,
                  "status": "verified",
                  "durable_path": str(out.relative_to(root)),
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "duration_seconds": round(duration, 3),
              })

          chapter_text = (root / "r2/assets/written/ch038.md").read_text()
          source_body = chapter_text.split("\n---\n", 1)[1].strip()
          reconstructed = "\n\n".join(t["transcript"] for t in take_map["takes"]).strip()
          if reconstructed != source_body:
              raise SystemExit("exact spoken-source coverage mismatch")

          concat_list = pathlib.Path("/tmp/ga038-concat.txt")
          concat_list.write_text("".join(f"file '{(chunks_dir / f'{i:02d}.mp3').as_posix()}'\n" for i in range(1, 34)))
          body_path = pathlib.Path("/tmp/ga038-body.mp3")
          subprocess.run(["ffmpeg", "-y", "-v", "error", "-f", "concat", "-safe", "0", "-i", str(concat_list), "-c:a", "libmp3lame", "-b:a", "128k", str(body_path)], check=True)

          sample_rate = run("ffprobe", "-v", "error", "-select_streams", "a:0", "-show_entries", "stream=sample_rate", "-of", "default=nw=1:nk=1", str(body_path))
          channel_layout = run("ffprobe", "-v", "error", "-select_streams", "a:0", "-show_entries", "stream=channel_layout", "-of", "default=nw=1:nk=1", str(body_path)) or "mono"
          silence_path = pathlib.Path("/tmp/ga038-silence.mp3")
          subprocess.run(["ffmpeg", "-y", "-v", "error", "-f", "lavfi", "-i", f"anullsrc=r={sample_rate}:cl={channel_layout}", "-t", "2.0", "-c:a", "libmp3lame", "-b:a", "128k", str(silence_path)], check=True)

          final_list = pathlib.Path("/tmp/ga038-final-list.txt")
          final_list.write_text(f"file '{body_path.as_posix()}'\nfile '{silence_path.as_posix()}'\n")
          final_path = root / "greg-again/audio/assets/chapter-038.mp3"
          subprocess.run(["ffmpeg", "-y", "-v", "error", "-f", "concat", "-safe", "0", "-i", str(final_list), "-c", "copy", str(final_path)], check=True)

          final_duration = float(run("ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=nw=1:nk=1", str(final_path)))
          body_duration = float(run("ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=nw=1:nk=1", str(body_path)))
          tail = final_duration - body_duration
          if not (1.5 <= tail <= 2.5):
              raise SystemExit(f"listener tail outside tolerance: {tail:.3f}s")

          final_data = final_path.read_bytes()
          take_map["assembled_audio"] = {
              "path": str(final_path.relative_to(root)),
              "bytes": len(final_data),
              "sha256": hashlib.sha256(final_data).hexdigest(),
              "duration_seconds": round(final_duration, 3),
              "listener_tail_seconds": round(tail, 3)
          }
          takes_path.write_text(json.dumps(take_map, ensure_ascii=False, indent=2) + "\n")

          verification = [
              "Greg, Again Chapter 38 audio verification",
              "chapter_id: ga-038",
              "title: Two Keys",
              "voice: deep",
              "take_count: 33",
              "source: r2/assets/written/ch038.md",
              "source_blob: e81e4ea9a0e9e60b5183e175c246835801678c27",
              "exact_spoken_source_coverage: PASS",
              "all_take_ffprobe_playability: PASS",
              "take_order: 01..33 PASS",
              "final_ellipsis_in_locked_take_33: PASS",
              f"listener_tail_seconds: {tail:.3f} PASS",
              f"duration_seconds: {final_duration:.3f}",
              f"final_sha256: {hashlib.sha256(final_data).hexdigest()}",
          ]
          (prod / "verification.txt").write_text("\n".join(verification) + "\n")
          PY

      - name: Commit durable Chapter 38 artifacts and remove capture workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ga-ch038-capture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A greg-again/audio/assets/chunks/038 greg-again/audio/assets/chapter-038.mp3 greg-again/audio/production/038 .github/workflows/ga-ch038-capture.yml
          git commit -m "audio: capture and assemble Chapter 38"
          git push origin HEAD:audio/greg-again-ch038-auto
