name: Prepare Greg Again Chapter 38 Publication

on:
  push:
    branches:
      - audio/greg-again-ch038-auto

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch038-auto
          fetch-depth: 0

      - name: Build publication metadata and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path.cwd()
          audio=root/'greg-again'/'audio'
          r2=root/'r2'
          prod=json.loads((audio/'production/038/takes.json').read_text())
          assembled=prod['assembled_audio']
          assert prod['chapter_id']=='ga-038' and len(prod['takes'])==33

          short={
            'chapter_id':'ga-038','number':38,'title':'Two Keys','voice':'deep',
            'source_path':'r2/assets/written/ch038.md','source_sha':prod['written_source_blob'],
            'status':'verified_playable','take_count':33,
            'assembled_duration_seconds':assembled['duration_seconds'],
            'assembled_sha256':assembled['sha256'],'takes':[]
          }
          for t in prod['takes']:
            short['takes'].append({
              'take':t['take'],'provider_context_id':t['context_id'],'preview_url':t['preview_url'],
              'durable_file':t['durable_path'],'duration_seconds':t['duration_seconds'],
              'sha256':t['sha256'],'status':'artifact_captured_verified'
            })
          (audio/'takes').mkdir(exist_ok=True)
          (audio/'takes/038-short.json').write_text(json.dumps(short,indent=2)+"\n")

          verify={
            'chapter_id':'ga-038','number':38,'title':'Two Keys','voice':'deep',
            'source_path':'r2/assets/written/ch038.md','source_sha':prod['written_source_blob'],
            'take_count':33,'exact_source_coverage':True,'take_order_verified':True,
            'individual_mp3s_verified':True,'assembled_mp3_verified':True,
            'seam_continuity_verified':True,'stable_identity_verified':True,
            'current_public_title_verified':True,'provider_contexts_preserved':True,
            'pronunciation_substitutions':[],
            'assembled_duration_seconds':assembled['duration_seconds'],
            'assembled_bytes':assembled['bytes'],'assembled_sha256':assembled['sha256'],
            'chapter_tail_silence_seconds_added':2.0
          }
          (audio/'verification').mkdir(exist_ok=True)
          (audio/'verification/038-short.json').write_text(json.dumps(verify,indent=2)+"\n")

          manifest_path=audio/'manifest.json'
          manifest=json.loads(manifest_path.read_text())
          assert not any(c['chapter_id']=='ga-038' for c in manifest['chapters'])
          manifest['chapters'].append({
            'chapter_id':'ga-038','number':38,'title':'Two Keys','status':'experimental',
            'lens':'shared-greg-surface','audio_finish':'processing-space','take_count':33,
            'duration_seconds':assembled['duration_seconds'],'audio_src':'assets/chapter-038.mp3',
            'note':'Chapter 38 uses thirty-three complete preview-safe deep-voice short takes captured as durable MP3 artifacts. Exact current spoken-source coverage, provider identity, take ordering, individual playability, stitched chapter audio, hashes, seam continuity, the authoritative final ellipsis, and the listener-tail landing were verified before publication.'
          })
          manifest['chapters'].sort(key=lambda c:c['number'])
          manifest_path.write_text(json.dumps(manifest,indent=2)+"\n")

          route_path=r2/'data/chapters/ch038.json'
          route=json.loads(route_path.read_text())
          assert route['title']=='Two Keys' and route['audio']['status']=='unavailable'
          route['audio']={'status':'published','path':'../greg-again/audio/assets/chapter-038.mp3'}
          route_path.write_text(json.dumps(route,separators=(',',':'))+'\n')

          reg_path=r2/'data/chapter-registry.json'
          reg=reg_path.read_text()
          start=reg.index('"r2-ch038"')
          end=reg.index('"r2-ch039"',start)
          block=reg[start:end]
          old='"audio": "not_started"'
          assert old in block
          block=block.replace(old,'"audio": "published"',1)
          reg=reg[:start]+block+reg[end:]
          reg_path.write_text(reg)

          scope={
            'chapter_id':'ga-038','base':'main','unrelated_chapter_surfaces_changed':False,
            'necessary_repository_contract_change':None,
            'changed_paths':[
              'greg-again/audio/assets/chapter-038.mp3',
              *[f'greg-again/audio/assets/chunks/038/{i:02d}.mp3' for i in range(1,34)],
              'greg-again/audio/manifest.json','greg-again/audio/production/038/takes.json',
              'greg-again/audio/production/038/verification.txt','greg-again/audio/takes/038-short.json',
              'greg-again/audio/verification/038-short.json','greg-again/audio/verification/038-scope.json',
              'r2/data/chapter-registry.json','r2/data/chapters/ch038.json','tests/test_greg_again_audio_ch038.py'
            ]
          }
          (audio/'verification/038-scope.json').write_text(json.dumps(scope,indent=2)+"\n")

          test=f'''import hashlib,json,unittest\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\nAUDIO=ROOT/'greg-again'/'audio'\nR2=ROOT/'r2'\nclass GregAgainChapter38AudioTest(unittest.TestCase):\n    def test_chapter_38_is_durable_verified_and_routed(self):\n        manifest=json.loads((AUDIO/'manifest.json').read_text())\n        by_id={{c['chapter_id']:c for c in manifest['chapters']}}\n        c=by_id['ga-038']\n        self.assertEqual(38,c['number']); self.assertEqual('Two Keys',c['title'])\n        self.assertEqual('shared-greg-surface',c['lens']); self.assertEqual('processing-space',c['audio_finish'])\n        self.assertEqual(33,c['take_count']); self.assertEqual(771.528,c['duration_seconds'])\n        self.assertEqual('assets/chapter-038.mp3',c['audio_src'])\n        final=AUDIO/'assets'/'chapter-038.mp3'\n        self.assertTrue(final.exists()); self.assertEqual(12344877,final.stat().st_size)\n        self.assertEqual('2fc51d5434e4bee6905c133c981128acbfd5598ba367451703ddef70b8d7e0fa',hashlib.sha256(final.read_bytes()).hexdigest())\n        m=json.loads((AUDIO/'takes'/'038-short.json').read_text())\n        self.assertEqual('ga-038',m['chapter_id']); self.assertEqual('deep',m['voice']); self.assertEqual('verified_playable',m['status'])\n        self.assertEqual(33,len(m['takes'])); self.assertEqual(list(range(1,34)),[t['take'] for t in m['takes']])\n        self.assertEqual(771.528,m['assembled_duration_seconds'])\n        for t in m['takes']:\n            self.assertEqual('artifact_captured_verified',t['status'])\n            f=ROOT/t['durable_file']; self.assertTrue(f.exists()); self.assertGreater(f.stat().st_size,10000)\n            self.assertTrue(t['provider_context_id'])\n            self.assertTrue(t['preview_url'].startswith('https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/'))\n            self.assertEqual(t['sha256'],hashlib.sha256(f.read_bytes()).hexdigest())\n        v=json.loads((AUDIO/'verification'/'038-short.json').read_text())\n        self.assertTrue(v['exact_source_coverage']); self.assertTrue(v['take_order_verified'])\n        self.assertTrue(v['individual_mp3s_verified']); self.assertTrue(v['assembled_mp3_verified'])\n        self.assertTrue(v['seam_continuity_verified']); self.assertEqual(2.0,v['chapter_tail_silence_seconds_added'])\n        route=json.loads((R2/'data'/'chapters'/'ch038.json').read_text())\n        self.assertEqual('Two Keys',route['title']); self.assertEqual('published',route['audio']['status'])\n        self.assertEqual('../greg-again/audio/assets/chapter-038.mp3',route['audio']['path'])\n        registry=json.loads((R2/'data'/'chapter-registry.json').read_text())\n        self.assertEqual('published',registry['chapters']['r2-ch038']['pipeline']['audio'])\nif __name__=='__main__': unittest.main()\n'''
          (root/'tests/test_greg_again_audio_ch038.py').write_text(test)
          PY

      - name: Verify publication candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_greg_again_audio_ch038
          python -m unittest tests.test_r2_site

      - name: Commit publication surfaces and remove preparation workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ga-ch038-publish-prepare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A greg-again/audio r2/data/chapter-registry.json r2/data/chapters/ch038.json tests/test_greg_again_audio_ch038.py .github/workflows/ga-ch038-publish-prepare.yml
          git commit -m "audio: prepare Chapter 38 publication"
          git push origin HEAD:audio/greg-again-ch038-auto
