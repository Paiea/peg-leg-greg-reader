name: Reconcile Greg Again Chapter 38 With Main

on:
  push:
    branches:
      - audio/greg-again-ch038-auto

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch038-auto
          fetch-depth: 0

      - name: Merge newest main preserving Chapter 38 publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            conflicted="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            echo "$conflicted"
            allowed=$'greg-again/audio/manifest.json\nr2/data/chapter-registry.json'
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                greg-again/audio/manifest.json|r2/data/chapter-registry.json) ;;
                *) echo "Unexpected conflict: $path"; exit 1 ;;
              esac
            done <<< "$conflicted"
            git checkout --theirs greg-again/audio/manifest.json r2/data/chapter-registry.json
          fi

          python - <<'PY'
          import json, pathlib
          root=pathlib.Path.cwd(); audio=root/'greg-again/audio'; r2=root/'r2'
          prod=json.loads((audio/'production/038/takes.json').read_text())
          assembled=prod['assembled_audio']

          p=audio/'manifest.json'; manifest=json.loads(p.read_text())
          manifest['chapters']=[c for c in manifest['chapters'] if c['chapter_id']!='ga-038']
          manifest['chapters'].append({
            'chapter_id':'ga-038','number':38,'title':'Two Keys','status':'experimental',
            'lens':'shared-greg-surface','audio_finish':'processing-space','take_count':33,
            'duration_seconds':assembled['duration_seconds'],'audio_src':'assets/chapter-038.mp3',
            'note':'Chapter 38 uses thirty-three complete preview-safe deep-voice short takes captured as durable MP3 artifacts. Exact current spoken-source coverage, provider identity, take ordering, individual playability, stitched chapter audio, hashes, seam continuity, the authoritative final ellipsis, and the listener-tail landing were verified before publication.'
          })
          manifest['chapters'].sort(key=lambda c:c['number'])
          p.write_text(json.dumps(manifest,indent=2)+'\n')

          rp=r2/'data/chapter-registry.json'; reg=rp.read_text()
          start=reg.index('"r2-ch038"'); end=reg.index('"r2-ch039"',start)
          block=reg[start:end]
          if '"audio": "not_started"' in block:
              block=block.replace('"audio": "not_started"','"audio": "published"',1)
          elif '"audio": "published"' not in block:
              raise SystemExit('Unexpected Chapter 38 registry audio state')
          reg=reg[:start]+block+reg[end:]; rp.write_text(reg)
          PY

          git add greg-again/audio/manifest.json r2/data/chapter-registry.json
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain"; git diff --name-only --diff-filter=U; exit 1
          fi
          rm -f .github/workflows/ga-ch038-reconcile-main.yml
          git add -A
          git commit -m "Merge current main into Chapter 38 audio publication"

      - name: Verify reconciled candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_greg_again_audio_ch038
          python -m unittest tests.test_r2_site
          python - <<'PY'
          import json
          m=json.load(open('greg-again/audio/manifest.json'))
          ids={c['chapter_id'] for c in m['chapters']}
          assert 'ga-036' in ids, 'newer Chapter 36 authority was lost'
          assert 'ga-038' in ids
          r=json.load(open('r2/data/chapter-registry.json'))
          assert r['chapters']['r2-ch036']['pipeline']['audio']=='published'
          assert r['chapters']['r2-ch038']['pipeline']['audio']=='published'
          PY

      - name: Push reconciled head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:audio/greg-again-ch038-auto
