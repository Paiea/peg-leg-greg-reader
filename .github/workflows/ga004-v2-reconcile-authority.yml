name: ga004 v2 reconcile authority
on:
  push:
    branches: [audio/v2-greg-again-ch004-auto]
    paths: ['.github/workflows/ga004-v2-reconcile-authority.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/v2-greg-again-ch004-auto
          fetch-depth: 0
      - name: Merge current Audio Score authority and preserve Chapter 004 publication
        shell: bash
        run: |
          set -euo pipefail
          test -s greg-again/audio/assets/v2/chapter-004.mp3
          test "$(find greg-again/audio/v2/takes/004/captured -maxdepth 1 -name 'take-*.mp3' | wc -l)" -eq 26
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin audio-score/chapters-001-010
          git merge --no-commit --no-ff -X theirs origin/audio-score/chapters-001-010
          python - <<'PY'
          import json, pathlib
          v2p = pathlib.Path('greg-again/audio/v2/manifest.json')
          v2 = json.loads(v2p.read_text())
          entry = {
            'chapter_id': 'ga-004',
            'number': 4,
            'title': 'Thirty Days',
            'status': 'complete',
            'voice_style': 'deep',
            'source': 'r2/assets/audio-score/ch004.md',
            'source_sha': '7c2f4b9cdf40fe8035568fa7e503bff4589780fe',
            'take_count': 26,
            'capture_mode': 'preview-safe-short-takes',
            'duration_seconds': 621.432,
            'audio_src': 'assets/v2/chapter-004.mp3'
          }
          chapters = v2.setdefault('chapters', [])
          chapters[:] = [c for c in chapters if c.get('chapter_id') != 'ga-004' and c.get('number') != 4]
          chapters.append(entry)
          chapters.sort(key=lambda c: c.get('number', 10**9))
          v2p.write_text(json.dumps(v2, indent=2) + '\n')

          pp = pathlib.Path('greg-again/audio/manifest.json')
          pub = json.loads(pp.read_text())
          matches = [c for c in pub.get('chapters', []) if c.get('chapter_id') == 'ga-004' or c.get('number') == 4]
          if len(matches) != 1:
            raise SystemExit(f'expected one public ga-004 entry, found {len(matches)}')
          c = matches[0]
          c['audio_src'] = 'assets/v2/chapter-004.mp3'
          c['take_count'] = 26
          c['duration_seconds'] = 621.432
          c['note'] = 'Audio Score v2 Chapter 4 assembled from twenty-six complete preview-safe deep-voice takes, ffprobe-verified individually and stitched with a two-second listener tail.'
          pp.write_text(json.dumps(pub, indent=2) + '\n')
          PY
          python -m json.tool greg-again/audio/v2/manifest.json >/dev/null
          python -m json.tool greg-again/audio/manifest.json >/dev/null
          python - <<'PY'
          import json
          v2=json.load(open('greg-again/audio/v2/manifest.json'))
          nums=[c.get('number') for c in v2['chapters']]
          assert 4 in nums, nums
          assert 9 in nums, nums
          pub=json.load(open('greg-again/audio/manifest.json'))
          c=next(c for c in pub['chapters'] if c.get('number')==4)
          assert c['audio_src']=='assets/v2/chapter-004.mp3', c
          print('v2 chapters preserved:', nums)
          PY
          git add greg-again/audio/v2/manifest.json greg-again/audio/manifest.json
          git commit -m 'Reconcile Audio Score v2 Chapter 004 with current authority'
          git push origin HEAD:audio/v2-greg-again-ch004-auto
