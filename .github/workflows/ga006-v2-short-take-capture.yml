name: ga006 v2 short take capture
on:
  push:
    branches: [audio/v2-greg-again-ch006-auto]
    paths: ['.github/workflows/ga006-v2-short-take-capture.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/v2-greg-again-ch006-auto

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Verify Audio Score coverage map
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          capture = json.loads(Path('greg-again/audio/v2/production/006/capture.json').read_text())
          score = Path('r2/assets/audio-score/ch006.md').read_text()
          body = score.split('\n---\n', 1)[1].strip()
          expected = re.sub(r'\bVale\b', 'Vayle', body)
          expected = re.sub(r'\bMana\b', 'Ma-na', expected)
          expected = re.sub(r'\bmana\b', 'ma-na', expected)
          spoken = '\n\n'.join(c['transcript'] for c in capture['chunks']).strip()
          norm = lambda s: re.sub(r'\s+', ' ', s).strip()
          assert len(capture['chunks']) == 30
          assert all(0 < len(c['transcript']) <= 500 for c in capture['chunks'])
          assert all(c['preview_url'].startswith('https://storage.googleapis.com/') for c in capture['chunks'])
          assert norm(expected) == norm(spoken), 'capture transcript does not exactly cover provider-facing Audio Score body'
          print('coverage_ok=true')
          print('chunks=30')
          PY

      - name: Capture, probe, stitch, and add settling tail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/v2/takes/006/audio greg-again/audio/assets/v2 greg-again/audio/v2/verification/006
          python - <<'PY' > /tmp/urls.tsv
          import json
          from pathlib import Path
          c = json.loads(Path('greg-again/audio/v2/production/006/capture.json').read_text())
          for x in c['chunks']:
              print(f"{x['chunk']:02d}\t{x['preview_url']}")
          PY
          : > greg-again/audio/v2/verification/006/chunk-probes.tsv
          while IFS=$'\t' read -r n url; do
            out="greg-again/audio/v2/takes/006/audio/chunk-${n}.mp3"
            curl -fL --retry 3 --retry-delay 2 "$url" -o "$out"
            test "$(stat -c%s "$out")" -gt 1000
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out")"
            test -n "$duration"
            printf '%s\t%s\t%s\n' "$n" "$duration" "$(sha256sum "$out" | cut -d' ' -f1)" >> greg-again/audio/v2/verification/006/chunk-probes.tsv
          done < /tmp/urls.tsv
          test "$(find greg-again/audio/v2/takes/006/audio -name 'chunk-*.mp3' | wc -l)" -eq 30
          printf "file '%s'\n" greg-again/audio/v2/takes/006/audio/chunk-*.mp3 > /tmp/list.txt
          test "$(wc -l < /tmp/list.txt)" -eq 30
          ffmpeg -v error -f concat -safe 0 -i /tmp/list.txt -c:a libmp3lame -q:a 2 /tmp/assembled.mp3
          ffmpeg -v error -i /tmp/assembled.mp3 -af apad=pad_dur=2 -c:a libmp3lame -q:a 2 greg-again/audio/assets/v2/chapter-006.mp3
          ffprobe -v error greg-again/audio/assets/v2/chapter-006.mp3
          final_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 greg-again/audio/assets/v2/chapter-006.mp3)"
          final_sha="$(sha256sum greg-again/audio/assets/v2/chapter-006.mp3 | cut -d' ' -f1)"
          printf 'chapter=006\nchunks=30\ncoverage_ok=true\nsource_blob_sha=660801faef0a727a50c73c2b4768e12b71780618\nvoice=deep\nfactory=preview-safe-v2\nfinal_duration_seconds=%s\nfinal_sha256=%s\ntail_seconds=2\n' "$final_duration" "$final_sha" > greg-again/audio/v2/verification/006/final.txt
          sha256sum greg-again/audio/v2/takes/006/audio/chunk-*.mp3 greg-again/audio/assets/v2/chapter-006.mp3 > greg-again/audio/v2/verification/006/SHA256SUMS

      - name: Commit captured binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add greg-again/audio/v2/takes/006/audio greg-again/audio/assets/v2/chapter-006.mp3 greg-again/audio/v2/verification/006
          git commit -m 'Capture and assemble ga-v2-006 preview takes'
          git push origin HEAD:audio/v2-greg-again-ch006-auto
