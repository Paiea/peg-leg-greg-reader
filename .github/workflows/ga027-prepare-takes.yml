name: Prepare Greg Again Chapter 27 Takes

on:
  push:
    branches:
      - audio/greg-again-ch027-auto

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch027-auto
      - name: Build deterministic provider-safe take map
        run: |
          python - <<'PY'
          import json, hashlib, pathlib, re
          src_path = pathlib.Path('r2/assets/written/ch027.md')
          raw = src_path.read_text(encoding='utf-8')
          marker = '\n---\n'
          if marker not in raw:
              raise SystemExit('missing prose separator')
          prose = raw.split(marker, 1)[1].strip()
          paragraphs = [p.strip() for p in re.split(r'\n\s*\n', prose) if p.strip()]
          max_chars = 480
          takes=[]
          current=[]
          def emit(parts):
              written='\n\n'.join(parts)
              provider=re.sub(r'\bMana\b','Ma-na',written)
              provider=re.sub(r'\bmana\b','ma-na',provider)
              provider=re.sub(r'\bVale\b','Vayle',provider)
              provider=re.sub(r'\bsparring\b','spar-ring',provider)
              takes.append({
                  'take': len(takes)+1,
                  'written_transcript': written,
                  'provider_transcript': provider,
                  'written_sha256': hashlib.sha256(written.encode()).hexdigest(),
                  'provider_sha256': hashlib.sha256(provider.encode()).hexdigest(),
                  'provider_job_id': None,
                  'preview_url': None,
                  'durable_file': f"greg-again/audio/production/027/takes/ga-027-take-{len(takes)+1:02d}.mp3",
                  'status': 'locked'
              })
          for p in paragraphs:
              if len(p) > max_chars:
                  raise SystemExit(f'paragraph over max_chars ({len(p)}): {p[:80]!r}')
              candidate='\n\n'.join(current+[p])
              if current and len(candidate) > max_chars:
                  emit(current); current=[p]
              else:
                  current.append(p)
          if current: emit(current)
          rebuilt='\n\n'.join(t['written_transcript'] for t in takes)
          if rebuilt != prose:
              raise SystemExit('take coverage mismatch')
          out=pathlib.Path('greg-again/audio/production/027')
          out.mkdir(parents=True, exist_ok=True)
          data={
              'chapter_id':'ga-027','chapter_number':27,'title':'The Student',
              'source_path':str(src_path),
              'source_sha256':hashlib.sha256(raw.encode()).hexdigest(),
              'spoken_prose_sha256':hashlib.sha256(prose.encode()).hexdigest(),
              'voice_id':'deep','max_provider_chars':max_chars,
              'take_count':len(takes),'takes':takes
          }
          (out/'takes.json').write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          (out/'STATUS.md').write_text(
              '# Greg, Again Chapter 27 Audio Status\n\n'
              'Claim: `audio/greg-again-ch027-auto`\n\n'
              'State: deterministic take map locked; provider synthesis next.\n\n'
              f'Takes: {len(takes)}\n\n'
              'Voice: `deep`\n\n'
              'Source: `r2/assets/written/ch027.md`\n\n'
              'Provider aliases follow `r2/AUDIO_PRONUNCIATION.md`.\n',encoding='utf-8')
          print(f'locked {len(takes)} takes')
          PY
      - name: Commit take map
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add greg-again/audio/production/027/takes.json greg-again/audio/production/027/STATUS.md
          git commit -m "Lock Chapter 27 audio take map"
          git push origin HEAD:audio/greg-again-ch027-auto
