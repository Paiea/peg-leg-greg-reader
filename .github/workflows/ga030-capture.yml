name: Capture Greg Again Chapter 30

on:
  push:
    branches:
      - audio/greg-again-ch030-auto
    paths:
      - greg-again/audio/production/030/CAPTURE_REQUEST.md

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch030-auto
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture available provider audio
        env:
          CONTEXTS: >-
            93c62921d43f4b47b08af01c1254e583,eef4a54dc9d14f52ad0287ecdf6ad41b,9de6b3d71a94456a851aad6fa78f0f61,923799aae20742f589cc2c07365addc6,3aa9322b2bcd4c218ac990177dca452d,44dd9c10f0914523ba3ec43cc049e3e6,d2ef6ede019e416393d2f3cc0168f32b,316d081b57bd4b6d920ac047a0935e88,572ec56651c64a6ca90b942d4c22affe,8aef05ee38714e2e8a7b9c0a2d49929f,e870748eb15945be855e8f34a4e068df,576113c44b8a449d8a633da86a14549d,322a8d47bd594fd5babe5909b0762f58,80220903a3974811935bad507412aefc,d3404150148c43078043b3de439f486f,8afb952ddb6c4c82bc375792248a256b,bccd7e15954d4e2d96f11beb5938c25b,f2966519c05245d99011d8777b61edc4,6ec99905f96b47d7b2d68cffd1603531,2a2c67e134b746519fd9faf141d6cedc,10bc1f31b1f34b018929c6b64e06a5fa,57834b17ed2a4934ad3c95d13b4f3f51,c33344093c9f44f7aeab1975c85eec51,63d3ed64e398473e99a93e3a21f6b7eb
        run: |
          mkdir -p greg-again/audio/production/030/takes
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const ids = process.env.CONTEXTS.split(',');
          const browser = await chromium.launch({headless:true});
          const ctx = await browser.newContext();
          const results = [];
          for (let i=0; i<ids.length; i++) {
            const id=ids[i]; const take=String(i+1).padStart(2,'0');
            const out=`greg-again/audio/production/030/takes/take-${take}.mp3`;
            if (fs.existsSync(out) && fs.statSync(out).size > 10000) {
              results.push({take:i+1,context_id:id,bytes:fs.statSync(out).size,status:'already_captured'});
              continue;
            }
            const page=await ctx.newPage();
            let ok=false, last='';
            for (let attempt=1; attempt<=6 && !ok; attempt++) {
              try {
                await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`, {waitUntil:'domcontentloaded', timeout:60000});
                await page.waitForTimeout(2500);
                const src=await page.locator('audio').evaluateAll(els => els.map(a=>a.currentSrc||a.src).find(Boolean)||'').catch(()=> '');
                last=src;
                if (src && !src.startsWith('blob:')) {
                  const r=await page.request.get(src, {timeout:60000});
                  if (r.ok()) {
                    const b=await r.body();
                    if (b.length > 10000) {
                      fs.writeFileSync(out,b); ok=true;
                      results.push({take:i+1,context_id:id,src,bytes:b.length,status:'captured'});
                    }
                  }
                }
              } catch(e) { last=String(e); }
              if (!ok) await page.waitForTimeout(2500);
            }
            await page.close();
            if (!ok) results.push({take:i+1,context_id:id,last,status:'not_ready'});
          }
          fs.writeFileSync('greg-again/audio/production/030/capture-results.json', JSON.stringify(results,null,2));
          await browser.close();
          JS
          node capture.mjs
          rm -f capture.mjs
          for f in greg-again/audio/production/030/takes/*.mp3; do ffprobe -v error -show_entries format=duration,size -of json "$f"; done
      - name: Assemble when all 24 takes are durable
        run: |
          count=$(find greg-again/audio/production/030/takes -name 'take-*.mp3' -size +10000c | wc -l)
          echo "durable take count=$count"
          if [ "$count" -eq 24 ]; then
            : > /tmp/concat.txt
            for f in greg-again/audio/production/030/takes/take-*.mp3; do printf "file '%s'\n" "$GITHUB_WORKSPACE/$f" >> /tmp/concat.txt; done
            ffmpeg -y -f concat -safe 0 -i /tmp/concat.txt -c copy /tmp/chapter-030-base.mp3
            ffmpeg -y -i /tmp/chapter-030-base.mp3 -f lavfi -t 2 -i anullsrc=r=44100:cl=stereo -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1[out]" -map "[out]" -codec:a libmp3lame -q:a 2 greg-again/audio/assets/chapter-030.mp3
            ffprobe -v error -show_entries format=duration,size -of json greg-again/audio/assets/chapter-030.mp3 > greg-again/audio/production/030/ffprobe.json
          else
            rm -f greg-again/audio/assets/chapter-030.mp3 greg-again/audio/production/030/ffprobe.json
          fi
      - name: Commit every durable recovery
        run: |
          git config user.name "greg-again-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add greg-again/audio/production/030 greg-again/audio/assets/chapter-030.mp3 2>/dev/null || git add greg-again/audio/production/030
          git commit -m "Capture Greg Again Chapter 30 provider audio" || exit 0
          git push origin HEAD:audio/greg-again-ch030-auto
