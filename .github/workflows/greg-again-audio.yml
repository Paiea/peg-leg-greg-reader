name: Validate Greg Again Audio

on:
  pull_request:
    paths:
      - 'greg-again/audio/**'
      - 'r2/**'
      - 'tests/test_greg_again_audio_catalog.py'
      - 'tests/test_r2_audio_library.py'
      - 'tests/test_r2_listen_first_site.py'
      - '.github/workflows/greg-again-audio.yml'
  push:
    branches:
      - main
    paths:
      - 'greg-again/audio/**'
      - 'r2/**'
      - 'tests/test_greg_again_audio_catalog.py'
      - 'tests/test_r2_audio_library.py'
      - 'tests/test_r2_listen_first_site.py'
      - '.github/workflows/greg-again-audio.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run Greg Again audio catalog contract
        run: python -m unittest tests.test_greg_again_audio_catalog -v
      - name: Run R2 Audio Library interface contract
        run: python -m unittest tests.test_r2_audio_library -v
      - name: Run R2 listen-first site contract
        run: python -m unittest tests.test_r2_listen_first_site -v
