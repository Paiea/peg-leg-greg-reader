name: Audit mana target chunk routing

on:
  push:
    branches:
      - audio/greg-again-mana-pronunciation-repair-v2
    paths:
      - '.github/workflows/greg-again-audio.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-mana-pronunciation-repair-v2
          fetch-depth: 0
      - name: Install speech matcher
        run: python -m pip install --quiet faster-whisper
      - name: Compare historical take text against neighboring chunk audio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          from difflib import SequenceMatcher
          from faster_whisper import WhisperModel

          root = Path('.')
          lows = json.loads((root/'greg-again/audio/production/2026-09-08-mana-anchor-alignment.json').read_text())['targets']
          model = WhisperModel('small.en', device='cpu', compute_type='int8')
          cache = {}

          def norm_tokens(text):
              text = text.lower().replace('mah-nah','mana').replace('ma-na','mana')
              return re.findall(r"[a-z0-9']+", text)

          def transcribe(path):
              key = str(path)
              if key in cache:
                  return cache[key]
              segs, _ = model.transcribe(str(path), beam_size=5, language='en', vad_filter=False)
              text = ' '.join(seg.text for seg in segs)
              cache[key] = text
              return text

          results = []
          for item in lows:
              ch = int(item['chapter']); take = int(item['take']); target = item['target']
              source_path = root/f'greg-again/audio/production/mana-repair-inputs/ch{ch:03d}-t{take:02d}.txt'
              source_text = source_path.read_text(encoding='utf-8')
              sw = norm_tokens(source_text)
              cands = []
              for n in range(max(1,take-2), take+3):
                  p = root/f'greg-again/audio/assets/chunks/{ch:03d}/{n:02d}.mp3'
                  if not p.exists():
                      continue
                  asr = transcribe(p)
                  aw = norm_tokens(asr)
                  ratio = SequenceMatcher(None, sw, aw).ratio()
                  cands.append({
                      'chunk': n,
                      'ratio': round(ratio,4),
                      'asr_word_count': len(aw),
                      'source_word_count': len(sw),
                      'asr_head': ' '.join(aw[:24]),
                      'asr_tail': ' '.join(aw[-24:]),
                  })
              cands.sort(key=lambda x:x['ratio'], reverse=True)
              best = cands[0] if cands else None
              second = cands[1] if len(cands)>1 else None
              margin = (best['ratio'] - second['ratio']) if best and second else None
              status = 'routed' if best and best['ratio'] >= 0.55 and (margin is None or margin >= 0.06) else 'ambiguous'
              rec = {'target':target,'chapter':ch,'script_take':take,'status':status,'best_chunk':best['chunk'] if best else None,'best_ratio':best['ratio'] if best else None,'margin':round(margin,4) if margin is not None else None,'candidates':cands}
              results.append(rec)
              print(target, status, 'best', rec['best_chunk'], 'ratio', rec['best_ratio'], 'margin', rec['margin'])

          out = {
              'method':'full historical take text vs neighboring published chunk ASR',
              'results':results,
              'summary':{
                  'target_count':len(results),
                  'routed':sum(r['status']=='routed' for r in results),
                  'ambiguous':sum(r['status']=='ambiguous' for r in results),
              }
          }
          (root/'greg-again/audio/production/2026-09-09-mana-chunk-routing-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out['summary']))
          PY
      - name: Restore validator and commit routing audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/greg-again-audio.yml > .github/workflows/greg-again-audio.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add greg-again/audio/production/2026-09-09-mana-chunk-routing-audit.json .github/workflows/greg-again-audio.yml
          git commit -m 'audio: audit mana target chunk routing'
          git push origin HEAD:audio/greg-again-mana-pronunciation-repair-v2
