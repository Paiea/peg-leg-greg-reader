name: Close final mana repair map

on:
  push:
    branches:
      - audio/greg-again-mana-pronunciation-repair-v2
    paths:
      - '.github/workflows/greg-again-audio.yml'

permissions:
  contents: write

jobs:
  close-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-mana-pronunciation-repair-v2
          fetch-depth: 0
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install --quiet faster-whisper
      - name: Capture widened Chapter 6 micro and close seams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/production/mana-repair-artifacts
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/ca5b486a-2002-45c9-a07f-2b11106453cb.mp3' \
            -o greg-again/audio/production/mana-repair-artifacts/ch006-t05-m01-wide.mp3
          ffprobe -v error greg-again/audio/production/mana-repair-artifacts/ch006-t05-m01-wide.mp3

          python3 - <<'PY'
          import hashlib,json,re,subprocess
          from difflib import SequenceMatcher
          from pathlib import Path
          from faster_whisper import WhisperModel

          root=Path('.')
          out={}

          # Chapter 6: the earlier globally aligned transcript already proved Metal ends at 8.26s
          # and People begins at 9.66s. Resolve a stable silence immediately before Metal and
          # immediately after the mana-bearing residue phrase from the waveform itself.
          ch6=root/'greg-again/audio/assets/chunks/006/06.mp3'
          def silence_intervals(path,noise=-46,d=0.03):
              p=subprocess.run(['ffmpeg','-hide_banner','-loglevel','info','-i',str(path),'-af',f'silencedetect=noise={noise}dB:d={d}','-f','null','-'],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True,check=False)
              ev=[]; cur=None; arr=[]
              for line in p.stderr.splitlines():
                  m=re.search(r'silence_start: ([0-9.]+)',line)
                  if m: ev.append(('s',float(m.group(1))))
                  m=re.search(r'silence_end: ([0-9.]+)',line)
                  if m: ev.append(('e',float(m.group(1))))
              ev.sort(key=lambda x:x[1])
              for k,t in ev:
                  if k=='s': cur=t
                  elif cur is not None: arr.append((cur,t)); cur=None
              return arr
          ch6sets={}
          for noise in (-50,-46,-42,-38,-34):
              arr=silence_intervals(ch6,noise,0.02)
              ch6sets[str(noise)]=[x for x in arr if 5.5 <= x[1] and x[0] <= 10.5]
          # Known audio anchors from authoritative full-take alignment.
          metal_end=8.26; people_start=9.66
          candidates=[]
          for noise,arr in ch6sets.items():
              left=[x for x in arr if x[1] <= metal_end and metal_end-x[1] <= 2.0 and (x[1]-x[0])>=0.04]
              right=[x for x in arr if x[0] >= 9.45 and x[0] <= people_start+0.12 and (x[1]-x[0])>=0.04]
              L=max(left,key=lambda x:x[1]) if left else None
              R=min(right,key=lambda x:x[0]) if right else None
              candidates.append({'noise_db':int(noise),'left':L,'right':R,'left_mid':round(sum(L)/2,3) if L else None,'right_mid':round(sum(R)/2,3) if R else None})
          wide=root/'greg-again/audio/production/mana-repair-artifacts/ch006-t05-m01-wide.mp3'
          wide_dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(wide)],text=True).strip())
          out['ch006-t05-m01-wide']={
              'source_audio':str(ch6),'replacement_audio':str(wide),
              'replacement_text':'Metal. Mah-nah-bearing residue.',
              'provider_context_id':'26d3c2900dec4f11b84b456c9e21dbd4',
              'preview_url':'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/ca5b486a-2002-45c9-a07f-2b11106453cb.mp3',
              'sha256':hashlib.sha256(wide.read_bytes()).hexdigest(),'duration_seconds':round(wide_dur,3),
              'known_metal_end':metal_end,'known_people_start':people_start,
              'silence_sets':ch6sets,'candidate_seams':candidates
          }

          # Chapter 11 is an older production-era assembled-only chapter. Locate the exact
          # historical three-sentence repair span in the assembled published MP3.
          ch11=root/'greg-again/audio/assets/chapter-011.mp3'
          model=WhisperModel('small.en',device='cpu',compute_type='int8')
          prompt='Under where the stone would swing if the bracket let go. I ran. No mana. Did not even reach for it. There was no four-inch solution to several hundred pounds of limestone.'
          segs,_=model.transcribe(str(ch11),beam_size=5,word_timestamps=True,vad_filter=True,language='en',condition_on_previous_text=True,initial_prompt=prompt)
          def nw(s):
              x=re.sub(r"[^a-z0-9']+",'',s.lower())
              if x in {'manna','mahna','manaa','manah'}: x='mana'
              return x
          words=[]
          for seg in segs:
              for w in seg.words or []:
                  z=nw(w.word)
                  if z: words.append({'word':z,'raw':w.word.strip(),'start':round(float(w.start),3),'end':round(float(w.end),3),'prob':round(float(w.probability or 0),3)})
          target=['i','ran','no','mana','did','not','even','reach','for','it']
          best=None
          for i in range(len(words)):
              for L in range(8,13):
                  if i+L>len(words): continue
                  cand=[x['word'] for x in words[i:i+L]]
                  ratio=SequenceMatcher(None,target,cand).ratio()
                  score=ratio-.02*abs(L-len(target))
                  if best is None or score>best[0]: best=(score,ratio,i,i+L,cand)
          if best is None: raise SystemExit('Chapter 11 target not found')
          score,ratio,i,j,cand=best; span=words[i:j]
          s,e=span[0]['start'],span[-1]['end']
          sil11={}
          proposed=[]
          for noise in (-50,-46,-42,-38,-34):
              arr=silence_intervals(ch11,noise,0.02)
              local=[x for x in arr if s-2.0 <= x[1] and x[0] <= e+2.0]
              sil11[str(noise)]=local
              left=[x for x in local if x[1] <= s+.12 and s-x[1]<=1.5 and (x[1]-x[0])>=0.04]
              right=[x for x in local if x[0] >= e-.12 and x[0]-e<=1.5 and (x[1]-x[0])>=0.04]
              L=max(left,key=lambda x:x[1]) if left else None
              R=min(right,key=lambda x:x[0]) if right else None
              proposed.append({'noise_db':noise,'left':L,'right':R,'left_mid':round(sum(L)/2,3) if L else None,'right_mid':round(sum(R)/2,3) if R else None})
          out['ch011-t14-m01']={
              'source_audio':str(ch11),'historical_target_text':'I ran. No mana. Did not even reach for it.',
              'match_ratio':round(ratio,3),'match_score':round(score,3),'matched_words':cand,
              'speech_start':s,'speech_end':e,'previous_word':words[i-1] if i else None,'next_word':words[j] if j<len(words) else None,
              'candidate_seams':proposed,'local_silences':sil11
          }

          Path('greg-again/audio/production/2026-09-09-mana-final-map-close.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Restore validator and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/greg-again-audio.yml > .github/workflows/greg-again-audio.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add greg-again/audio/production/mana-repair-artifacts/ch006-t05-m01-wide.mp3 greg-again/audio/production/2026-09-09-mana-final-map-close.json .github/workflows/greg-again-audio.yml
          git commit -m 'audio: close final mana repair map'
          git push origin HEAD:audio/greg-again-mana-pronunciation-repair-v2
