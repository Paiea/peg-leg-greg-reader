name: Focus final mana repair seams

on:
  push:
    branches:
      - audio/greg-again-mana-pronunciation-repair-v2
    paths:
      - '.github/workflows/greg-again-audio.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-mana-pronunciation-repair-v2
          fetch-depth: 0
      - name: Install focused audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install --quiet faster-whisper
      - name: Diagnose exact local speech windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          from difflib import SequenceMatcher
          from faster_whisper import WhisperModel

          root=Path('.')
          work=Path('/tmp/mana-focus'); work.mkdir(parents=True,exist_ok=True)
          model=WhisperModel('small.en',device='cpu',compute_type='int8')
          cases={
            'ch006-t05-m01': {
              'audio':'greg-again/audio/assets/chunks/006/06.mp3','offset':6.0,'duration':6.5,
              'target':'Mana-bearing residue.',
              'prompt':'Not memories exactly. Shape. Failure shape. Conductive path. Wet floor. Metal. Mana-bearing residue. People standing inside it. Back.'},
            'ch006-t06-m01': {
              'audio':'greg-again/audio/assets/chunks/006/07.mp3','offset':21.0,'duration':11.5,
              'target':'Reached for mana.',
              'prompt':'I put out my hand. Reached for mana. The pressure behind my eyes. A weak pulse down my arm. Then pain. No barrier. Not even close.'},
            'ch018-t18-m01': {
              'audio':'greg-again/audio/assets/chunks/018/18.mp3','offset':0.0,'duration':9.0,
              'target':'Current mana.',
              'prompt':'Current body. Current mana. No historical exemptions for having once been impressive. I counted twelve copper onto the counter.'},
            'ch022-t03-m01': {
              'audio':'greg-again/audio/assets/chunks/022/03.mp3','offset':52.0,'duration':24.608,
              'target':'Mana gathered badly, then enough.',
              'prompt':'The heat line climbed left beneath the landing. A chunk larger than his head broke loose. My hand moved before I finished thinking. Mana gathered badly, then enough. A support plane snapped into place between the falling plaster and the side of his face. Five inches. Maybe six. The slab hit at an angle. The plane did not stop it. It changed the angle. That was enough. The plaster broke against his shoulder instead of his temple and exploded across the floor.'},
          }

          def nword(s):
            x=re.sub(r"[^a-z0-9']+",'',s.lower())
            if x in {'manna','mahna','manaa'}: x='mana'
            return x
          def twords(s): return [nword(x) for x in re.findall(r"[A-Za-z0-9']+",s) if nword(x)]
          def silences(path):
            outputs={}
            for noise in (-50,-46,-42,-38):
              log=work/f'{path.stem}-{abs(noise)}.log'
              with log.open('w') as f:
                subprocess.run(['ffmpeg','-hide_banner','-loglevel','info','-i',str(path),'-af',f'silencedetect=noise={noise}dB:d=0.015','-f','null','-'],stdout=subprocess.DEVNULL,stderr=f,check=False)
              ev=[]; cur=None; arr=[]
              for ln in log.read_text(errors='replace').splitlines():
                m=re.search(r'silence_start: ([0-9.]+)',ln)
                if m: ev.append(('s',float(m.group(1))))
                m=re.search(r'silence_end: ([0-9.]+)',ln)
                if m: ev.append(('e',float(m.group(1))))
              ev.sort(key=lambda x:x[1])
              for k,t in ev:
                if k=='s': cur=t
                elif cur is not None: arr.append((cur,t)); cur=None
              outputs[str(noise)]=arr
            return outputs
          def best_span(words,target):
            tgt=twords(target); best=None
            for i in range(len(words)):
              for L in range(max(1,len(tgt)-2),min(len(words)-i,len(tgt)+3)+1):
                cand=[x['word'] for x in words[i:i+L]]
                ratio=SequenceMatcher(None,tgt,cand).ratio()
                score=ratio-.03*abs(L-len(tgt))
                if best is None or score>best[0]: best=(score,ratio,i,i+L,cand)
            return best

          results=[]
          for target,c in cases.items():
            src=root/c['audio']; clip=work/f'{target}.wav'
            subprocess.run(['ffmpeg','-y','-hide_banner','-loglevel','error','-ss',str(c['offset']),'-i',str(src),'-t',str(c['duration']),'-af','loudnorm=I=-20:LRA=11:TP=-2','-ar','24000','-ac','1',str(clip)],check=True)
            segs,_=model.transcribe(str(clip),beam_size=5,word_timestamps=True,vad_filter=False,language='en',condition_on_previous_text=False,initial_prompt=c['prompt'])
            words=[]
            for seg in segs:
              for w in seg.words or []:
                nw=nword(w.word)
                if nw:
                  words.append({'word':nw,'raw':w.word.strip(),'start':round(float(w.start),3),'end':round(float(w.end),3),'prob':round(float(w.probability or 0),3)})
            best=best_span(words,c['target'])
            rec={'target':target,'source_audio':c['audio'],'window_offset':c['offset'],'window_duration':c['duration'],'expected_text':c['target'],'words':words,'silences':silences(clip)}
            if best:
              score,ratio,i,j,cand=best; span=words[i:j]
              rec.update(match_ratio=round(ratio,3),match_score=round(score,3),matched_words=cand,match_start_index=i,match_end_index=j,
                         local_speech_start=span[0]['start'],local_speech_end=span[-1]['end'],
                         absolute_speech_start=round(c['offset']+span[0]['start'],3),absolute_speech_end=round(c['offset']+span[-1]['end'],3),
                         previous_word=words[i-1] if i>0 else None,next_word=words[j] if j<len(words) else None)
              # nearest stable silence around the matched speech across threshold sets
              proposed=[]
              for noise,arr in rec['silences'].items():
                left=[(a,b) for a,b in arr if b<=span[0]['start']+.10 and span[0]['start']-b<=1.5]
                right=[(a,b) for a,b in arr if a>=span[-1]['end']-.10 and a-span[-1]['end']<=1.5]
                L=max(left,key=lambda x:x[1]) if left else None
                R=min(right,key=lambda x:x[0]) if right else None
                proposed.append({'noise_db':int(noise),'left':L,'right':R,
                  'absolute_left_mid':round(c['offset']+(sum(L)/2),3) if L else None,
                  'absolute_right_mid':round(c['offset']+(sum(R)/2),3) if R else None})
              rec['proposed_silence_seams']=proposed
            results.append(rec)
            print('\n',target,'ratio',rec.get('match_ratio'),'speech',rec.get('absolute_speech_start'),rec.get('absolute_speech_end'))
            print('words:', ' | '.join(f"{w['raw']}[{w['start']:.3f}-{w['end']:.3f}]" for w in words))
            for p in rec.get('proposed_silence_seams',[]): print(' ',p)
          out={'method':'isolated local windows + prompted small.en word timestamps + multi-threshold silence detection','results':results}
          (root/'greg-again/audio/production/2026-09-09-mana-focused-seams.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Restore validator and commit focused diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/greg-again-audio.yml > .github/workflows/greg-again-audio.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add greg-again/audio/production/2026-09-09-mana-focused-seams.json .github/workflows/greg-again-audio.yml
          git commit -m 'audio: focus final mana repair seams'
          git push origin HEAD:audio/greg-again-mana-pronunciation-repair-v2
