name: Locate unresolved mana in provider chunks

on:
  push:
    branches:
      - audio/greg-again-mana-pronunciation-repair-v2
    paths:
      - '.github/workflows/greg-again-audio.yml'

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-mana-pronunciation-repair-v2
          fetch-depth: 0
      - name: Install speech tools
        run: python -m pip install --quiet faster-whisper
      - name: Transcribe exact provider chunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          from difflib import SequenceMatcher
          from faster_whisper import WhisperModel

          root=Path('.')
          model=WhisperModel('small.en',device='cpu',compute_type='int8')
          jobs=[]
          for ch,nums in [(18,[17,18]),(22,list(range(1,11)))]:
              for n in nums:
                  jobs.append((ch,n,root/f'greg-again/audio/assets/chunks/{ch:03d}/{n:02d}.mp3'))

          targets={
            18:['current body current mana','current mana','no historical exemptions'],
            22:['mana gathered badly then enough','support plane snapped into place','my hand moved before i finished thinking','the plane vanished']
          }
          def nw(s):
              s=s.lower().replace('manna','mana').replace('mah-nah','mana').replace('ma-na','mana')
              return re.findall(r"[a-z0-9']+",s)
          out={'chunks':[]}
          for ch,n,p in jobs:
              segs,_=model.transcribe(str(p),beam_size=5,word_timestamps=True,vad_filter=False,language='en')
              words=[]
              segtext=[]
              for seg in segs:
                  segtext.append(seg.text.strip())
                  for w in seg.words or []:
                      raw=w.word.strip(); toks=nw(raw)
                      if toks:
                          words.append({'word':toks[0],'raw':raw,'start':round(float(w.start),3),'end':round(float(w.end),3),'prob':round(float(w.probability or 0),3)})
              text=' '.join(segtext)
              flat=[w['word'] for w in words]
              matches=[]
              for phrase in targets[ch]:
                  tw=nw(phrase); best=None
                  for i in range(len(flat)):
                      for L in range(max(1,len(tw)-3),min(len(flat)-i,len(tw)+4)+1):
                          cand=flat[i:i+L]
                          ratio=SequenceMatcher(None,tw,cand).ratio()
                          if best is None or ratio>best[0]: best=(ratio,i,i+L,cand)
                  if best:
                      ratio,i,j,cand=best; span=words[i:j]
                      matches.append({'target':phrase,'ratio':round(ratio,3),'start':span[0]['start'],'end':span[-1]['end'],'words':cand})
              rec={'chapter':ch,'chunk':n,'text':text,'word_count':len(words),'matches':matches}
              out['chunks'].append(rec)
              print(f'CH{ch:03d} chunk {n:02d}:',text)
              for m in matches:
                  if m['ratio']>=0.55: print('  MATCH',m)
          (root/'greg-again/audio/production/2026-09-09-mana-provider-chunk-search.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Restore validator and commit search evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/greg-again-audio.yml > .github/workflows/greg-again-audio.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add greg-again/audio/production/2026-09-09-mana-provider-chunk-search.json .github/workflows/greg-again-audio.yml
          git commit -m 'audio: locate unresolved mana in provider chunks'
          git push origin HEAD:audio/greg-again-mana-pronunciation-repair-v2
