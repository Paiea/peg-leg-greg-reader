name: Resolve Provider Modal API Endpoint
on:
  push:
    branches: [audio/greg-again-batch-018-020]
    paths: ['.github/workflows/greg-again-batch-018-020-probe5.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-batch-018-020
      - name: Resolve API endpoint
        run: |
          python <<'PY'
          import re, urllib.request
          from pathlib import Path
          base='https://www.aidocmaker.com'
          page=urllib.request.urlopen(base+'/g0/audio?name=7c31ecb98d01441298fbb5e536696ee1').read().decode('utf-8','ignore')
          srcs=re.findall(r'<script[^>]+src="([^"]+)',page)
          text=''
          for src in srcs:
            url=src if src.startswith('http') else base+src
            try: text += urllib.request.urlopen(url,timeout=30).read().decode('utf-8','ignore')+'\n'
            except: pass
          out=[]
          for needle in ['63273,e=>','callModalApi",0','function callModalApi','modal.com','modal.run','/api/modal','modal-api','api/apps','appName']:
            out.append('\n=== '+needle+' ===')
            start=0
            for _ in range(20):
              i=text.find(needle,start)
              if i<0: break
              out.append(text[max(0,i-1200):min(len(text),i+2600)])
              start=i+len(needle)
          Path('greg-again/audio/capture-debug-018-modal.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/capture-debug-018-modal.txt
          git commit -m 'Resolve provider modal API endpoint'
          git push origin HEAD:audio/greg-again-batch-018-020
