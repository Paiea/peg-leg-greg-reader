name: Recover and stitch Greg Again Chapter 15

on:
  push:
    branches:
      - audio/greg-again-batch-015-017
    paths:
      - .github/workflows/greg-again-ch015-recovery-run.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-batch-015-017
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Capture six authorized Chapter 15 take URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/assets/chunks/015
          urls=(
            'https://www.aidocmaker.com/g0/audio?name=15b862f5bf9c4e5fbd0e401b3ff753a3'
            'https://www.aidocmaker.com/g0/audio?name=c0e1776c689c44a6be3e846595045996'
            'https://www.aidocmaker.com/g0/audio?name=a41b7579f79e4812ac2c426dae56fc29'
            'https://www.aidocmaker.com/g0/audio?name=e33c7e4a79f44034834cb0c489b10e08'
            'https://www.aidocmaker.com/g0/audio?name=bb42574cca414211bad3dd1c25af82f0'
            'https://www.aidocmaker.com/g0/audio?name=842bf96b301643bc986fece4d6ef5714'
          )
          for i in $(seq 1 6); do
            n=$(printf '%02d' "$i")
            url="${urls[$((i-1))]}"
            out="greg-again/audio/assets/chunks/015/${n}.mp3"
            curl --fail --location --retry 12 --retry-delay 10 --retry-all-errors "$url" -o "$out"
            test "$(stat -c%s "$out")" -gt 10000
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out"
          done

      - name: Stitch Chapter 15
        shell: bash
        run: |
          set -euo pipefail
          list=$(mktemp)
          for i in $(seq -w 1 6); do
            printf "file '%s'\n" "$GITHUB_WORKSPACE/greg-again/audio/assets/chunks/015/${i}.mp3" >> "$list"
          done
          ffmpeg -v error -f concat -safe 0 -i "$list" -c copy greg-again/audio/assets/chapter-015.mp3
          test "$(stat -c%s greg-again/audio/assets/chapter-015.mp3)" -gt 1000000
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 greg-again/audio/assets/chapter-015.mp3

      - name: Preserve original contexts and record captured replacement contexts
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          p = Path('greg-again/audio/takes/015.json')
          data = json.loads(p.read_text())
          replacement = [
              ('15b862f5bf9c4e5fbd0e401b3ff753a3','https://www.aidocmaker.com/g0/audio?name=15b862f5bf9c4e5fbd0e401b3ff753a3'),
              ('c0e1776c689c44a6be3e846595045996','https://www.aidocmaker.com/g0/audio?name=c0e1776c689c44a6be3e846595045996'),
              ('a41b7579f79e4812ac2c426dae56fc29','https://www.aidocmaker.com/g0/audio?name=a41b7579f79e4812ac2c426dae56fc29'),
              ('e33c7e4a79f44034834cb0c489b10e08','https://www.aidocmaker.com/g0/audio?name=e33c7e4a79f44034834cb0c489b10e08'),
              ('bb42574cca414211bad3dd1c25af82f0','https://www.aidocmaker.com/g0/audio?name=bb42574cca414211bad3dd1c25af82f0'),
              ('842bf96b301643bc986fece4d6ef5714','https://www.aidocmaker.com/g0/audio?name=842bf96b301643bc986fece4d6ef5714'),
          ]
          total = 0.0
          for i, take in enumerate(data['takes'], 1):
              f = Path(f'greg-again/audio/assets/chunks/015/{i:02d}.mp3')
              dur = float(subprocess.check_output([
                  'ffprobe','-v','error','-show_entries','format=duration',
                  '-of','default=nw=1:nk=1',str(f)
              ], text=True).strip())
              total += dur
              take['original_provider_context_id'] = take.get('provider_context_id')
              take['original_provider_player_url'] = take.get('provider_player_url')
              take['replacement_context_id'] = replacement[i-1][0]
              take['artifact_url'] = replacement[i-1][1]
              take['durable_file'] = str(f)
              take['duration_seconds'] = round(dur, 3)
              take['status'] = 'artifact_captured'
          data['artifact_boundary'] = 'captured_replacement_after_explicit_user_authorization'
          data['assembled_file'] = 'greg-again/audio/assets/chapter-015.mp3'
          data['assembled_duration_seconds'] = round(total, 3)
          data['status'] = 'verified_playable'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Commit durable Chapter 15 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chunks/015 greg-again/audio/assets/chapter-015.mp3 greg-again/audio/takes/015.json
          git commit -m 'audio: recover and stitch Greg Again Chapter 15'
          git push origin HEAD:audio/greg-again-batch-015-017
