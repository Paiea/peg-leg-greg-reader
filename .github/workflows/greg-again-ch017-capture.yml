          python3 - <<'PY'
          import hashlib, json, subprocess, urllib.request
          from pathlib import Path

          root = Path('.')
          source_path = root / 'r2/assets/written/ch017.md'
          take_map_path = root / 'greg-again/audio/takes/017-short.json'
          chunks_dir = root / 'greg-again/audio/assets/chunks/017-short'
          final_path = root / 'greg-again/audio/assets/chapter-017.mp3'
          chunks_dir.mkdir(parents=True, exist_ok=True)
          source = source_path.read_text(encoding='utf-8')
          rows = []
          for line in Path('/tmp/ga017.tsv').read_text(encoding='utf-8').splitlines():
              n, context_id, url, transcript_hash, anchor = line.split('\t', 4)
              rows.append((int(n), context_id, url, transcript_hash, anchor))
          assert [r[0] for r in rows] == list(range(1, 43))
          assert len({r[1] for r in rows}) == 42
          assert len({r[2] for r in rows}) == 42

          positions = []
          cursor = 0
          for n, context_id, url, transcript_hash, anchor in rows:
              pos = source.find(anchor, cursor)
              if pos < 0:
                  raise SystemExit(f'take {n}: source anchor not found: {anchor!r}')
              positions.append(pos)
              cursor = pos + len(anchor)

          take_records = []
          for idx, (n, context_id, url, transcript_hash, anchor) in enumerate(rows):
              start = positions[idx]
              end = positions[idx + 1] if idx + 1 < len(positions) else len(source)
              raw = source[start:end].strip()
              transcript = raw.replace('**', '').replace('~~', '')
              actual_hash = hashlib.sha256(transcript.encode('utf-8')).hexdigest()
              if actual_hash != transcript_hash:
                  raise SystemExit(f'take {n}: transcript/source hash mismatch: {actual_hash} != {transcript_hash}')

              out = chunks_dir / f'{n:02d}.mp3'
              req = urllib.request.Request(url, headers={'User-Agent':'greg-again-audio-capture/1.0'})
              with urllib.request.urlopen(req, timeout=60) as response, out.open('wb') as fh:
                  fh.write(response.read())
              if out.stat().st_size < 10_000:
                  raise SystemExit(f'take {n}: suspiciously small MP3: {out.stat().st_size}')
              duration = float(subprocess.check_output([
                  'ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(out)
              ], text=True).strip())
              if duration <= 0:
                  raise SystemExit(f'take {n}: non-positive duration')
              audio_sha = hashlib.sha256(out.read_bytes()).hexdigest()
              take_records.append({
                  'take': n,
                  'transcript': transcript,
                  'transcript_sha256': actual_hash,
                  'provider_context_id': context_id,
                  'preview_url': url,
                  'durable_file': str(out).replace('\\','/'),
                  'audio_sha256': audio_sha,
                  'duration_seconds': round(duration, 3),
                  'status': 'artifact_captured'
              })

          concat = Path('/tmp/ga017-concat.txt')
          concat.write_text(''.join(f"file '{(chunks_dir / f'{n:02d}.mp3').resolve()}'\n" for n in range(1, 43)), encoding='utf-8')
          subprocess.run(['ffmpeg','-v','error','-y','-f','concat','-safe','0','-i',str(concat),'-c','copy',str(final_path)], check=True)
          final_duration = float(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(final_path)
          ], text=True).strip())
          if final_path.stat().st_size < 1_000_000 or final_duration <= 0:
              raise SystemExit('assembled Chapter 17 MP3 failed durability/playability checks')

          spoken_source = source[positions[0]:].strip().replace('**','').replace('~~','')
          assembled_text = '\n\n'.join(t['transcript'] for t in take_records)
          def norm(s): return ' '.join(s.split())
          if norm(spoken_source) != norm(assembled_text):
              raise SystemExit('assembled take transcript coverage/order differs from current spoken source')

          final_map = {
              'chapter_id': 'ga-017',
              'chapter_number': 17,
              'title': 'The Extra Hand',
              'written_source_title': 'The Wrong Rope',
              'source': 'r2/assets/written/ch017.md',
              'source_blob_sha': '46429c720be7455d28474fb94042865c7b10a906',
              'voice': 'deep',
              'production_mode': 'original_short_take_complete_preview',
              'take_count': 42,
              'artifact_boundary': 'direct_preview_captured',
              'assembled_file': 'greg-again/audio/assets/chapter-017.mp3',
              'assembled_duration_seconds': round(final_duration, 3),
              'assembled_audio_sha256': hashlib.sha256(final_path.read_bytes()).hexdigest(),
              'status': 'verified_playable',
              'preserves_legacy_take_map': 'greg-again/audio/takes/017.json on audio/greg-again-batch-015-017',
              'verification': {
                  'exact_source_coverage': True,
                  'take_order': list(range(1, 43)),
                  'all_preview_urls_direct_mp3': True,
                  'all_provider_context_ids_unique': True,
                  'all_takes_ffprobe_playable': True,
                  'assembled_ffprobe_playable': True
              },
              'takes': take_records
          }
          take_map_path.write_text(json.dumps(final_map, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps({'take_count':42,'duration_seconds':round(final_duration,3),'bytes':final_path.stat().st_size}, indent=2))
          PY

      - name: Commit durable Chapter 17 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/greg-again-ch017-capture.yml
          git add \
            greg-again/audio/takes/017-short.json \
            greg-again/audio/assets/chunks/017-short \
            greg-again/audio/assets/chapter-017.mp3
          git commit -m 'audio: capture Chapter 17 short takes'
          git push origin HEAD:audio/greg-again-ch017-auto
