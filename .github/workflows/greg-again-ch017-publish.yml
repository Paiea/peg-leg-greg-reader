name: Publish Greg Again Chapter 17

on:
  push:
    branches:
      - audio/greg-again-ch017-auto
    paths:
      - .github/workflows/greg-again-ch017-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch017-auto
          fetch-depth: 0

      - name: Reconcile newest main before shared audio surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Publish stable Chapter 17 identity only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          audio = Path('greg-again/audio')
          r2 = Path('r2')
          take_map = json.loads((audio / 'takes/017-short.json').read_text(encoding='utf-8'))
          assert take_map['chapter_id'] == 'ga-017'
          assert take_map['chapter_number'] == 17
          assert take_map['title'] == 'The Extra Hand'
          assert take_map['voice'] == 'deep'
          assert take_map['production_mode'] == 'original_short_take_complete_preview'
          assert take_map['take_count'] == 42
          assert take_map['status'] == 'verified_playable'
          assert take_map['verification']['exact_source_coverage'] is True
          assert take_map['artifact_boundary'] == 'direct_preview_captured'
          assert all(t['status'] == 'artifact_captured' for t in take_map['takes'])

          duration = round(float(take_map['assembled_duration_seconds']), 3)
          manifest_path = audio / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          chapters = [c for c in manifest['chapters'] if c.get('chapter_id') != 'ga-017' and c.get('number') != 17]
          chapters.append({
              'chapter_id': 'ga-017',
              'number': 17,
              'title': 'The Extra Hand',
              'status': 'experimental',
              'lens': 'shared-greg-surface',
              'audio_finish': 'processing-space',
              'take_count': 42,
              'duration_seconds': duration,
              'audio_src': 'assets/chapter-017.mp3',
              'note': 'Chapter 17 uses forty-two complete preview-safe deep-voice takes captured directly as durable MP3 artifacts. Exact current spoken-source coverage and take order are verified before stitching; the legacy eleven-take player-page transaction remains historical recovery evidence only.'
          })
          manifest['chapters'] = sorted(chapters, key=lambda c: c['number'])
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          registry_path = r2 / 'data/chapter-registry.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          reg = registry['chapters']['r2-ch017']
          reg['title'] = 'The Extra Hand'
          reg['pipeline']['audio'] = 'published'
          reg['next_action'] = 'plan_images'
          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          route_path = r2 / 'data/chapters/ch017.json'
          route = json.loads(route_path.read_text(encoding='utf-8'))
          route['title'] = 'The Extra Hand'
          route['audio'] = {'status': 'published', 'path': '../greg-again/audio/assets/chapter-017.mp3'}
          route_path.write_text(json.dumps(route, separators=(',', ':'), ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Add Chapter 17 publication verification
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_greg_again_audio_ch017.py <<'PY'
          import json
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          AUDIO = ROOT / 'greg-again' / 'audio'
          R2 = ROOT / 'r2'

          class GregAgainChapter17AudioTest(unittest.TestCase):
              def test_chapter_17_is_durable_exact_and_published(self):
                  manifest = json.loads((AUDIO / 'manifest.json').read_text(encoding='utf-8'))
                  by_id = {c['chapter_id']: c for c in manifest['chapters']}
                  self.assertIn('ga-017', by_id)
                  ch = by_id['ga-017']
                  self.assertEqual(17, ch['number'])
                  self.assertEqual('The Extra Hand', ch['title'])
                  self.assertEqual(42, ch['take_count'])
                  self.assertEqual('assets/chapter-017.mp3', ch['audio_src'])

                  audio = AUDIO / 'assets' / 'chapter-017.mp3'
                  self.assertTrue(audio.exists())
                  self.assertGreater(audio.stat().st_size, 1_000_000)

                  take_map = json.loads((AUDIO / 'takes' / '017-short.json').read_text(encoding='utf-8'))
                  self.assertEqual('ga-017', take_map['chapter_id'])
                  self.assertEqual('deep', take_map['voice'])
                  self.assertEqual('original_short_take_complete_preview', take_map['production_mode'])
                  self.assertEqual('direct_preview_captured', take_map['artifact_boundary'])
                  self.assertEqual('verified_playable', take_map['status'])
                  self.assertEqual(42, take_map['take_count'])
                  self.assertEqual(42, len(take_map['takes']))
                  self.assertTrue(take_map['verification']['exact_source_coverage'])
                  self.assertEqual(list(range(1,43)), take_map['verification']['take_order'])
                  self.assertTrue(all(t['status'] == 'artifact_captured' for t in take_map['takes']))
                  self.assertEqual(42, len({t['provider_context_id'] for t in take_map['takes']}))
                  self.assertEqual(42, len({t['preview_url'] for t in take_map['takes']}))
                  self.assertTrue(all('/mcp-preview/' in t['preview_url'] and t['preview_url'].endswith('.mp3') for t in take_map['takes']))
                  for i in range(1, 43):
                      take = AUDIO / 'assets' / 'chunks' / '017-short' / f'{i:02d}.mp3'
                      self.assertTrue(take.exists())
                      self.assertGreater(take.stat().st_size, 10_000)

                  route = json.loads((R2 / 'data' / 'chapters' / 'ch017.json').read_text(encoding='utf-8'))
                  self.assertEqual('The Extra Hand', route['title'])
                  self.assertEqual('published', route['audio']['status'])
                  self.assertEqual('../greg-again/audio/assets/chapter-017.mp3', route['audio']['path'])

                  registry = json.loads((R2 / 'data' / 'chapter-registry.json').read_text(encoding='utf-8'))
                  reg = registry['chapters']['r2-ch017']
                  self.assertEqual('The Extra Hand', reg['title'])
                  self.assertEqual('published', reg['pipeline']['audio'])

              def test_historical_legacy_map_is_not_reintroduced_on_current_branch(self):
                  self.assertFalse((AUDIO / 'takes' / '017.json').exists())

          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Verify publication and scope
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_greg_again_audio_ch017.py' -v
          python -m unittest discover -s tests -p 'test_greg_again_audio_catalog.py' -v
          changed="$(git diff --name-only origin/main)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)(ch016|ch020|ch023|chapter-016|chapter-020|chapter-023|016-short|020-short|023-short)'; then
            echo 'Forbidden chapter scope touched' >&2
            exit 1
          fi

      - name: Commit Chapter 17 publication payload
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/greg-again-ch017-publish.yml
          git add \
            greg-again/audio/manifest.json \
            r2/data/chapter-registry.json \
            r2/data/chapters/ch017.json \
            tests/test_greg_again_audio_ch017.py
          git commit -m 'audio: publish Greg Again Chapter 17'
          git push origin HEAD:audio/greg-again-ch017-auto
