          34	f79a0de794e1460ebc2a930ae424284f	https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b438704f-d8ba-458a-a31a-5f513e27262d.mp3
          EOF

          : > /tmp/concat.txt
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          rows=[]
          total=0.0
          for line in Path('/tmp/takes.tsv').read_text().splitlines():
              take, context_id, url = line.split('\t')
              dest=Path('greg-again/audio/assets/chunks/018') / f'{take}.mp3'
              subprocess.run(['curl','-L','--fail','--retry','3','--silent','--show-error',url,'-o',str(dest)], check=True)
              probe=subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(dest)], text=True).strip()
              duration=float(probe)
              if duration <= 0:
                  raise SystemExit(f'non-positive duration for take {take}')
              total += duration
              rows.append({'take':take,'context_id':context_id,'preview_url':url,'voice':'deep','status':'artifact_captured','durable_file':str(dest),'duration_seconds':round(duration,3)})
          Path('greg-again/audio/takes/018.json').write_text(json.dumps({'chapter':18,'voice':'deep','take_count':len(rows),'takes':rows},indent=2)+'\n')
          Path('/tmp/concat.txt').write_text(''.join(f"file '{Path(r['durable_file']).resolve()}'\n" for r in rows))
          print(f'takes={len(rows)} total_take_duration={total:.3f}')
          PY

          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i /tmp/concat.txt -c copy greg-again/audio/assets/chapter-018.mp3
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 greg-again/audio/assets/chapter-018.mp3 | tee /tmp/ch018-probe.txt
          test "$(find greg-again/audio/assets/chunks/018 -type f -name '*.mp3' | wc -l)" -eq 34
          test "$(stat -c%s greg-again/audio/assets/chapter-018.mp3)" -gt 1000000

      - name: Commit durable Chapter 18 audio artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chunks/018 greg-again/audio/assets/chapter-018.mp3 greg-again/audio/takes/018.json
          git commit -m 'audio: capture and stitch Greg Again Chapter 18' || exit 0
          git push origin HEAD:audio/greg-again-ch018-auto
