name: Capture Greg Again Chapter 18 audio

on:
  push:
    branches:
      - audio/greg-again-ch018-auto
    paths:
      - .github/workflows/greg-again-ch018-capture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch018-auto
          fetch-depth: 0

      - name: Capture, verify, and stitch final takes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/assets/chunks/018 greg-again/audio/takes
          cat > /tmp/takes.tsv <<'EOF'
          01	d93873872868418e87a52efdc5abc445	https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b04fa8b4-0c27-4121-9cfe-49fbf88e73a9.mp3
