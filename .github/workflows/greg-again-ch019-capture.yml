name: Greg Again Chapter 19 Capture

on:
  push:
    branches:
      - audio/greg-again-ch019-auto
    paths:
      - .github/workflows/greg-again-ch019-capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch019-auto
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Capture provider takes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' ' Omitted'