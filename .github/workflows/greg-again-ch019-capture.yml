name: Greg Again Chapter 19 Capture

on:
  push:
    branches:
      - audio/greg-again-ch019-auto
    paths:
      - .github/workflows/greg-again-ch019-capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch019-auto
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Capture provider takes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/assets/chunks/019
          while IFS=$'\t' read -r n context url; do
            out="greg-again/audio/assets/chunks/019/${n}.mp3"
            curl --fail --location --retry 3 --output "$out" "$url"
            test -s "$out"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out"
          done < greg-again/audio/production/019/provider-artifacts.tsv
      - name: Update durable take map
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for line in Path('greg-again/audio/production/019/provider-artifacts.tsv').read_text().splitlines():
              n,context,url=line.split('\t')
              rows.append((int(n),context,url))
          path=Path('greg-again/audio/takes/019.json')
          data=json.loads(path.read_text())
          assert data['take_count']==36
          assert [t['take'] for t in data['takes']] == list(range(1,37))
          lookup={n:(context,url) for n,context,url in rows}
          for take in data['takes']:
              n=take['take']; context,url=lookup[n]
              take['provider_context_id']=context
              take['provider_preview_url']=url
              take['durable_audio']=f'assets/chunks/019/{n:02d}.mp3'
              take['status']='artifact_captured'
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Stitch Chapter 19
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/concat.txt
          for n in $(seq -w 1 36); do
            printf "file '%s'\n" "$GITHUB_WORKSPACE/greg-again/audio/assets/chunks/019/${n}.mp3" >> /tmp/concat.txt
          done
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i /tmp/concat.txt -c copy greg-again/audio/assets/chapter-019.mp3
          test -s greg-again/audio/assets/chapter-019.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 greg-again/audio/assets/chapter-019.mp3 | tee /tmp/duration.txt
      - name: Record capture status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          duration=Path('/tmp/duration.txt').read_text().strip()
          out=Path('greg-again/audio/production/019/STATUS.md')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(
              '# Greg, Again Chapter 19 audio production\n\n'
              'Claim: `audio/greg-again-ch019-auto`\n'
              'Source: `r2/assets/written/ch019.md`\n'
              'Title: **The Maintainer**\n'
              'Voice: `deep`\n'
              'Takes: **36 / 36 artifact-captured**\n'
              'Final MP3: `greg-again/audio/assets/chapter-019.mp3`\n'
              f'Duration seconds: **{duration}**\n\n'
              'All 36 provider-safe takes were captured from the exact successful provider preview artifacts recorded in `greg-again/audio/takes/019.json`, stitched in numeric order, and ffprobe-verified. Publication/shared-manifest reconciliation remains the next step.\n'
          )
          PY
      - name: Commit durable Chapter 19 audio
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chunks/019 greg-again/audio/assets/chapter-019.mp3 greg-again/audio/takes/019.json greg-again/audio/production/019/STATUS.md
          git commit -m 'audio: capture and stitch Greg Again Chapter 19'
          git push origin HEAD:audio/greg-again-ch019-auto
