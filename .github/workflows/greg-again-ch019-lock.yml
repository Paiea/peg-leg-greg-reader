name: Greg Again Chapter 19 Lock Takes

on:
  push:
    branches:
      - audio/greg-again-ch019-auto
    paths:
      - .github/workflows/greg-again-ch019-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch019-auto
          fetch-depth: 0
      - name: Lock exact provider-safe takes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path

          src = Path('r2/assets/written/ch019.md').read_text(encoding='utf-8')
          if '\n---\n' not in src:
              raise SystemExit('missing prose separator')
          prose = src.split('\n---\n', 1)[1].strip()
          spoken = prose.replace('**', '')
          paras = [p.strip() for p in re.split(r'\n\s*\n', spoken) if p.strip()]
          LIMIT = 430

          def split_long(text):
              if len(text) <= LIMIT:
                  return [text]
              pieces = re.split(r'(?<=[.!?])\s+', text)
              out, cur = [], ''
              for piece in pieces:
                  if len(piece) > LIMIT:
                      words = piece.split()
                      for word in words:
                          cand = (cur + ' ' + word).strip()
                          if cur and len(cand) > LIMIT:
                              out.append(cur); cur = word
                          else:
                              cur = cand
                  else:
                      cand = (cur + ' ' + piece).strip() if cur else piece
                      if cur and len(cand) > LIMIT:
                          out.append(cur); cur = piece
                      else:
                          cur = cand
              if cur:
                  out.append(cur)
              return out

          units = []
          for p in paras:
              units.extend(split_long(p))

          takes, cur = [], ''
          for u in units:
              cand = (cur + '\n\n' + u).strip() if cur else u
              if cur and len(cand) > LIMIT:
                  takes.append(cur); cur = u
              else:
                  cur = cand
          if cur:
              takes.append(cur)

          if '\n\n'.join(takes) != '\n\n'.join(paras):
              raise SystemExit('coverage mismatch')
          if max(map(len, takes)) > LIMIT:
              raise SystemExit('provider-safe limit exceeded')

          out = {
              'chapter_id': 'ga-019',
              'chapter_number': 19,
              'title': 'The Maintainer',
              'source_path': 'r2/assets/written/ch019.md',
              'source_normalization': 'prose after separator; markdown bold markers removed mechanically',
              'voice': 'deep',
              'take_count': len(takes),
              'takes': []
          }
          for i, t in enumerate(takes, 1):
              out['takes'].append({
                  'take': i,
                  'chars': len(t),
                  'transcript': t,
                  'start': t[:80],
                  'end': t[-80:],
                  'provider_context_id': None,
                  'provider_preview_url': None,
                  'durable_audio': None,
                  'status': 'locked'
              })

          p = Path('greg-again/audio/takes/019.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          s = Path('greg-again/audio/scripts/019-the-maintainer.md')
          s.parent.mkdir(parents=True, exist_ok=True)
          s.write_text(
              '# Greg, Again - Chapter 19 Audio Finish\n\n'
              'Chapter: **019 - The Maintainer**\n'
              'Source authority: `r2/assets/written/ch019.md`\n'
              'Voice: `deep`\n'
              'Lens: **SHARED GREG SURFACE**\n'
              'Audio finish: **PROCESSING SPACE**\n'
              'Claim: `audio/greg-again-ch019-auto`\n\n'
              '## Listening guardrail\n\n'
              '> **THE CLEAN OBJECT IS NOT THE SYSTEM.**\n\n'
              'Preserve the chapter’s distinction between remembering a mature filter and discovering the present-day maintenance system: matched spares, service labor, warning marks, route time, cleaning capacity, and learning one before scaling. Do not optimize away Greg’s processing or Ivena/Arlo/customer ownership.\n\n'
              f'## Locked take factory\n\n{len(takes)} deterministic provider-safe takes, each <= {LIMIT} characters. The exact transcripts and boundaries live in `greg-again/audio/takes/019.json`. Take seams are production seams only.\n',
              encoding='utf-8'
          )
          print(json.dumps({'take_count': len(takes), 'max_chars': max(map(len,takes)), 'spoken_chars': len(spoken)}, indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/takes/019.json greg-again/audio/scripts/019-the-maintainer.md
          git commit -m 'audio: lock Chapter 19 provider-safe takes'
          git push origin HEAD:audio/greg-again-ch019-auto
