name: Capture Greg Again Chapter 20 Preview Audio

on:
  push:
    branches:
      - audio/greg-again-ch020-recovery-publish
    paths:
      - .github/workflows/greg-again-ch020-preview-capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch020-recovery-publish
      - name: Capture preview-safe take
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/assets/chunks/020
          curl --fail --location --retry 3 \
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/148f226d-81bc-4cd0-8b02-c49a619754cb.mp3' \
            -o greg-again/audio/assets/chunks/020/01.mp3
          test "$(stat -c%s greg-again/audio/assets/chunks/020/01.mp3)" -gt 1000
          python - <<'PY'
          from pathlib import Path
          p = Path('greg-again/audio/assets/chunks/020/01.mp3')
          head = p.read_bytes()[:3]
          if head != b'ID3' and not (len(head) >= 2 and head[0] == 0xFF and (head[1] & 0xE0) == 0xE0):
              raise SystemExit(f'unexpected MP3 signature: {head!r}')
          print(f'captured {p} ({p.stat().st_size} bytes)')
          PY
      - name: Commit captured artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chunks/020/01.mp3
          if git diff --cached --quiet; then
            echo 'No artifact change to commit.'
            exit 0
          fi
          git commit -m 'audio: capture Chapter 20 preview-safe take 01'
          git push origin HEAD:audio/greg-again-ch020-recovery-publish
