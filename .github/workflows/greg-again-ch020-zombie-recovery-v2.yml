name: Capture Greg Again Chapter 20 Zombie Recovery v2

on:
  push:
    branches:
      - audio/greg-again-ch020-zombie-publish
    paths:
      - '.github/workflows/greg-again-ch020-zombie-recovery-v2.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch020-zombie-publish
          fetch-depth: 1
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Capture preview-safe takes and assemble chapter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf greg-again/audio/assets/chunks/020-short
          mkdir -p greg-again/audio/assets/chunks/020-short greg-again/audio/verification greg-again/audio/takes /tmp/ga20
          awk '/cat > \/tmp\/ga20\/takes.tsv/{flag=1;next} flag && /^[[:space:]]+EOF$/{exit} flag{sub(/^          /,"");print}' .github/workflows/greg-again-ch020-zombie-recovery.yml > /tmp/ga20/takes.tsv
          test "$(wc -l < /tmp/ga20/takes.tsv)" -eq 41
          : > /tmp/ga20/concat.txt
          : > /tmp/ga20/meta.tsv
          n=0
          while IFS=$'\t' read -r context url; do
            n=$((n+1))
            take="$(printf '%02d' "$n")"
            out="greg-again/audio/assets/chunks/020-short/${take}.mp3"
            curl -L --fail -sS --retry 3 --connect-timeout 20 --max-time 180 "$url" -o "$out"
            test "$(stat -c%s "$out")" -gt 10000
            duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$out")"
            sha="$(sha256sum "$out" | awk '{print $1}')"
            printf "file '%s'\n" "$GITHUB_WORKSPACE/$out" >> /tmp/ga20/concat.txt
            printf '%s\t%s\t%s\t%s\t%s\n' "$n" "$context" "$url" "$duration" "$sha" >> /tmp/ga20/meta.tsv
          done < /tmp/ga20/takes.tsv
          test "$n" -eq 41
          ffmpeg -v error -f concat -safe 0 -i /tmp/ga20/concat.txt -af 'apad=pad_dur=2' -c:a libmp3lame -q:a 2 greg-again/audio/assets/chapter-020.mp3
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 greg-again/audio/assets/chapter-020.mp3)"
          size="$(stat -c%s greg-again/audio/assets/chapter-020.mp3)"
          test "$size" -gt 1000000
          sha256="$(sha256sum greg-again/audio/assets/chapter-020.mp3 | awk '{print $1}')"
          python - /tmp/ga20/meta.tsv "$duration" "$size" "$sha256" <<'PY'
          import json, sys
          meta, chapter_duration, chapter_size, chapter_sha = sys.argv[1:]
          takes=[]
          for line in open(meta, encoding='utf-8'):
              n, context, url, duration, sha = line.rstrip('\n').split('\t')
              takes.append({'take':int(n),'provider_context_id':context,'preview_url':url,'provider_audio_url':f'https://www.aidocmaker.com/g0/audio?name={context}','status':'artifact_captured','durable_file':f'greg-again/audio/assets/chunks/020-short/{int(n):02d}.mp3','duration_seconds':float(duration),'sha256':sha})
          take_map={'chapter_id':'ga-020','chapter_number':20,'title':'The Ward Hand','voice':'deep','production_mode':'original_short_take_complete_preview','written_source':'r2/assets/written/ch020.md','written_ref':'main','written_source_sha':'a39e994cfe329731355ab84e802235aa56f31cc3','take_count':len(takes),'component_duration_seconds':sum(t['duration_seconds'] for t in takes),'assembled_duration_seconds':float(chapter_duration),'status':'verified_playable','takes':takes}
          with open('greg-again/audio/takes/020-short.json','w',encoding='utf-8') as f: json.dump(take_map,f,indent=2); f.write('\n')
          verification={'chapter_id':'ga-020','number':20,'title':'The Ward Hand','voice':'deep','production_mode':'original_short_take_complete_preview','written_source':'r2/assets/written/ch020.md','written_source_sha':'a39e994cfe329731355ab84e802235aa56f31cc3','take_count':len(takes),'duration_seconds':float(chapter_duration),'size_bytes':int(chapter_size),'sha256':chapter_sha,'trailing_silence_added_seconds':2.0,'status':'verified_playable'}
          with open('greg-again/audio/verification/020-short.json','w',encoding='utf-8') as f: json.dump(verification,f,indent=2); f.write('\n')
          PY
      - name: Commit recovered audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chunks/020-short greg-again/audio/assets/chapter-020.mp3 greg-again/audio/takes/020-short.json greg-again/audio/verification/020-short.json
          git commit -m 'audio: capture and assemble Greg Again Chapter 20'
          git push origin HEAD:audio/greg-again-ch020-zombie-publish
