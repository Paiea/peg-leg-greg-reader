name: Capture Greg Again Chapter 20 Zombie Recovery

on:
  push:
    branches:
      - audio/greg-again-ch020-zombie-publish
    paths:
      - '.github/workflows/greg-again-ch020-zombie-recovery.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch020-zombie-publish
