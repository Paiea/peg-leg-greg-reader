name: Greg Again Chapter 22 capture

on:
  push:
    branches:
      - audio/greg-again-ch022-auto
    paths:
      - .github/workflows/greg-again-ch022-capture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch022-auto
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser and audio harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Capture Chapter 22 takes
        shell: bash
        run: |
          mkdir -p greg-again/audio/assets/chunks/022
          cat > capture.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const map=JSON.parse(fs.readFileSync('greg-again/audio/takes/022.json','utf8'));
          const jobs=map.takes.map(t=>[t.take,t.provider_context_id]);
          const browser=await chromium.launch({headless:true});
          const failures=[];
          async function capture(label,id){
            const out=`greg-again/audio/assets/chunks/022/${label}.mp3`;
            if(fs.existsSync(out)&&fs.statSync(out).size>10000)return;
            const page=await browser.newPage();
            try{
              for(let attempt=1;attempt<=12;attempt++){
                await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForTimeout(5000);
                const text=await page.locator('body').innerText().catch(()=> '');
                console.log('SEGMENT',label,'ATTEMPT',attempt,text.slice(0,700).replaceAll('\n',' | '));
                if(/longer than 2 minutes requires a paid plan/i.test(text))throw new Error('two-minute gate');
                if(/File Not Found/i.test(text))throw new Error('file not found');
                const sources=await page.locator('audio').evaluateAll(nodes=>nodes.map(n=>n.currentSrc||n.src).filter(Boolean)).catch(()=>[]);
                for(const src of sources){
                  const response=await page.request.get(src).catch(()=>null);
                  if(!response||!response.ok())continue;
                  const body=await response.body();
                  if(body.length>10000){fs.writeFileSync(out,body);console.log('CAPTURED',label,body.length);return;}
                }
                await page.waitForTimeout(4000);
              }
              throw new Error('no playable media surfaced');
            }finally{await page.close();}
          }
          for(const [label,id] of jobs){try{await capture(label,id);}catch(error){failures.push(`${label}: ${error.message}`);console.log('FAILED',label,error.message);}}
          await browser.close();
          fs.writeFileSync('/tmp/capture-failures.txt',failures.join('\n'));
          JS
          node capture.mjs
      - name: Commit every successful chunk
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git stash push --include-untracked --message chapter-22-takes
          git pull --rebase origin audio/greg-again-ch022-auto
          git stash pop
          git add greg-again/audio/assets/chunks/022
          if ! git diff --cached --quiet; then
            git commit -m 'audio: persist Greg Again Chapter 22 takes'
            git push origin HEAD:audio/greg-again-ch022-auto
          fi
      - name: Verify and assemble Chapter 22
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/capture-failures.txt ]; then cat /tmp/capture-failures.txt; exit 1; fi
          test "$(find greg-again/audio/assets/chunks/022 -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 10
          : > /tmp/ch22-concat.txt
          for i in $(seq 1 10); do
            f=$(printf 'greg-again/audio/assets/chunks/022/%02d.mp3' "$i")
            test "$(stat -c%s "$f")" -gt 10000
            ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$f"
            printf "file '%s'\n" "$GITHUB_WORKSPACE/$f" >> /tmp/ch22-concat.txt
          done
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i /tmp/ch22-concat.txt -c copy greg-again/audio/assets/chapter-022.mp3
          test "$(stat -c%s greg-again/audio/assets/chapter-022.mp3)" -gt 1000000
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 greg-again/audio/assets/chapter-022.mp3
          python3 - <<'PY'
          import json, subprocess
          p='greg-again/audio/takes/022.json'
          d=json.load(open(p))
          total=0.0
          for t in d['takes']:
              f=t['durable_file']
              dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',f],text=True).strip())
              t['status']='artifact_captured'
              t['duration_seconds']=round(dur,3)
              total += dur
          chapter='greg-again/audio/assets/chapter-022.mp3'
          chapter_dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',chapter],text=True).strip())
          d['status']='verified_playable'
          d['take_duration_sum_seconds']=round(total,3)
          d['assembled_duration_seconds']=round(chapter_dur,3)
          with open(p,'w') as fh:
              json.dump(d,fh,indent=2)
              fh.write('\n')
          PY
      - name: Commit assembled Chapter 22
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git stash push --include-untracked --message chapter-22-final
          git pull --rebase origin audio/greg-again-ch022-auto
          git stash pop
          git add greg-again/audio/assets/chapter-022.mp3 greg-again/audio/takes/022.json
          if ! git diff --cached --quiet; then
            git commit -m 'audio: assemble Greg Again Chapter 22'
            git push origin HEAD:audio/greg-again-ch022-auto
          fi
