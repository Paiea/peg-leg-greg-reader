name: Final Reconcile Greg Again Chapter 22

on:
  push:
    branches:
      - audio/greg-again-ch022-auto
    paths:
      - .github/workflows/greg-again-ch022-reconcile-final.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch022-auto
          fetch-depth: 0
      - name: Merge newest main and preserve Chapter 22 manifest entry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json
          d=json.load(open('greg-again/audio/manifest.json'))
          entry=next(ch for ch in d['chapters'] if ch['chapter_id']=='ga-022')
          json.dump(entry,open('/tmp/ga022-entry.json','w'))
          PY
          git fetch origin main
          set +e
          git merge --no-commit origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            unmerged="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$unmerged" | grep -v '^greg-again/audio/manifest.json$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            git checkout --theirs greg-again/audio/manifest.json
            git add greg-again/audio/manifest.json
          fi
          python3 - <<'PY'
          import json
          p='greg-again/audio/manifest.json'
          d=json.load(open(p))
          entry=json.load(open('/tmp/ga022-entry.json'))
          chapters=[ch for ch in d['chapters'] if ch['chapter_id']!='ga-022']
          chapters.append(entry)
          chapters.sort(key=lambda ch: ch['number'])
          d['chapters']=chapters
          with open(p,'w') as f:
              json.dump(d,f,indent=2,ensure_ascii=False)
              f.write('\n')
          PY
          git add greg-again/audio/manifest.json
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m 'Merge newest main before Chapter 22 publication'
          else
            git commit -m 'audio: reconcile Chapter 22 manifest with newest main' || true
          fi
          git push origin HEAD:audio/greg-again-ch022-auto
