name: Capture and stitch Greg Again Chapter 25

on:
  push:
    branches:
      - audio/greg-again-ch025-auto
    paths:
      - .github/workflows/greg-again-ch025-capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch025-auto
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Materialize locked short-take records
        shell: bash
        env:
          PAYLOAD_B64: ''
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/scripts greg-again/audio/takes
          python3 - <<'PY'
          import base64, json, os, zlib
          from pathlib import Path
          payload=json.loads(zlib.decompress(base64.b64decode(os.environ['PAYLOAD_B64'])))
          Path('greg-again/audio/scripts/025-short-transcripts.json').write_text(json.dumps(payload['spec'], indent=2, ensure_ascii=False)+'\n')
          Path('greg-again/audio/takes/025-short.json').write_text(json.dumps(payload['take_map'], indent=2, ensure_ascii=False)+'\n')
          PY

      - name: Verify exact take coverage and provider identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          src=Path('r2/assets/written/ch025.md').read_text()
          body=src.split('\n---\n',1)[1].strip().replace('**','')
          spec=json.loads(Path('greg-again/audio/scripts/025-short-transcripts.json').read_text())
          m=json.loads(Path('greg-again/audio/takes/025-short.json').read_text())
          assert spec['chapter_id']=='ga-025' and spec['chapter_number']==25 and spec['title']=='The Hired Sword'
          assert spec['written_source_title']=='The Hired Sword' and spec['voice']=='deep'
          assert len(spec['takes'])==len(m['takes'])==38
          assert [x['take'] for x in spec['takes']]==list(range(1,39))
          rebuilt='\n\n'.join(x['transcript'].strip() for x in spec['takes'])
          assert rebuilt==body, 'short-take transcripts do not exactly reconstruct current spoken body'
          for s,t in zip(spec['takes'],m['takes']):
              h=hashlib.sha256(s['transcript'].encode()).hexdigest()
              assert h==s['sha256']==t['transcript_sha256']
              assert t['provider_context_id']
              assert t['preview_url'].startswith('https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/')
              assert t['status']=='generated_preview_url_captured'
          assert len({x['provider_context_id'] for x in m['takes']})==38
          assert len({x['preview_url'] for x in m['takes']})==38
          print(f'exact coverage verified: {len(body)} chars across 38 ordered takes')
          PY

      - name: Capture and verify 38 direct preview MP3s
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/assets/chunks/025-short
          python3 - <<'PY' > /tmp/urls.txt
          import json
          from pathlib import Path
          m=json.loads(Path('greg-again/audio/takes/025-short.json').read_text())
          for t in m['takes']: print(t['preview_url'])
          PY
          i=0
          while IFS= read -r url; do
            i=$((i+1)); n=$(printf '%02d' "$i")
            out="greg-again/audio/assets/chunks/025-short/${n}.mp3"
            curl -L --fail --silent --show-error "$url" -o "$out"
            size=$(stat -c%s "$out"); test "$size" -gt 10000
            duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out")
            codec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$out")
            test "$codec" = mp3
            python3 - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1]); assert 2.0 < d < 29.9, d
          PY
            echo "take ${n}: bytes=${size} duration=${duration} codec=${codec}"
          done < /tmp/urls.txt
          test "$i" -eq 38

      - name: Stitch Chapter 25 and add chapter-tail landing
        shell: bash
        run: |
          set -euo pipefail
          list=$(mktemp)
          for i in $(seq -w 1 38); do printf "file '%s'\n" "$GITHUB_WORKSPACE/greg-again/audio/assets/chunks/025-short/${i}.mp3" >> "$list"; done
          ffmpeg -v error -f concat -safe 0 -i "$list" -af "apad=pad_dur=2" -c:a libmp3lame -q:a 2 greg-again/audio/assets/chapter-025.mp3
          size=$(stat -c%s greg-again/audio/assets/chapter-025.mp3); test "$size" -gt 1000000
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 greg-again/audio/assets/chapter-025.mp3)
          codec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 greg-again/audio/assets/chapter-025.mp3)
          test "$codec" = mp3
          python3 - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1]); assert 300 < d < 1200, d
          PY
          echo "chapter-025: bytes=${size} duration=${duration} codec=${codec}"

      - name: Record durable hashes durations and verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/verification
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          p=Path('greg-again/audio/takes/025-short.json'); m=json.loads(p.read_text())
          total=0.0
          for t in m['takes']:
              f=Path(f"greg-again/audio/assets/chunks/025-short/{t['take']:02d}.mp3")
              dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(f)],text=True).strip())
              t['duration_seconds']=round(dur,3); total+=dur
              t['status']='artifact_captured_verified'; t['durable_file']=str(f)
              t['sha256']=hashlib.sha256(f.read_bytes()).hexdigest()
          a=Path('greg-again/audio/assets/chapter-025.mp3')
          ad=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(a)],text=True).strip())
          m.update({'status':'verified_playable','assembled_file':str(a),'assembled_duration_seconds':round(ad,3),'component_duration_seconds':round(total,3),'assembled_sha256':hashlib.sha256(a.read_bytes()).hexdigest(),'chapter_tail_silence_seconds_added':2.0})
          p.write_text(json.dumps(m,indent=2)+'\n')
          v={'chapter_id':'ga-025','chapter_number':25,'title':'The Hired Sword','voice':'deep','take_count':38,'exact_source_coverage':True,'take_order_verified':True,'individual_mp3s_verified':True,'assembled_mp3_verified':True,'assembled_duration_seconds':round(ad,3),'assembled_sha256':m['assembled_sha256'],'provider_context_count':38,'provider_preview_count':38,'chapter_tail_silence_seconds_added':2.0,'source_path':'r2/assets/written/ch025.md','source_blob_sha':'11229b660f83589b1249447b6e19f8a359e314ec'}
          Path('greg-again/audio/verification/025-short.json').write_text(json.dumps(v,indent=2)+'\n')
          print(json.dumps(v,indent=2))
          PY

      - name: Commit durable Chapter 25 artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/scripts/025-short-transcripts.json greg-again/audio/takes/025-short.json greg-again/audio/assets/chunks/025-short greg-again/audio/assets/chapter-025.mp3 greg-again/audio/verification/025-short.json
          git commit -m 'audio: capture and stitch Chapter 25 short takes'
          git push origin HEAD:audio/greg-again-ch025-auto
