name: Reconcile and publish Greg Again Chapter 25

on:
  push:
    branches:
      - audio/greg-again-ch025-auto
    paths:
      - .github/workflows/greg-again-ch025-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch025-auto
          fetch-depth: 0

      - name: Reconcile newest main before shared publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Publish only Chapter 25 shared surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path=Path('greg-again/audio/manifest.json')
          manifest=json.loads(manifest_path.read_text())
          verification=json.loads(Path('greg-again/audio/verification/025-short.json').read_text())
          assert verification['assembled_duration_seconds']==931.44
          entry={
            'chapter_id':'ga-025','number':25,'title':'The Hired Sword','status':'experimental',
            'lens':'shared-greg-surface','audio_finish':'processing-space','take_count':38,
            'duration_seconds':verification['assembled_duration_seconds'],
            'audio_src':'assets/chapter-025.mp3',
            'note':'Chapter 25 uses thirty-eight complete preview-safe deep-voice takes captured directly as durable MP3 artifacts. Exact current spoken-source coverage, ordered provider identity, individual MP3 playability, stitched chapter audio, durable hashes, and the final chapter-tail landing were verified before publication.'
          }
          manifest['chapters']=[x for x in manifest['chapters'] if x['chapter_id']!='ga-025']+[entry]
          manifest['chapters'].sort(key=lambda x:x['number'])
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')

          route_path=Path('r2/data/chapters/ch025.json')
          route=json.loads(route_path.read_text())
          assert route['chapter_id']=='r2-ch025' and route['display_number']==25
          assert route['title']=='The Hired Sword'
          assert route['written']['status']=='published'
          route['audio']={'status':'published','path':'../greg-again/audio/assets/chapter-025.mp3'}
          route_path.write_text(json.dumps(route,separators=(',',':'),ensure_ascii=False)+'\n')

          registry_path=Path('r2/data/chapter-registry.json')
          registry=json.loads(registry_path.read_text())
          ch=registry['chapters']['r2-ch025']
          assert ch['display_number']==25 and ch['title']=='The Hired Sword'
          assert ch['pipeline']['written']=='published'
          ch['pipeline']['audio']='published'
          if ch.get('next_action')=='publish_audio_and_plan_images': ch['next_action']='plan_images'
          registry_path.write_text(json.dumps(registry,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Add Chapter 25 audio contract test
        shell: bash
        run: |
          cat > tests/test_greg_again_audio_ch025.py <<'PY'
          import json
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          AUDIO_ROOT = ROOT / 'greg-again' / 'audio'
          R2_ROOT = ROOT / 'r2'

          class GregAgainChapter25AudioTest(unittest.TestCase):
              def test_chapter_25_is_durable_and_routed(self):
                  manifest=json.loads((AUDIO_ROOT/'manifest.json').read_text())
                  by_id={c['chapter_id']:c for c in manifest['chapters']}
                  c=by_id['ga-025']
                  self.assertEqual('The Hired Sword',c['title'])
                  self.assertEqual('shared-greg-surface',c['lens'])
                  self.assertEqual('processing-space',c['audio_finish'])
                  self.assertEqual(38,c['take_count'])
                  self.assertEqual(931.44,c['duration_seconds'])
                  self.assertEqual('assets/chapter-025.mp3',c['audio_src'])

                  final_audio=AUDIO_ROOT/'assets'/'chapter-025.mp3'
                  self.assertTrue(final_audio.exists())
                  self.assertGreater(final_audio.stat().st_size,1_000_000)

                  m=json.loads((AUDIO_ROOT/'takes'/'025-short.json').read_text())
                  self.assertEqual('ga-025',m['chapter_id'])
                  self.assertEqual('The Hired Sword',m['title'])
                  self.assertEqual('deep',m['voice'])
                  self.assertEqual('verified_playable',m['status'])
                  self.assertEqual(38,len(m['takes']))
                  self.assertEqual(931.44,m['assembled_duration_seconds'])
                  self.assertEqual('98a198d25553f57eb19fd1d0070928eb3336c0d6e71c16eb7ef4f7b25f5ded2d',m['assembled_sha256'])
                  for t in m['takes']:
                      self.assertEqual('artifact_captured_verified',t['status'])
                      f=ROOT/t['durable_file']
                      self.assertTrue(f.exists())
                      self.assertGreater(f.stat().st_size,10_000)
                      self.assertTrue(t['provider_context_id'])
                      self.assertTrue(t['preview_url'].startswith('https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/'))
                      self.assertEqual(64,len(t['sha256']))

                  v=json.loads((AUDIO_ROOT/'verification'/'025-short.json').read_text())
                  self.assertTrue(v['exact_source_coverage'])
                  self.assertTrue(v['take_order_verified'])
                  self.assertTrue(v['individual_mp3s_verified'])
                  self.assertTrue(v['assembled_mp3_verified'])
                  self.assertEqual(2.0,v['chapter_tail_silence_seconds_added'])

                  route=json.loads((R2_ROOT/'data'/'chapters'/'ch025.json').read_text())
                  self.assertEqual('The Hired Sword',route['title'])
                  self.assertEqual('published',route['audio']['status'])
                  self.assertEqual('../greg-again/audio/assets/chapter-025.mp3',route['audio']['path'])

                  registry=json.loads((R2_ROOT/'data'/'chapter-registry.json').read_text())
                  self.assertEqual('published',registry['chapters']['r2-ch025']['pipeline']['audio'])

          if __name__ == '__main__': unittest.main()
          PY

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only','origin/main'],text=True).splitlines()
          allowed_exact={
            '.github/workflows/greg-again-ch025-capture.yml',
            '.github/workflows/greg-again-ch025-publish.yml',
            'greg-again/audio/assets/chapter-025.mp3',
            'greg-again/audio/scripts/025-short-transcripts.json',
            'greg-again/audio/takes/025-short.json',
            'greg-again/audio/verification/025-short.json',
            'greg-again/audio/verification/025-scope.json',
            'greg-again/audio/manifest.json',
            'r2/data/chapters/ch025.json',
            'r2/data/chapter-registry.json',
            'tests/test_greg_again_audio_ch025.py',
          }
          def allowed(p):
              return p in allowed_exact or p.startswith('greg-again/audio/assets/chunks/025-short/')
          bad=[p for p in changed if not allowed(p)]
          assert not bad, f'unrelated surfaces changed: {bad}'
          scope={'chapter_id':'ga-025','base':'origin/main','unrelated_chapter_surfaces_changed':False,'changed_paths':changed}
          Path('greg-again/audio/verification/025-scope.json').write_text(json.dumps(scope,indent=2)+'\n')
          PY

      - name: Run Chapter 25 and catalog verification
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_greg_again_audio_ch025.py
          python -m unittest tests.test_greg_again_audio_catalog -v
          python -m json.tool greg-again/audio/manifest.json >/dev/null
          python -m json.tool r2/data/chapters/ch025.json >/dev/null
          python -m json.tool r2/data/chapter-registry.json >/dev/null

      - name: Commit reconciled Chapter 25 publication
        shell: bash
        run: |
          set -euo pipefail
          git add greg-again/audio/manifest.json r2/data/chapters/ch025.json r2/data/chapter-registry.json tests/test_greg_again_audio_ch025.py greg-again/audio/verification/025-scope.json
          git commit -m 'audio: republish Greg Again Chapter 25 over newest main' || true
          git push origin HEAD:audio/greg-again-ch025-auto
