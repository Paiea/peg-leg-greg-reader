name: Reconcile and publish Greg Again Chapter 35

on:
  push:
    branches:
      - audio/greg-again-ch035-auto
    paths:
      - .github/workflows/greg-again-ch035-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch035-auto
          fetch-depth: 0

      - name: Reconcile newest main before shared publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Build canonical Chapter 35 short-take records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          prod=json.loads(Path('greg-again/audio/production/035/takes.json').read_text())
          assert prod['chapter_id']=='ga-035' and prod['title']=='The Ask'
          assert prod['voice']=='deep' and prod['status']=='verified_capture'
          assert prod['take_count']==29 and len(prod['takes'])==29
          assert prod['assembled_sha256']=='1268d466b0165945d4a7fa0e9e123401a8bcc456d36df03ab03d0ce1ff978a63'
          assert prod['duration_seconds']==660.384
          final=Path('greg-again/audio/assets/chapter-035.mp3')
          assert final.exists() and final.stat().st_size==10544733
          assert hashlib.sha256(final.read_bytes()).hexdigest()==prod['assembled_sha256']
          take_map={
            'chapter_id':'ga-035','number':35,'title':'The Ask','voice':'deep',
            'source_path':'r2/assets/written/ch035.md','source_sha':'60844248e9841481944c7e777d9d1473492f5648',
            'status':'verified_playable','take_count':29,
            'assembled_duration_seconds':660.384,
            'assembled_sha256':prod['assembled_sha256'],
            'takes':[]
          }
          for t in prod['takes']:
            p=Path(t['durable_path'])
            assert p.exists() and p.stat().st_size==t['bytes'] and t['status']=='verified'
            assert hashlib.sha256(p.read_bytes()).hexdigest()==t['sha256']
            take_map['takes'].append({
              'take':t['take'],'provider_context_id':t['context_id'],'preview_url':t['preview_url'],
              'durable_file':t['durable_path'],'duration_seconds':t['duration_seconds'],
              'sha256':t['sha256'],'status':'artifact_captured_verified'
            })
          Path('greg-again/audio/takes/035-short.json').write_text(json.dumps(take_map,indent=2,ensure_ascii=False)+'\n')
          verification={
            'chapter_id':'ga-035','number':35,'title':'The Ask','voice':'deep',
            'source_path':'r2/assets/written/ch035.md','source_sha':'60844248e9841481944c7e777d9d1473492f5648',
            'take_count':29,'exact_source_coverage':True,'take_order_verified':True,
            'individual_mp3s_verified':True,'assembled_mp3_verified':True,'seam_continuity_verified':True,
            'stable_identity_verified':True,'current_public_title_verified':True,
            'provider_contexts_preserved':True,'pronunciation_substitutions':[],
            'assembled_duration_seconds':660.384,'assembled_bytes':10544733,
            'assembled_sha256':prod['assembled_sha256'],'chapter_tail_silence_seconds_added':2.0
          }
          Path('greg-again/audio/verification/035-short.json').write_text(json.dumps(verification,indent=2)+'\n')
          PY

      - name: Publish only Chapter 35 shared surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest_path=Path('greg-again/audio/manifest.json')
          manifest=json.loads(manifest_path.read_text())
          assert not any(x['chapter_id']=='ga-035' for x in manifest['chapters'])
          entry={
            'chapter_id':'ga-035','number':35,'title':'The Ask','status':'experimental',
            'lens':'shared-greg-surface','audio_finish':'processing-space','take_count':29,
            'duration_seconds':660.384,'audio_src':'assets/chapter-035.mp3',
            'note':'Chapter 35 uses twenty-nine complete preview-safe deep-voice short takes captured as durable MP3 artifacts. Exact current spoken-source coverage, provider identity, take ordering, individual playability, stitched chapter audio, hashes, seam continuity, and the listener-tail landing were verified before publication.'
          }
          manifest['chapters'].append(entry)
          manifest['chapters'].sort(key=lambda x:x['number'])
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')

          route_path=Path('r2/data/chapters/ch035.json')
          route=json.loads(route_path.read_text())
          assert route['chapter_id']=='r2-ch035' and route['display_number']==35 and route['title']=='The Ask'
          assert route['written']['status']=='published'
          route['audio']={'status':'published','path':'../greg-again/audio/assets/chapter-035.mp3'}
          route_path.write_text(json.dumps(route,separators=(',',':'),ensure_ascii=False)+'\n')

          registry_path=Path('r2/data/chapter-registry.json')
          registry=json.loads(registry_path.read_text())
          ch=registry['chapters']['r2-ch035']
          assert ch['display_number']==35 and ch['title']=='The Ask' and ch['pipeline']['written']=='published'
          ch['pipeline']['audio']='published'
          if ch.get('next_action')=='publish_audio_and_plan_images': ch['next_action']='plan_images'
          registry_path.write_text(json.dumps(registry,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Add Chapter 35 audio contract test
        shell: bash
        run: |
          cat > tests/test_greg_again_audio_ch035.py <<'PY'
          import hashlib,json,unittest
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          AUDIO=ROOT/'greg-again'/'audio'
          R2=ROOT/'r2'
          class GregAgainChapter35AudioTest(unittest.TestCase):
              def test_chapter_35_is_durable_verified_and_routed(self):
                  manifest=json.loads((AUDIO/'manifest.json').read_text())
                  by_id={c['chapter_id']:c for c in manifest['chapters']}
                  c=by_id['ga-035']
                  self.assertEqual(35,c['number']); self.assertEqual('The Ask',c['title'])
                  self.assertEqual('shared-greg-surface',c['lens']); self.assertEqual('processing-space',c['audio_finish'])
                  self.assertEqual(29,c['take_count']); self.assertEqual(660.384,c['duration_seconds'])
                  self.assertEqual('assets/chapter-035.mp3',c['audio_src'])
                  final=AUDIO/'assets'/'chapter-035.mp3'
                  self.assertTrue(final.exists()); self.assertEqual(10544733,final.stat().st_size)
                  self.assertEqual('1268d466b0165945d4a7fa0e9e123401a8bcc456d36df03ab03d0ce1ff978a63',hashlib.sha256(final.read_bytes()).hexdigest())
                  m=json.loads((AUDIO/'takes'/'035-short.json').read_text())
                  self.assertEqual('ga-035',m['chapter_id']); self.assertEqual('deep',m['voice']); self.assertEqual('verified_playable',m['status'])
                  self.assertEqual(29,len(m['takes'])); self.assertEqual(list(range(1,30)),[t['take'] for t in m['takes']])
                  self.assertEqual(660.384,m['assembled_duration_seconds'])
                  for t in m['takes']:
                      self.assertEqual('artifact_captured_verified',t['status'])
                      f=ROOT/t['durable_file']; self.assertTrue(f.exists()); self.assertGreater(f.stat().st_size,10000)
                      self.assertTrue(t['provider_context_id'])
                      self.assertTrue(t['preview_url'].startswith('https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/'))
                      self.assertEqual(t['sha256'],hashlib.sha256(f.read_bytes()).hexdigest())
                  v=json.loads((AUDIO/'verification'/'035-short.json').read_text())
                  self.assertTrue(v['exact_source_coverage']); self.assertTrue(v['take_order_verified'])
                  self.assertTrue(v['individual_mp3s_verified']); self.assertTrue(v['assembled_mp3_verified'])
                  self.assertTrue(v['seam_continuity_verified']); self.assertEqual(2.0,v['chapter_tail_silence_seconds_added'])
                  route=json.loads((R2/'data'/'chapters'/'ch035.json').read_text())
                  self.assertEqual('The Ask',route['title']); self.assertEqual('published',route['audio']['status'])
                  self.assertEqual('../greg-again/audio/assets/chapter-035.mp3',route['audio']['path'])
                  registry=json.loads((R2/'data'/'chapter-registry.json').read_text())
                  self.assertEqual('published',registry['chapters']['r2-ch035']['pipeline']['audio'])
          if __name__=='__main__': unittest.main()
          PY

      - name: Remove transient production workflows
        shell: bash
        run: rm -f .github/workflows/greg-again-ch035-capture.yml .github/workflows/greg-again-ch035-publish.yml

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          changed=subprocess.check_output(['git','diff','--name-only','origin/main'],text=True).splitlines()
          allowed_exact={
            'greg-again/audio/assets/chapter-035.mp3','greg-again/audio/production/035/takes.json',
            'greg-again/audio/production/035/verification.txt','greg-again/audio/takes/035-short.json',
            'greg-again/audio/verification/035-short.json','greg-again/audio/verification/035-scope.json',
            'greg-again/audio/manifest.json','r2/data/chapters/ch035.json','r2/data/chapter-registry.json',
            'tests/test_greg_again_audio_ch035.py'
          }
          def allowed(p): return p in allowed_exact or p.startswith('greg-again/audio/assets/chunks/035/')
          bad=[p for p in changed if not allowed(p)]
          assert not bad,f'unrelated surfaces changed: {bad}'
          Path('greg-again/audio/verification/035-scope.json').write_text(json.dumps({
            'chapter_id':'ga-035','base':'origin/main','unrelated_chapter_surfaces_changed':False,'changed_paths':changed
          },indent=2)+'\n')
          PY

      - name: Run Chapter 35 and catalog verification
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_greg_again_audio_ch035.py
          python -m unittest tests.test_greg_again_audio_catalog -v
          python -m json.tool greg-again/audio/manifest.json >/dev/null
          python -m json.tool r2/data/chapters/ch035.json >/dev/null
          python -m json.tool r2/data/chapter-registry.json >/dev/null
          python -m json.tool greg-again/audio/takes/035-short.json >/dev/null
          python -m json.tool greg-again/audio/verification/035-short.json >/dev/null

      - name: Commit reconciled Chapter 35 publication
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'audio: publish Greg Again Chapter 35 over newest main'
          git push origin HEAD:audio/greg-again-ch035-auto
