name: Capture Greg Again Chapter 11 Audio

on:
  push:
    branches:
      - audio/greg-again-ch11-future-uncertainty
    paths:
      - '.github/workflows/greg-again-ch11-capture.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch11-future-uncertainty
      - name: Probe rendered Chapter 11 audio endpoint
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/assets
          status="$(curl --location --silent --show-error \
            --dump-header /tmp/ch11-headers.txt \
            --write-out '%{http_code}' \
            'https://www.aidocmaker.com/g0/audio?name=6dcd92545dba44e2ae8e075306c0f70c' \
            --output /tmp/ch11-response.bin || true)"
          bytes="$(stat -c%s /tmp/ch11-response.bin 2>/dev/null || echo 0)"
          kind="$(file -b /tmp/ch11-response.bin 2>/dev/null || true)"
          {
            echo "http_status=$status"
            echo "bytes=$bytes"
            echo "file=$kind"
            echo "--- headers ---"
            cat /tmp/ch11-headers.txt
            echo "--- first printable bytes ---"
            strings /tmp/ch11-response.bin | head -n 20 || true
          } > greg-again/audio/ch11-http-debug.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/ch11-http-debug.txt
          git commit -m 'Record Chapter 11 audio endpoint probe'
          git push origin HEAD:audio/greg-again-ch11-future-uncertainty
