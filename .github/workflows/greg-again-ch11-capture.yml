name: Assemble Greg Again Chapter 11 Audio

on:
  push:
    branches:
      - audio/greg-again-ch11-future-uncertainty
    paths:
      - '.github/workflows/greg-again-ch11-capture.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch11-future-uncertainty
          fetch-depth: 0

      - name: Verify exact text coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('r2/assets/written/ch011.md').read_text(encoding='utf-8')
          body = source.split('\n---\n', 1)[1].strip()
          take_map = json.loads(Path('greg-again/audio/takes/011.json').read_text(encoding='utf-8'))
          takes = take_map['takes']
          assert take_map['take_count'] == len(takes) == 29
          assert [t['take'] for t in takes] == list(range(1, 30))
          assembled_text = '\n\n'.join(t['transcript'].strip() for t in takes).strip()
          if assembled_text != body:
              import difflib
              print(''.join(difflib.unified_diff(body.splitlines(True), assembled_text.splitlines(True), fromfile='source', tofile='takes')))
              raise SystemExit('take transcripts do not exactly cover Chapter 11 source')
          print('Exact Chapter 11 text coverage verified across 29 ordered takes.')
          PY

      - name: Download and verify provider take artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/ga011-takes
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          data = json.loads(Path('greg-again/audio/takes/011.json').read_text(encoding='utf-8'))
          for take in data['takes']:
              n = take['take']
              dest = Path('/tmp/ga011-takes') / f'{n:03d}.mp3'
              subprocess.run(['curl', '--fail', '--location', '--retry', '3', take['artifact_url'], '--output', str(dest)], check=True)
              if dest.stat().st_size < 1000:
                  raise SystemExit(f'take {n} is unexpectedly small: {dest.stat().st_size}')
              subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'default=nw=1:nk=1', str(dest)], check=True)
          PY

      - name: Assemble continuous Chapter 11 MP3
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/assets
          : > /tmp/ga011-concat.txt
          for f in /tmp/ga011-takes/*.mp3; do
            printf "file '%s'\n" "$f" >> /tmp/ga011-concat.txt
          done
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i /tmp/ga011-concat.txt -c copy greg-again/audio/assets/chapter-011.mp3
          test "$(stat -c%s greg-again/audio/assets/chapter-011.mp3)" -gt 1000000
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 greg-again/audio/assets/chapter-011.mp3

      - name: Reconcile newest main before shared publication
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Publish Chapter 11 routes and duration
        run: |
          set -euo pipefail
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 greg-again/audio/assets/chapter-011.mp3)"
          python - "$duration" <<'PY'
          import json
          import sys
          from pathlib import Path

          duration = round(float(sys.argv[1]), 3)
          manifest_path = Path('greg-again/audio/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['chapters'] = [c for c in manifest['chapters'] if c['chapter_id'] != 'ga-011']
          manifest['chapters'].append({
              'chapter_id': 'ga-011',
              'number': 11,
              'title': 'The Gate Hand',
              'status': 'experimental',
              'lens': 'shared-greg-surface',
              'audio_finish': 'processing-space',
              'take_count': 29,
              'duration_seconds': duration,
              'audio_src': 'assets/chapter-011.mp3',
              'note': 'Chapter 11 preserves remembered future fact as distinct from present causal proof. Twenty-nine short provider-safe takes preserve exact Shared Greg Surface wording and processing space while keeping every seam locally repairable.'
          })
          manifest['chapters'].sort(key=lambda c: c['number'])
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          chapter_path = Path('r2/data/chapters/ch011.json')
          chapter = json.loads(chapter_path.read_text(encoding='utf-8'))
          chapter['audio'] = {
              'status': 'published',
              'path': '../greg-again/audio/assets/chapter-011.mp3'
          }
          chapter_path.write_text(json.dumps(chapter, separators=(',', ':')) + '\n', encoding='utf-8')
          print(f'Chapter 11 duration: {duration:.3f}s')
          PY

      - name: Verify repository audio contract
        run: |
          set -euo pipefail
          python -m unittest tests.test_greg_again_audio_catalog
          python -m json.tool greg-again/audio/manifest.json >/dev/null
          python -m json.tool greg-again/audio/takes/011.json >/dev/null
          python -m json.tool r2/data/chapters/ch011.json >/dev/null
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 greg-again/audio/assets/chapter-011.mp3

      - name: Commit durable Chapter 11 product
        run: |
          set -euo pipefail
          git rm -f .github/workflows/greg-again-ch11-capture.yml greg-again/audio/ch11-http-debug.txt || true
          git add greg-again/audio/assets/chapter-011.mp3 greg-again/audio/manifest.json greg-again/audio/scripts/011-the-gate-hand.md greg-again/audio/takes/011.json r2/data/chapters/ch011.json tests/test_greg_again_audio_catalog.py
          git commit -m 'Publish Greg Again Chapter 11 audio'
          git push origin HEAD:audio/greg-again-ch11-future-uncertainty
