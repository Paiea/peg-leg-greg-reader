name: Capture Greg Again Chapter 11 Audio

on:
  push:
    branches:
      - audio/greg-again-ch11-future-uncertainty
    paths:
      - '.github/workflows/greg-again-ch11-capture.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch11-future-uncertainty
      - name: Download rendered Chapter 11 audio
        run: |
          set -euo pipefail
          mkdir -p greg-again/audio/assets
          curl --fail --location --retry 3 \
            'https://www.aidocmaker.com/g0/audio?name=6dcd92545dba44e2ae8e075306c0f70c' \
            --output greg-again/audio/assets/chapter-011.mp3
          test "$(stat -c%s greg-again/audio/assets/chapter-011.mp3)" -gt 1000000
      - name: Measure duration and update catalog routes
        run: |
          set -euo pipefail
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 greg-again/audio/assets/chapter-011.mp3)"
          python - "$duration" <<'PY'
          import json
          import sys
          from pathlib import Path

          duration = round(float(sys.argv[1]), 3)
          manifest_path = Path('greg-again/audio/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['chapters'] = [c for c in manifest['chapters'] if c['chapter_id'] != 'ga-011']
          manifest['chapters'].append({
              'chapter_id': 'ga-011',
              'number': 11,
              'title': 'The Gate Hand',
              'status': 'experimental',
              'lens': 'shared-greg-surface',
              'audio_finish': 'processing-space',
              'take_count': 1,
              'duration_seconds': duration,
              'audio_src': 'assets/chapter-011.mp3',
              'note': 'Chapter 11 preserves the Shared Greg Surface while keeping remembered future fact distinct from present causal proof. Processing space protects the shift from gate work, to local hoist danger, to the unresolved later collapse memory.'
          })
          manifest['chapters'].sort(key=lambda c: c['number'])
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          chapter_path = Path('r2/data/chapters/ch011.json')
          chapter = json.loads(chapter_path.read_text(encoding='utf-8'))
          chapter['audio'] = {
              'status': 'published',
              'path': '../greg-again/audio/assets/chapter-011.mp3'
          }
          chapter_path.write_text(json.dumps(chapter, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Commit durable audio product
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/assets/chapter-011.mp3 greg-again/audio/manifest.json r2/data/chapters/ch011.json
          git commit -m 'Publish Greg Again Chapter 11 audio'
          git push origin HEAD:audio/greg-again-ch11-future-uncertainty
