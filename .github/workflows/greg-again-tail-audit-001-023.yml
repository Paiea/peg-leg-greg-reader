name: Diagnose Greg Again Chapter 015 Xing Tail

on:
  push:
    branches:
      - audio/greg-again-tail-normalize-001-023
    paths:
      - .github/workflows/greg-again-tail-audit-001-023.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-tail-normalize-001-023
          fetch-depth: 1
      - name: Install ffmpeg tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Test normal Xing header on Chapter 015
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess, tempfile
          src = pathlib.Path('greg-again/audio/assets/chapter-015.mp3')

          def packet_hashes(path):
              out = subprocess.check_output([
                  'ffprobe','-v','error','-select_streams','a:0','-show_packets',
                  '-show_entries','packet=data_hash','-show_data_hash','sha256','-of','json',str(path)
              ], text=True)
              return [p['data_hash'] for p in json.loads(out)['packets'] if p.get('data_hash')]

          original = packet_hashes(src)
          with tempfile.TemporaryDirectory() as td:
              td = pathlib.Path(td)
              silence = td / 'silence.mp3'
              candidate = td / 'candidate.mp3'
              concat = td / 'concat.txt'
              subprocess.run([
                  'ffmpeg','-v','error','-y','-f','lavfi','-i','anullsrc=r=24000:cl=mono',
                  '-t','1.401','-c:a','libmp3lame','-b:a','128k','-write_xing','0','-id3v2_version','0',str(silence)
              ], check=True)
              concat.write_text(f"file '{src.resolve()}'\nfile '{silence.resolve()}'\n", encoding='utf-8')
              subprocess.run([
                  'ffmpeg','-v','error','-y','-f','concat','-safe','0','-i',str(concat),
                  '-map','0:a:0','-c:a','copy',str(candidate)
              ], check=True)

              probe = json.loads(subprocess.check_output([
                  'ffprobe','-v','error','-show_entries','format=duration,start_time,bit_rate',
                  '-show_entries','stream=codec_name,sample_rate,channels,bit_rate','-of','json',str(candidate)
              ], text=True))
              print('candidate_probe=' + json.dumps(probe, sort_keys=True))

              proc = subprocess.run([
                  'ffmpeg','-hide_banner','-nostats','-i',str(candidate),
                  '-af','silencedetect=noise=-45dB:d=0.10','-f','null','-'
              ], text=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
              starts = [float(x) for x in re.findall(r'silence_start: ([0-9.]+)', proc.stderr)]
              ends = [float(x) for x in re.findall(r'silence_end: ([0-9.]+)', proc.stderr)]
              print('last_silence_start=', starts[-1] if starts else None)
              print('last_silence_end=', ends[-1] if ends else None)
              print('\n'.join([line for line in proc.stderr.splitlines() if 'silence_' in line][-8:]))

              cand = packet_hashes(candidate)
              print('original_packets=', len(original), 'candidate_packets=', len(cand))
              matches = []
              for offset in range(0, 4):
                  if cand[offset:offset+len(original)] == original:
                      matches.append(offset)
              print('exact_original_packet_run_offsets=', matches)
              if not matches:
                  raise SystemExit('Original packet run not preserved behind Xing header')
              duration = float(probe['format']['duration'])
              last_start = starts[-1]
              tail = duration - last_start
              print(f'duration={duration:.6f} tail={tail:.6f}')
              if not (1.5 <= tail <= 2.5):
                  raise SystemExit(f'Tail outside window: {tail}')
          PY
