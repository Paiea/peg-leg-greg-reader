name: Diagnose Greg Again Chapter 015 Tail

on:
  push:
    branches:
      - audio/greg-again-tail-normalize-001-023
    paths:
      - .github/workflows/greg-again-tail-audit-001-023.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-tail-normalize-001-023
          fetch-depth: 1
      - name: Install ffmpeg tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Reproduce Chapter 015 concat edge
        shell: bash
        run: |
          set -euo pipefail
          src='greg-again/audio/assets/chapter-015.mp3'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          echo '=== ORIGINAL PROBE ==='
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,channel_layout,bit_rate -show_entries format=duration,bit_rate,start_time -of json "$src"
          echo '=== ORIGINAL LAST PACKETS ==='
          ffprobe -v error -select_streams a:0 -show_packets -show_entries packet=pts_time,dts_time,duration_time,size,flags -of csv=p=0 "$src" | tail -n 8
          echo '=== ORIGINAL TAIL DETECT ==='
          ffmpeg -hide_banner -nostats -sseof -5 -i "$src" -af 'silencedetect=noise=-45dB:d=0.10' -f null - 2>&1 | grep -E 'silence_(start|end)|Duration|time=' || true

          ffmpeg -v error -y -f lavfi -i 'anullsrc=r=24000:cl=mono' -t 1.401 -c:a libmp3lame -b:a 128k -write_xing 0 -id3v2_version 0 "$tmp/silence.mp3"
          echo '=== SILENCE PROBE ==='
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,channel_layout,bit_rate -show_entries format=duration,bit_rate,start_time -of json "$tmp/silence.mp3"
          echo '=== SILENCE DETECT ==='
          ffmpeg -hide_banner -nostats -i "$tmp/silence.mp3" -af 'silencedetect=noise=-45dB:d=0.10' -f null - 2>&1 | grep -E 'silence_(start|end)|Duration|time=' || true

          printf "file '%s'\nfile '%s'\n" "$(realpath "$src")" "$(realpath "$tmp/silence.mp3")" > "$tmp/concat.txt"
          echo '=== CONCAT COMMAND ==='
          ffmpeg -hide_banner -y -f concat -safe 0 -i "$tmp/concat.txt" -map 0:a:0 -c:a copy -write_xing 0 -id3v2_version 0 "$tmp/candidate.mp3" 2>&1 | tail -n 30
          echo '=== CANDIDATE PROBE ==='
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,channel_layout,bit_rate -show_entries format=duration,bit_rate,start_time -of json "$tmp/candidate.mp3"
          echo '=== CANDIDATE LAST PACKETS ==='
          ffprobe -v error -select_streams a:0 -show_packets -show_entries packet=pts_time,dts_time,duration_time,size,flags -of csv=p=0 "$tmp/candidate.mp3" | tail -n 16
          echo '=== CANDIDATE TAIL DETECT FULL ==='
          ffmpeg -hide_banner -nostats -i "$tmp/candidate.mp3" -af 'silencedetect=noise=-45dB:d=0.10' -f null - 2>&1 | grep -E 'silence_(start|end)|Duration|time=' | tail -n 20 || true
          echo '=== CANDIDATE TAIL DETECT SSEOF ==='
          ffmpeg -hide_banner -nostats -sseof -5 -i "$tmp/candidate.mp3" -af 'silencedetect=noise=-45dB:d=0.10' -f null - 2>&1 | grep -E 'silence_(start|end)|Duration|time=' || true
