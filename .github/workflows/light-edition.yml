name: Refresh Light edition

on:
  push:
    branches:
      - main
      - 'reader/**'
    paths:
      - 'state/manuscript/Peg_Leg_Greg_Running_Manuscript.md'
      - 'state/manuscript/Peg_Leg_Greg_Recovered_Ch156-219_EXACT.md'
      - 'state/LIGHT_EDITION_STATE.md'
      - 'state/PROJECT_STATE.md'
      - 'state/READER_DESIGN_LAB.md'
      - 'chapters/*.html'
      - 'index.html'
      - 'scripts/generate_light.py'
      - 'scripts/reader_sections.py'
      - 'scripts/update_home_contents.py'
      - 'scripts/materialize_book_role_cards.py'
      - 'scripts/verify_light.py'
      - 'scripts/update_reader_navigation.py'
      - 'scripts/update_reader_presentation.py'
      - 'tests/test_*.py'
      - 'assets/reader.css'
      - 'assets/light.css'
      - 'assets/book-contents.css'
      - 'assets/light-progress.js'
      - 'assets/light-reader.js'
      - 'visual/book_plates/**'
      - 'light.html'
      - '.github/workflows/light-edition.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: light-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize staged Book role cards
        run: python scripts/materialize_book_role_cards.py
      - name: Prepare reader presentation CSS
        run: python scripts/update_reader_presentation.py assets/reader.css
      - name: Test reader tooling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate recovered Light range
        run: python scripts/generate_light.py 156-219
      - name: Generate current Light range
        run: python scripts/generate_light.py current
      - name: Update illustrated contents and cross-mode navigation
        run: |
          python scripts/update_reader_navigation.py index.html
          python scripts/update_home_contents.py
      - name: Verify Light publishing derivatives
        run: |
          python scripts/verify_light.py 156-219
          python scripts/verify_light.py current
          test -f light/156.html
          test -f light/219.html
          test -f light/220.html
          test -f light/index.html
          test -f light/manifest.json
          test -f latest.html
          test -f visual/book_plates/book-i-role-card-warrior-005.webp
          test -f visual/book_plates/book-ii-role-card-stagehand-177.webp
          test -f visual/book_plates/book-iii-role-card-magistrate-231.webp
          ! grep -R '<img' light/*.html
          ! grep -R 'Peg_Leg_Greg_Running_Manuscript.md' light/*.html
          ! grep -R 'Peg_Leg_Greg_Recovered_Ch156-219_EXACT.md' light/*.html
          grep -q 'href="220.html"' light/219.html
          grep -q 'href="219.html"' light/220.html
          grep -q 'href="light/index.html">Read Light</a>' index.html
          grep -q 'BOOK I' index.html
          grep -q 'BOOK II' index.html
          grep -q 'BOOK III' index.html
          grep -q 'THE SECOND LIFE' index.html
          grep -q 'THE STAGE DOOR' index.html
          grep -q 'THE COMPANY ROAD' index.html
          grep -q 'THE WORKING COMPANY' index.html
          grep -q 'THE PRICE OF ATTENTION' index.html
          grep -q 'book-i-role-card-warrior-005.webp' index.html
          grep -q 'book-ii-role-card-stagehand-177.webp' index.html
          grep -q 'book-iii-role-card-magistrate-231.webp' index.html
          grep -q 'assets/book-contents.css' index.html
          grep -q 'BOOK I' light/index.html
          grep -q 'BOOK II' light/index.html
          grep -q 'BOOK III' light/index.html
          grep -q 'THE STAGE DOOR' light/index.html
          grep -q 'THE WORKING COMPANY' light/index.html
          grep -q 'THE PRICE OF ATTENTION' light/index.html
          grep -q '../assets/book-contents.css' light/index.html
          grep -q 'READER ACT CONTENTS + DESKTOP ART CAPS' assets/reader.css
          git diff --check
      - name: Commit generated reader presentation derivatives
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- light latest.html index.html assets/reader.css visual/book_plates; then
            echo 'Reader presentation already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add light latest.html index.html assets/reader.css visual/book_plates
          git commit -m 'Refresh reader presentation'
          git push
