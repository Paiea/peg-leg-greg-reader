name: Refresh Light edition

on:
  push:
    branches:
      - main
      - 'reader/**'
    paths:
      - 'state/manuscript/Peg_Leg_Greg_Running_Manuscript.md'
      - 'state/manuscript/Peg_Leg_Greg_Recovered_Ch156-219_EXACT.md'
      - 'state/LIGHT_EDITION_STATE.md'
      - 'state/READER_DESIGN_LAB.md'
      - 'chapters/*.html'
      - 'index.html'
      - 'scripts/generate_light.py'
      - 'scripts/reader_sections.py'
      - 'scripts/verify_light.py'
      - 'scripts/update_reader_navigation.py'
      - 'scripts/update_reader_presentation.py'
      - 'tests/test_generate_light.py'
      - 'tests/test_update_reader_navigation.py'
      - 'tests/test_light_progress_links.py'
      - 'tests/test_reader_acts.py'
      - 'assets/reader.css'
      - 'assets/light.css'
      - 'assets/light-progress.js'
      - 'assets/light-reader.js'
      - 'light.html'
      - '.github/workflows/light-edition.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: light-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe canonical Book 1 DOCX
        run: |
          pip install python-docx beautifulsoup4
          python - <<'PY'
          from docx import Document
          p='state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map.docx'
          doc=Document(p)
          print('PARAGRAPHS', len(doc.paragraphs))
          for i, para in enumerate(doc.paragraphs[:140]):
              t=para.text.strip().replace('\n',' / ')
              if t:
                  print(i, repr(para.style.name), repr(t[:220]), 'runs=',len(para.runs))
          print('--- TERM MATCHES ---')
          terms=('chapter','the boy','the borrower','the investor','the expert','the warrior')
          found=0
          for i, para in enumerate(doc.paragraphs):
              t=para.text.strip()
              if t and any(term in t.lower() for term in terms):
                  print(i, repr(para.style.name), repr(t[:260]), 'runs=',len(para.runs))
                  found += 1
                  if found >= 100:
                      break
          PY
      - name: Prepare reader presentation CSS
        run: python scripts/update_reader_presentation.py assets/reader.css
      - name: Test reader tooling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate recovered Light range
        run: python scripts/generate_light.py 156-219
      - name: Generate current Light range
        run: python scripts/generate_light.py current
      - name: Update illustrated contents and cross-mode navigation
        run: python scripts/update_reader_navigation.py index.html
      - name: Verify Light publishing derivatives
        run: |
          python scripts/verify_light.py 156-219
          python scripts/verify_light.py current
          git diff --check
      - name: Commit generated reader presentation derivatives
        run: |
          if git diff --quiet -- light latest.html index.html assets/reader.css; then
            echo 'Reader presentation already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add light latest.html index.html assets/reader.css
          git commit -m 'Refresh reader presentation'
          git push
