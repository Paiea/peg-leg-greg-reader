name: Refresh Light edition

on:
  push:
    branches:
      - main
      - 'reader/**'
    paths:
      - 'state/manuscript/Peg_Leg_Greg_Running_Manuscript.md'
      - 'state/manuscript/Peg_Leg_Greg_Recovered_Ch156-219_EXACT.md'
      - 'state/LIGHT_EDITION_STATE.md'
      - 'state/READER_DESIGN_LAB.md'
      - 'chapters/*.html'
      - 'index.html'
      - 'scripts/generate_light.py'
      - 'scripts/reader_sections.py'
      - 'scripts/verify_light.py'
      - 'scripts/update_reader_navigation.py'
      - 'scripts/update_reader_presentation.py'
      - 'tests/test_generate_light.py'
      - 'tests/test_update_reader_navigation.py'
      - 'tests/test_light_progress_links.py'
      - 'tests/test_reader_acts.py'
      - 'assets/reader.css'
      - 'assets/light.css'
      - 'assets/light-progress.js'
      - 'assets/light-reader.js'
      - 'light.html'
      - '.github/workflows/light-edition.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: light-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe canonical Book 1 DOCX
        run: |
          pip install python-docx beautifulsoup4
          python - <<'PY'
          import re
          from docx import Document
          from bs4 import BeautifulSoup
          p='state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map.docx'
          doc=Document(p)
          print('PARAGRAPHS', len(doc.paragraphs))
          markers=[]
          for i, para in enumerate(doc.paragraphs):
              t=para.text.strip()
              if re.fullmatch(r'CHAPTER\s+\d+', t, re.I):
                  markers.append((i,t,para.style.name))
          print('MARKERS', len(markers))
          print('FIRST_MARKERS', markers[:12])
          for ch in range(1,7):
              m=next((x for x in markers if x[1].upper()==f'CHAPTER {ch}'),None)
              if not m: continue
              start=m[0]
              end=next((x[0] for x in markers if x[0]>start), len(doc.paragraphs))
              print(f'=== CH{ch} {start}:{end} ===')
              for j in range(start,min(end,start+12)):
                  q=doc.paragraphs[j]
                  print(j, repr(q.style.name), repr(q.text[:160]), 'runs=', len(q.runs))
              html=f'chapters/{ch:03d}.html'
              soup=BeautifulSoup(open(html,encoding='utf-8').read(),'html.parser')
              ps=[x.get_text() for x in soup.select('article.prose > p')]
              print('HTML_P',len(ps),'DOCX_AFTER_MARKER',end-start-1)
          PY
      - name: Prepare reader presentation CSS
        run: python scripts/update_reader_presentation.py assets/reader.css
      - name: Test reader tooling
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate recovered Light range
        run: python scripts/generate_light.py 156-219
      - name: Generate current Light range
        run: python scripts/generate_light.py current
      - name: Update illustrated contents and cross-mode navigation
        run: python scripts/update_reader_navigation.py index.html
      - name: Verify Light publishing derivatives
        run: |
          python scripts/verify_light.py 156-219
          python scripts/verify_light.py current
          test -f light/156.html
          test -f light/219.html
          test -f light/220.html
          test -f light/index.html
          test -f light/manifest.json
          test -f latest.html
          ! grep -R '<img' light/*.html
          ! grep -R 'Peg_Leg_Greg_Running_Manuscript.md' light/*.html
          ! grep -R 'Peg_Leg_Greg_Recovered_Ch156-219_EXACT.md' light/*.html
          grep -q 'href="220.html"' light/219.html
          grep -q 'href="219.html"' light/220.html
          grep -q 'href="light/index.html">Read Light</a>' index.html
          grep -q 'THE SECOND LIFE' index.html
          grep -q 'THE COMPANY ROAD' index.html
          grep -q 'THE SECOND LIFE' light/index.html
          grep -q 'THE COMPANY ROAD' light/index.html
          grep -q 'READER ACT CONTENTS + DESKTOP ART CAPS' assets/reader.css
          git diff --check
      - name: Commit generated reader presentation derivatives
        run: |
          if git diff --quiet -- light latest.html index.html assets/reader.css; then
            echo 'Reader presentation already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add light latest.html index.html assets/reader.css
          git commit -m 'Refresh reader presentation'
          git push
