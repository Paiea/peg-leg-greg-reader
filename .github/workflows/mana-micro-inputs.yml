name: Build mana sentence micro inputs
on:
  push:
    branches: [audio/greg-again-mana-pronunciation-repair]
    paths: [.github/workflows/mana-micro-inputs.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-mana-pronunciation-repair
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          q=json.loads(Path('greg-again/audio/production/2026-09-08-mana-repair-queue.json').read_text(encoding='utf-8'))
          root=Path('greg-again/audio/production/mana-micro-inputs')
          root.mkdir(parents=True,exist_ok=True)
          # clean only generated micro files from retries
          for p in root.glob('ch*-m*.txt'): p.unlink()
          items=[]
          for e in q['entries']:
              paras=[p.strip() for p in re.split(r'\n\s*\n',e['transcript']) if p.strip()]
              provider_paras=[p.strip() for p in re.split(r'\n\s*\n',e['provider_transcript']) if p.strip()]
              if len(paras)!=len(provider_paras):
                  raise SystemExit(f'paragraph structure changed ch{e["chapter"]} t{e["take"]}')
              hit_idx=[i for i,p in enumerate(paras) if re.search(r'\bmana\b',p,re.I)]
              if not hit_idx:
                  raise SystemExit(f'no target paragraph ch{e["chapter"]} t{e["take"]}')
              for mi,i in enumerate(hit_idx,1):
                  original=paras[i]; provider=provider_paras[i]
                  if len(provider)>500:
                      raise SystemExit(f'micro exceeds 500 chars ch{e["chapter"]} t{e["take"]} p{i}: {len(provider)}')
                  if re.search(r'\bmana\b',provider,re.I):
                      raise SystemExit(f'raw mana survived provider micro ch{e["chapter"]} t{e["take"]} p{i}')
                  if 'mah-nah' not in provider.lower():
                      raise SystemExit(f'phonetic spelling missing ch{e["chapter"]} t{e["take"]} p{i}')
                  name=f'ch{e["chapter"]:03d}-t{e["take"]:02d}-m{mi:02d}.txt'
                  (root/name).write_text(provider+'\n',encoding='utf-8')
                  items.append({
                      'chapter':e['chapter'],'take':e['take'],'micro':mi,'paragraph_index':i,
                      'filename':name,'original_text':original,'provider_text':provider,
                      'previous_text':paras[i-1] if i else None,
                      'next_text':paras[i+1] if i+1<len(paras) else None,
                      'chars':len(provider),'mana_tokens':len(re.findall(r'\bmana\b',original,re.I))
                  })
          total_tokens=sum(x['mana_tokens'] for x in items)
          if total_tokens!=25: raise SystemExit(f'expected 25 mana tokens, got {total_tokens}')
          if not (22 <= len(items) <= 25): raise SystemExit(f'unexpected micro count {len(items)}')
          meta={'voice':'deep','provider_spelling':'mah-nah','human_audition':'approved','micro_count':len(items),'mana_token_count':total_tokens,'items':items}
          (root/'index.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'index.txt').write_text(''.join(x['filename']+'\n' for x in items),encoding='utf-8')
          print(json.dumps({'micro_count':len(items),'mana_token_count':total_tokens,'files':[x['filename'] for x in items]},indent=2))
          PY
          rm .github/workflows/mana-micro-inputs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/production/mana-micro-inputs .github/workflows/mana-micro-inputs.yml
          git commit -m 'audio: lock sentence-local mana repair inputs'
          git push origin HEAD:audio/greg-again-mana-pronunciation-repair
