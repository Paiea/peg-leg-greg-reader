name: Index mana repair inputs
on:
  push:
    branches: [audio/greg-again-mana-pronunciation-repair]
    paths: [.github/workflows/mana-repair-index.yml]
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-mana-pronunciation-repair
      - shell: bash
        run: |
          set -euo pipefail
          find greg-again/audio/production/mana-repair-inputs -maxdepth 1 -type f -name '*.txt' -printf '%f\n' | sort > greg-again/audio/production/mana-repair-inputs/index.txt
          test "$(wc -l < greg-again/audio/production/mana-repair-inputs/index.txt)" -eq 22
          cat greg-again/audio/production/mana-repair-inputs/index.txt
          rm .github/workflows/mana-repair-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/production/mana-repair-inputs/index.txt .github/workflows/mana-repair-index.yml
          git commit -m 'audio: index approved mana repair inputs'
          git push origin HEAD:audio/greg-again-mana-pronunciation-repair
