name: Audit published spoken mana takes
on:
  push:
    branches: [audio/greg-again-mana-pronunciation-repair]
    paths: [.github/workflows/mana-spoken-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          rx=re.compile(r'\bmana\b',re.I)
          found={}
          # Exact transcript-bearing take JSON wins.
          for p in sorted(Path('greg-again/audio/takes').glob('*.json')):
              try: data=json.loads(p.read_text(encoding='utf-8'))
              except Exception: continue
              ch=data.get('chapter_number') or data.get('chapter')
              if not isinstance(ch,int):
                  m=re.search(r'(\d{3})',p.stem); ch=int(m.group(1)) if m else None
              if not ch: continue
              for t in data.get('takes',[]):
                  text=t.get('transcript') if isinstance(t,dict) else None
                  if isinstance(text,str) and rx.search(text):
                      take=t.get('take')
                      found[(ch,int(take))]={'chapter':ch,'take':int(take),'transcript':text,'mana_tokens':len(rx.findall(text)),'source':str(p)}
          # Full performance scripts fill gaps.
          for p in sorted(Path('greg-again/audio/scripts').glob('*.md')):
              m=re.match(r'(\d{3})-',p.name)
              if not m: continue
              ch=int(m.group(1))
              text=p.read_text(encoding='utf-8')
              matches=list(re.finditer(r'^##\s+TAKE\s+(\d+)\b[^\n]*\n',text,re.I|re.M))
              for idx,mm in enumerate(matches):
                  take=int(mm.group(1)); start=mm.end(); end=matches[idx+1].start() if idx+1<len(matches) else len(text)
                  body=text[start:end].strip()
                  # remove trailing horizontal rule only
                  body=re.sub(r'\n---\s*$','',body).strip()
                  if rx.search(body) and (ch,take) not in found:
                      found[(ch,take)]={'chapter':ch,'take':take,'transcript':body,'mana_tokens':len(rx.findall(body)),'source':str(p)}
          out={'exact_spoken_take_hits':[found[k] for k in sorted(found)],'total_tokens':sum(x['mana_tokens'] for x in found.values()),'take_count':len(found)}
          dest=Path('greg-again/audio/production/2026-09-08-mana-spoken-audit.json')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          rm .github/workflows/mana-spoken-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/production/2026-09-08-mana-spoken-audit.json .github/workflows/mana-spoken-audit.yml
          git commit -m 'audio: audit exact spoken mana takes'
          git push origin HEAD:audio/greg-again-mana-pronunciation-repair
