name: Validate PLG Terminal Card

on:
  push:
    branches:
      - reader/plg-terminal-r2-card

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply persistent terminal card postprocessors
        run: |
          python scripts/update_showcase_chapter_shells.py
          python scripts/cleanup_showcase_light.py
      - name: Verify both terminal reader modes
        run: |
          grep -q 'Original Peg-Leg Greg ends at <em>THE AMATEUR</em>.' chapters/503.html
          grep -q 'Greg’s life keeps going. The book does not.' chapters/503.html
          grep -q 'href="../r2/">START R2 →</a>' chapters/503.html
          grep -q 'plg-terminal.css' chapters/503.html
          grep -q 'Original Peg-Leg Greg ends at <em>THE AMATEUR</em>.' light/503.html
          grep -q 'Greg’s life keeps going. The book does not.' light/503.html
          grep -q 'href="../r2/">START R2 →</a>' light/503.html
          grep -q 'plg-terminal.css' light/503.html
          grep -q 'The second stitch was worse.' chapters/503.html
          grep -q 'The second stitch was worse.' light/503.html
          grep -q 'is-disabled">Next' chapters/503.html
          grep -q 'is-disabled">Next' light/503.html
          git diff --check
      - name: Commit generated terminal pages
        run: |
          if git diff --quiet -- chapters/503.html light/503.html; then
            echo 'Terminal pages already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chapters/503.html light/503.html
          git commit -m 'Render PLG terminal R2 card'
          git push origin HEAD:reader/plg-terminal-r2-card
