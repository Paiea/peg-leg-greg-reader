name: Publish approved structural compression

on:
  push:
    branches: [integration/structural-compression-live]
    paths:
      - '.github/workflows/publish-approved-structural-compression.yml'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/structural-compression-live
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Materialize approved transformers from editor authority
        run: |
          git fetch origin editor/voice-compression-pass
          mkdir -p /tmp/plg-compression
          for stem in 060_061 075_076 144_152 183_184 197_198 208_213 250_251; do
            git show origin/editor/voice-compression-pass:scripts/apply_structural_compression_${stem}.py > /tmp/plg-compression/apply_${stem}.py
          done
      - name: Replay approved compression against current main-derived authority
        run: |
          python /tmp/plg-compression/apply_060_061.py --root . --write --manifest state/compression-batches/060-061.json
          python /tmp/plg-compression/apply_075_076.py --root . --write --manifest state/compression-batches/075-076.json
          python /tmp/plg-compression/apply_144_152.py --root .
          python /tmp/plg-compression/apply_183_184.py --root . --write --manifest state/compression-batches/183-184.json
          python /tmp/plg-compression/apply_197_198.py --root . --write --manifest state/compression-batches/197-198.json
          python /tmp/plg-compression/apply_208_213.py --root . --write --manifest state/compression-batches/208-213.json
          python /tmp/plg-compression/apply_250_251.py --root . --write --manifest state/compression-batches/250-251.json
      - name: Verify every replayed batch
        run: |
          python /tmp/plg-compression/apply_060_061.py --root . --verify
          python /tmp/plg-compression/apply_075_076.py --root . --verify
          python /tmp/plg-compression/apply_144_152.py --root . --check
          python /tmp/plg-compression/apply_183_184.py --root . --verify
          python /tmp/plg-compression/apply_197_198.py --root . --verify
          python /tmp/plg-compression/apply_208_213.py --root . --verify
          python /tmp/plg-compression/apply_250_251.py --root . --verify
      - name: Ensure current-main frontier remains present
        run: |
          test -f chapters/431.html || test -f light/431.html || test -f state/manuscript/Peg_Leg_Greg_Chapter_431_EXACT_WIP.md
      - name: Commit replayed structural edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/publish-approved-structural-compression.yml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m 'Replay approved structural compression onto current main'
            git push origin HEAD:integration/structural-compression-live
          fi
