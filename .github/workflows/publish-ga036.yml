name: Publish Greg Again Chapter 36

on:
  push:
    branches:
      - audio/greg-again-ch036-auto
    paths:
      - .github/workflows/publish-ga036.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch036-auto
          fetch-depth: 1
      - name: Confirm newest main authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin main
          CURRENT_MAIN="$(git rev-parse FETCH_HEAD)"
          EXPECTED_MAIN="f41527ebdb9edb39a96acf5631b480d6be6a2dc9"
          test "$CURRENT_MAIN" = "$EXPECTED_MAIN"
      - name: Publish only ga-036
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('.')
          audio=root/'greg-again'/'audio'
          r2=root/'r2'
          verification=json.loads((audio/'verification'/'036-short.json').read_text())
          assert verification['chapter_id']=='ga-036'
          assert verification['status']=='verified_playable'
          assert verification['take_count']==33
          assert verification['all_takes_playable'] is True
          assert verification['take_order_verified'] is True
          assert verification['source_coverage']=='exact_after_nonspoken_markdown_normalization'
          final=audio/'assets'/'chapter-036.mp3'
          assert final.exists() and final.stat().st_size==verification['assembled_bytes']
          assert hashlib.sha256(final.read_bytes()).hexdigest()==verification['assembled_sha256']

          manifest_path=audio/'manifest.json'
          manifest=json.loads(manifest_path.read_text())
          entry={
            'chapter_id':'ga-036','number':36,'title':'Four Nights','status':'experimental',
            'lens':'shared-greg-surface','audio_finish':'processing-space','take_count':33,
            'duration_seconds':verification['assembled_duration_seconds'],
            'audio_src':'assets/chapter-036.mp3',
            'note':'Chapter 36 uses thirty-three complete preview-safe deep-voice short takes captured as durable MP3 artifacts. Exact current spoken-source coverage, provider identities, take ordering, individual playability, stitched chapter audio, durable hashes, the authoritative ellipsis landing, and a two-second listener tail were verified before publication.'
          }
          chapters=[c for c in manifest['chapters'] if c.get('chapter_id')!='ga-036']
          chapters.append(entry); chapters.sort(key=lambda c:c['number'])
          manifest['chapters']=chapters
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')

          route_path=r2/'data'/'chapters'/'ch036.json'
          route=json.loads(route_path.read_text())
          assert route['display_number']==36 and route['title']=='Four Nights'
          assert route['written']['status']=='published'
          route['audio']={'status':'published','path':'../greg-again/audio/assets/chapter-036.mp3'}
          route_path.write_text(json.dumps(route,ensure_ascii=False,separators=(',',':'))+'\n')

          reg_path=r2/'data'/'chapter-registry.json'
          reg=json.loads(reg_path.read_text())
          ch=reg['chapters']['r2-ch036']
          assert ch['display_number']==36 and ch['title']=='Four Nights'
          ch['pipeline']['audio']='published'
          ch['next_action']='plan_images'
          reg_path.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n')

          test=(root/'tests'/'test_greg_again_audio_ch036.py')
          test.write_text('''import hashlib,json,unittest\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\nAUDIO=ROOT/"greg-again"/"audio"\nR2=ROOT/"r2"\nclass GregAgainChapter36AudioTest(unittest.TestCase):\n    def test_chapter_36_is_durable_verified_and_routed(self):\n        manifest=json.loads((AUDIO/"manifest.json").read_text())\n        by_id={c["chapter_id"]:c for c in manifest["chapters"]}\n        c=by_id["ga-036"]\n        self.assertEqual(36,c["number"]); self.assertEqual("Four Nights",c["title"])\n        self.assertEqual("shared-greg-surface",c["lens"]); self.assertEqual("processing-space",c["audio_finish"])\n        self.assertEqual(33,c["take_count"]); self.assertEqual(662.496,c["duration_seconds"])\n        self.assertEqual("assets/chapter-036.mp3",c["audio_src"])\n        final=AUDIO/"assets"/"chapter-036.mp3"\n        self.assertTrue(final.exists()); self.assertEqual(10600365,final.stat().st_size)\n        self.assertEqual("3dc0cec0265257e1f47e05397434515b48e1f6658f01f06703daa5c07e46bba8",hashlib.sha256(final.read_bytes()).hexdigest())\n        m=json.loads((AUDIO/"production"/"036"/"takes.json").read_text())\n        self.assertEqual("ga-036",m["chapter_id"]); self.assertEqual("deep",m["voice"]); self.assertEqual("verified_playable",m["status"])\n        self.assertEqual(33,len(m["takes"])); self.assertEqual(list(range(1,34)),[t["take"] for t in m["takes"]])\n        self.assertEqual(662.496,m["assembled_duration_seconds"])\n        for t in m["takes"]:\n            self.assertEqual("artifact_captured_verified",t["status"])\n            f=ROOT/t["durable_path"]; self.assertTrue(f.exists()); self.assertGreater(f.stat().st_size,10000)\n            self.assertTrue(t["context_id"])\n            self.assertTrue(t["preview_url"].startswith("https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/"))\n            self.assertEqual(t["sha256"],hashlib.sha256(f.read_bytes()).hexdigest())\n        v=json.loads((AUDIO/"verification"/"036-short.json").read_text())\n        self.assertEqual("exact_after_nonspoken_markdown_normalization",v["source_coverage"])\n        self.assertTrue(v["take_order_verified"]); self.assertTrue(v["all_takes_playable"])\n        self.assertEqual(2.0,v["chapter_tail_silence_seconds"])\n        route=json.loads((R2/"data"/"chapters"/"ch036.json").read_text())\n        self.assertEqual("Four Nights",route["title"]); self.assertEqual("published",route["audio"]["status"])\n        self.assertEqual("../greg-again/audio/assets/chapter-036.mp3",route["audio"]["path"])\n        registry=json.loads((R2/"data"/"chapter-registry.json").read_text())\n        self.assertEqual("published",registry["chapters"]["r2-ch036"]["pipeline"]["audio"])\nif __name__=="__main__": unittest.main()\n''')
          PY
      - name: Verify and scope-guard
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_greg_again_audio_ch036 -v
          python -m unittest tests.test_greg_again_audio_catalog -v
          python -m unittest tests.test_r2_site -v
          python - <<'PY'
          import json, pathlib, re, subprocess
          out=subprocess.check_output(['git','diff','--name-only','FETCH_HEAD'],text=True).splitlines()
          allowed_shared={'greg-again/audio/manifest.json','r2/data/chapter-registry.json','tests/test_greg_again_audio_ch036.py','.github/workflows/publish-ga036.yml'}
          bad=[]
          for p in out:
              if p in allowed_shared: continue
              nums=re.findall(r'(?:chapter-|chunks/|production/|takes/|verification/|ch)(\d{3})',p)
              if nums and any(n!='036' for n in nums): bad.append(p)
          if bad: raise SystemExit('unrelated chapter-specific surfaces changed: '+repr(bad))
          guard={'chapter_id':'ga-036','base_sha':'f41527ebdb9edb39a96acf5631b480d6be6a2dc9','unrelated_chapter_surfaces_changed':False,'changed_paths':out}
          path=pathlib.Path('greg-again/audio/verification/036-scope.json')
          path.write_text(json.dumps(guard,indent=2)+'\n')
          PY
      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git add greg-again/audio/manifest.json greg-again/audio/verification/036-scope.json r2/data/chapter-registry.json r2/data/chapters/ch036.json tests/test_greg_again_audio_ch036.py
          git commit -m 'audio: publish Greg Again Chapter 36 over newest main'
          git push origin HEAD:audio/greg-again-ch036-auto
