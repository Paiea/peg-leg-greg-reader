name: Publish Greg Again Chapter 41

on:
  push:
    branches:
      - audio/greg-again-ch041-auto
    paths:
      - .github/workflows/publish-ga041.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/greg-again-ch041-auto
          fetch-depth: 0
      - name: Reconcile newest main and publish chapter 41 metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- greg-again/audio/manifest.json r2/data/chapters/ch041.json
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          audio=root/'greg-again/audio'
          v=json.loads((audio/'verification/041-short.json').read_text())
          assert v['status']=='verified_playable'
          assert v['exact_source_coverage'] is True
          assert v['take_order_verified'] is True
          assert v['individual_mp3s_verified'] is True
          assert v['assembled_mp3_verified'] is True
          assert v['seam_continuity_verified'] is True
          assert v['take_count']==30
          assert v['assembled_duration_seconds']==785.448
          assert v['assembled_bytes']==12567597
          assert v['assembled_sha256']=='0d7dc39f03031b0836658d23a442fc3d507e1a059668054c9d23c7c0583f4f62'
          assert v['pronunciation_substitutions']==[{'take':13,'written':'Mana','provider':'Ma-na'}]

          manifest_path=audio/'manifest.json'
          manifest=json.loads(manifest_path.read_text())
          if any(c['chapter_id']=='ga-041' for c in manifest['chapters']):
              raise SystemExit('ga-041 already published on newest main; refusing to overwrite newer authority')
          manifest['chapters'].append({
            'chapter_id':'ga-041','number':41,'title':'The Cordon','status':'experimental',
            'lens':'shared-greg-surface','audio_finish':'processing-space','take_count':30,
            'duration_seconds':785.448,'audio_src':'assets/chapter-041.mp3',
            'note':'Chapter 41 uses thirty complete preview-safe deep-voice short takes captured as durable MP3 artifacts. Exact current spoken-source coverage, provider identities, take ordering, individual playability, stitched chapter audio, durable hashes, seam continuity, the Hawaiian-context Mana pronunciation substitution, the authoritative final ellipsis, and a two-second listener tail were verified before publication.'
          })
          manifest['chapters'].sort(key=lambda c:c['number'])
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')

          route_path=root/'r2/data/chapters/ch041.json'
          route=json.loads(route_path.read_text())
          assert route['chapter_id']=='r2-ch041' and route['title']=='The Cordon'
          route['audio']={'status':'published','path':'../greg-again/audio/assets/chapter-041.mp3'}
          route_path.write_text(json.dumps(route,separators=(',',':'))+'\n')

          test_path=root/'tests/test_greg_again_audio_ch041.py'
          test_path.write_text('''import hashlib,json,unittest\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\nAUDIO=ROOT/'greg-again'/'audio'\nR2=ROOT/'r2'\nclass GregAgainChapter41AudioTest(unittest.TestCase):\n    def test_chapter_41_is_durable_verified_and_routed(self):\n        manifest=json.loads((AUDIO/'manifest.json').read_text())\n        by_id={c['chapter_id']:c for c in manifest['chapters']}\n        c=by_id['ga-041']\n        self.assertEqual(41,c['number']); self.assertEqual('The Cordon',c['title'])\n        self.assertEqual('shared-greg-surface',c['lens']); self.assertEqual('processing-space',c['audio_finish'])\n        self.assertEqual(30,c['take_count']); self.assertEqual(785.448,c['duration_seconds'])\n        self.assertEqual('assets/chapter-041.mp3',c['audio_src'])\n        final=AUDIO/'assets'/'chapter-041.mp3'\n        self.assertTrue(final.exists()); self.assertEqual(12567597,final.stat().st_size)\n        self.assertEqual('0d7dc39f03031b0836658d23a442fc3d507e1a059668054c9d23c7c0583f4f62',hashlib.sha256(final.read_bytes()).hexdigest())\n        m=json.loads((AUDIO/'takes'/'041-short.json').read_text())\n        self.assertEqual('ga-041',m['chapter_id']); self.assertEqual('deep',m['voice']); self.assertEqual('verified_playable',m['status'])\n        self.assertEqual(30,len(m['takes'])); self.assertEqual(list(range(1,31)),[t['take'] for t in m['takes']])\n        self.assertEqual(785.448,m['assembled_duration_seconds'])\n        for t in m['takes']:\n            self.assertEqual('artifact_captured_verified',t['status'])\n            f=ROOT/t['durable_file']; self.assertTrue(f.exists()); self.assertGreater(f.stat().st_size,10000)\n            self.assertTrue(t['provider_context_id'])\n            self.assertTrue(t['preview_url'].startswith('https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/'))\n            self.assertEqual(t['sha256'],hashlib.sha256(f.read_bytes()).hexdigest())\n        self.assertEqual('Ma-na',m['takes'][12]['provider_transcript'].split('discharge?')[0].split('\\n')[-1].strip('" '))\n        v=json.loads((AUDIO/'verification'/'041-short.json').read_text())\n        self.assertTrue(v['exact_source_coverage']); self.assertTrue(v['take_order_verified'])\n        self.assertTrue(v['individual_mp3s_verified']); self.assertTrue(v['assembled_mp3_verified'])\n        self.assertTrue(v['seam_continuity_verified']); self.assertEqual(2.0,v['chapter_tail_silence_seconds_added'])\n        self.assertEqual([{'take':13,'written':'Mana','provider':'Ma-na'}],v['pronunciation_substitutions'])\n        route=json.loads((R2/'data'/'chapters'/'ch041.json').read_text())\n        self.assertEqual('The Cordon',route['title']); self.assertEqual('published',route['audio']['status'])\n        self.assertEqual('../greg-again/audio/assets/chapter-041.mp3',route['audio']['path'])\nif __name__=='__main__': unittest.main()\n''')
          PY
          python -m unittest tests.test_greg_again_audio_ch041
          python -m unittest tests.test_r2_site
      - name: Remove temporary production workflows
        shell: bash
        run: |
          rm -f .github/workflows/capture-ga041.yml .github/workflows/capture-ga041-v2.yml .github/workflows/diagnose-ga041-coverage.yml .github/workflows/publish-ga041.yml
      - name: Commit publication transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audio: publish Greg Again Chapter 41'
          git push origin HEAD:audio/greg-again-ch041-auto
