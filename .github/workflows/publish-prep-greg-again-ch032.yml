name: Prepare Greg Again Chapter 32 Publication

on:
  push:
    branches:
      - audio/greg-again-ch032-auto
    paths:
      - .github/workflows/publish-prep-greg-again-ch032.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audio/greg-again-ch032-auto

      - name: Reconcile newest main manifest and add Chapter 32
        run: |
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:greg-again/audio/manifest.json > /tmp/main-manifest.json
          python - <<'PY'
          import json, pathlib
          src = pathlib.Path('/tmp/main-manifest.json')
          data = json.loads(src.read_text())
          chapters = data['chapters']
          existing = {int(c['number']) for c in chapters}
          if 32 not in existing:
              chapters.append({
                  'chapter_id': 'ga-032',
                  'number': 32,
                  'title': 'The Longer Route',
                  'status': 'experimental',
                  'lens': 'shared-greg-surface',
                  'audio_finish': 'processing-space',
                  'take_count': 27,
                  'duration_seconds': 612.384,
                  'audio_src': 'assets/chapter-032.mp3',
                  'note': 'Chapter 32 uses twenty-seven complete preview-safe deep-voice takes captured directly as durable MP3 artifacts. Exact authoritative written-source coverage, provider identities, ordered take playback, stitched chapter audio, durable hashes, terminal ellipsis landing, and a two-second listener tail were verified before publication.'
              })
          pathlib.Path('greg-again/audio/manifest.json').write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Verify publication contract
        run: |
          python -m unittest tests.test_greg_again_audio_catalog -v
          python -m unittest tests.test_r2_site -v

      - name: Commit reconciled manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/manifest.json
          if git diff --cached --quiet; then
            echo 'Manifest already reconciled.'
          else
            git commit -m 'audio: publish Greg Again Chapter 32 manifest'
            git push origin HEAD:audio/greg-again-ch032-auto
          fi
