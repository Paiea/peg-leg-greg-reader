name: Publish Experiment C Round 01

on:
  push:
    branches:
      - publish/r2-written-c-round1-087-112
    paths:
      - .github/workflows/publish-r2-c-round1-087-112.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: publish/r2-written-c-round1-087-112
      - name: Materialize selected prose and reader state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin experiment/r2-temporal-c-hybrid:refs/remotes/origin/experiment/r2-temporal-c-hybrid
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          root = Path('.')
          r2 = root / 'r2'
          source_root = 'r2/experiments/temporal-writing/c-hybrid/reconciled'
          titles = {}

          def source_text(n):
              path = f'{source_root}/ch{n:03d}.md'
              return subprocess.check_output(['git','show',f'origin/experiment/r2-temporal-c-hybrid:{path}'], text=True)

          def clean_teaser(text):
              lines = text.splitlines()[1:]
              para=[]; started=False
              for line in lines:
                  s=line.strip()
                  if not s and not started: continue
                  if not s and started: break
                  started=True; para.append(s)
              teaser=re.sub(r'[*_`#]+','', ' '.join(para))
              teaser=re.sub(r'\s+',' ',teaser).strip()
              if len(teaser)>220:
                  teaser=teaser[:217].rsplit(' ',1)[0]+'...'
              return teaser

          for n in range(87,113):
              text=source_text(n)
              m=re.match(r'# Chapter\s+%d:\s*(.+)' % n,text)
              if not m: raise SystemExit(f'bad heading {n}')
              titles[n]=m.group(1).strip()
              p=r2/f'assets/written/ch{n:03d}.md'
              p.write_text(text,encoding='utf-8')

          project_path=r2/'data/project.json'
          project=json.loads(project_path.read_text(encoding='utf-8'))
          project['current_chapter']='r2-ch112'
          project['chapters']=[f'r2-ch{i:03d}' for i in range(1,113)]
          project_path.write_text(json.dumps(project,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          registry_path=r2/'data/chapter-registry.json'
          registry=json.loads(registry_path.read_text(encoding='utf-8'))
          registry['current_chapter']='r2-ch112'
          for n in range(87,113):
              cid=f'r2-ch{n:03d}'
              registry['chapters'][cid]={
                  'display_number':n,'title':titles[n],'status':'in_progress',
                  'pipeline':{'scene_packets':'in_progress','audio':'not_started','written':'published','story_sync':'in_progress','image_plan':'not_started','image_generation':'not_started','image_review':'not_started','image_integration':'not_started'},
                  'images':{'target_count':2,'planned':0,'generated':0,'approved':0,'integrated':0},
                  'last_completed_stage':'written','next_action':'publish_audio_and_plan_images'
              }
          registry_path.write_text(json.dumps(registry,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')

          ch86_path=r2/'data/chapters/ch086.json'
          ch86=json.loads(ch86_path.read_text(encoding='utf-8'))
          ch86['navigation']['next']='r2-ch087'
          ch86_path.write_text(json.dumps(ch86,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')

          for n in range(87,113):
              text=(r2/f'assets/written/ch{n:03d}.md').read_text(encoding='utf-8')
              manifest={
                  'chapter_id':f'r2-ch{n:03d}','display_number':n,'title':titles[n],'status':'published','book':1,'act':1,
                  'teaser':clean_teaser(text),'audio':{'status':'unavailable','path':None},
                  'written':{'status':'published','path':f'assets/written/ch{n:03d}.md'},'images':[],
                  'navigation':{'previous':f'r2-ch{n-1:03d}','next':None if n==112 else f'r2-ch{n+1:03d}'}
              }
              (r2/f'data/chapters/ch{n:03d}.json').write_text(json.dumps(manifest,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')

          test_path=root/'tests/test_r2_site.py'
          tests=test_path.read_text(encoding='utf-8')
          tests=tests.replace('range(1, 87)','range(1, 113)')
          tests=tests.replace("self.assertEqual(project['current_chapter'], 'r2-ch086')","self.assertEqual(project['current_chapter'], 'r2-ch112')")
          tests=tests.replace('test_written_frontier_is_public_through_chapter_eighty_six','test_written_frontier_is_public_through_chapter_one_hundred_twelve')
          tests=tests.replace('None if number == 86 else','None if number == 112 else')
          test_path.write_text(tests,encoding='utf-8')
          PY

          python -m unittest tests.test_r2_site -v

          git config user.name "experiment-c-publisher"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/publish-r2-c-round1-087-112.yml
          git add r2/assets/written r2/data tests/test_r2_site.py
          git commit -m "Publish Experiment C Round 01 Chapters 87-112"
          git push origin HEAD:publish/r2-written-c-round1-087-112
