name: Publish Experiment C Round 10

on:
  push:
    branches:
      - publish/r2-written-c-round10-305-330
    paths:
      - r2/publish_round10.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch reconciled experiment authority
        run: git fetch origin experiment/r2-temporal-c-hybrid
      - name: Materialize selected prose and reader state
        run: python r2/publish_round10.py
      - name: Run R2 reader contract
        run: python -m unittest tests.test_r2_site -v
      - name: Commit publication transaction
        run: |
          rm -f r2/publish_round10.py .github/workflows/publish-r2-c-round10-305-330.yml
          git config user.name "experiment-c-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish Experiment C Round 10 Chapters 305-330" || exit 0
          git push origin HEAD:publish/r2-written-c-round10-305-330
