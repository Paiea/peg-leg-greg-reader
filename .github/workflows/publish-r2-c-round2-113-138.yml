name: Publish Experiment C Round 02
on:
  push:
    branches: [publish/r2-written-c-round2-113-138]
    paths: ['.github/workflows/publish-r2-c-round2-113-138.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: publish/r2-written-c-round2-113-138
      - name: Materialize selected prose and reader state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin experiment/r2-temporal-c-hybrid:refs/remotes/origin/experiment/r2-temporal-c-hybrid
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          root=Path('.')
          r2=root/'r2'
          source_root='r2/experiments/temporal-writing/c-hybrid/reconciled/round-02'
          titles={}

          def source_text(n):
              path=f'{source_root}/ch{n:03d}.md'
              return subprocess.check_output(['git','show',f'origin/experiment/r2-temporal-c-hybrid:{path}'], text=True)

          def teaser(text):
              lines=text.splitlines()[1:]
              para=[]; started=False
              for line in lines:
                  s=line.strip()
                  if not s and not started: continue
                  if not s and started: break
                  started=True; para.append(s)
              t=' '.join(para)
              t=re.sub(r'[*_`#]+','',t)
              t=re.sub(r'\s+',' ',t).strip()
              if len(t)>220: t=t[:217].rsplit(' ',1)[0]+'...'
              return t

          for n in range(113,139):
              text=source_text(n)
              m=re.match(r'# Chapter\s+%d:\s*(.+)'%n,text)
              if not m: raise SystemExit(f'bad heading {n}')
              titles[n]=m.group(1).strip()
              p=r2/f'assets/written/ch{n:03d}.md'
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text,encoding='utf-8')

          project_path=r2/'data/project.json'
          project=json.loads(project_path.read_text(encoding='utf-8'))
          project['current_chapter']='r2-ch138'
          project['chapters']=[f'r2-ch{i:03d}' for i in range(1,139)]
          project_path.write_text(json.dumps(project,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          registry_path=r2/'data/chapter-registry.json'
          registry=json.loads(registry_path.read_text(encoding='utf-8'))
          registry['current_chapter']='r2-ch138'
          for n in range(113,139):
              cid=f'r2-ch{n:03d}'
              registry['chapters'][cid]={
                  'display_number':n,
                  'title':titles[n],
                  'status':'in_progress',
                  'pipeline':{
                      'scene_packets':'in_progress',
                      'audio':'not_started',
                      'written':'published',
                      'story_sync':'in_progress',
                      'image_plan':'not_started',
                      'image_generation':'not_started',
                      'image_review':'not_started',
                      'image_integration':'not_started'
                  },
                  'images':{'target_count':2,'planned':0,'generated':0,'approved':0,'integrated':0},
                  'last_completed_stage':'written',
                  'next_action':'publish_audio_and_plan_images'
              }
          registry_path.write_text(json.dumps(registry,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')

          prev_path=r2/'data/chapters/ch112.json'
          prev=json.loads(prev_path.read_text(encoding='utf-8'))
          prev['navigation']['next']='r2-ch113'
          prev_path.write_text(json.dumps(prev,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')

          for n in range(113,139):
              text=(r2/f'assets/written/ch{n:03d}.md').read_text(encoding='utf-8')
              manifest={
                  'chapter_id':f'r2-ch{n:03d}',
                  'display_number':n,
                  'title':titles[n],
                  'status':'published',
                  'book':1,
                  'act':1,
                  'teaser':teaser(text),
                  'audio':{'status':'unavailable','path':None},
                  'written':{'status':'published','path':f'assets/written/ch{n:03d}.md'},
                  'images':[],
                  'navigation':{
                      'previous':f'r2-ch{n-1:03d}',
                      'next':None if n==138 else f'r2-ch{n+1:03d}'
                  }
              }
              (r2/f'data/chapters/ch{n:03d}.json').write_text(json.dumps(manifest,separators=(',',':'),ensure_ascii=False)+'\n',encoding='utf-8')

          test_path=root/'tests/test_r2_site.py'
          tests=test_path.read_text(encoding='utf-8')
          tests=tests.replace('range(1, 113)','range(1, 139)')
          tests=tests.replace("self.assertEqual(project['current_chapter'], 'r2-ch112')","self.assertEqual(project['current_chapter'], 'r2-ch138')")
          tests=tests.replace('test_written_frontier_is_public_through_chapter_one_hundred_twelve','test_written_frontier_is_public_through_chapter_one_hundred_thirty_eight')
          tests=tests.replace('None if number == 112 else','None if number == 138 else')
          test_path.write_text(tests,encoding='utf-8')
          PY
          python -m unittest tests.test_r2_site -v
          git config user.name experiment-c-publisher
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/publish-r2-c-round2-113-138.yml
          git add r2/assets/written r2/data tests/test_r2_site.py
          git commit -m 'Publish Experiment C Round 02 Chapters 113-138'
          git push origin HEAD:publish/r2-written-c-round2-113-138