name: Publish Experiment C Round 03

on:
  push:
    branches:
      - publish/r2-written-c-round3-139-164
    paths:
      - .github/workflows/publish-r2-c-round3-139-164.yml
      - r2/experiments/temporal-writing/c-hybrid/tools/round3_publish.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch reconciled experiment authority
        run: git fetch origin experiment/r2-temporal-c-hybrid
      - name: Materialize selected prose and reader state
        run: python r2/experiments/temporal-writing/c-hybrid/tools/round3_publish.py
      - name: Run R2 reader contract
        run: python -m unittest tests.test_r2_site -v
      - name: Commit publication transaction
        run: |
          git config user.name "experiment-c-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add r2/assets/written r2/data tests/test_r2_site.py
          git rm .github/workflows/publish-r2-c-round3-139-164.yml
          git rm r2/experiments/temporal-writing/c-hybrid/tools/round3_publish.py
          git commit -m "Publish Experiment C Round 03 Chapters 139-164"
          git push origin HEAD:publish/r2-written-c-round3-139-164
