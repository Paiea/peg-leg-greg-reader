name: Apply R2 Chapter Landing Doctrine

on:
  push:
    branches:
      - audio/chapter-landing-doctrine
    paths:
      - .github/workflows/r2-chapter-landing-doctrine.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/chapter-landing-doctrine
      - name: Apply doctrine updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pipeline = Path('r2/PIPELINE.md')
          text = pipeline.read_text()
          anchor = "When a moment becomes too compressed to process by ear, prefer an earned beat of Greg over a perfectly efficient sentence.\n\n## Written Finish"
          insert = """When a moment becomes too compressed to process by ear, prefer an earned beat of Greg over a perfectly efficient sentence.\n\n## Chapter landing\n\nA chapter ending needs both a **semantic landing** and an **acoustic landing**.\n\nThe final spoken beat should feel like the chapter's actual closing thought, image, joke, consequence, realization, or emotional state from current story authority. Do not cut that beat short merely because a provider-safe take boundary is convenient.\n\nDo not invent an extra closing sentence just to manufacture closure. If the authoritative ending is deliberately unresolved, abrupt, or open, preserve that shape. The rule is to let the real ending land, not to conventionalize it.\n\nAfter the final spoken word, the listener should get a short clean tail before the file ends so the last idea has time to register by ear. Production owns the exact tail treatment.\n\n## Written Finish"""
          if anchor not in text:
              raise SystemExit('PIPELINE anchor missing')
          pipeline.write_text(text.replace(anchor, insert, 1))

          production = Path('r2/AUDIO_PRODUCTION.md')
          text = production.read_text()
          anchor = """Assembly must:\n\n1. order takes numerically\n2. include every take exactly once\n3. preserve intentional end/start silence when it carries useful processing space\n4. avoid accidental duplicated phrases at seams\n5. avoid accidental missing phrases at seams\n6. avoid adding decorative sound design, music, crossfades, or performance effects unless separately authorized\n7. produce the established chapter audio artifact path used by the Greg, Again manifest/catalog\n"""
          replacement = """Assembly must:\n\n1. order takes numerically\n2. include every take exactly once\n3. preserve intentional end/start silence when it carries useful processing space\n4. avoid accidental duplicated phrases at seams\n5. avoid accidental missing phrases at seams\n6. avoid adding decorative sound design, music, crossfades, or performance effects unless separately authorized\n7. produce the established chapter audio artifact path used by the Greg, Again manifest/catalog\n8. preserve the chapter's actual final spoken beat as the ending, then leave roughly **2–4 seconds of clean tail silence** after the final word so the listener can register that the chapter has ended\n\nIf the final take already contains a clean natural tail in that range, preserve it instead of stacking more silence on top. If it ends too tightly, add deterministic tail silence during final assembly. A deliberately unusual ending may justify a different tail, but ordinary production should default to the 2–4 second landing window.\n"""
          if anchor not in text:
              raise SystemExit('AUDIO_PRODUCTION assembly anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = """- manifest/catalog entries point to the correct artifact\n- neighboring workers' chapters were not overwritten\n"""
          replacement = """- manifest/catalog entries point to the correct artifact\n- neighboring workers' chapters were not overwritten\n- the last spoken beat matches the authoritative chapter ending rather than a convenient production cutoff\n- the final listener-facing file preserves roughly 2–4 seconds of clean tail silence after the last spoken word unless a deliberate ending requires otherwise\n"""
          if anchor not in text:
              raise SystemExit('AUDIO_PRODUCTION verification anchor missing')
          production.write_text(text.replace(anchor, replacement, 1))
          PY

          git diff --check
          grep -n "Chapter landing" r2/PIPELINE.md
          grep -n "2–4 seconds of clean tail silence" r2/AUDIO_PRODUCTION.md
      - name: Commit doctrine updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r2/PIPELINE.md r2/AUDIO_PRODUCTION.md
          git commit -m 'audio: define chapter landing rule'
          git push origin HEAD:audio/chapter-landing-doctrine
