name: Apply R2 Ending Ellipsis 001-023

on:
  push:
    branches:
      - editor/r2-ending-ellipsis-001-023
    paths:
      - .github/workflows/r2-ending-ellipsis-retrofit-001-023.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor/r2-ending-ellipsis-001-023
          fetch-depth: 0
      - name: Normalize final sentence punctuation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for n in range(1, 24):
              p = Path(f'r2/assets/written/ch{n:03d}.md')
              if not p.exists():
                  raise SystemExit(f'missing {p}')
              text = p.read_text(encoding='utf-8')
              lines = text.splitlines()
              idx = next((i for i in range(len(lines)-1, -1, -1) if lines[i].strip()), None)
              if idx is None:
                  raise SystemExit(f'empty {p}')
              old = lines[idx]
              new = re.sub(r'[.!?…]+$', '...', old)
              if new == old and not old.endswith('...'):
                  new = old + '...'
              lines[idx] = new
              out = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
              p.write_text(out, encoding='utf-8')
              changed.append((n, old, new))

          for n, old, new in changed:
              print(f'{n:03d}: {old} -> {new}')
              if not new.endswith('...'):
                  raise SystemExit(f'ch{n:03d} did not end with ellipsis')
          PY
          git diff --check
          git diff -- r2/assets/written/ch*.md
      - name: Commit chapter-ending normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Paiea
          git config user.email paiea.tv@gmail.com
          git add r2/assets/written/ch{001..023}.md
          if git diff --cached --quiet; then
            echo 'No prose changes needed.'
            exit 0
          fi
          git commit -m 'r2: normalize chapter endings 001-023 to ellipsis'
          git fetch origin editor/r2-ending-ellipsis-001-023
          git rebase origin/editor/r2-ending-ellipsis-001-023
          git push origin HEAD:editor/r2-ending-ellipsis-001-023
