name: Inventory R2 Chapter Endings

on:
  push:
    branches:
      - audio/chapter-ending-normalization-001-023
    paths:
      - .github/workflows/r2-ending-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/chapter-ending-normalization-001-023
      - name: Record ending inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          out=[]
          for p in sorted(Path('r2/assets/written').glob('ch*.md')):
              n=int(p.stem[2:])
              if n>23: continue
              text=p.read_text().rstrip()
              paras=[x.strip() for x in text.split('\n\n') if x.strip()]
              out.append(f'## {p.name}\n\n')
              out.append('\n\n'.join(paras[-3:]))
              out.append('\n\n')
          Path('r2/state-ending-inventory-001-023.md').write_text(''.join(out))
          PY
          git add r2/state-ending-inventory-001-023.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audio: inventory chapter endings 001-023'
          git push origin HEAD:audio/chapter-ending-normalization-001-023
