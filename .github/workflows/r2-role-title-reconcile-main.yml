name: Reconcile R2 role titles with current main

on:
  push:
    branches:
      - r2/embodied-role-titles-118-fast
    paths:
      - '.github/workflows/r2-role-title-reconcile-main.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge newest main with explicit conflict boundary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            echo "Conflicts detected:"
            printf '%s\n' "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^greg-again/audio/manifest.json$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected conflicts. Refusing to guess:"
              printf '%s\n' "$unexpected"
              exit 1
            fi

            # Current main owns audio-production structure/state. Restore its
            # manifest first, then reapply title metadata from R2 authority.
            git checkout --theirs greg-again/audio/manifest.json
            git add greg-again/audio/manifest.json
          elif [ "$merge_status" -ne 0 ]; then
            echo "Merge failed without a resolvable tracked conflict."
            exit "$merge_status"
          fi

          python scripts/sync_r2_role_titles.py --apply
          python scripts/sync_r2_role_titles.py --check

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # One-time reconciliation workflow removes itself from the branch.
          rm .github/workflows/r2-role-title-reconcile-main.yml
          git add -A

          python -m unittest tests.test_sync_r2_role_titles tests.test_r2_role_titles tests.test_r2_site -v
          git diff --check --cached

          git commit -m 'chore(r2): reconcile role titles with current main'
          git push origin HEAD:r2/embodied-role-titles-118-fast
