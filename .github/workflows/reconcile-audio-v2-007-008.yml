name: Reconcile Audio Score v2 007-008

on:
  push:
    branches:
      - reconcile/audio-score-v2-ch007-ch008

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconcile/audio-score-v2-ch007-ch008
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Patch current manifests
        run: python scripts/reconcile_audio_v2_007_008.py
      - name: Remove one-shot reconciler
        run: |
          git rm .github/workflows/reconcile-audio-v2-007-008.yml
          git rm scripts/reconcile_audio_v2_007_008.py
      - name: Commit reconciled manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/manifest.json greg-again/audio/v2/manifest.json
          git commit -m 'Reconcile Audio Score v2 Chapters 7 and 8'
          git push origin HEAD:reconcile/audio-score-v2-ch007-ch008
