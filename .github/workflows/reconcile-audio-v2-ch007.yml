name: Reconcile Audio v2 Chapter 007

on:
  push:
    branches:
      - audio/v2-greg-again-ch007-auto

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/v2-greg-again-ch007-auto
          fetch-depth: 0
      - name: Fetch active Audio Score authority
        run: git fetch origin audio-score/chapters-001-010:refs/remotes/origin/audio-score/chapters-001-010
      - name: Reconcile shared authority files
        run: python scripts/reconcile_audio_v2_ch007.py
      - name: Run audio catalog contract
        run: python -m unittest tests.test_greg_again_audio_catalog -v
      - name: Commit reconciled authority and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-audio-v2-ch007.yml scripts/reconcile_audio_v2_ch007.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add greg-again/audio/v2/manifest.json greg-again/audio/manifest.json tests/test_greg_again_audio_catalog.py
          git commit -m "audio: reconcile Chapter 007 with current v2 authority"
          git push origin HEAD:audio/v2-greg-again-ch007-auto
