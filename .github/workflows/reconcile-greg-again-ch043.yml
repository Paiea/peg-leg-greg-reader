name: Reconcile Greg Again Chapter 43

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'audio/greg-again-ch043-auto'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audio/greg-again-ch043-auto
      - name: Rebuild manifest from newest main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:greg-again/audio/manifest.json > /tmp/manifest.json
          python - <<'PY'
          import json, pathlib
          src = pathlib.Path('/tmp/manifest.json')
          data = json.loads(src.read_text())
          chapters = data['chapters']
          chapters = [c for c in chapters if c.get('chapter_id') != 'ga-043']
          chapters.append({
            'chapter_id':'ga-043','number':43,'title':'The Support','status':'experimental',
            'lens':'shared-greg-surface','audio_finish':'processing-space','take_count':26,
            'duration_seconds':708.744,'audio_src':'assets/chapter-043.mp3',
            'note':'Chapter 43 uses twenty-six complete preview-safe deep-voice takes captured directly as durable MP3 artifacts. Exact current written-source coverage, ordered take identity, individual MP3 playability, provider-facing mana pronunciation aliases, stitched chapter audio, durable hashes, the authoritative ellipsis landing, and a two-second listener tail were verified before publication.'
          })
          data['chapters'] = sorted(chapters, key=lambda c: c['number'])
          pathlib.Path('greg-again/audio/manifest.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Verify publication contracts
        run: python -m unittest tests.test_greg_again_audio_catalog tests.test_r2_site -v
      - name: Commit reconciled manifest
        run: |
          if git diff --quiet -- greg-again/audio/manifest.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add greg-again/audio/manifest.json
          git commit -m 'audio: publish Greg Again Chapter 43 manifest'
          git push origin HEAD:audio/greg-again-ch043-auto
