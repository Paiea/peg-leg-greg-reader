name: REHEARSAL overtuned calibration 001-020

on:
  push:
    branches:
      - editor/rehearsal-simulation-engine
    paths:
      - '.github/workflows/rehearsal-overtuned-calibration-001-020.yml'
      - 'scripts/apply_rehearsal_overtuned_calibration.py'
      - 'scripts/rehearsal_engine.py'
      - 'tests/test_rehearsal_engine.py'
      - 'tests/test_rehearsal_overtuned_calibration.py'
      - 'state/editorial/rehearsal/campaigns/canon-001-020-overtuned-manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Focused calibration tests
        run: |
          python -m unittest tests.test_rehearsal_engine tests.test_rehearsal_overtuned_calibration -v

      - name: Dry-run all exact actor patches
        run: |
          python scripts/apply_rehearsal_overtuned_calibration.py

      - name: Apply overtuned actor-preferred prose
        run: |
          python scripts/apply_rehearsal_overtuned_calibration.py --write

      - name: Verify calibration diff boundaries
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report_path = Path('state/editorial/rehearsal/campaigns/canon-001-020-overtuned-report.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          if report['patches_applied'] != 31:
              raise SystemExit(f"expected 31 applied patches, got {report['patches_applied']}")
          expected_chapters = {5, 7, 10, 11, 13, 14, 16, 17, 18}
          if set(report['changed_chapters']) != expected_chapters:
              raise SystemExit(f"unexpected changed chapters: {report['changed_chapters']}")

          allowed = {f'chapters/{n:03d}.html' for n in expected_chapters}
          allowed.add(str(report_path))
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).split())
          extra = changed - allowed
          if extra:
              raise SystemExit('unexpected generated files: ' + ', '.join(sorted(extra)))
          missing = {f'chapters/{n:03d}.html' for n in expected_chapters} - changed
          if missing:
              raise SystemExit('expected chapter rewrites missing: ' + ', '.join(sorted(missing)))
          print('Overtuned diff boundary verified:', ', '.join(sorted(changed)))
          PY

      - name: Reject hard-surface leakage and em dashes
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path('state/editorial/rehearsal/campaigns/canon-001-020-overtuned-manifest.json').read_text(encoding='utf-8'))
          hard = {'plot','facts','knowledge','causality','major_relationship_state','physical_state','chronology','economics','earned_competence','injury_state'}
          for patch in manifest['patches']:
              overlap = hard.intersection(patch['changed_surfaces'])
              if overlap:
                  raise SystemExit(f"hard surface leaked into {patch['id']}: {sorted(overlap)}")
          for n in {5,7,10,11,13,14,16,17,18}:
              page = Path('chapters') / f'{n:03d}.html'
              text = page.read_text(encoding='utf-8')
              article = text.split('<article class="prose">', 1)[1].split('</article>', 1)[0]
              prose = re.sub(r'<[^>]+>', '', article)
              if '—' in prose:
                  raise SystemExit(f'em dash in prose: {page}')
          print('Hard-surface and no-em-dash checks passed.')
          PY

      - name: Full repository validation
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate_performance_roundtrip_archive.py
          python scripts/validate_showcase.py
          git diff --check

      - name: Commit overtuned calibration prose
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chapters/005.html chapters/007.html chapters/010.html chapters/011.html chapters/013.html chapters/014.html chapters/016.html chapters/017.html chapters/018.html state/editorial/rehearsal/campaigns/canon-001-020-overtuned-report.json
          if git diff --cached --quiet; then
            echo 'No overtuned prose changes to commit.'
            exit 0
          fi
          git commit -m 'Apply overtuned REHEARSAL calibration through canon 20'
          git push origin HEAD:editor/rehearsal-simulation-engine
