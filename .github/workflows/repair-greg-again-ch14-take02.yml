name: Repair Greg Again Chapter 14 Take 02

on:
  push:
    branches:
      - audio/greg-again-ch014-auto
    paths:
      - .github/workflows/repair-greg-again-ch14-take02.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch014-auto
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser and audio harness
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Preserve captured chunks and make room for split repair
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 12 -1 3); do
            src=$(printf 'greg-again/audio/assets/chunks/014/%02d.mp3' "$i")
            dst=$(printf 'greg-again/audio/assets/chunks/014/%02d.mp3' "$((i+3))")
            test -f "$src"
            mv "$src" "$dst"
          done
      - name: Capture replacement takes 02-05
        shell: bash
        run: |
          cat > capture-repair.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const jobs = [
            ['02','7c28c220f53d4be6bd893c8563f2941b'],
            ['03','f78483fbda3549bbbe83393561aeac68'],
            ['04','57ad466c09274a58b6b5a6b63145da95'],
            ['05','ff46ce8b012e457ba1e406e4b38bb6a9']
          ];
          const browser = await chromium.launch({headless:true});
          const failures=[];
          async function capture(label,id){
            const out=`greg-again/audio/assets/chunks/014/${label}.mp3`;
            const page=await browser.newPage();
            try{
              for(let attempt=1;attempt<=12;attempt++){
                await page.goto(`https://www.aidocmaker.com/g0/audio?name=${id}`,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForTimeout(5000);
                const text=await page.locator('body').innerText().catch(()=> '');
                console.log('SEGMENT',label,'ATTEMPT',attempt,text.slice(0,700).replaceAll('\n',' | '));
                if(/longer than 2 minutes requires a paid plan/i.test(text))throw new Error('two-minute gate');
                if(/File Not Found/i.test(text))throw new Error('file not found');
                const sources=await page.locator('audio').evaluateAll(nodes=>nodes.map(n=>n.currentSrc||n.src).filter(Boolean)).catch(()=>[]);
                for(const src of sources){
                  const response=await page.request.get(src).catch(()=>null);
                  if(!response||!response.ok())continue;
                  const body=await response.body();
                  if(body.length>10000){fs.writeFileSync(out,body);console.log('CAPTURED',label,body.length);return;}
                }
                await page.waitForTimeout(4000);
              }
              throw new Error('no playable media surfaced');
            }finally{await page.close();}
          }
          for(const [label,id] of jobs){try{await capture(label,id);}catch(error){failures.push(`${label}: ${error.message}`);console.log('FAILED',label,error.message);}}
          await browser.close();
          fs.writeFileSync('/tmp/capture-failures.txt',failures.join('\n'));
          JS
          node capture-repair.mjs
      - name: Verify, persist, and assemble Chapter 14
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /tmp/capture-failures.txt ]; then cat /tmp/capture-failures.txt; exit 1; fi
          test "$(find greg-again/audio/assets/chunks/014 -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 15
          : > /tmp/ch14-concat.txt
          for i in $(seq 1 15); do
            f=$(printf 'greg-again/audio/assets/chunks/014/%02d.mp3' "$i")
            test "$(stat -c%s "$f")" -gt 10000
            ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$f"
            printf "file '%s'\n" "$GITHUB_WORKSPACE/$f" >> /tmp/ch14-concat.txt
          done
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i /tmp/ch14-concat.txt -c copy greg-again/audio/assets/chapter-014.mp3
          test "$(stat -c%s greg-again/audio/assets/chapter-014.mp3)" -gt 1000000
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 greg-again/audio/assets/chapter-014.mp3
      - name: Commit repaired chunks and assembled Chapter 14
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git stash push --include-untracked --message chapter-14-repair
          git pull --rebase origin audio/greg-again-ch014-auto
          git stash pop
          git add greg-again/audio/assets/chunks/014 greg-again/audio/assets/chapter-014.mp3
          git add -u greg-again/audio/assets/chunks/014
          git commit -m 'audio: repair and assemble Greg Again Chapter 14'
          git push origin HEAD:audio/greg-again-ch014-auto
