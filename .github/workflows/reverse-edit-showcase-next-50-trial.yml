name: Reverse Edit Showcase Next 50 Trial

on:
  push:
    branches:
      - editor/reverse-edit-showcase-next-50
    paths:
      - 'scripts/performance_selected_campaign.py'
      - 'tests/test_performance_campaign_selection.py'
      - '.github/workflows/reverse-edit-showcase-next-50-trial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve accepted main authority
        run: echo "SOURCE_AUTHORITY=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Verify explicit-selection adapter
        run: python -m unittest tests.test_performance_campaign_selection

      - name: Compile Brain packet for trial
        run: |
          mkdir -p .cache/plg/trial
          python scripts/brain_compiler.py compile \
            --task "reverse edit performance next 50 showcase chapters" \
            --authority-branch main \
            --authority-sha "$SOURCE_AUTHORITY" \
            --format json > .cache/plg/trial/brain-packet.json

      - name: Plan selected reverse-edit campaign
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.performance_selected_campaign import plan_selected_campaign

          ids = [27,28,29,30,31,32,34,35,36,37,39,40,41,42,44,45,47,50,51,52,53,54,55,56,58,59,60,61,62,63,64,65,67,68,69,70,71,72,74,75,76,77,78,79,80,81,82,83,84,86]
          result = plan_selected_campaign(
              task="reverse_edit",
              chapter_ids=ids,
              source_authority=os.environ["SOURCE_AUTHORITY"],
              chapter_root=Path("chapters"),
              cache_root=Path(".cache/plg"),
              profile="eco",
              executor="manual",
          )
          Path(".cache/plg/trial/plan-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Verify selected scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plans = list(Path('.cache/plg/campaigns').glob('*/campaign.json'))
          if len(plans) != 1:
              raise SystemExit(f'expected one campaign, found {len(plans)}')
          campaign = json.loads(plans[0].read_text(encoding='utf-8'))
          expected = [27,28,29,30,31,32,34,35,36,37,39,40,41,42,44,45,47,50,51,52,53,54,55,56,58,59,60,61,62,63,64,65,67,68,69,70,71,72,74,75,76,77,78,79,80,81,82,83,84,86]
          if campaign['scope']['chapter_ids'] != expected:
              raise SystemExit('selected scope mismatch')
          if campaign['plan']['chapters_considered'] != 50:
              raise SystemExit('expected exactly 50 selected chapters')
          print(f"Selected {len(expected)} Showcase-visible chapters; {campaign['plan']['scenes_considered']} scenes; {campaign['plan']['packets_planned']} packets; {campaign['plan']['cache_hits']} cache hits")
          PY

      - name: Upload disposable campaign packets
        uses: actions/upload-artifact@v4
        with:
          name: reverse-edit-showcase-next-50-packets
          path: .cache/plg
          if-no-files-found: error
          retention-days: 7
