name: One-shot ship Chapter 232
on:
  push:
    paths:
      - '.github/workflows/ship-ch232-once.yml'
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append chapter and sync living state
        run: |
          python - <<'PY'
          from pathlib import Path
          m=Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md')
          p=Path('state/manuscript/.chapter232.tmp')
          text=m.read_text()
          chapter=p.read_text().strip()
          assert '## Chapter 232 — THE COUNTERSIGN' not in text, 'Chapter 232 already present'
          body=chapter.split('\n',1)[1]
          assert '—' not in body, 'em dash in chapter prose'
          import re
          wc=len(re.findall(r"\b[\w’'-]+\b", chapter))
          assert 2500 <= wc <= 4000, wc
          m.write_text(text.rstrip()+'\n\n'+chapter+'\n')

          s=Path('state/MANUSCRIPT_STATE.md')
          t=s.read_text()
          assert 'Current story endpoint: Chapter 231 — **THE MAGISTRATE**.' in t
          t=t.replace('Current story endpoint: Chapter 231 — **THE MAGISTRATE**.','Current story endpoint: Chapter 232 — **THE COUNTERSIGN**.',1)
          t=t.replace('- Chapter 231 contains no magic attempt or Hessa appearance. Counts remain 33 / 29 / 45 and all restrictions remain unchanged.','- Chapters 231–232 contain no magic attempt or Hessa appearance. Counts remain 33 / 29 / 45 and all restrictions remain unchanged.',1)
          t=t.replace('- Ch231 the narrow folded brown cloth remains in the same fold with the same three pins at morning and evening; customer, garment, ownership, and use remain unestablished. Greg\'s cuff remains at three loose threads and is not repaired.','- Ch231 the narrow folded brown cloth remains in the same fold with the same three pins at morning and evening; customer, garment, ownership, and use remain unestablished. Greg\'s cuff remains at three loose threads and is not repaired.\n- Ch232 the same narrow brown cloth remains in the same fold with the same three pins. Lyssa is working on a separate dark sleeve by evening; no relationship between the sleeve and brown cloth is established. Greg\'s cuff remains at three loose threads.',1)
          t=t.replace('- Ch231 contains no Vale appearance, debt payment, or debt credit. Greg receives the normal one copper for theatre work; debt remains active and unstated.','- Ch231 contains no Vale appearance, debt payment, or debt credit. Greg receives the normal one copper for theatre work; debt remains active and unstated.\n- Ch232 Greg voluntarily seeks suitable Vale work after returning the theatre coat. He matches returned payment acknowledgments against account lines under clerk review and receives legitimate debt credit. Exact credit and current balance remain unstated in narration; Greg sees and knows the balance. No guaranteed job, schedule, or rate is created.',1)
          t=t.replace('- Chapters 224–231 do not advance the pressure arc.','- Chapters 224–232 do not advance the pressure arc.',1)
          marker='\n## Immediate next edge — Chapter 232\n'
          assert marker in t
          chapter_state='''\n## Chapter 232 — THE COUNTERSIGN\n- Ch231 theatre breathes. Greg only returns Nessa's black Magistrate coat in the morning and sees the prior set already repurposed; no rehearsal or performance follows. Rinna says `Tomorrow maybe`, which is not a firm call.\n- With no theatre work that day and active debt, Greg voluntarily checks Vale's office for suitable labor. Outgoing bundles are not ready, so the ink-fingered clerk assigns returned-payment acknowledgment matching instead.\n- Matching rule is narrow: compare name, house mark, date, and amount against the account line; cross matches, turn disagreements or uncertainty sideways, and the clerk checks Greg's crosses. Local correction/district marks remain contextual rather than universal.\n- Greg correctly flags several mismatches and one office carry-forward error involving an earlier partial payment. The office resolves it without mystery or threat significance.\n- Greg makes one ordinary mistake by matching the first familiar-looking surname at a shared house instead of checking the full page; two sisters have near-matching names. The clerk catches it before anything leaves the desk.\n- Antonius records legitimate debt credit. Greg sees and knows the updated balance, but narration does not state the figure. Debt is smaller, still active, and not small. No guaranteed Vale post, schedule, rate, or promotion is established.\n- Body cost remains ordinary seated-work stiffness/eye/back fatigue; new left crutch tip remains normal.\n- No Hessa appearance or magic attempt. Counts remain 33 / 29 / 45; all restrictions unchanged. No Bren/pressure evidence or investigation.\n- Household: narrow brown cloth remains same fold/three pins. Lyssa independently works on a separate dark sleeve. Greg's cuff remains three loose threads. Lyssa asks only whether Vale work produced credit, not the balance.\n- Onion-seller recognition returns narrowly: Greg asks for two, she gives him three while teasing him about deciding faster; he buys three. Do not inflate this into reputation.\n\n## Immediate next edge — Chapter 233\nPrimary recommendation: **LET THE VALE OFFICE DAY BREATHE. FOLLOW THE NEXT ACTUAL OBLIGATION, PERSON, OR ORDINARY PRESSURE.**\n\nReasons:\n- Ch232 gives Vale/debt a full ordinary workday and legitimate credit without creating employment security; another office chapter immediately would overconcentrate the same engine.\n- Theatre is available again only as `Tomorrow maybe`, not a guaranteed call. If work exists, it can be compact or substantial according to the actual day rather than because theatre is due.\n- Hessa still has no chosen next experiment after Ch230. Magic remains 33 / 29 / 45 and should not reopen on a timer.\n- External pressure remains quiet through Ch232. Do not manufacture escalation from elapsed chapters.\n- Lyssa's brown cloth remains deliberately unresolved while a separate dark sleeve shows her work continuing independently. Neither needs explanation merely because it is visible.\n- Ordinary Carrow, food, money, company, errands, household rhythm, and body costs remain valid engines.\n\nStrong Chapter 233 possibilities:\n- follow an actual theatre call if one materializes, preferably ordinary company/work texture unless the repertory day genuinely supports more;\n- an ordinary Carrow/social/household day with Greg free enough to encounter people rather than systems;\n- Lyssa may be present or absent according to her own work, without forcing garment resolution;\n- one grounded pressure fact only if it reaches Greg naturally through an established person or business.\n\nPreserve magic counts 33 / 29 / 45 and all restrictions. Preserve the debt as active with exact balance known in-world but unstated. Do not turn acknowledgment matching into a general detective skill or Ch232's office rules into universal bookkeeping.\n'''
          t=t.replace(marker,chapter_state,1)
          s.write_text(t)

          idx=Path('state/MANUSCRIPT_CHAPTER_INDEX.md')
          it=idx.read_text().rstrip()
          assert '231. **THE MAGISTRATE**' in it and '232. **THE COUNTERSIGN**' not in it
          idx.write_text(it+'\n232. **THE COUNTERSIGN**\n')

          ot=Path('state/OPEN_THREADS.md')
          o=ot.read_text()
          o=o.replace('**Current endpoint:** Chapter 231 — **THE MAGISTRATE**.','**Current endpoint:** Chapter 232 — **THE COUNTERSIGN**.',1)
          o=o.replace('Ch231 contains no magic attempt; counts remain 33 / 29 / 45.','Chapters 231–232 contain no magic attempt; counts remain 33 / 29 / 45.',1)
          o=o.replace('Chapters 224–231 contain no new warning, demand, appearance, violence, sabotage, or investigation.','Chapters 224–232 contain no new warning, demand, appearance, violence, sabotage, or investigation.',1)
          insert='''- **Ch232 Vale work:** Greg voluntarily checks for suitable work after returning the theatre coat. Bundles are not ready; he instead matches returned payment acknowledgments against account lines under clerk review. One office carry-forward error is caught; Greg also makes one ordinary near-name/two-sisters matching mistake that the clerk catches. Antonius records legitimate debt credit; exact credit/balance remain unstated. No guaranteed job/schedule/rate.\n- **Ch232 household:** brown cloth remains same fold/three pins; Lyssa independently works on a separate dark sleeve; Greg's cuff remains three loose threads.\n- **Ch232 pressure/magic:** no Hessa, magic attempt, Bren/observer evidence, warning, investigation, or escalation. Counts remain 33 / 29 / 45.\n'''
          anchor='- **Next engine rotation:**'
          assert anchor in o
          o=o.replace(anchor,insert+anchor,1)
          o=o.replace('let the full Ch231 theatre/performance day breathe. Vale/money, ordinary Carrow/social/household life, or one genuinely grounded pressure fact are available; none is owed on a timer. Hessa still has no chosen next experiment.','let the full Ch232 Vale office day breathe. Follow the next actual obligation or ordinary pressure; theatre is only `Tomorrow maybe`, Hessa still has no chosen experiment, and external pressure is not owed on a timer.',1)
          ot.write_text(o)

          wf=Path('state/MANUSCRIPT_WORKFLOW.md')
          w=wf.read_text()
          w=w.replace('Chapter 231 — **THE MAGISTRATE**.\n\nSee `state/MANUSCRIPT_STATE.md` for current canon and the Chapter 232 edge.','Chapter 232 — **THE COUNTERSIGN**.\n\nSee `state/MANUSCRIPT_STATE.md` for current canon and the Chapter 233 edge.',1)
          wf.write_text(w)

          ps=Path('state/PROJECT_STATE.md')
          q=ps.read_text()
          q=q.replace('Current recorded story endpoint is Chapter 231 — **THE MAGISTRATE**.','Current recorded story endpoint is Chapter 232 — **THE COUNTERSIGN**.',1)
          ps.write_text(q)
          PY
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          m=Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md').read_text()
          assert m.count('## Chapter 232 — THE COUNTERSIGN') == 1
          ch=m.split('## Chapter 232 — THE COUNTERSIGN',1)[1]
          assert '—' not in ch
          wc=len(re.findall(r"\b[\w’'-]+\b", ch))
          assert 2500 <= wc <= 4000, wc
          s=Path('state/MANUSCRIPT_STATE.md').read_text()
          assert 'Current story endpoint: Chapter 232 — **THE COUNTERSIGN**.' in s
          assert 'Immediate next edge — Chapter 233' in s
          assert '33 successful supervised minimal draws' in s
          assert '29 supervised deliberate shaping attempts' in s
          assert '45 supervised external-effect attempts' in s
          assert '232. **THE COUNTERSIGN**' in Path('state/MANUSCRIPT_CHAPTER_INDEX.md').read_text()
          print('Chapter 232 words:',wc)
          print('prose em dashes:',ch.count('—'))
          PY
      - name: Remove one-shot helpers
        run: rm -f state/manuscript/.chapter232.tmp .github/workflows/ship-ch232-once.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Ship Chapter 232: THE COUNTERSIGN'
          git pull --rebase origin main
          git push origin HEAD:main
