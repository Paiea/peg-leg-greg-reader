name: One-shot ship Chapter 233
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ship-ch233-once.yml
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh authority before mutation
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Append Chapter 233 and sync living state
        run: python state/.ship_ch233.py
      - name: Remove one-shot files
        run: rm state/.ship_ch233.py state/manuscript/.ch233_seat.tmp .github/workflows/ship-ch233-once.yml
      - name: Verify, commit, rebase, reverify, and push
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          m=Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md').read_text()
          assert m.count('## Chapter 232 — THE COUNTERSIGN') == 1
          assert '# CHAPTER 232\n\n## THE MATCHER' not in m
          assert m.count('# CHAPTER 233') == 1
          tail='# CHAPTER 233'+m.split('# CHAPTER 233',1)[1]
          assert '## THE SEAT' in tail
          body=tail.split('## THE SEAT',1)[1]
          words=len(re.findall(r"\b[\w’'-]+\b", tail))
          assert 2500 <= words <= 4000, words
          assert '—' not in body
          s=Path('state/MANUSCRIPT_STATE.md').read_text()
          i=Path('state/MANUSCRIPT_CHAPTER_INDEX.md').read_text()
          w=Path('state/MANUSCRIPT_WORKFLOW.md').read_text()
          q=Path('state/PROJECT_STATE.md').read_text()
          o=Path('state/OPEN_THREADS.md').read_text()
          assert 'Current story endpoint: Chapter 233 — **THE SEAT**.' in s
          assert 'Immediate next edge — Chapter 234' in s
          assert '33 successful supervised minimal draws' in s
          assert '29 supervised deliberate shaping attempts' in s
          assert '45 supervised external-effect attempts' in s
          assert '**Current endpoint:** Chapter 233 — THE SEAT' in i
          assert '233. **THE SEAT**' in i
          assert '232. **THE MATCHER**' not in i
          assert 'Chapter 233 — **THE SEAT**.' in w
          assert 'Chapter 234 edge' in w
          assert 'Current recorded story endpoint is Chapter 233 — **THE SEAT**.' in q
          assert '- **Current endpoint:** Chapter 233 — **THE SEAT**.' in o
          print('precommit_words', words)
          print('precommit_em_dashes', body.count('—'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/manuscript/Peg_Leg_Greg_Running_Manuscript.md state/MANUSCRIPT_STATE.md state/OPEN_THREADS.md state/MANUSCRIPT_CHAPTER_INDEX.md state/MANUSCRIPT_WORKFLOW.md state/PROJECT_STATE.md state/.ship_ch233.py state/manuscript/.ch233_seat.tmp .github/workflows/ship-ch233-once.yml
          git diff --cached --check
          git commit -m "Ship Chapter 233: THE SEAT"
          git fetch origin main
          git rebase origin/main
          python - <<'PY'
          from pathlib import Path
          import re
          m=Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md').read_text()
          assert m.count('## Chapter 232 — THE COUNTERSIGN') == 1
          assert '# CHAPTER 232\n\n## THE MATCHER' not in m
          assert m.count('# CHAPTER 233') == 1
          assert '# CHAPTER 234' not in m and '## Chapter 234' not in m
          tail='# CHAPTER 233'+m.split('# CHAPTER 233',1)[1]
          assert '## THE SEAT' in tail
          body=tail.split('## THE SEAT',1)[1]
          words=len(re.findall(r"\b[\w’'-]+\b", tail))
          assert 2500 <= words <= 4000, words
          assert '—' not in body
          assert 'Current story endpoint: Chapter 233 — **THE SEAT**.' in Path('state/MANUSCRIPT_STATE.md').read_text()
          assert '233. **THE SEAT**' in Path('state/MANUSCRIPT_CHAPTER_INDEX.md').read_text()
          print('postrebase_words', words)
          print('postrebase_em_dashes', body.count('—'))
          print('postrebase_authority_ok')
          PY
          git push origin HEAD:main
