name: One-shot ship Chapter 239

on:
  push:
    branches:
      - manuscript/ch239-waiter
    paths:
      - state/.ch239_waiter_trigger

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append chapter and sync state
        run: python state/.ship_ch239_waiter.py
      - name: Remove one-shot files
        run: rm state/.ship_ch239_waiter.py state/.ch239_waiter_payload.md state/.ch239_waiter_trigger .github/workflows/ship-ch239-waiter-once.yml
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          m = Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md').read_text()
          assert m.count('# CHAPTER 239') == 1
          ch = m[m.index('# CHAPTER 239'):]
          assert '## THE WAITER' in ch
          assert ch.count('—') == 0
          words = len(re.findall(r"\b[\w’'-]+\b", ch))
          assert 2500 <= words <= 4000, words
          assert ch.rstrip().endswith('It was almost enough to make waiting feel like a job.')
          s = Path('state/MANUSCRIPT_STATE.md').read_text()
          assert 'Current story endpoint: Chapter 239 — **THE WAITER**.' in s
          assert 'Chapter 239 contains no Hessa appearance or magic attempt. Counts remain 34 / 30 / 49' in s
          assert '## Immediate next edge — Chapter 240' in s
          o = Path('state/OPEN_THREADS.md').read_text()
          assert '**Current endpoint:** Chapter 239 — **THE WAITER**.' in o
          assert '**Ch239 offstage Hara/Greg:**' in o
          i = Path('state/MANUSCRIPT_CHAPTER_INDEX.md').read_text()
          assert i.count('239. **THE WAITER**') == 1
          assert '**Current endpoint:** Chapter 239 — THE WAITER' in i
          w = Path('state/MANUSCRIPT_WORKFLOW.md').read_text()
          assert 'Chapter 239 — **THE WAITER**.' in w
          assert 'Chapter 240 edge.' in w
          p = Path('state/PROJECT_STATE.md').read_text()
          assert 'Current recorded story endpoint is Chapter 239 — **THE WAITER**.' in p
          assert '34 / 30 / 49' in s
          assert 'Marra ≠ Maren' in s or 'Marra' in s
          print('chapter_words', words)
          print('em_dashes', ch.count('—'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/manuscript/Peg_Leg_Greg_Running_Manuscript.md state/MANUSCRIPT_STATE.md state/OPEN_THREADS.md state/MANUSCRIPT_CHAPTER_INDEX.md state/MANUSCRIPT_WORKFLOW.md state/PROJECT_STATE.md state/.ship_ch239_waiter.py state/.ch239_waiter_payload.md state/.ch239_waiter_trigger .github/workflows/ship-ch239-waiter-once.yml
          git diff --cached --check
          git commit -m "Ship Chapter 239: THE WAITER"
          git push origin HEAD:manuscript/ch239-waiter
