name: Ship Chapter 240 Sample

on:
  push:
    branches:
      - manuscript/ch240-sample

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope current-magic selector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/ship_ch240_sample.py')
          text = p.read_text(encoding='utf-8')
          old = "s = replace_once(s, '- Attempt 49 INTERMEDIATE/AWAY: no observed response; control unchanged.', magic_insert, 'magic attempt insertion')"
          new = """magic_anchor = '- Attempt 49 INTERMEDIATE/AWAY: no observed response; control unchanged.\\n- All four Ch234 external attempts are clean for apparatus/control interpretation: no control movement or apparatus disturbance is observed.'
          magic_replacement = magic_insert + '\\n- All four Ch234 external attempts are clean for apparatus/control interpretation: no control movement or apparatus disturbance is observed.'
          s = replace_once(s, magic_anchor, magic_replacement, 'magic attempt insertion')"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one source selector, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('PATCHED_MAGIC_SELECTOR=1')
          PY

      - name: Apply chapter and state updates
        run: python .github/scripts/ship_ch240_sample.py

      - name: Remove temporary shipping machinery
        run: |
          rm .github/scripts/ship_ch240_sample.py
          rm .github/workflows/ship-ch240-sample.yml
          rm .github/scripts/ch240-trigger.txt

      - name: Verify Chapter 240 and durable state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          manuscript = Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md').read_text(encoding='utf-8')
          assert manuscript.count('# CHAPTER 240') == 1
          chapter = manuscript.split('# CHAPTER 240', 1)[1]
          assert '# CHAPTER 241' not in chapter
          words = len(re.findall(r"\b\w[\w'’-]*\b", chapter))
          emdashes = chapter.count('—')
          assert 2500 <= words <= 4000, words
          assert emdashes == 0, emdashes
          assert chapter.lstrip().startswith("## THE SAMPLE\n\nHessa's note was under the door.")
          assert chapter.rstrip().endswith('It had not made it simpler.')

          state = Path('state/MANUSCRIPT_STATE.md').read_text(encoding='utf-8')
          opn = Path('state/OPEN_THREADS.md').read_text(encoding='utf-8')
          index = Path('state/MANUSCRIPT_CHAPTER_INDEX.md').read_text(encoding='utf-8')
          workflow = Path('state/MANUSCRIPT_WORKFLOW.md').read_text(encoding='utf-8')
          project = Path('state/PROJECT_STATE.md').read_text(encoding='utf-8')

          assert 'Current story endpoint: Chapter 240 — **THE SAMPLE**.' in state
          assert '35 successful supervised minimal draws.' in state
          assert '31 supervised deliberate shaping attempts.' in state
          assert '53 supervised external-effect attempts.' in state
          assert 'Attempt 50 FAR/AWAY: no observed response; control unchanged.' in state
          assert 'Attempt 51 FAR/AWAY: no observed response; control unchanged.' in state
          assert 'Attempt 52 FAR/AWAY: small observed target response, net AWAY, no obvious rotation; control unchanged.' in state
          assert 'Attempt 53 FAR/AWAY: no observed response; control unchanged.' in state
          assert 'Hessa has no selected next experiment when Greg leaves.' in state
          assert 'NO RANGE. NOT GENERALIZED.' in state
          assert 'Restrictions unchanged: no independent draw, shaping, external testing, paper, coins, thread, larger objects, practice, Barrier broadening, theatrical magic, or loopholes.' in state
          assert 'No Vale/Bren connection established.' in state

          assert '**Current endpoint:** Chapter 240 — **THE SAMPLE**.' in opn
          assert 'ACTIVE at 35 supervised minimal draws / 31 deliberate shaping attempts / 53 external-effect attempts.' in opn
          assert '**Attempt 52:** FAR/AWAY, small observed target response, net AWAY, no obvious rotation, control unchanged.' in opn
          assert '# PEG-LEG GREG — CHAPTER INDEX — CH240' in index
          assert '**Current endpoint:** Chapter 240 — THE SAMPLE' in index
          assert index.rstrip().endswith('240. **THE SAMPLE**')
          assert 'Chapter 240 — **THE SAMPLE**.' in workflow
          assert 'Chapter 241 edge.' in workflow
          assert 'Current recorded story endpoint is Chapter 240 — **THE SAMPLE**.' in project

          print(f'VERIFIED_CH240_WORDS={words}')
          print(f'VERIFIED_CH240_EMDASHES={emdashes}')
          print('VERIFIED_MAGIC_COUNTS=35/31/53')
          print('VERIFIED_ATTEMPTS_50_53=1')
          print('VERIFIED_ENDPOINTS=1')
          PY

      - name: Stage and inspect cleanup commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          printf '%s\n' '--- staged paths ---'
          git diff --cached --name-only | sort
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/ch240-trigger.txt \
            .github/scripts/ship_ch240_sample.py \
            .github/workflows/ship-ch240-sample.yml \
            state/MANUSCRIPT_CHAPTER_INDEX.md \
            state/MANUSCRIPT_STATE.md \
            state/MANUSCRIPT_WORKFLOW.md \
            state/OPEN_THREADS.md \
            state/PROJECT_STATE.md \
            state/manuscript/Peg_Leg_Greg_Running_Manuscript.md | sort)"
          test "$actual" = "$expected"
          echo VERIFIED_STAGED_PATHS=9

      - name: Commit, verify net diff, and push Chapter 240
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ship Chapter 240: THE SAMPLE"
          printf '%s\n' '--- net paths from original main base ---'
          git diff --name-only 8cc98383d6e57c0328008e628e777fd59b723fe0..HEAD | sort
          actual="$(git diff --name-only 8cc98383d6e57c0328008e628e777fd59b723fe0..HEAD | sort)"
          expected="$(printf '%s\n' \
            state/MANUSCRIPT_CHAPTER_INDEX.md \
            state/MANUSCRIPT_STATE.md \
            state/MANUSCRIPT_WORKFLOW.md \
            state/OPEN_THREADS.md \
            state/PROJECT_STATE.md \
            state/manuscript/Peg_Leg_Greg_Running_Manuscript.md | sort)"
          test "$actual" = "$expected"
          echo VERIFIED_NET_DIFF_PATHS=6
          git push origin HEAD:manuscript/ch240-sample
