name: Ship Chapter 242 Spender

on:
  push:
    branches:
      - manuscript/ch242-spender

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Chapter 242 and state updates
        run: python .github/scripts/ship_ch242_spender.py

      - name: Remove temporary shipping machinery
        run: |
          rm .github/scripts/ship_ch242_spender.py
          rm .github/workflows/ship-ch242-spender.yml

      - name: Verify Chapter 242 and durable state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          manuscript = Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md').read_text(encoding='utf-8')
          assert manuscript.count('# CHAPTER 242') == 1
          chapter = manuscript.split('# CHAPTER 242', 1)[1]
          assert '# CHAPTER 243' not in chapter
          words = len(re.findall(r"\b\w[\w'’-]*\b", chapter))
          emdashes = chapter.count('—')
          assert words == 2521, words
          assert emdashes == 0, emdashes
          assert chapter.lstrip().startswith("## THE SPENDER\n\nThe right crutch grip had turned.")
          assert chapter.rstrip().endswith('That was the most useful thing I bought all day.')

          state = Path('state/MANUSCRIPT_STATE.md').read_text(encoding='utf-8')
          opn = Path('state/OPEN_THREADS.md').read_text(encoding='utf-8')
          index = Path('state/MANUSCRIPT_CHAPTER_INDEX.md').read_text(encoding='utf-8')
          workflow = Path('state/MANUSCRIPT_WORKFLOW.md').read_text(encoding='utf-8')
          project = Path('state/PROJECT_STATE.md').read_text(encoding='utf-8')

          assert 'Current story endpoint: Chapter 242 — **THE SPENDER**.' in state
          assert '35 successful supervised minimal draws.' in state
          assert '31 supervised deliberate shaping attempts.' in state
          assert '53 supervised external-effect attempts.' in state
          assert 'Attempt 52 FAR/AWAY: small observed target response, net AWAY, no obvious rotation; control unchanged.' in state
          assert 'NO RANGE ESTABLISHED. NOT GENERALIZED.' in state
          assert 'Restrictions unchanged: no independent draw, shaping, external testing, paper, coins, thread, larger objects, practice, Barrier broadening, theatrical magic, or loopholes.' in state
          assert 'Hessa still has no selected next experiment.' in state
          assert 'The clerk has no suitable work for Greg that day, so Greg receives no credit.' in state
          assert '`Tomorrow, maybe` sealing is conditional only.' in state
          assert 'No Vale/Bren connection established.' in state
          assert 'Ch236 remains the newest grounded pressure fact' in state
          assert '## Immediate next edge — Chapter 243' in state

          assert '**Current endpoint:** Chapter 242 — **THE SPENDER**.' in opn
          assert 'retensions a shifted RIGHT grip wrap' in opn
          assert 'The repaired LEFT tip remains normal.' in opn
          assert 'no suitable work for him that day' in opn
          assert 'Ch236 remains newest pressure evidence' in opn

          assert '# PEG-LEG GREG — CHAPTER INDEX — CH242' in index
          assert '**Current endpoint:** Chapter 242 — THE SPENDER' in index
          assert index.rstrip().endswith('242. **THE SPENDER**')
          assert 'Chapter 242 — **THE SPENDER**.' in workflow
          assert 'Chapter 243 edge.' in workflow
          assert 'Current recorded story endpoint is Chapter 242 — **THE SPENDER**.' in project

          print(f'VERIFIED_CH242_WORDS={words}')
          print(f'VERIFIED_CH242_EMDASHES={emdashes}')
          print('VERIFIED_MAGIC_COUNTS=35/31/53')
          print('VERIFIED_RIGHT_GRIP=1')
          print('VERIFIED_VALE_NO_WORK=1')
          print('VERIFIED_ENDPOINTS=1')
          PY

      - name: Stage and inspect cleanup commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          printf '%s\n' '--- staged paths ---'
          git diff --cached --name-only | sort
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/ship_ch242_spender.py \
            .github/workflows/ship-ch242-spender.yml \
            state/MANUSCRIPT_CHAPTER_INDEX.md \
            state/MANUSCRIPT_STATE.md \
            state/MANUSCRIPT_WORKFLOW.md \
            state/OPEN_THREADS.md \
            state/PROJECT_STATE.md \
            state/manuscript/Peg_Leg_Greg_Running_Manuscript.md | sort)"
          test "$actual" = "$expected"
          echo VERIFIED_STAGED_PATHS=8

      - name: Commit verify net diff and push Chapter 242
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ship Chapter 242: THE SPENDER"
          printf '%s\n' '--- net paths from original main base ---'
          git diff --name-only 3e115214d9e5a91a8a61043d345093251becbf83..HEAD | sort
          actual="$(git diff --name-only 3e115214d9e5a91a8a61043d345093251becbf83..HEAD | sort)"
          expected="$(printf '%s\n' \
            state/MANUSCRIPT_CHAPTER_INDEX.md \
            state/MANUSCRIPT_STATE.md \
            state/MANUSCRIPT_WORKFLOW.md \
            state/OPEN_THREADS.md \
            state/PROJECT_STATE.md \
            state/manuscript/Peg_Leg_Greg_Running_Manuscript.md | sort)"
          test "$actual" = "$expected"
          echo VERIFIED_NET_DIFF_PATHS=6
          git push origin HEAD:manuscript/ch242-spender
