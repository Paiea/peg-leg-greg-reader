name: Ship Chapter 245 Name Taker

on:
  push:
    branches:
      - manuscript/ch245-name-taker

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct staged Chapter 245 wording and count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/ship_ch245_name_taker.py')
          text = p.read_text(encoding='utf-8')
          assert 'assert words == 2660, words' in text
          text = text.replace('assert words == 2660, words', 'assert words == 2662, words', 1)
          old = '\\n"Wrong Vale."\\n'
          new = '\\n"Wrong office."\\n'
          assert old in text
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Apply Chapter 245 and state updates
        run: python .github/scripts/ship_ch245_name_taker.py

      - name: Remove temporary shipping machinery
        run: |
          rm .github/scripts/ship_ch245_name_taker.py
          rm .github/workflows/ship-ch245-name-taker.yml

      - name: Verify Chapter 245 and durable state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          manuscript = Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md').read_text(encoding='utf-8')
          assert manuscript.count('# CHAPTER 245') == 1
          chapter = manuscript.split('# CHAPTER 245', 1)[1]
          assert '# CHAPTER 246' not in chapter
          words = len(re.findall(r"\b\w[\w'’-]*\b", chapter))
          emdashes = chapter.count('—')
          assert words == 2662, words
          assert 2500 <= words <= 4000
          assert emdashes == 0, emdashes
          assert chapter.lstrip().startswith("## THE NAME-TAKER\n\nI met Vale's runner halfway down the stairs.")
          assert chapter.rstrip().endswith("That was where they belonged.")
          assert '"Wrong office."' in chapter
          assert '"Wrong Vale."' not in chapter

          state = Path('state/MANUSCRIPT_STATE.md').read_text(encoding='utf-8')
          opn = Path('state/OPEN_THREADS.md').read_text(encoding='utf-8')
          index = Path('state/MANUSCRIPT_CHAPTER_INDEX.md').read_text(encoding='utf-8')
          flow = Path('state/MANUSCRIPT_WORKFLOW.md').read_text(encoding='utf-8')
          project = Path('state/PROJECT_STATE.md').read_text(encoding='utf-8')

          assert 'Current story endpoint: Chapter 245 — **THE NAME-TAKER**.' in state
          assert 'Book 2 closed at Chapter 180. Book 3 active from Chapter 181.' in state
          assert '35 successful supervised minimal draws.' in state
          assert '31 supervised deliberate shaping attempts.' in state
          assert '53 supervised external-effect attempts.' in state
          assert 'Attempt 52 FAR/AWAY: small observed target response, net AWAY, no obvious rotation; control unchanged.' in state
          assert 'NO RANGE ESTABLISHED. NOT GENERALIZED.' in state
          assert 'Restrictions unchanged: no independent draw, shaping, external testing, paper, coins, thread, larger objects, practice, Barrier broadening, theatrical magic, or loopholes.' in state
          assert 'Chapters 241–245 contain no Hessa appearance or magic attempt. Counts remain 35 / 31 / 53' in state
          assert '## Chapter 245 — THE NAME-TAKER' in state
          assert 'legitimate debt credit' in state
          assert 'no cash, promotion, standing front-desk role, fixed rate, schedule, or future-work promise' in state
          assert '## Immediate next edge — Chapter 246' in state
          assert 'Ch236 remains the newest pressure fact' in state
          assert 'no Vale/Bren connection exists' in state

          assert '**Current endpoint:** Chapter 245 — **THE NAME-TAKER**.' in opn
          assert '**Ch245 Vale front-room work:**' in opn
          assert '**Ch245 authority correction:**' in opn
          assert 'Magic remains 35 / 31 / 53' in opn

          assert '# PEG-LEG GREG — CHAPTER INDEX — CH245' in index
          assert '**Current endpoint:** Chapter 245 — THE NAME-TAKER' in index
          assert index.rstrip().endswith('245. **THE NAME-TAKER**')

          assert 'Chapter 245 — **THE NAME-TAKER**.' in flow
          assert 'Chapter 246 edge.' in flow

          assert '## Book 2\n\nClosed at Chapter 180 — **THE THIRD MAN**.' in project
          assert '## Book 3\n\nActive from Chapter 181 — **THE CALLER**.' in project
          assert '**ACT II — THE PRICE OF ATTENTION** — Chapters 220–current' in project
          assert 'Current recorded story endpoint is Chapter 245 — **THE NAME-TAKER**.' in project

          print(f'VERIFIED_CH245_WORDS={words}')
          print(f'VERIFIED_CH245_EMDASHES={emdashes}')
          print('VERIFIED_MAGIC_COUNTS=35/31/53')
          print('VERIFIED_VALE_CREDIT=1')
          print('VERIFIED_NO_STANDING_VALE_JOB=1')
          print('VERIFIED_BOOK3_HIERARCHY=1')
          print('VERIFIED_ENDPOINTS=1')
          PY

      - name: Stage and inspect cleanup commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/scripts/ship_ch245_name_taker.py \
            .github/workflows/ship-ch245-name-taker.yml \
            state/MANUSCRIPT_CHAPTER_INDEX.md \
            state/MANUSCRIPT_STATE.md \
            state/MANUSCRIPT_WORKFLOW.md \
            state/OPEN_THREADS.md \
            state/PROJECT_STATE.md \
            state/manuscript/Peg_Leg_Greg_Running_Manuscript.md | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          echo VERIFIED_STAGED_PATHS=8

      - name: Commit verify net diff and push Chapter 245
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ship Chapter 245: THE NAME-TAKER"
          actual="$(git diff --name-only 4157543c96db51178b4e4b54c4bcd804d7037d19..HEAD | sort)"
          expected="$(printf '%s\n' \
            state/MANUSCRIPT_CHAPTER_INDEX.md \
            state/MANUSCRIPT_STATE.md \
            state/MANUSCRIPT_WORKFLOW.md \
            state/OPEN_THREADS.md \
            state/PROJECT_STATE.md \
            state/manuscript/Peg_Leg_Greg_Running_Manuscript.md | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          echo VERIFIED_NET_DIFF_PATHS=6
          git push origin HEAD:manuscript/ch245-name-taker
