name: Ship Chapter 246 Matcher

on:
  push:
    branches:
      - manuscript/ch246-matcher

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Chapter 246 and state updates
        run: python .github/scripts/ship_ch246_matcher.py

      - name: Remove temporary shipping machinery
        run: |
          rm .github/ch246_payload.md
          rm .github/scripts/ship_ch246_matcher.py
          rm .github/workflows/ship-ch246-matcher.yml

      - name: Verify Chapter 246 and durable state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          manuscript = Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md').read_text(encoding='utf-8')
          assert manuscript.count('# CHAPTER 246') == 1
          chapter = manuscript.split('# CHAPTER 246', 1)[1]
          assert '# CHAPTER 247' not in chapter
          words = len(re.findall(r"\b\w[\w'’-]*\b", chapter))
          emdashes = chapter.count('—')
          assert words == 2605, words
          assert 2500 <= words <= 4000
          assert emdashes == 0, emdashes
          assert chapter.lstrip().startswith("## THE MATCHER\n\nLyssa handed me a square of cloth before I had finished breakfast.")
          assert chapter.rstrip().endswith("I left the spool alone.")

          state = Path('state/MANUSCRIPT_STATE.md').read_text(encoding='utf-8')
          opn = Path('state/OPEN_THREADS.md').read_text(encoding='utf-8')
          index = Path('state/MANUSCRIPT_CHAPTER_INDEX.md').read_text(encoding='utf-8')
          flow = Path('state/MANUSCRIPT_WORKFLOW.md').read_text(encoding='utf-8')
          project = Path('state/PROJECT_STATE.md').read_text(encoding='utf-8')
          audit = Path('state/LYSSA_WORK_NETWORK_AUDIT.md').read_text(encoding='utf-8')

          assert 'Current story endpoint: Chapter 246 — **THE MATCHER**.' in state
          assert 'Book 1 Chapters 1–82 closed. Book 2 closed at Chapter 180. Book 3 active from Chapter 181.' in state
          assert '35 successful supervised minimal draws.' in state
          assert '31 supervised deliberate shaping attempts.' in state
          assert '53 supervised external-effect attempts.' in state
          assert 'Attempt 52 FAR/AWAY: small observed target response, net AWAY, no obvious rotation; control unchanged.' in state
          assert 'NO RANGE ESTABLISHED. NOT GENERALIZED.' in state
          assert 'Restrictions unchanged: no independent draw, shaping, external testing, paper, coins, thread, larger objects, practice, Barrier broadening, theatrical magic, or loopholes.' in state
          assert '## Chapter 246 — THE MATCHER' in state
          assert '`Blue last time`' in state
          assert '`If exact, exact. If not, darker.`' in state
          assert 'thread-delivery crate' in state
          assert '## Immediate next edge — Chapter 247' in state
          assert 'No Vale/Bren connection established.' in state
          assert 'Ch236 remains the newest pressure fact' in state

          assert '**Current endpoint:** Chapter 246 — **THE MATCHER**.' in opn
          assert '**Ch246 Maren return:**' in opn
          assert '**Ch246 delivery ceiling:**' in opn
          assert 'Magic remains 35 / 31 / 53' in opn

          assert '# PEG-LEG GREG — CHAPTER INDEX — CH246' in index
          assert '**Current endpoint:** Chapter 246 — THE MATCHER' in index
          assert index.rstrip().endswith('246. **THE MATCHER**')

          assert 'Chapter 246 — **THE MATCHER**.' in flow
          assert 'Chapter 247 edge.' in flow

          assert '## Book 2\n\nClosed at Chapter 180 — **THE THIRD MAN**.' in project
          assert '## Book 3\n\nActive from Chapter 181 — **THE CALLER**.' in project
          assert '**ACT II — THE PRICE OF ATTENTION** — Chapters 220–current' in project
          assert 'Current recorded story endpoint is Chapter 246 — **THE MATCHER**.' in project

          assert '**Chapter 246:** the same Maren counter woman remembers Greg narrowly as `Blue last time`' in audit
          assert '**Maren is NOT Marra.**' in audit

          print(f'VERIFIED_CH246_WORDS={words}')
          print(f'VERIFIED_CH246_EMDASHES={emdashes}')
          print('VERIFIED_MAGIC_COUNTS=35/31/53')
          print('VERIFIED_ATTEMPT52_CEILING=1')
          print('VERIFIED_MAREN_NARROW_MEMORY=1')
          print('VERIFIED_BOOK3_HIERARCHY=1')
          print('VERIFIED_ENDPOINTS=1')
          PY

      - name: Stage and inspect cleanup commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/ch246_payload.md \
            .github/scripts/ship_ch246_matcher.py \
            .github/workflows/ship-ch246-matcher.yml \
            state/LYSSA_WORK_NETWORK_AUDIT.md \
            state/MANUSCRIPT_CHAPTER_INDEX.md \
            state/MANUSCRIPT_STATE.md \
            state/MANUSCRIPT_WORKFLOW.md \
            state/OPEN_THREADS.md \
            state/PROJECT_STATE.md \
            state/manuscript/Peg_Leg_Greg_Running_Manuscript.md | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          echo VERIFIED_STAGED_PATHS=10

      - name: Commit verify net diff and push Chapter 246
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ship Chapter 246: THE MATCHER"
          actual="$(git diff --name-only 7165d093afbff6097a1e9dde2fdfcc6abf1d3cf9..HEAD | sort)"
          expected="$(printf '%s\n' \
            state/LYSSA_WORK_NETWORK_AUDIT.md \
            state/MANUSCRIPT_CHAPTER_INDEX.md \
            state/MANUSCRIPT_STATE.md \
            state/MANUSCRIPT_WORKFLOW.md \
            state/OPEN_THREADS.md \
            state/PROJECT_STATE.md \
            state/manuscript/Peg_Leg_Greg_Running_Manuscript.md | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          echo VERIFIED_NET_DIFF_PATHS=7
          git push origin HEAD:manuscript/ch246-matcher
