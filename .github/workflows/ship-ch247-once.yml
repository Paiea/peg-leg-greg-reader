name: Ship Chapter 247 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ship-ch247-once.yml'

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collision check and recover staged chapter
        run: |
          git pull --ff-only origin main
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          manuscript = Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md')
          text = manuscript.read_text(encoding='utf-8')
          nums = [int(x) for x in re.findall(r'^# CHAPTER (\d+)$', text, re.M)]
          if not nums or nums[-1] != 246:
              raise SystemExit(f'COLLISION: live manuscript endpoint is {nums[-1] if nums else "unknown"}, expected 246')
          start = "          cat >> state/manuscript/Peg_Leg_Greg_Running_Manuscript.md <<'CHAPTER'\n"
          old = None
          for rev in subprocess.check_output(['git','rev-list','--max-count=8','HEAD'], text=True).splitlines()[1:]:
              try:
                  candidate = subprocess.check_output(['git','show',f'{rev}:.github/workflows/ship-ch247-once.yml'], text=True, stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              if start in candidate and '\nCHAPTER\n' in candidate:
                  old = candidate
                  break
          if old is None:
              raise SystemExit('staged chapter source not found in recent workflow history')
          chapter = old.split(start,1)[1].split('\nCHAPTER\n',1)[0]
          if not chapter.startswith('\n# CHAPTER 247\n\n## THE PATRON\n'):
              raise SystemExit('unexpected staged chapter header')
          manuscript.write_text(text + chapter + '\n', encoding='utf-8')
          PY
      - name: Update durable state
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')

          p='state/MANUSCRIPT_CHAPTER_INDEX.md'; t=read(p)
          t=t.replace('# PEG-LEG GREG — CHAPTER INDEX — CH246','# PEG-LEG GREG — CHAPTER INDEX — CH247',1)
          t=t.replace('**Current endpoint:** Chapter 246 — THE MATCHER','**Current endpoint:** Chapter 247 — THE PATRON',1)
          if '247. **THE PATRON**' not in t: t=t.rstrip()+"\n247. **THE PATRON**\n"
          write(p,t)

          p='state/MANUSCRIPT_WORKFLOW.md'; t=read(p)
          t=t.replace('Chapter 246 — **THE MATCHER**.','Chapter 247 — **THE PATRON**.',1)
          t=t.replace('the Chapter 247 edge.','the Chapter 248 edge.',1)
          write(p,t)

          p='state/PROJECT_STATE.md'; t=read(p)
          t=t.replace('Current recorded story endpoint is Chapter 246 — **THE MATCHER**.','Current recorded story endpoint is Chapter 247 — **THE PATRON**.',1)
          write(p,t)

          p='state/MANUSCRIPT_STATE.md'; t=read(p)
          t=t.replace('Current story endpoint: Chapter 246 — **THE MATCHER**.','Current story endpoint: Chapter 247 — **THE PATRON**.',1)
          marker='## Permanent forward manuscript path\n'
          residue=(
              '## Chapter 247 durable residue\n'
              '- Ch247 is a full ordinary Carrow personal-maintenance day centered on an unnamed Lower Steps barber shop. No theatre, Vale, Hessa, Maren, or pressure fact appears.\n'
              '- Greg pays ordinary money for a haircut and later bread. Vale debt remains active and unstated; no debt credit/payment occurs.\n'
              '- Greg hair continuity changes: front is cut above/out of his eyes, ears are clear, hair no longer touches the collar, sides/back are shorter than he expected but accepted. Barber name remains unknown. Mira is established only as another shop customer, not a Greg relationship.\n'
              '- The short heavy-coated man who waits after Greg enters is only an ordinary barber customer in this chapter. No Bren, brown-coat, theatre-pressure, or other threat connection is established.\n'
              '- Greg body/equipment remain ordinary: right leg/shoulders normal, LEFT tip normal, LEFT grip normal, RIGHT grip tack remains flush/normal. No injury or new limitation.\n'
              '- Magic remains 35 / 31 / 53 with all restrictions unchanged and no selected Hessa next experiment. Ch236 remains latest pressure evidence. No Vale/Bren connection.\n'
              '- Household object ceilings remain unchanged: long-standing brown cloth same fold/three pins; damaged shirt still three loose threads; Ch246 reddish-brown sample and darker close substitute spool remain together with customer/garment/use unknown; Ch246 delivery-crate contents remain unknown.\n\n'
          )
          if '## Chapter 247 durable residue' not in t: t=t.replace(marker,residue+marker,1)
          write(p,t)

          p='state/OPEN_THREADS.md'; t=read(p)
          t=t.replace('- **Current endpoint:** Chapter 246 — **THE MATCHER**.','- **Current endpoint:** Chapter 247 — **THE PATRON**.',1)
          anchor='- **Engine method:** `state/MANUSCRIPT_ENGINE_PLAYBOOK.md` preserves durable 01 behavior and recovery instructions.\n'
          add=(
              '- **Ch247 ordinary-life residue:** Greg gets an ordinary paid haircut at an unnamed Lower Steps barber shop after Lyssa notes his hair is in his eyes. Front is now clear of his eyes, ears are clear, hair no longer touches his collar, and sides/back are shorter than before. Barber name remains unknown; Mira is only another customer. Do not immediately turn the shop into a standing social route.\n'
              '- **Ch247 threat ceiling:** a short man in a heavy coat waits for an ordinary haircut after Greg arrives. This is NOT pressure evidence and has no established connection to Bren, the brown-coat observer, theatre, Vale, or any threat actor. Ch236 remains the latest grounded pressure fact.\n'
              '- **Ch247 subsystem restraint:** no theatre, Vale, Hessa, Maren, or pressure event. Magic stays 35 / 31 / 53; debt remains active/unstated; Ch236 remains latest pressure evidence.\n'
              '- **Ch247 household continuity:** brown cloth remains same fold/three pins; damaged shirt remains three loose threads; Ch246 sample and darker substitute spool remain paired and unexplained; delivery-crate contents remain unknown.\n'
          )
          if '**Ch247 ordinary-life residue:**' not in t: t=t.replace(anchor,anchor+add,1)
          write(p,t)

          p='state/CHARACTER_BIBLE.md'; t=read(p)
          anchor='### Voice / behavior targets\n'
          add='- Current visual continuity after Ch247: Greg has a fresh ordinary haircut from an unnamed Lower Steps barber. Hair is cut above/out of his eyes, clear of his ears and collar, with shorter sides/back than before. No exact named style is established.\n\n'
          if 'Current visual continuity after Ch247' not in t: t=t.replace(anchor,add+anchor,1)
          write(p,t)

          m=read('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md')
          piece=m.split('# CHAPTER 247\n',1)[1]
          prose=piece.split('------------------------------------------------------------------------',1)[0].split('## THE PATRON\n',1)[1]
          words=re.findall(r"\b[\w’'-]+\b", prose)
          assert 2500 <= len(words) <= 4000, len(words)
          assert '—' not in prose
          assert '# CHAPTER 247\n\n## THE PATRON' in m
          assert 'Chapter 247 — **THE PATRON**' in read('state/MANUSCRIPT_STATE.md')
          assert 'Chapter 248 edge.' in read('state/MANUSCRIPT_WORKFLOW.md')
          assert '247. **THE PATRON**' in read('state/MANUSCRIPT_CHAPTER_INDEX.md')
          print('CH247_PROSE_WORDS', len(words))
          print('CH247_EM_DASHES', prose.count('—'))
          PY
      - name: Verify and ship
        run: |
          git diff --check
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/project_check.py reader
          python scripts/project_check.py assets
          python - <<'PY'
          import subprocess
          from pathlib import Path
          path='state/manuscript/Peg_Leg_Greg_Running_Manuscript.md'
          base=subprocess.check_output(['git','show',f'HEAD:{path}'], text=True)
          current=Path(path).read_text(encoding='utf-8')
          print('BASE_RUNNING_MANUSCRIPT_EM_DASHES', base.count('—'))
          print('CURRENT_RUNNING_MANUSCRIPT_EM_DASHES', current.count('—'))
          assert current.count('—') == base.count('—')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ship-ch247-once.yml
          git add state/manuscript/Peg_Leg_Greg_Running_Manuscript.md state/MANUSCRIPT_STATE.md state/OPEN_THREADS.md state/MANUSCRIPT_CHAPTER_INDEX.md state/MANUSCRIPT_WORKFLOW.md state/PROJECT_STATE.md state/CHARACTER_BIBLE.md
          git commit -m 'Add Chapter 247 — THE PATRON'
          git push origin HEAD:main
