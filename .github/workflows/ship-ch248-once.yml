name: Ship Chapter 248 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ship-ch248-once.yml'

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover staged chapter and update state
        run: |
          git pull --ff-only origin main
          python - <<'PY'
          import re, subprocess, textwrap
          from pathlib import Path

          manuscript = Path('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md')
          text = manuscript.read_text(encoding='utf-8')
          nums = [int(x) for x in re.findall(r'^# CHAPTER (\d+)$', text, re.M)]
          if not nums or nums[-1] != 247:
              raise SystemExit(f'COLLISION: live manuscript endpoint is {nums[-1] if nums else "unknown"}, expected 247')
          if '# CHAPTER 248\n' in text:
              raise SystemExit('COLLISION: Chapter 248 already exists')

          payload = None
          for rev in subprocess.check_output(
              ['git','rev-list','--max-count=10','HEAD'], text=True
          ).splitlines()[1:]:
              try:
                  candidate = subprocess.check_output(
                      ['git','show',f'{rev}:.github/workflows/ship-ch248-once.yml'],
                      text=True, stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  continue
              if '\n# CHAPTER 248\n\n## THE CONSTANT\n' in candidate and '      - name: Update durable state\n' in candidate:
                  payload = candidate
                  break
          if payload is None:
              raise SystemExit('staged Chapter 248 payload not found in recent workflow history')

          chapter_start = payload.index('# CHAPTER 248\n')
          chapter_end = payload.index('\nCH248_EOF', chapter_start)
          chapter = payload[chapter_start:chapter_end].strip()
          if not chapter.endswith('------------------------------------------------------------------------'):
              raise SystemExit('unexpected Chapter 248 payload ending')
          manuscript.write_text(text.rstrip() + '\n\n' + chapter + '\n', encoding='utf-8')

          state_prefix = "      - name: Update durable state\n        run: |\n          python - <<'PY'\n"
          state_suffix = "\n          PY\n\n      - name: Verify and ship"
          if state_prefix not in payload or state_suffix not in payload:
              raise SystemExit('staged state updater not found')
          state_code = payload.split(state_prefix, 1)[1].split(state_suffix, 1)[0]
          exec(compile(textwrap.dedent(state_code), '<staged-state-update>', 'exec'), {})
          PY

      - name: Verify and ship
        run: |
          git diff --check
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/project_check.py reader
          python scripts/project_check.py assets
          python - <<'PY'
          import re, subprocess
          from pathlib import Path

          path='state/manuscript/Peg_Leg_Greg_Running_Manuscript.md'
          base=subprocess.check_output(['git','show',f'HEAD:{path}'], text=True)
          current=Path(path).read_text(encoding='utf-8')
          print('BASE_RUNNING_MANUSCRIPT_EM_DASHES', base.count('—'))
          print('CURRENT_RUNNING_MANUSCRIPT_EM_DASHES', current.count('—'))
          assert current.count('—') == base.count('—')

          piece=current.split('# CHAPTER 248\n',1)[1]
          prose=piece.split('------------------------------------------------------------------------',1)[0].split('## THE CONSTANT\n',1)[1]
          words=re.findall(r"\b[\w’'-]+\b", prose)
          print('CH248_PROSE_WORDS', len(words))
          print('CH248_EM_DASHES', prose.count('—'))
          assert 2500 <= len(words) <= 4000
          assert '—' not in prose

          idx=Path('state/MANUSCRIPT_CHAPTER_INDEX.md').read_text(encoding='utf-8')
          ms=Path('state/MANUSCRIPT_STATE.md').read_text(encoding='utf-8')
          ot=Path('state/OPEN_THREADS.md').read_text(encoding='utf-8')
          mw=Path('state/MANUSCRIPT_WORKFLOW.md').read_text(encoding='utf-8')
          ps=Path('state/PROJECT_STATE.md').read_text(encoding='utf-8')

          assert '# PEG-LEG GREG — CHAPTER INDEX — CH248' in idx
          assert '**Current endpoint:** Chapter 248 — THE CONSTANT' in idx
          assert idx.rstrip().endswith('248. **THE CONSTANT**')
          assert 'Current story endpoint: Chapter 248 — **THE CONSTANT**.' in ms
          assert '**Current endpoint:** Chapter 248 — **THE CONSTANT**.' in ot
          assert '**Magic counts:** ACTIVE at 36 supervised minimal draws / 32 deliberate shaping attempts / 57 external-effect attempts.' in ot
          assert 'Chapter 248 — **THE CONSTANT**.' in mw
          assert 'Chapter 249 edge.' in mw
          assert 'Current recorded story endpoint is Chapter 248 — **THE CONSTANT**.' in ps
          assert '## Immediate next edge — Chapter 249' in ms
          assert 'Book 2 closed at Chapter 180' in ms
          assert 'Book 3 active from Chapter 181' in ms
          assert 'Closed at Chapter 180 — **THE THIRD MAN**.' in ps
          assert 'Active from Chapter 181 — **THE CALLER**.' in ps
          assert '**ACT II — THE PRICE OF ATTENTION** — Chapters 220–current' in ps
          print('STATE_ENDPOINTS_OK')
          print('BOOK_AUTHORITY_OK')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ship-ch248-once.yml
          git add state/manuscript/Peg_Leg_Greg_Running_Manuscript.md state/MANUSCRIPT_STATE.md state/OPEN_THREADS.md state/MANUSCRIPT_CHAPTER_INDEX.md state/MANUSCRIPT_WORKFLOW.md state/PROJECT_STATE.md
          git commit -m 'Add Chapter 248 — THE CONSTANT'
          git push origin HEAD:main
