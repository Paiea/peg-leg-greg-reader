          t=t.replace('- **Magic counts:** ACTIVE at 35 supervised minimal draws / 31 deliberate shaping attempts / 53 external-effect attempts.','- **Magic counts:** ACTIVE at 36 supervised minimal draws / 32 deliberate shaping attempts / 57 external-effect attempts.',1)
