          t=t.replace('- **Next magic question:** Hessa has no selected next experiment after Ch240. Attempt 52 does not authorize a ladder, new distance, new direction, new object, or independent practice.','- **Next magic question:** Hessa has no selected next experiment after Ch248. She leaves the two existing fins in their swapped jobs only for inspection/record review. Attempts 54/57 do not authorize a swap-back block, FAR replication, new paper, new direction, ladder, range test, or independent practice.',1)
          write(p,t)

          m=read('state/manuscript/Peg_Leg_Greg_Running_Manuscript.md')
