name: Structural compression 060-061

on:
  push:
    branches: [editor/voice-compression-pass]
    paths:
      - 'scripts/apply_structural_compression_060_061.py'
      - 'tests/test_structural_compression_060_061.py'
      - 'chapters/060.html'
      - 'chapters/061.html'
      - 'state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map.docx'
      - '.github/workflows/structural-compression-060-061.yml'

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: editor/voice-compression-pass
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run focused structural-compression tests
        run: python -m unittest tests.test_structural_compression_060_061
      - name: Apply source-safe Book I structural edit
        run: python scripts/apply_structural_compression_060_061.py --root . --write --manifest state/compression-batches/060-061.json
      - name: Verify transform is idempotent
        run: |
          git diff --exit-code -- chapters/060.html chapters/061.html state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map.docx || true
          python scripts/apply_structural_compression_060_061.py --root . --write --manifest /tmp/060-061-second.json
          git diff --exit-code -- chapters/060.html chapters/061.html state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map.docx
      - name: Verify DOCX and reader projection agree
        run: python scripts/apply_structural_compression_060_061.py --root . --verify
      - name: Commit edited range
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chapters/060.html chapters/061.html state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map.docx state/compression-batches/060-061.json
          if [ -n "$(git status --porcelain -- chapters/060.html chapters/061.html state/manuscript/Peg_Leg_Greg_authoritative_ch82_final_name_map.docx state/compression-batches/060-061.json)" ]; then
            git commit -m 'Compress road inspection chapters 60 and 61'
            git push origin HEAD:editor/voice-compression-pass
          fi
