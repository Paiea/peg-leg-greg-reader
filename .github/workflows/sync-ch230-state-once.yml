name: One-shot sync Chapter 230 state
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-ch230-state-once.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync living manuscript state
        run: python state/.sync_ch230.py
      - name: Remove one-shot files
        run: rm state/.sync_ch230.py .github/workflows/sync-ch230-state-once.yml
      - name: Verify and commit state
        run: |
          grep -Fq '# CHAPTER 230' state/manuscript/Peg_Leg_Greg_Running_Manuscript.md
          grep -Fq 'Current story endpoint: Chapter 230' state/MANUSCRIPT_STATE.md
          grep -Fq '45 supervised external-effect attempts' state/MANUSCRIPT_STATE.md
          grep -Fq '230. **THE REPLICATE**' state/MANUSCRIPT_CHAPTER_INDEX.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/MANUSCRIPT_STATE.md state/OPEN_THREADS.md state/MANUSCRIPT_CHAPTER_INDEX.md state/MANUSCRIPT_WORKFLOW.md state/PROJECT_STATE.md state/.sync_ch230.py .github/workflows/sync-ch230-state-once.yml
          git diff --cached --check
          git commit -m "Advance manuscript state through Chapter 230"
          git push origin HEAD:main
