name: One-shot sync Chapter 231 state
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-ch231-state-once.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync living manuscript state
        run: python state/.sync_ch231.py
      - name: Verify transformed state
        shell: bash
        run: |
          grep -Fq 'Current story endpoint: Chapter 231' state/MANUSCRIPT_STATE.md
          grep -Fq '## Chapter 231 — THE MAGISTRATE' state/MANUSCRIPT_STATE.md
          grep -Fq '## Immediate next edge — Chapter 232' state/MANUSCRIPT_STATE.md
          grep -Fq 'Current endpoint:** Chapter 231' state/OPEN_THREADS.md
          grep -Fq '231. **THE MAGISTRATE**' state/MANUSCRIPT_CHAPTER_INDEX.md
          grep -Fq 'Chapter 231 — **THE MAGISTRATE**.' state/MANUSCRIPT_WORKFLOW.md
          grep -Fq 'Current recorded story endpoint is Chapter 231' state/PROJECT_STATE.md
          grep -Fq '33 successful supervised minimal draws.' state/MANUSCRIPT_STATE.md
          grep -Fq '29 supervised deliberate shaping attempts.' state/MANUSCRIPT_STATE.md
          grep -Fq '45 supervised external-effect attempts.' state/MANUSCRIPT_STATE.md
      - name: Remove one-shot files
        run: rm state/.sync_ch231.py .github/workflows/sync-ch231-state-once.yml
      - name: Commit, rebase, and push state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/MANUSCRIPT_STATE.md state/OPEN_THREADS.md state/MANUSCRIPT_CHAPTER_INDEX.md state/MANUSCRIPT_WORKFLOW.md state/PROJECT_STATE.md state/.sync_ch231.py .github/workflows/sync-ch231-state-once.yml
          git diff --cached --check
          git commit -m "Advance manuscript state through Chapter 231"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
