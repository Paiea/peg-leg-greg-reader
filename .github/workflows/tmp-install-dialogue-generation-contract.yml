name: Install dialogue generation authority

on:
  push:
    branches:
      - integration/dialogue-ownership-generation-contract
    paths:
      - 'scripts/_install_dialogue_generation_contract.py'
      - '.github/workflows/tmp-install-dialogue-generation-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/dialogue-ownership-generation-contract
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch durable manuscript authority
        run: python scripts/_install_dialogue_generation_contract.py
      - name: Verify patch scope and clean installer
        run: |
          grep -q 'Scene beat ownership' state/MANUSCRIPT_ENGINE_PLAYBOOK.md
          grep -q 'dialogue_ownership_check.py --latest --strict' state/MANUSCRIPT_WORKFLOW.md
          grep -q 'Dialogue paragraph ownership' state/PROSE_PLAYBOOK.md
          grep -q 'Mixed-owner dialogue paragraphs' state/STORY_ANTI_PATTERNS.md
          rm scripts/_install_dialogue_generation_contract.py
          rm .github/workflows/tmp-install-dialogue-generation-contract.yml
          git diff --check
      - name: Commit durable authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make dialogue ownership part of scene generation'
          git push origin HEAD:integration/dialogue-ownership-generation-contract
