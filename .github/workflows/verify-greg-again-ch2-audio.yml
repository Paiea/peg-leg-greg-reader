name: Verify Greg Again Chapter 2 audio

on:
  push:
    branches:
      - audio/greg-again-ch2
    paths:
      - .github/workflows/verify-greg-again-ch2-audio.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audio/greg-again-ch2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run Chapter 2 audio publication contract
        run: python -m unittest tests.test_greg_again_audio_catalog -v
