<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#17140f">
  <title>The Third Leg has moved</title>
  <link rel="canonical" href="https://paiea.github.io/3L/">

    (() => {
      const target = new URL('https://paiea.github.io/3L/');
      target.search = window.location.search;
      target.hash = window.location.hash;

    })();
  </script>
  <style>
    :root{color-scheme:light;--paper:#f3ede1;--ink:#211d18;--muted:#786f63}

    main{max-width:32rem}
    p{color:var(--muted)}
    a{color:var(--ink);font-family:ui-sans-serif,system-ui,sans-serif;font-weight:750}
  </style>
</head>
<body>
  <main>
    <h1>The Third Leg has moved.</h1>
