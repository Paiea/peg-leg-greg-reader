<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta name="description" content="Peg-Leg Greg Light edition: fast, text-first chapters without illustrations."/>
<title>Light Edition — Peg-Leg Greg</title>
<link href="assets/reader.css" rel="stylesheet"/>
<link href="assets/light.css" rel="stylesheet"/>
<style>
.light-reader-note,.light-reader-controls,.light-reader-status,.light-reader-switch,.light-reader-gap{max-width:46rem;margin:1rem auto;padding:0 1rem}.light-reader-controls{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:2rem}.light-reader-jump{display:flex;gap:.35rem;align-items:center}.light-reader-jump input{width:5.5rem;padding:.45rem}.light-toc-label{grid-column:1/-1;margin:1.4rem 0 .2rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;opacity:.72}
</style>
</head>
<body class="light-edition">
<header class="site-head light-site-head"><a class="site-brand" href="index.html">PEG-LEG GREG</a><nav aria-label="Site navigation" class="site-nav"><a href="index.html">HOME</a><a href="index.html#chapters">ILLUSTRATED</a><a aria-current="page" href="light/index.html">LIGHT</a><a href="latest.html">LATEST</a><a href="art.html">ART</a></nav></header>
<main class="chapter-shell">
<header class="chapter-title"><div class="number" data-light-number>LIGHT EDITION</div><h1 data-light-title>CHAPTERS</h1></header>
<p class="light-reader-note">Text-first reading with no chapter illustrations. <a href="light/index.html">Browse the Light chapter list.</a></p>
<div class="light-reader-controls" aria-label="Light reader navigation"><a data-light-prev href="#">← Previous</a><a href="light/index.html">Light TOC</a><a data-light-next href="#">Next →</a><form class="light-reader-jump" data-light-jump><label for="light-chapter">Chapter</label><input id="light-chapter" name="chapter" inputmode="numeric" pattern="[0-9]*"/><button type="submit">Go</button></form></div>
<p class="light-reader-status" data-light-status>Loading chapter…</p>
<section class="toc" data-light-toc aria-label="Light reader table of contents"></section>
<article class="prose" data-light-prose hidden></article>
<div class="light-reader-switch" data-light-switch hidden></div>
<div class="light-reader-controls" data-light-bottom hidden><a data-light-prev-bottom href="#">← Previous</a><a href="light/index.html">Light TOC</a><a data-light-next-bottom href="#">Next →</a></div>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const requested = Number.parseInt(params.get('chapter') || '', 10);
  fetch('light/manifest.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null).then(manifest => {
    if (!requested) { location.replace('light/index.html'); return; }
    const found = manifest?.chapters?.find(chapter => Number(chapter.number) === requested);
    if (found?.path) { location.replace(`light/${found.path}`); return; }
    const script = document.createElement('script');
    script.src = 'assets/light-reader.js?v=20260831-static-backfill';
    document.body.appendChild(script);
  });
})();
</script>
</body>
</html>
