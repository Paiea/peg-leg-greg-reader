<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta name="description" content="Peg-Leg Greg Text Reader: fast, text-only chapters without illustrations."/>
<title>Text Reader — Peg-Leg Greg</title>
<link href="assets/reader.css" rel="stylesheet"/>
<link href="assets/light.css" rel="stylesheet"/>
<style>
.light-reader-note,.light-reader-controls,.light-reader-status,.light-reader-switch,.light-reader-gap{max-width:46rem;margin:1rem auto;padding:0 1rem}.light-reader-controls{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:2rem}.light-reader-jump{display:flex;gap:.35rem;align-items:center}.light-reader-jump input{width:5.5rem;padding:.45rem}.light-toc-label{grid-column:1/-1;margin:1.4rem 0 .2rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;opacity:.72}
</style>
</head>
<body class="light-edition">
<header class="site-head light-site-head"><a class="site-brand" href="index.html">PEG-LEG GREG</a><nav aria-label="Site navigation" class="site-nav"><a href="index.html">HOME</a><a href="index.html#books">ILLUSTRATED READER</a><a aria-current="page" href="light/index.html">TEXT READER</a><a href="latest.html">LATEST</a><a href="art.html">ART</a></nav></header>
<main class="chapter-shell">
<header class="chapter-title"><div class="number" data-light-number>TEXT READER</div><h1 data-light-title>CHAPTERS</h1></header>
<p class="light-reader-note">Text-only reading with no chapter illustrations. <a href="light/index.html">Browse the Text Reader chapter list.</a></p>
<div class="light-reader-controls" aria-label="Text Reader navigation"><a data-light-prev href="#">← Previous</a><a href="light/index.html">Chapters</a><a data-light-next href="#">Next →</a><form class="light-reader-jump" data-light-jump><label for="light-chapter">Chapter</label><input id="light-chapter" name="chapter" inputmode="numeric" pattern="[0-9]*"/><button type="submit">Go</button></form></div>
<p class="light-reader-status" data-light-status>Loading chapter…</p>
<section class="toc" data-light-toc aria-label="Text Reader table of contents"></section>
<article class="prose" data-light-prose hidden></article>
<div class="light-reader-switch" data-light-switch hidden></div>
<div class="light-reader-controls" data-light-bottom hidden><a data-light-prev-bottom href="#">← Previous</a><a href="light/index.html">Chapters</a><a data-light-next-bottom href="#">Next →</a></div>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const requested = Number(params.get('chapter') || '');
  if (!Number.isInteger(requested) || requested < 1) {
    location.replace('light/index.html');
    return;
  }

  fetch('light/manifest.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null).then(manifest => {
    if (!manifest || !Array.isArray(manifest.chapters)) {
      location.replace('light/index.html');
      return;
    }

    const latest = Number(manifest?.latest);
    const staticNumbers = manifest.chapters
      .map(chapter => Number(chapter?.number))
      .filter(number => Number.isInteger(number) && number > 0);
    if (!Number.isInteger(latest) || staticNumbers.length === 0) {
      location.replace('light/index.html');
      return;
    }
    if (requested > latest) {
      location.replace('light/index.html');
      return;
    }

    const firstStatic = Math.min(...staticNumbers);
    const expectedPath = `${String(requested).padStart(3, '0')}.html`;
    const found = manifest.chapters.find(chapter => Number(chapter.number) === requested);
    if (found?.path === expectedPath) {
      location.replace(`light/${found.path}`);
      return;
    }

    if (requested >= firstStatic) {
      location.replace('light/index.html');
      return;
    }

    const script = document.createElement('script');
    script.src = 'assets/light-reader.js?v=20260905-books-fallback';
    document.body.appendChild(script);
  });
})();
</script>
</body>
</html>
